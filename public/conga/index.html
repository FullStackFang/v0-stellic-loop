<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Conga · Loopd</title>
<meta name="description" content="Walk your animal round campus and gather the longest line.">
<link rel="modulepreload" href="./conga/sim.js"><link rel="modulepreload" href="./conga/maps.js">
<style>
@font-face { font-family: Archivo; src: url(/fonts/Archivo.ttf); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
:root { --field: oklch(82% 0.12 38); --dot: oklch(77% 0.13 37); --ink: oklch(24% 0.035 30); --action: oklch(48.5% 0.185 27); --action-hover: oklch(54% 0.19 27);
  --paper: oklch(99.2% 0.004 60); --mute: oklch(45% 0.016 40); --line: oklch(88% 0.012 50); --expo: cubic-bezier(.16, 1, .3, 1); }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow: hidden; background: #f0e8d4; color: var(--ink); font-family: Archivo, system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
/* One animal's face, cut from the sheet all of them are on: seven across, six down. */
.face { display: block; aspect-ratio: 1; background: var(--sheet) 0 0 / 700% 600% no-repeat; }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
.hud[hidden], .dash[hidden], .pause[hidden] { display: none; }
body.bare .hud, body.bare .card, body.bare .say { display: none; } /* a still view of one place, for comparing looks */

.hud { position: fixed; z-index: 2; pointer-events: none; background: var(--paper); box-shadow: 3px 3px 0 var(--ink), inset 0 0 0 2px var(--ink); }
.mine { top: max(14px, env(safe-area-inset-top)); left: 14px; display: flex; align-items: center; gap: 8px; padding: 5px 16px 5px 6px; border-radius: 99px; }
.mine .face { width: 40px; border-radius: 50%; background-color: var(--field); }
.mine b { font-weight: 900; font-size: 26px; font-stretch: 110%; line-height: 1; font-variant-numeric: tabular-nums; }
.mine span { font-size: 13px; font-weight: 600; color: var(--mute); }

/* The scoreboard, and under it the controls, always there in small. */
.side { position: fixed; z-index: 2; top: max(14px, env(safe-area-inset-top)); right: 14px; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.side .hud { position: static; }
.hint { display: grid; gap: 4px; padding: 7px 10px 7px 7px; border-radius: 14px 14px 14px 4px; font-size: 12px; font-weight: 600; }
.hint span { display: flex; align-items: center; gap: 6px; }
.hint kbd { font: inherit; font-weight: 800; padding: 1px 8px; border-radius: 99px; background: var(--ink); color: var(--paper); }
/* What each pickup does, under the controls: its picture and a few words. */
.hint .it { gap: 5px; } .hint .it:first-of-type { margin-top: 4px; padding-top: 6px; box-shadow: 0 -1.5px 0 var(--line); }
.hint .it img { width: 22px; height: 22px; margin: -2px 0; }
.board { width: 190px; padding: 6px; border-radius: 16px 16px 16px 4px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.board div { display: flex; align-items: center; gap: 7px; padding: 2px 8px 2px 3px; border-radius: 99px; font-size: 13px; font-weight: 600; }
.board div.me { background: var(--ink); color: var(--paper); }
.board .face { width: 24px; flex: none; }
.board i { flex: 1; font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.board b { font-weight: 900; font-variant-numeric: tabular-nums; }

.map { left: 14px; bottom: max(14px, env(safe-area-inset-bottom)); width: 104px; height: 104px; border-radius: 50%; padding: 6px; }
.map canvas { width: 100%; height: 100%; display: block; }

.dash { position: fixed; z-index: 2; right: 18px; bottom: max(18px, env(safe-area-inset-bottom)); width: 92px; height: 92px; border-radius: 50%; background: var(--action); color: var(--paper);
  font-weight: 900; font-size: 18px; font-stretch: 110%; box-shadow: 4px 4px 0 var(--ink); touch-action: none; transition: transform .12s var(--expo), box-shadow .12s var(--expo); }
.dash:active, .dash.on { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); background: var(--action-hover); }

.pause { position: fixed; z-index: 2; left: 132px; bottom: max(14px, env(safe-area-inset-bottom)); width: 48px; height: 48px; border-radius: 50%; background: var(--paper); box-shadow: 3px 3px 0 var(--ink), inset 0 0 0 2px var(--ink); display: grid; place-items: center; }
.pause:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink), inset 0 0 0 2px var(--ink); }
.pause svg { width: 18px; }

.say { position: fixed; z-index: 3; top: max(18px, env(safe-area-inset-top)); left: 50%; padding: 9px 20px; border-radius: 99px; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 15px; white-space: nowrap;
  transform: translate(-50%, -80px); opacity: 0; transition: transform .45s var(--expo), opacity .2s; pointer-events: none; }
.say.show { transform: translate(-50%, 0); opacity: 1; }

.card { position: fixed; z-index: 4; left: 50%; top: 50%; width: min(520px, calc(100vw - 32px)); padding: 26px 26px 24px; background: var(--paper); border-radius: 26px 26px 26px 6px; box-shadow: 7px 7px 0 var(--ink), inset 0 0 0 2px var(--ink);
  transform: translate(-50%, -50%); transition: transform .5s var(--expo), opacity .25s; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.card[hidden] { display: grid; opacity: 0; transform: translate(-50%, -42%) scale(.96); pointer-events: none; }
.card h1 { font-weight: 900; font-stretch: 112%; font-size: clamp(30px, 8vw, 44px); line-height: .98; letter-spacing: -.02em; }
.card p { font-size: 16px; line-height: 1.4; font-weight: 500; }
.faces { display: flex; gap: 8px; align-items: center; position: relative; }
.faces > button { flex: 1; position: relative; aspect-ratio: 1; min-width: 0; padding: 4px; border-radius: 50%; background: var(--field); box-shadow: inset 0 0 0 2px var(--ink); transition: transform .15s var(--expo); }
.faces > button .face { width: 100%; }
.faces > button[aria-pressed="true"] { background: var(--paper); box-shadow: inset 0 0 0 4px var(--action), 3px 3px 0 var(--ink); transform: translateY(-4px); }
/* Shuffle: a round button the size of an animal, in ink so it reads as a control and not a seventh animal. */
.faces .more { background: var(--ink); color: var(--paper); display: grid; place-items: center; }
.faces .more svg { width: 52%; transition: transform .45s var(--expo); }
.faces .more:active svg { transform: rotate(180deg); }
/* Your own animal, for someone signed in: the first seat of the row, on ink. Without Ink it wears the Ink mark and opens the join card. */
.faces > .own { background: var(--ink); box-shadow: inset 0 0 0 2px var(--ink), 3px 3px 0 var(--action); }
.faces > .own[aria-pressed="true"] { background: var(--ink); }
.plus { position: absolute; left: 50%; bottom: -9px; translate: -50% 0; padding: 2px 8px 3px; border-radius: 99px; font-size: 11.5px; font-weight: 760; background: var(--ink); color: var(--field); white-space: nowrap; box-shadow: 0 0 0 2px var(--paper); }
/* The join card: grows out of the seat and overlaps what is above it. */
.ask { position: absolute; z-index: 8; left: -6px; bottom: calc(100% + 20px); width: min(360px, calc(100vw - 60px)); padding: 26px 18px 16px; border-radius: 20px 20px 20px 6px; background: var(--ink); color: var(--paper); box-shadow: 6px 6px 0 var(--action); transform-origin: 34px 100%; transition: opacity .3s, scale .4s var(--expo), translate .4s var(--expo), display .4s allow-discrete; }
.ask[hidden] { display: none; } @starting-style { .ask { opacity: 0; scale: .7; translate: 0 14px; } }
.ask::after { content: ''; position: absolute; left: 26px; bottom: -9px; width: 18px; height: 18px; rotate: 45deg; background: var(--ink); }
.ask .tab { position: absolute; left: 14px; top: -12px; padding: 3px 11px 4px; border-radius: 9px 9px 9px 3px; font-size: 13px; font-weight: 700; background: var(--field); color: var(--ink); }
.ask h3 { font-size: 25px; font-weight: 740; font-stretch: 110%; letter-spacing: -.045em; line-height: 1.02; } .card .ask p { margin: 6px 0 14px; color: oklch(80% 0.03 40); font-size: 15px; }
.ask div { display: flex; flex-wrap: wrap; gap: 8px; }
.ask .pl { padding: 8px 14px; border-radius: 99px; font-size: 14.5px; font-weight: 650; white-space: nowrap; text-decoration: none; background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
/* An Ink member's own animals, to pick one. */
/* The mark of Ink (components/campus/ink-mark.tsx): the blot alone, in the colour of what it sits on (openspec loop-ink-tiers). */
.mk { display: block; width: 17px; height: 17px; fill: currentColor; } .ask .tab .mk { width: 19px; height: 19px; }
.ask .pick { width: 48px; height: 48px; padding: 3px; border-radius: 50%; background: var(--field); box-shadow: inset 0 0 0 2px var(--paper); } .ask .pick .face { width: 100%; }
.ask .pick[aria-pressed="true"] { background: var(--paper); box-shadow: inset 0 0 0 4px var(--action); }
.ask .pl.see { background: var(--action); color: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink), 3px 3px 0 var(--field); }
.go { justify-self: start; padding: 0 30px; border-radius: 99px; background: var(--action); color: var(--paper); font-weight: 900; font-stretch: 110%; font-size: 19px; box-shadow: 4px 4px 0 var(--ink); transition: transform .12s var(--expo), box-shadow .12s var(--expo), background .12s; }
.go:hover { background: var(--action-hover); }
.go:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
/* A card's controls: one line, every one the same height. */
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row > * { height: 48px; flex: none; display: inline-flex; align-items: center; }
.where { gap: 4px; padding: 4px; flex: 0 1 auto; min-width: 0; border-radius: 99px; box-shadow: inset 0 0 0 2px var(--ink); }
.where button { height: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; padding: 0 14px; border-radius: 99px; background: none; font-weight: 700; font-size: 14px; white-space: nowrap; }
.where button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
/* The way back to Loopd: the woven mark on an ink tile, at the end of the row. Only the page's own colours: paper rings, the top one
   coral, and no second red beside Start. It lifts when pointed at. */
.back { margin-left: auto; width: 48px; justify-content: center; border-radius: 13px 13px 13px 4px; background: var(--ink); color: var(--paper); transition: transform .2s var(--expo), box-shadow .2s var(--expo); }
.back svg { width: 36px; height: 36px; }
.back:hover { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--field), 3px 3px 0 1.5px var(--ink); }
.quit { text-decoration: none; color: inherit; padding: 0 22px; border-radius: 99px; background: none; box-shadow: inset 0 0 0 2px var(--ink); font-weight: 700; font-size: 15px; }
.score { display: flex; gap: 10px; align-items: stretch; }
.score div { flex: 1; padding: 12px 16px; border-radius: 16px 16px 16px 4px; background: var(--field); display: grid; gap: 2px; }
.score div + div { background: var(--ink); color: var(--paper); }
.score b { font-weight: 900; font-stretch: 112%; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.score span { font-size: 13px; font-weight: 700; }
@media (max-width: 560px) { .board { width: 142px; padding: 4px; } .board div { font-size: 12px; gap: 5px; padding-right: 7px; } .board .face { width: 20px; } .board div:nth-child(n+4):not(.me) { display: none; }
  .card { padding: 22px 16px 20px; } .row { gap: 6px; } .go { padding: 0 13px; font-size: 17px; } .where button { padding: 0 6px; font-size: 12.5px; } .quit { padding: 0 16px; }
  .mine span:not(.face) { display: none; } .say { top: calc(max(14px, env(safe-area-inset-top)) + 124px); font-size: 14px; } .map { width: 84px; height: 84px; } .hint { font-size: 11px; padding: 5px 8px 5px 5px; } .pause { left: 110px; } }
/* On a phone the animals to pick from are four to a row, each big enough for a thumb, and the scoreboard and controls
   step aside while a card is up so nothing sits over it. */
@media (max-width: 560px) { .faces { flex-wrap: wrap; row-gap: 12px; } .faces > button { flex: 0 0 calc(25% - 6px); }
  body:has(.card:not([hidden])) :is(.board, .hint) { visibility: hidden; } }
/* A long notice wraps rather than runs off a narrow screen. */
.say { width: max-content; max-width: calc(100vw - 32px); white-space: normal; text-align: center; }
/* A phone on its side: little height, so the scoreboard keeps its top three and you, and everything round the edge is
   smaller, leaving the middle of the screen to the game. */
@media (max-height: 500px) { .board { width: 168px; padding: 4px; } .board div { font-size: 12px; gap: 5px; padding: 1px 7px 1px 3px; } .board .face { width: 20px; } .board div:nth-child(n+4):not(.me) { display: none; }
  .mine { padding: 4px 14px 4px 5px; } .mine .face { width: 32px; } .mine b { font-size: 22px; } .hint { font-size: 11px; padding: 5px 8px 5px 5px; }
  .map { width: 84px; height: 84px; } .pause { left: 110px; } .dash { width: 78px; height: 78px; font-size: 16px; }
  .card { top: 50%; max-height: calc(100dvh - 24px); padding: 18px 22px; gap: 12px; } .card h1 { font-size: 34px; } .faces > button { max-width: 56px; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud mine" id="mine" hidden><span class="face" id="mineFace"></span><b id="mineCount">1</b><span>in your line</span></div>
<div class="side"><div class="hud board" id="board"></div><div class="hud hint" id="hint"></div></div>
<div class="hud map"><canvas id="map" width="184" height="184"></canvas></div>
<button class="dash" id="dash" hidden>Dash</button>
<button class="pause" id="pause" hidden aria-label="Pause"><svg viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><rect x="3" y="2" width="4.5" height="14" rx="1.5"/><rect x="10.5" y="2" width="4.5" height="14" rx="1.5"/></svg></button>
<div class="say" id="say"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <path id="ra" d="M29 35a21 21 0 1 0 42 0a21 21 0 1 0 -42 0"/><path id="rb" d="M14.500 60a21 21 0 1 0 42 0a21 21 0 1 0 -42 0"/><path id="rc" d="M43.500 60a21 21 0 1 0 42 0a21 21 0 1 0 -42 0"/>
  <mask id="ma" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><use href="#rc" stroke="#000" stroke-width="17"/></mask>
  <mask id="mb" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><use href="#ra" stroke="#000" stroke-width="17"/></mask>
  <mask id="mc" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><use href="#rb" stroke="#000" stroke-width="17"/></mask>
  <symbol id="loopd" viewBox="4 4 92 92"><g fill="none" stroke-width="10.5"><g mask="url(#ma)"><use href="#ra" stroke="var(--field)"/></g><g mask="url(#mb)"><use href="#rb" stroke="currentColor"/></g><g mask="url(#mc)"><use href="#rc" stroke="currentColor"/></g></g></symbol>
</defs></svg>

<section class="card" id="start">
  <h1>Longest line wins</h1>
  <p>Walk into a stray and it joins your line. Walk into another line and yours scatters for anyone to grab.</p>
  <div class="faces" id="faces"></div>
  <div class="row"><button class="go" id="go">Start</button><div class="where" id="where"></div><a class="back" href="/" aria-label="Back to Loopd" title="Back to Loopd"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#loopd"/></svg></a></div>
</section>

<section class="card" id="over" hidden>
  <h1 id="overHead">Scattered</h1>
  <div class="score"><div><b id="overCount">1</b><span>in your line</span></div><div><b id="overBest">1</b><span>your best</span></div></div>
  <div class="row"><button class="go" id="again">Again</button><a class="back" href="/" aria-label="Back to Loopd" title="Back to Loopd"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#loopd"/></svg></a></div>
</section>

<section class="card" id="paused" hidden>
  <h1>Paused</h1>
  <div class="row"><button class="go" id="resume">Resume</button><button class="quit" id="quit">Quit</button><a class="back" href="/" aria-label="Back to Loopd" title="Back to Loopd"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#loopd"/></svg></a></div>
</section>

<script type="module">
import { createWorld, addLine, steer, step, removeLine, FACES, PLAZA, POWERS, LOUD } from './conga/sim.js';
import { MAPS, shore, TALL, treeWidth } from './conga/maps.js';
import { SHEET as SCENERY, AT } from './conga/scenery.js';

const $ = id => document.getElementById(id);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
// Outside the ground is the print map's paper, and its blue where there is water (components/campus/near.tsx).
const C = { field: css('--field'), dot: css('--dot'), ink: css('--ink'), paper: css('--paper'), action: css('--action'), town: '#f0e8d4', twine: '#fbf7ec', water: '#3f86de', roof: '#f5eedc', trim: '#dccfae', green: 'oklch(87% 0.1 140)', tree: 'oklch(71% 0.14 148)', blossom: 'oklch(84% 0.1 0)', panel: '#c5d6ea', stone: '#d9d4c7', lamp: '#ffe27a', cab: '#fccc0a' };
// Every animal is on one sheet (scripts/conga-atlas.mjs), seven across, with its ground shadow already under it.
// A small screen takes the small sheet. The version is in the name so the file can be kept by the browser for good.
const COLS = 7, SHEET = Math.min(innerWidth, innerHeight * 1.25) / 760 * Math.min(2, devicePixelRatio || 1) > 1.4 ? 192 : 96;
const sheet = Object.assign(new Image(), { src: `./conga/animals-${SHEET}.v1.webp` });
document.documentElement.style.setProperty('--sheet', `url(${sheet.src})`);
// Who is playing, for someone signed in (app/conga): whether they have Ink (`ink`) or Ink+ (`plus`), their school, and the animals that are theirs to
// play as, the one they wear on campus first. `chosen` is the one in their seat. Face 0 is a made pet, a picture apart from the sheet.
let you = null, chosen = 0; const pet = new Image();
const own = () => you.animals[chosen];
const CORE = 36; // the animals anyone may play as; the rest are an Ink member's own
// The Ink mark, in place of the plan's name: a feature that comes with Ink wears it.
const INK = '<svg class="mk" viewBox="-68 -68 136 136" role="img" aria-label="Ink"><path d="M-8 -60C22 -66 52 -44 58 -14C66 18 46 54 10 60C-24 66 -58 44 -62 10C-66 -24 -40 -54 -8 -60Z"/><circle cx="56" cy="-50" r="9"/><circle cx="-58" cy="46" r="6"/></svg>';
// Each school's two colours (app/c/campus.css, [data-kit]): what an Ink+ line's sparkle wears.
const KITS = { loop: ['oklch(96.4% 0.19 117)', 'oklch(47.6% 0.13 250)'], cornell: ['oklch(99.2% 0.004 60)', 'oklch(48.5% 0.185 27)'], columbia: ['oklch(87% 0.075 235)', 'oklch(46% 0.14 255)'],
  cuny: ['oklch(88% 0.13 88)', 'oklch(38% 0.18 264)'], nyu: ['oklch(85% 0.09 305)', 'oklch(40% 0.2 305)'] };
const cut = (face, picture = pet.src) => !face ? `background: var(--field) url(${picture}) center / contain no-repeat; border-radius: 50%` : `background-position: ${(face - 1) % COLS / (COLS - 1) * 100}% ${Math.floor((face - 1) / COLS) / (Math.ceil(FACES / COLS) - 1) * 100}%`;
const faceTag = (face, picture) => `<span class="face" style="${cut(face, picture)}"></span>`;
// The pickups, drawn as toys in the animals' style (scripts/pickup-art.ts), and each one's own colour, for its light on the ground.
const ART = Object.fromEntries(Object.keys(POWERS).map(kind => [kind, Object.assign(new Image(), { src: `./conga/pickups/${kind}.v1.webp` })]));
const OWN = { megaphone: '62% 0.2 27', coffee: '62% 0.09 60', whistle: '84% 0.16 88' };
const keep = { get: key => { try { return localStorage.getItem(key); } catch { return null; } }, set: (key, value) => { try { localStorage.setItem(key, value); } catch {} } };

// The other lines. In live play these are people; here each one is a bot with its own nerve and temper.
// The grounds grew half again (maps.js ROOM), so each has more lines on it.
const GROUPS = { cornell: ['Donlon 2F', 'CS 2110', 'Team 4', 'Risley', 'Big Red Band', 'Club Frisbee', 'Glee Club', 'West Campus', 'Olin late shift', 'Slope Day crew', 'Ag Quad lab', 'Collegetown', 'Rowing', 'Hotelies', 'Mews Hall', 'Dairy Bar line', 'Physics 1112'],
  'cornell-tech': ['Bloomberg 2F', 'Tata studio', 'The House 12', 'Studio team 4', 'Johnson MBA', 'Tram regulars', 'Jacobs', 'Health Tech', 'Connective Media', 'Urban Tech', 'Cafe line', 'Runway', 'Startup Studio', 'Ferry crew', 'Bloomberg 3F', 'Run club', 'Verizon EC'] };
// Each line's rope colour, one for every line on a ground, told apart by hue and by lightness, and kept off the coral ground and your own red.
const TINTS = ['88% 0.17 98', '62% 0.2 262', '74% 0.2 140', '62% 0.24 320', '76% 0.13 195', '55% 0.2 290', '82% 0.16 125', '66% 0.22 350', '62% 0.13 225', '72% 0.17 305', '58% 0.14 165',
  '46% 0.13 150', '88% 0.08 230', '45% 0.17 300', '90% 0.11 165', '72% 0.13 85', '42% 0.06 260'];
const tint = n => `oklch(${TINTS[n % TINTS.length]})`;
const ME = 'me';
const colour = id => id === ME ? C.action : tint(id);

let world, map, land, me = null, aim = 0, followed = null;
const ask = new URLSearchParams(location.search);
let held = null, best = Number(keep.get('conga-best')) || 1, picked = Number(keep.get('conga-face')) || 1 + Math.floor(Math.random() * CORE), mine = keep.get('conga-face') === 'mine', where = MAPS[ask.get('map')] ? ask.get('map') : MAPS[keep.get('conga-map')] ? keep.get('conga-map') : 'cornell';
window.conga = { get world() { return world; } }; // for poking at the game from the console

const BOTS = 10; // lines played by the game; more fill the ground faster than it refills
/** Opens a ground: its own world, with the bots already walking it. In the app this is the campus you are on. */
function open(id) {

    if (!seen(line.x, line.y)) continue;
    const across = pill(`${line.name} · ${line.tail.length + 1}`, line.x, line.y - 46, line === me ? C.action : C.ink, C.paper);
    // What the line holds, beside its name: the pickup on a paper disc, with its time running down round it in the line's colour.
    let x = line.x + across / 2 + 4;
    for (const kind of Object.keys(POWERS)) {
      const left = line.powers[kind];
      if (left <= 0) continue;
      const r = Math.max(14, 11 / cam.z); x += r + 4;
      ctx.beginPath(); ctx.arc(x, line.y - 46, r, 0, 7); ctx.fillStyle = C.paper; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.arc(x, line.y - 46, r + 3.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * left / POWERS[kind]); ctx.strokeStyle = colour(line.id); ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.stroke(); ctx.lineCap = 'butt';
      const art = ART[kind]; if (art.complete && art.naturalWidth) ctx.drawImage(art, x - r * 0.8, line.y - 46 - r * 0.8, r * 1.6, r * 1.6);
      x += r + 4;
    }
  }
}

// The small map: the whole ground in its real shape, and where every line is on it.
const chartPen = $('map').getContext('2d');
function chart() {
  const { west, east, north, south } = world.box, scale = 164 / Math.max(east - west, south - north);
  chartPen.setTransform(1, 0, 0, 1, 0, 0); chartPen.clearRect(0, 0, 184, 184);
  chartPen.translate(92, 92); chartPen.scale(scale, scale); chartPen.translate(-(west + east) / 2, -(north + south) / 2);
  chartPen.fillStyle = C.field; chartPen.strokeStyle = C.ink; chartPen.lineWidth = 3 / scale; chartPen.lineJoin = 'round'; chartPen.stroke(land); chartPen.fill(land);
  // A mob pings on the small map, in the colour of the line it was.
  for (const mob of world.mobs) {
    const beat = (world.t % 1.2) / 1.2;
    chartPen.beginPath(); chartPen.arc(mob.x, mob.y, (7 + beat * 14) / scale, 0, 7); chartPen.globalAlpha = 1 - beat; chartPen.strokeStyle = colour(mob.from); chartPen.lineWidth = 3 / scale; chartPen.stroke(); chartPen.globalAlpha = 1;
    chartPen.beginPath(); chartPen.arc(mob.x, mob.y, 7 / scale, 0, 7); chartPen.fillStyle = colour(mob.from); chartPen.fill(); chartPen.strokeStyle = C.ink; chartPen.lineWidth = 2 / scale; chartPen.stroke();
  }
  for (const it of world.items) { chartPen.beginPath(); chartPen.arc(it.x, it.y, 5 / scale, 0, 7); chartPen.fillStyle = `oklch(${OWN[it.kind]})`; chartPen.fill(); chartPen.lineWidth = 1.5 / scale; chartPen.stroke(); }
  for (const car of world.shuttles) { chartPen.beginPath(); chartPen.rect(car.x - 6 / scale, car.y - 6 / scale, 12 / scale, 12 / scale); chartPen.fillStyle = C.action; chartPen.fill(); chartPen.lineWidth = 2 / scale; chartPen.stroke(); }
  for (const line of world.lines) {
    if (line.dead) continue;
    chartPen.fillStyle = line === me ? C.action : C.ink;
    chartPen.beginPath(); chartPen.arc(line.x, line.y, (line === me ? 9 : 3 + Math.min(6, line.tail.length / 8)) / scale, 0, 7); chartPen.fill();
  }
}

function board() {
  const ranked = world.lines.filter(line => !line.dead).sort((a, b) => b.tail.length - a.tail.length), top = ranked.slice(0, 5);
  if (me && !me.dead && !top.includes(me)) top[4] = me;
  $('board').innerHTML = top.map(line => `<div class="${line === me ? 'me' : ''}">${faceTag(line.face)}<i>${ranked.indexOf(line) + 1}. ${line.name}</i><b>${line.tail.length + 1}</b></div>`).join('');
  if (me && !me.dead) $('mineCount').textContent = me.tail.length + 1;
}

// ---------- the loop ----------
open(where);
let last = performance.now(), ticks = 0, pace = 16, settled = 0, clock = 0;
function frame(now) {
  const took = now - last, dt = paused ? 0 : Math.max(0, Math.min(0.05, took / 1000)), t = clock += dt; last = now; // the game's own clock, which stops with it
  // `pace` is the usual time between frames. Two seconds of it staying over 24 ms, about 40 frames a second, is too slow.
  if (took < 250) pace += (took - pace) * 0.05;
  if (++settled > 120 && pace > 24 && quality < SHARP.length - 1) { quality++; settled = 0; pace = 16; fit(); }
  if (me && !me.dead && !paused) {
    if (keys.has('ArrowLeft') || keys.has('KeyA')) aim = me.a - 1.2;
    if (keys.has('ArrowRight') || keys.has('KeyD')) aim = me.a + 1.2;
    steer(me, aim, dash);
  }
  for (const event of paused ? [] : step(world, dt)) {
    if (event.type === 'join' && event.line === ME) navigator.vibrate?.(8);
    if (event.type === 'scatter') {
      puffs.push({ x: event.x, y: event.y, t, colour: colour(event.line) });
      if (event.line === ME) { navigator.vibrate?.(60); finish(event); }
      else if (event.by === ME) say(`${world.lines.find(line => line.id === event.line).name} scattered on your line`);
    }
    if (event.type === 'arrive') {
      // Its riders hop off into each line waiting; with nobody waiting they hop down round the stop.
      const ride = world.shuttles.find(each => each.name === event.name), from = { x: ride.x, y: ride.y + (ride.kind === 'bus' ? -20 : 20) }, fill = carColour(ride);
      for (const each of event.onto) {
        const line = world.lines.find(one => one.id === each.line);
        if (!line || !each.count) continue;
        hopping(each.count, from, () => line, t);
        counts.push({ line, text: `+${each.count}`, fill, ink: C.ink, t });
      }
      if (!event.onto.length) for (let n = 0; n < 8; n++) { const a = n * 0.785, spot = { x: event.x + Math.cos(a) * 90, y: event.y + Math.sin(a) * 60 }; hopping(1, from, () => spot, t + n * 0.06); }
      const mine = event.onto.find(each => each.line === ME), car = event.name.toLowerCase();
      if (mine) { navigator.vibrate?.(30); say(`${mine.count} got off the ${car} straight onto your line`); }
      else if (me && !me.dead) say(event.onto.length ? `${world.lines.find(line => line.id === event.onto[0].line).name} met the ${car} and took its riders` : `The ${car} let ${event.count} off at ${event.stop}`);
    }
    if (event.type === 'lift') {
      // The back of the line hops up into the car, which it goes on carrying.
      const ride = world.shuttles.find(each => each.name === event.name), line = world.lines.find(one => one.id === event.line);
      if (ride && line) {
        const end = line.tail.at(-1) ?? line;
        hopping(event.count, { x: end.x, y: end.y }, () => ({ x: ride.x, y: ride.y + (ride.kind === 'bus' ? -20 : 20) }), t);
        counts.push({ line, text: `−${event.count}`, fill: C.ink, ink: C.paper, t });
      }
      if (event.line === ME) { navigator.vibrate?.(30); say(event.head ? `The ${event.name.toLowerCase()} hit you and took ${event.count}` : `The ${event.name.toLowerCase()} took ${event.count} off the back of your line`); } }
    if (event.type === 'full') {
      // The lines together got too long to draw smoothly: the round ends with your count kept, and a fresh ground opens.
      if (me && !me.dead) { const size = me.tail.length + 1; removeLine(world, ME); me = null; finish({ size, full: true }); }
      open(where);
      break;
    }
    if (event.type === 'grab') {
      // A sack taken: a ring in the fallen line's colour where it lay, and its count by the taker's name.
      const line = world.lines.find(one => one.id === event.line);
      puffs.push({ x: event.x, y: event.y, t, colour: colour(event.from) });
      if (line) counts.push({ line, text: `+${event.count}`, fill: colour(event.from), ink: Number(/([\d.]+)%/.exec(colour(event.from))?.[1] ?? 60) > 66 ? C.ink : C.paper, t });
      if (event.line === ME) navigator.vibrate?.(30);
    }
    if (event.type === 'dance' && event.line === ME) say(`${event.size} in line. Everybody dance`);
    // Someone else's big spill is news everywhere; a small one only near you.
    if (event.type === 'spill' && event.line !== ME && me && !me.dead && event.by !== ME && (event.size >= 15 || Math.hypot(event.x - me.x, event.y - me.y) < 1200)) say(`${event.name} spilled ${event.size}`);
    if (event.type === 'power' && event.line === ME) {
      navigator.vibrate?.(20);
      say({ megaphone: 'Megaphone! Strays come from twice as far', coffee: 'Coffee! Dash for free', whistle: `Whistle! The ${car()} can't take anyone off your line` }[event.kind]);
    }
    if (event.type === 'restless' && event.line === ME) say('Nobody new for a while. The back of your line is wandering off');
  }
  draw(t, dt);
  if (stick) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(stick.x0, stick.y0, REACH, 0, 7); ctx.fillStyle = C.paper; ctx.fill(); ctx.globalAlpha = 1; ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(stick.x, stick.y, 20, 0, 7); ctx.fillStyle = C.ink; ctx.fill();
  }
  if (ticks++ % 12 === 0) { board(); chart(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
