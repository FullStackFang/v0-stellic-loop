<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Conga · Loopd</title>
<meta name="description" content="Walk your animal round campus and gather the longest line.">
<link rel="modulepreload" href="./conga/sim.js"><link rel="modulepreload" href="./conga/maps.js">
<style>
@font-face { font-family: Archivo; src: url(/fonts/Archivo.ttf); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
:root { --field: oklch(82% 0.12 38); --dot: oklch(77% 0.13 37); --ink: oklch(24% 0.035 30); --action: oklch(48.5% 0.185 27); --action-hover: oklch(54% 0.19 27);
  --paper: oklch(99.2% 0.004 60); --mute: oklch(45% 0.016 40); --line: oklch(88% 0.012 50); --expo: cubic-bezier(.16, 1, .3, 1); }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow: hidden; background: #f0e8d4; color: var(--ink); font-family: Archivo, system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
/* One animal's face, cut from the sheet all of them are on: seven across, six down. */
.face { display: block; aspect-ratio: 1; background: var(--sheet) 0 0 / 700% 600% no-repeat; }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
.hud[hidden], .dash[hidden], .pause[hidden] { display: none; }
body.bare .hud, body.bare .card, body.bare .say { display: none; } /* a still view of one place, for comparing looks */

.hud { position: fixed; z-index: 2; pointer-events: none; background: var(--paper); box-shadow: 3px 3px 0 var(--ink), inset 0 0 0 2px var(--ink); }
.mine { top: max(14px, env(safe-area-inset-top)); left: 14px; display: flex; align-items: center; gap: 8px; padding: 5px 16px 5px 6px; border-radius: 99px; }
.mine .face { width: 40px; border-radius: 50%; background-color: var(--field); }
.mine b { font-weight: 900; font-size: 26px; font-stretch: 110%; line-height: 1; font-variant-numeric: tabular-nums; }
.mine span { font-size: 13px; font-weight: 600; color: var(--mute); }

/* The scoreboard, and under it the controls, always there in small. */
.side { position: fixed; z-index: 2; top: max(14px, env(safe-area-inset-top)); right: 14px; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.side .hud { position: static; }
.hint { display: grid; gap: 4px; padding: 7px 10px 7px 7px; border-radius: 14px 14px 14px 4px; font-size: 12px; font-weight: 600; }
.hint span { display: flex; align-items: center; gap: 6px; }
.hint kbd { font: inherit; font-weight: 800; padding: 1px 8px; border-radius: 99px; background: var(--ink); color: var(--paper); }
.board { width: 190px; padding: 6px; border-radius: 16px 16px 16px 4px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.board div { display: flex; align-items: center; gap: 7px; padding: 2px 8px 2px 3px; border-radius: 99px; font-size: 13px; font-weight: 600; }
.board div.me { background: var(--ink); color: var(--paper); }
.board .face { width: 24px; flex: none; }
.board i { flex: 1; font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.board b { font-weight: 900; font-variant-numeric: tabular-nums; }

.map { left: 14px; bottom: max(14px, env(safe-area-inset-bottom)); width: 104px; height: 104px; border-radius: 50%; padding: 6px; }
.map canvas { width: 100%; height: 100%; display: block; }

.dash { position: fixed; z-index: 2; right: 18px; bottom: max(18px, env(safe-area-inset-bottom)); width: 92px; height: 92px; border-radius: 50%; background: var(--action); color: var(--paper);
  font-weight: 900; font-size: 18px; font-stretch: 110%; box-shadow: 4px 4px 0 var(--ink); touch-action: none; transition: transform .12s var(--expo), box-shadow .12s var(--expo); }
.dash:active, .dash.on { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); background: var(--action-hover); }

.pause { position: fixed; z-index: 2; left: 132px; bottom: max(14px, env(safe-area-inset-bottom)); width: 48px; height: 48px; border-radius: 50%; background: var(--paper); box-shadow: 3px 3px 0 var(--ink), inset 0 0 0 2px var(--ink); display: grid; place-items: center; }
.pause:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink), inset 0 0 0 2px var(--ink); }
.pause svg { width: 18px; }

.say { position: fixed; z-index: 3; top: max(18px, env(safe-area-inset-top)); left: 50%; padding: 9px 20px; border-radius: 99px; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 15px; white-space: nowrap;
  transform: translate(-50%, -80px); opacity: 0; transition: transform .45s var(--expo), opacity .2s; pointer-events: none; }
.say.show { transform: translate(-50%, 0); opacity: 1; }

.card { position: fixed; z-index: 4; left: 50%; top: 50%; width: min(520px, calc(100vw - 32px)); padding: 26px 26px 24px; background: var(--paper); border-radius: 26px 26px 26px 6px; box-shadow: 7px 7px 0 var(--ink), inset 0 0 0 2px var(--ink);
  transform: translate(-50%, -50%); transition: transform .5s var(--expo), opacity .25s; display: grid; gap: 16px; }
.card[hidden] { display: grid; opacity: 0; transform: translate(-50%, -42%) scale(.96); pointer-events: none; }
.card h1 { font-weight: 900; font-stretch: 112%; font-size: clamp(30px, 8vw, 44px); line-height: .98; letter-spacing: -.02em; }
.card p { font-size: 16px; line-height: 1.4; font-weight: 500; }
.faces { display: flex; gap: 8px; align-items: center; }
.faces button { flex: 1; aspect-ratio: 1; min-width: 0; padding: 4px; border-radius: 50%; background: var(--field); box-shadow: inset 0 0 0 2px var(--ink); transition: transform .15s var(--expo); }
.faces button .face { width: 100%; }
.faces button[aria-pressed="true"] { background: var(--paper); box-shadow: inset 0 0 0 4px var(--action), 3px 3px 0 var(--ink); transform: translateY(-4px); }
/* Shuffle: a round button the size of an animal, in ink so it reads as a control and not a seventh animal. */
.faces .more { background: var(--ink); color: var(--paper); display: grid; place-items: center; }
.faces .more svg { width: 52%; transition: transform .45s var(--expo); }
.faces .more:active svg { transform: rotate(180deg); }
.go { justify-self: start; padding: 14px 34px; border-radius: 99px; background: var(--action); color: var(--paper); font-weight: 900; font-stretch: 110%; font-size: 19px; box-shadow: 4px 4px 0 var(--ink); transition: transform .12s var(--expo), box-shadow .12s var(--expo), background .12s; }
.go:hover { background: var(--action-hover); }
.go:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; }
.where { display: flex; gap: 4px; padding: 4px; border-radius: 99px; box-shadow: inset 0 0 0 2px var(--ink); }
.where button { padding: 9px 14px; border-radius: 99px; background: none; font-weight: 700; font-size: 14px; white-space: nowrap; }
.where button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.quit { text-decoration: none; color: inherit; padding: 12px 22px; border-radius: 99px; background: none; box-shadow: inset 0 0 0 2px var(--ink); font-weight: 700; font-size: 15px; }
.score { display: flex; gap: 10px; align-items: stretch; }
.score div { flex: 1; padding: 12px 16px; border-radius: 16px 16px 16px 4px; background: var(--field); display: grid; gap: 2px; }
.score div + div { background: var(--ink); color: var(--paper); }
.score b { font-weight: 900; font-stretch: 112%; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.score span { font-size: 13px; font-weight: 700; }
@media (max-width: 560px) { .board { width: 142px; padding: 4px; } .board div { font-size: 12px; gap: 5px; padding-right: 7px; } .board .face { width: 20px; } .board div:nth-child(n+4):not(.me) { display: none; }
  .mine span:not(.face) { display: none; } .say { top: calc(max(14px, env(safe-area-inset-top)) + 124px); font-size: 14px; } .map { width: 84px; height: 84px; } .hint { font-size: 11px; padding: 5px 8px 5px 5px; } .pause { left: 110px; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud mine" id="mine" hidden><span class="face" id="mineFace"></span><b id="mineCount">1</b><span>in your line</span></div>
<div class="side"><div class="hud board" id="board"></div><div class="hud hint" id="hint"></div></div>
<div class="hud map"><canvas id="map" width="184" height="184"></canvas></div>
<button class="dash" id="dash" hidden>Dash</button>
<button class="pause" id="pause" hidden aria-label="Pause"><svg viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><rect x="3" y="2" width="4.5" height="14" rx="1.5"/><rect x="10.5" y="2" width="4.5" height="14" rx="1.5"/></svg></button>
<div class="say" id="say"></div>

<section class="card" id="start">
  <h1>Longest line wins</h1>
  <p>Walk into a stray and it joins your line. Walk into another line and yours scatters for anyone to grab.</p>
  <div class="faces" id="faces"></div>
  <div class="row"><button class="go" id="go">Start</button><div class="where" id="where"></div><a class="quit" href="/">Back to Loopd</a></div>
</section>

<section class="card" id="over" hidden>
  <h1 id="overHead">Scattered</h1>
  <div class="score"><div><b id="overCount">1</b><span>in your line</span></div><div><b id="overBest">1</b><span>your best</span></div></div>
  <div class="row"><button class="go" id="again">Again</button><a class="quit" href="/">Back to Loopd</a></div>
</section>

<section class="card" id="paused" hidden>
  <h1>Paused</h1>
  <div class="row"><button class="go" id="resume">Resume</button><button class="quit" id="quit">Quit</button><a class="quit" href="/">Back to Loopd</a></div>
</section>

<script type="module">
import { createWorld, addLine, place, steer, step, removeLine, FACES, PLAZA } from './conga/sim.js';
import { MAPS, shore } from './conga/maps.js';

const $ = id => document.getElementById(id);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
// Outside the ground is the print map's paper, and its blue where there is water (components/campus/near.tsx).
const C = { field: css('--field'), dot: css('--dot'), ink: css('--ink'), paper: css('--paper'), action: css('--action'), town: '#f0e8d4', twine: '#fbf7ec', water: '#3f86de', roof: '#f5eedc', trim: '#dccfae', green: 'oklch(87% 0.1 140)', tree: 'oklch(71% 0.14 148)', blossom: 'oklch(84% 0.1 0)', panel: '#c5d6ea', stone: '#d9d4c7', lamp: '#ffe27a', cab: '#fccc0a' };
// Every animal is on one sheet (scripts/conga-atlas.mjs), seven across, with its ground shadow already under it.
// A small screen takes the small sheet. The version is in the name so the file can be kept by the browser for good.
const COLS = 7, SHEET = Math.min(innerWidth, innerHeight * 1.25) / 760 * Math.min(2, devicePixelRatio || 1) > 1.4 ? 192 : 96;
const sheet = Object.assign(new Image(), { src: `./conga/animals-${SHEET}.v1.webp` });
document.documentElement.style.setProperty('--sheet', `url(${sheet.src})`);
const cut = face => `background-position: ${(face - 1) % COLS / (COLS - 1) * 100}% ${Math.floor((face - 1) / COLS) / (Math.ceil(FACES / COLS) - 1) * 100}%`;
const faceTag = face => `<span class="face" style="${cut(face)}"></span>`;
const keep = { get: key => { try { return localStorage.getItem(key); } catch { return null; } }, set: (key, value) => { try { localStorage.setItem(key, value); } catch {} } };

// The other lines. In live play these are people; here each one is a bot with its own nerve and temper.
const GROUPS = { cornell: ['Donlon 2F', 'CS 2110', 'Team 4', 'Risley', 'Big Red Band', 'Club Frisbee', 'Glee Club', 'West Campus', 'Olin late shift', 'Slope Day crew', 'Ag Quad lab'],
  'cornell-tech': ['Bloomberg 2F', 'Tata studio', 'The House 12', 'Studio team 4', 'Johnson MBA', 'Tram regulars', 'Jacobs', 'Health Tech', 'Connective Media', 'Urban Tech', 'Cafe line'] };
const tint = n => `oklch(64% 0.17 ${[125, 235, 80, 305, 165, 0, 200, 140, 55, 270, 330][n]})`;
const ME = 'me';
const colour = id => id === ME ? C.action : tint(id);

let world, map, land, blossoms = [], me = null, aim = 0;
const ask = new URLSearchParams(location.search);
let held = null, best = Number(keep.get('conga-best')) || 1, picked = Number(keep.get('conga-face')) || 1 + Math.floor(Math.random() * FACES), where = MAPS[ask.get('map')] ? ask.get('map') : MAPS[keep.get('conga-map')] ? keep.get('conga-map') : 'cornell';
window.conga = { get world() { return world; } }; // for poking at the game from the console

/** Opens a ground: its own world, with the bots already walking it. In the app this is the campus you are on. */
function open(id) {
  where = id; map = MAPS[id]; me = null;
  world = createWorld(Math.random, map.rings, map.holes, map.shuttles ?? []);
  // Roosevelt Island's cherry trees: a row just in from the west shore.
  blossoms = [];
  if (map.axis != null) {
    const a = map.axis * Math.PI / 180, shore = map.rings[0], mid = [shore.reduce((sum, q) => sum + q[0], 0) / shore.length, shore.reduce((sum, q) => sum + q[1], 0) / shore.length];
    shore.forEach((from, i) => { const to = shore[(i + 1) % shore.length], far = Math.hypot(to[0] - from[0], to[1] - from[1]);
      for (let d = 40; d < far; d += 85) { const x = from[0] + (to[0] - from[0]) * d / far, y = from[1] + (to[1] - from[1]) * d / far; if ((x - mid[0]) * Math.cos(a) + (y - mid[1]) * Math.sin(a) < -60) blossoms.push([x + Math.cos(a) * 38, y + Math.sin(a) * 38]); } });
  }
  GROUPS[id].forEach((name, i) => addLine(world, { id: i, face: 1 + Math.floor(Math.random() * FACES), name, bot: { skill: 0.35 + Math.random() * 0.65, aggro: Math.random() }, start: 3 + Math.floor(Math.random() * 14) }));
  for (let i = 0; i < 240; i++) step(world, 1 / 30); // let the bots spread out before anyone looks
  land = new Path2D();
  for (const ring of map.rings) { ring.forEach(([x, y], i) => i ? land.lineTo(x, y) : land.moveTo(x, y)); land.closePath(); }
  const lead = world.lines.reduce((a, b) => a.tail.length >= b.tail.length ? a : b), pin = map.things.find(thing => thing.name === ask.get('at'));
  held = pin ? { x: pin.x + Number(ask.get('dx') ?? 0), y: pin.y + Number(ask.get('dy') ?? 0), dead: true, tail: [] } : null;
  document.body.classList.toggle('bare', !!held);
  cam.x = (held ?? lead).x; cam.y = (held ?? lead).y;
  for (const button of $('where').children) button.setAttribute('aria-pressed', button.dataset.map === id);
}

// ---------- the cards ----------
function offer() {
  const set = new Set([picked]);
  while (set.size < 6) set.add(1 + Math.floor(Math.random() * FACES));
  $('faces').replaceChildren(...[...set].map(face => {
    const button = document.createElement('button');
    button.setAttribute('aria-pressed', face === picked);
    button.setAttribute('aria-label', `Animal ${face}`);
    button.innerHTML = faceTag(face);
    button.onclick = () => { picked = face; for (const other of $('faces').children) other.setAttribute('aria-pressed', other === button); };
    return button;
  }), Object.assign(document.createElement('button'), { className: 'more', ariaLabel: 'Shuffle the animals', title: 'Shuffle', onclick: () => offer(),
    innerHTML: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h3.5c3.5 0 5.5 10 9 10H21M3 17h3.5c1.4 0 2.5-1.5 3.5-3.3M14 8.300C14.700 7.500 15.500 7 16.500 7H21M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>' }));
}
offer();
$('where').replaceChildren(...Object.entries(MAPS).map(([id, each]) => {
  const button = Object.assign(document.createElement('button'), { textContent: each.name, onclick: () => { keep.set('conga-map', id); open(id); } });
  button.dataset.map = id;
  return button;
}));

function begin() {
  keep.set('conga-face', picked);
  if (me) place(world, me);
  else me = addLine(world, { id: ME, face: picked, name: 'You' });
  me.ink = ask.has('ink'); // until the game knows who has Ink+, `?ink` shows its sparkle on your own line
  me.face = picked;
  aim = me.a;
  $('start').hidden = $('over').hidden = true;
  $('mine').hidden = $('pause').hidden = false; $('dash').hidden = !touched;
  $('mineFace').style.cssText = cut(picked);
}
$('go').onclick = $('again').onclick = begin;

// What the controls are, in a word each, under the scoreboard for the whole game: for a mouse and keys, or a thumb.
function controls() {
  $('hint').innerHTML = (touched ? [['Drag', 'steer'], ['Dash', 'faster']] : [['Mouse', 'steer'], ['Space', 'dash'], ['P', 'pause']]).map(([key, does]) => `<span><kbd>${key}</kbd>${does}</span>`).join('');
}

// A game alone can be stopped and picked up again. Nothing moves while it is paused.
let paused = false;
function pause(on) {
  if (!me || me.dead || on === paused) return;
  paused = on;
  $('paused').hidden = !on; $('pause').hidden = on;
  keys.clear(); dash = false; stick = null; $('dash').classList.remove('on');
}
$('pause').onclick = () => pause(true);
$('resume').onclick = () => pause(false);
// Quit: your animals stay behind as strays, and the first card comes back with its animals and places.
$('quit').onclick = () => {
  paused = false; removeLine(world, ME); me = null;
  $('paused').hidden = $('mine').hidden = $('dash').hidden = $('pause').hidden = true;
  offer(); $('start').querySelector('p').after($('faces')); $('go').after($('where'));
  $('start').hidden = false;
};
addEventListener('visibilitychange', () => { if (document.hidden) pause(true); });

function finish(event) {
  best = Math.max(best, event.size);
  keep.set('conga-best', best);
  const by = world.lines.find(line => line.id === event.by);
  $('overHead').textContent = by ? `You walked into ${by.name}` : 'Scattered';
  $('overCount').textContent = event.size;
  $('overBest').textContent = best;
  $('mine').hidden = $('dash').hidden = $('pause').hidden = true;
  // The same animals and grounds as the first card, moved here: another go can be as someone else, or somewhere else.
  offer(); $('over').querySelector('.score').after($('faces')); $('again').after($('where'));
  setTimeout(() => { $('over').hidden = false; }, 900);
}

let quiet = 0;
function say(text) { $('say').textContent = text; $('say').classList.add('show'); clearTimeout(quiet); quiet = setTimeout(() => $('say').classList.remove('show'), 2400); }

// ---------- steering ----------
const canvas = $('game'), ctx = canvas.getContext('2d');
let dash = false, wide = 0, tall = 0, dpr = 1;
// On a touch screen the thumb steers like a stick: the line heads the way the thumb has moved from where it went down,
// so it can stay in a corner and never covers the animal. `stick` is that thumb. A mouse just points where to go.
let stick = null, touched = matchMedia('(pointer: coarse)').matches;
controls();
const REACH = 46;
const keys = new Set();
function point(event) { if (me && !me.dead) aim = Math.atan2(event.clientY - tall / 2, event.clientX - wide / 2); }
addEventListener('pointerdown', event => { if (event.pointerType !== 'mouse' && !touched) { touched = true; controls(); if (me && !me.dead) $('dash').hidden = false; } }, true);
canvas.addEventListener('pointerdown', event => {
  if (event.pointerType === 'mouse') { point(event); dash = true; }
  else if (!stick) stick = { id: event.pointerId, x0: event.clientX, y0: event.clientY, x: event.clientX, y: event.clientY };
});
addEventListener('pointermove', event => {
  if (event.pointerType === 'mouse') return void (event.target === canvas && point(event));
  if (!stick || event.pointerId !== stick.id) return;
  stick.x = event.clientX; stick.y = event.clientY;
  const dx = stick.x - stick.x0, dy = stick.y - stick.y0, far = Math.hypot(dx, dy);
  if (far > 8 && me && !me.dead) aim = Math.atan2(dy, dx);
  if (far > REACH) { stick.x0 += dx * (1 - REACH / far); stick.y0 += dy * (1 - REACH / far); } // the stick is dragged along behind a thumb that goes further
});
for (const type of ['pointerup', 'pointercancel']) addEventListener(type, event => { if (event.pointerType === 'mouse') dash = false; else if (stick && event.pointerId === stick.id) stick = null; });
// Leaving the window with a key or the button held would leave it held.
addEventListener('blur', () => { keys.clear(); dash = false; stick = null; $('dash').classList.remove('on'); pause(true); });
for (const [type, on] of [['pointerdown', true], ['pointerup', false], ['pointercancel', false], ['pointerleave', false]]) $('dash').addEventListener(type, event => { event.preventDefault(); dash = on; $('dash').classList.toggle('on', on); });
addEventListener('keydown', event => {
  if ((event.code === 'KeyP' || event.code === 'Escape') && !event.repeat) return pause(!paused);
  keys.add(event.code);
  if (event.code !== 'Space') return;
  event.preventDefault();
  if (paused) { if (!event.repeat) pause(false); } else if (me && !me.dead) dash = true; else if (!event.repeat) begin();
});
addEventListener('keyup', event => { keys.delete(event.code); if (event.code === 'Space') dash = false; });
addEventListener('contextmenu', event => event.preventDefault());

// How sharp the picture is drawn. A device that cannot keep up steps down: fewer pixels first, then plain water too.
// The number of pixels is most of the cost of a frame, far more than the rules.
const SHARP = [2, 1.5, 1];
let quality = 0;
function fit() {
  dpr = Math.min(SHARP[quality], devicePixelRatio || 1); wide = innerWidth; tall = innerHeight;
  canvas.width = wide * dpr; canvas.height = tall * dpr;
}
addEventListener('resize', fit); fit();

// ---------- drawing ----------
const cam = { x: 0, y: 0, z: 1 }, puffs = [];
const SIZE = { stray: 40, tail: 42, head: 58 };
// ---------- water, grass and trees ----------
// `?at=Name` holds the view still on one landmark with nothing over it, and `?map=` picks the ground: for looking at the drawing.
const tile = (size, work) => { const sheet = document.createElement('canvas'); sheet.width = sheet.height = size; work(sheet.getContext('2d'), size); return ctx.createPattern(sheet, 'repeat'); };
// Grass and trees are the linocut ones: deep grass with tufts, scalloped trees. The water is a cartoon's: one flat bright
// colour, puffy white foam along the shore, rings going out from it, and wave marks drawn with a fat pen.
const style = { green: 'oklch(70% 0.15 147)', tree: 'oklch(45% 0.11 158)', leaf: 'oklch(61% 0.14 150)', deep: 'oklch(71% 0.135 236)' };
{
  Object.assign(C, { green: style.green, tree: style.tree });
  style.tufts = tile(64, pen => { pen.strokeStyle = 'oklch(80% 0.15 140)'; pen.lineCap = pen.lineJoin = 'round'; pen.lineWidth = 2.5; for (const [x, y] of [[12, 16], [44, 40], [20, 54]]) { pen.beginPath(); pen.moveTo(x - 4, y - 7); pen.lineTo(x, y); pen.lineTo(x + 4, y - 7); pen.stroke(); } });
}
// The shore of a cartoon: two rings going out from it and fading, then foam like a row of little clouds.

  }
}
// Main Street, and the island's red bus going up and down it.
function road(thing, t) {
  ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(...thing.from); ctx.lineTo(...thing.to); ctx.strokeStyle = C.roof; ctx.lineWidth = thing.w; ctx.stroke();
  if (world.shuttles.some(car => car.kind === 'bus')) return;
  const f = 0.5 - 0.5 * Math.cos(t * 0.1), going = Math.sin(t * 0.1) > 0 ? 0 : Math.PI;
  ctx.save(); ctx.translate(thing.from[0] + (thing.to[0] - thing.from[0]) * f, thing.from[1] + (thing.to[1] - thing.from[1]) * f); ctx.rotate(Math.atan2(thing.to[1] - thing.from[1], thing.to[0] - thing.from[0]) + going);
  box(34, 15, 4); inked(C.action, 2.5); ctx.fillStyle = C.paper; ctx.fillRect(-12, -4, 20, 8); ctx.restore();
}
// Yellow cabs over the bridge, one lane each way.
function cabs(thing, t) {
  const dx = thing.to[0] - thing.from[0], dy = thing.to[1] - thing.from[1], far = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
  for (let k = 0; k < 8; k++) {
    const back = k % 2, f = (t * 0.03 + k / 8 + chance({ x: k, y: 1 }, 3) * 0.08) % 1, at = back ? 1 - f : f, lane = (back ? -1 : 1) * thing.w * 0.24;
    ctx.save(); ctx.translate(thing.from[0] + dx * at - dy / far * lane, thing.from[1] + dy * at + dx / far * lane); ctx.rotate(a); box(20, 11, 3); inked(C.cab, 2); ctx.restore();
  }
}
// The tram goes over everyone's heads, so it is drawn last, with its shadow on the ground under it.
// Its riders look out of the windows on the way in, and it goes back with the windows empty.
function tram(car) {
  const { from, to, x, y } = car, dx = to[0] - from[0], dy = to[1] - from[1], far = Math.hypot(dx, dy);
  if (car.kind === 'bus') return bus(car, dx / far, dy / far);
  ctx.lineCap = 'butt'; ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5; ctx.beginPath();
  for (const side of [-7, 7]) { ctx.moveTo(from[0] - dy / far * side, from[1] + dx / far * side); ctx.lineTo(to[0] - dy / far * side, to[1] + dx / far * side); }
  ctx.stroke();
  for (const at of [0.36, 0.74]) { box(22, 22, 3, from[0] + dx * at, from[1] + dy * at); inked(C.stone, 3); } // its towers
  ctx.globalAlpha = 0.2; ctx.fillStyle = C.ink; ctx.beginPath(); ctx.ellipse(x + 26, y + 40, 62, 30, Math.atan2(dy, dx), 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(dy, dx)); box(132, 72, 16); inked(C.action, 4); box(112, 46, 8); ctx.fillStyle = C.paper; ctx.fill(); ctx.restore();
  for (let n = 0; n < Math.min(4, car.load); n++) sprite(1 + (n * 11 + Math.floor(world.t / (car.ride * 2 + car.stay + car.away)) * 7) % FACES, x + (n - 1.5) * 26 * dx / far, y + (n - 1.5) * 26 * dy / far - 2, 38);
}
// A bus is on the ground, so its shadow is close under it. It faces the way it is going.
function bus(car, ux, uy) {
  const { x, y } = car, back = car.clock >= car.ride + car.stay && car.clock < car.ride * 2 + car.stay;
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(uy, ux) + (back ? Math.PI : 0));
  box(140, 66, 14, 5, 8); ctx.fillStyle = C.ink; ctx.fill();
  box(140, 66, 14); inked(C.water, 4); box(96, 44, 8, -12, 0); ctx.fillStyle = C.paper; ctx.fill();
  box(14, 44, 5, 54, 0); ctx.fillStyle = C.panel; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5; ctx.stroke(); // the windscreen
  ctx.fillStyle = C.lamp; for (const side of [-22, 22]) { ctx.beginPath(); ctx.arc(68, side, 4, 0, 7); ctx.fill(); }
  ctx.restore();
  for (let n = 0; n < Math.min(3, car.load); n++) sprite(1 + (n * 11 + Math.floor(world.t / (car.ride * 2 + car.stay + car.away)) * 7) % FACES, x + ((n - 1) * 28 - 12 * (back ? -1 : 1)) * ux, y + ((n - 1) * 28 - 12 * (back ? -1 : 1)) * uy - 2, 36);
  pill(car.name, x, y - 52, C.ink, C.paper, 14);
}
// The lighthouse lamp turning.
function beam(thing, t) {
  ctx.fillStyle = 'rgba(255, 236, 150, .3)'; ctx.beginPath(); ctx.moveTo(thing.x, thing.y); ctx.arc(thing.x, thing.y, 460, t * 0.6, t * 0.6 + 0.42); ctx.closePath(); ctx.fill();
}

// What stands on the ground. Greens and fields are painted on it; halls, towers and water are walked around.
function shape(thing, inset = 0) {
  ctx.translate(thing.x, thing.y); ctx.rotate(thing.turn); ctx.beginPath();
  if (thing.kind === 'water') { for (let n = 0; n < 60; n++) { const a = n * Math.PI / 30, far = shore(a); ctx.lineTo(Math.cos(a) * thing.w / 2 * far, Math.sin(a) * thing.h / 2 * far); } ctx.closePath(); }
  else if (thing.kind === 'tower') ctx.ellipse(0, 0, thing.w / 2, thing.h / 2, 0, 0, 7);
  else ctx.roundRect(-thing.w / 2 + inset, -thing.h / 2 + inset, thing.w - inset * 2, thing.h - inset * 2, thing.kind === 'hall' ? 8 : 26);
}
function painted(thing) {
  if (PAINT[thing.name]) return PAINT[thing.name](thing);
  lawn(thing);
}
function solid(thing, t) {
  if (LOOK[thing.name]) return LOOK[thing.name](thing);
  if (thing.kind === 'water') return lake(thing, t);
  if (thing.kind === 'tower') { ctx.strokeStyle = C.ink; ctx.lineWidth = thing.w * 0.8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(thing.x, thing.y); ctx.lineTo(thing.x + 40, thing.y + 40); ctx.stroke(); } // it is tall, so its shadow is long
  else if (thing.kind === 'hall') { ctx.save(); ctx.translate(10, 10); shape(thing); ctx.fillStyle = C.ink; ctx.fill(); ctx.restore(); }
  ctx.save(); shape(thing); ctx.fillStyle = C.roof; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.stroke(); ctx.restore();
  if (thing.kind === 'hall' && Math.min(thing.w, thing.h) > 44) { ctx.save(); shape(thing, 10); ctx.strokeStyle = C.trim; ctx.lineWidth = 3; ctx.stroke(); ctx.restore(); }
  if (thing.kind === 'tower') { ctx.fillStyle = C.action; ctx.beginPath(); ctx.arc(thing.x, thing.y, thing.w * 0.24, 0, 7); ctx.fill(); ctx.lineWidth = 3; ctx.stroke(); }
}
function bridge(thing) {
  ctx.lineCap = 'butt'; ctx.beginPath(); ctx.moveTo(...thing.from); ctx.lineTo(...thing.to);
  ctx.strokeStyle = C.ink; ctx.lineWidth = thing.w + 10; ctx.stroke(); ctx.strokeStyle = C.roof; ctx.lineWidth = thing.w; ctx.stroke();
  ctx.setLineDash([16, 14]); ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.stroke(); ctx.setLineDash([]);
}
const SOLID = ['hall', 'tower', 'water'];

function draw(t, dt) {
  const watch = held ?? (me && (!me.dead || $('start').hidden) ? me : world.lines.reduce((a, b) => (!a.dead && a.tail.length >= b.tail.length) || b.dead ? a : b));
  const size = watch.dead ? 0 : watch.tail.length, fitTo = Math.max(0.62, Math.min(wide, tall * 1.25) / 760);
  const zoom = Math.max(fitTo * 0.75, fitTo / (1 + size * 0.007)), slide = 1 - Math.exp(-dt * (watch === me ? 9 : 2.5));
  cam.x += (watch.x - cam.x) * slide; cam.y += (watch.y - cam.y) * slide; cam.z += (zoom - cam.z) * (1 - Math.exp(-dt * 3));

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.translate(wide / 2, tall / 2); ctx.scale(cam.z, cam.z); ctx.translate(-cam.x, -cam.y);
  const halfW = wide / 2 / cam.z + 80, halfH = tall / 2 / cam.z + 80, seen = (x, y) => Math.abs(x - cam.x) < halfW && Math.abs(y - cam.y) < halfH;

  if (map.water) sea(t, cam.x - halfW, cam.y - halfH, halfW * 2, halfH * 2);
  else { ctx.fillStyle = C.town; ctx.fillRect(cam.x - halfW, cam.y - halfH, halfW * 2, halfH * 2); }
  if (map.axis != null) { boats(t); banks(Math.hypot(halfW, halfH)); }
  ctx.save(); ctx.translate(14, 14); ctx.fillStyle = C.ink; ctx.fill(land); ctx.restore(); // the hard shadow the ground casts
  ctx.strokeStyle = C.ink; ctx.lineWidth = 10; ctx.lineJoin = 'round'; ctx.stroke(land);
  ctx.fillStyle = C.field; ctx.fill(land);
  ctx.save(); ctx.clip(land);
  ctx.strokeStyle = C.dot; ctx.lineWidth = 5; ctx.setLineDash([4, 18]); ctx.lineCap = 'round'; if (map.rings.length > 1) ctx.stroke(land); ctx.setLineDash([]); // where one section meets the next
  ctx.fillStyle = C.dot; ctx.beginPath();
  for (let x = Math.floor((cam.x - halfW) / 90) * 90; x < cam.x + halfW; x += 90) for (let y = Math.floor((cam.y - halfH) / 90) * 90; y < cam.y + halfH; y += 90) { ctx.moveTo(x + 5, y); ctx.arc(x, y, 5, 0, 7); }
  ctx.fill();
  for (const thing of map.things) if (thing.kind === 'road') road(thing, t);
  const near = thing => Math.abs(thing.x - cam.x) < halfW + Math.max(thing.w, thing.h) && Math.abs(thing.y - cam.y) < halfH + Math.max(thing.w, thing.h);
  for (const thing of map.things) if ((thing.kind === 'green' || thing.kind === 'field') && near(thing)) painted(thing);
  for (const [x, y] of blossoms) if (seen(x, y)) tree(x, y, 10, C.blossom);
  ctx.restore();
  for (const thing of map.things) if (thing.kind === 'bridge') { bridge(thing); cabs(thing, t); }
  for (const thing of map.things) if (SOLID.includes(thing.kind) && near(thing)) solid(thing, t);
  for (const car of world.shuttles) {
    const due = car.clock < car.ride ? car.clock / car.ride : 0;
    ctx.beginPath(); ctx.arc(car.off[0], car.off[1], PLAZA, 0, 7); ctx.globalAlpha = 0.14 + due * 0.22; ctx.fillStyle = C.action; ctx.fill(); ctx.globalAlpha = 1;
    ctx.setLineDash([14, 12]); ctx.strokeStyle = C.paper; ctx.lineWidth = 5; ctx.stroke(); ctx.setLineDash([]);
  }
  for (const thing of map.things) if (thing.name === 'Lighthouse') beam(thing, t);
  for (const zone of map.zones) if (seen(...zone.at)) pill(zone.name, zone.at[0], zone.at[1], C.paper, C.ink, 22);
  for (const thing of map.things) {
    const across = thing.kind === 'bridge' ? 0.43 : 0.5, hard = SOLID.includes(thing.kind) || thing.kind === 'bridge';
    // A building's name sits under it, so the building itself can be seen.
    const [x, y] = thing.from ? [thing.from[0] + (thing.to[0] - thing.from[0]) * across, thing.from[1] + (thing.to[1] - thing.from[1]) * across] : [thing.x, thing.kind === 'tower' ? thing.y - 44 : thing.kind === 'hall' ? thing.y + Math.max(thing.w, thing.h) * 0.42 + 18 : thing.y];
    if (seen(x, y)) pill(thing.name, x, y, hard ? C.ink : C.paper, hard ? C.paper : C.ink, 14);
    if (thing.kind === 'bridge' && map.axis != null) BANKS.forEach(([, name], n) => pill(name, thing.from[0] + (thing.to[0] - thing.from[0]) * (n ? 0.93 : 0.05), thing.from[1] + (thing.to[1] - thing.from[1]) * (n ? 0.93 : 0.05) - 60, C.paper, C.ink, 22));
  }

  // Where each animal is shown: a soft step as it walks, and a wave down the line while the line dances.
  const sprites = [], heads = [];
  for (const line of world.lines) {
    if (line.dead) continue;
    const dancing = line.dance > 0, step = i => 0.5 - 0.5 * Math.cos((t * 7 - i * 0.7) * 2), shown = [{ x: line.x, y: line.y - step(0) * 2.5 }];
    line.tail.forEach((f, i) => {
      const before = shown[i], dx = before.x - f.x, dy = before.y - f.y, far = Math.hypot(dx, dy) || 1, beat = Math.sin(t * 8 - i * 0.8), sway = dancing ? beat * 13 : 0;
      shown.push({ x: f.x - dy / far * sway, y: f.y + dx / far * sway - step(i + 1) * (dancing ? 8 : 2.5), face: f.face, tilt: dancing ? beat * 0.35 : 0,
        size: SIZE.tail * (1 + (world.t - f.born < 0.4 ? 0.35 * Math.sin((world.t - f.born) / 0.4 * Math.PI) : 0)) }); // a newcomer swells for a moment as it falls in
    });
    if (line.tail.length && shown.some(each => seen(each.x, each.y))) rope(shown, colour(line.id));
    for (let i = shown.length - 1; i > 0; i--) if (seen(shown[i].x, shown[i].y)) sprites.push(shown[i]);
    const blink = line.safe > 0 && Math.sin(t * 22) > 0 ? 0.45 : 1;
    sprites.push({ ...shown[0], face: line.face, size: SIZE.head, tilt: dancing ? Math.sin(t * 8) * 0.3 : 0, alpha: blink, front: 1, ink: line.ink });
    heads.push(line);
  }
  for (const s of world.strays) if (seen(s.x, s.y)) sprites.push({ x: s.x, y: s.y - (0.5 - 0.5 * Math.cos(t * 3 + s.a * 9)) * 2, face: s.face, size: SIZE.stray });
  sprites.sort((a, b) => (a.front || 0) - (b.front || 0) || a.y - b.y);
  for (const s of sprites) { sprite(s.face, s.x, s.y, s.size, s.tilt, s.alpha); if (s.ink && quality < 2) sparkle(s.face, s.x, s.y, s.size, t); }
  for (const car of world.shuttles) tram(car);

  for (let i = puffs.length - 1; i >= 0; i--) {
    const puff = puffs[i], age = (t - puff.t) / 0.6;
    if (age > 1) { puffs.splice(i, 1); continue; }
    ctx.strokeStyle = C.paper; ctx.globalAlpha = 1 - age; ctx.lineWidth = 10 * (1 - age) + 2;
    ctx.beginPath(); ctx.arc(puff.x, puff.y, 30 + age * 130, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
  }
  for (const line of heads) if (seen(line.x, line.y)) pill(`${line.name} · ${line.tail.length + 1}`, line.x, line.y - 46, line === me ? C.action : C.ink, C.paper);
}

// The small map: the whole ground in its real shape, and where every line is on it.
const chartPen = $('map').getContext('2d');
function chart() {
  const { west, east, north, south } = world.box, scale = 164 / Math.max(east - west, south - north);
  chartPen.setTransform(1, 0, 0, 1, 0, 0); chartPen.clearRect(0, 0, 184, 184);
  chartPen.translate(92, 92); chartPen.scale(scale, scale); chartPen.translate(-(west + east) / 2, -(north + south) / 2);
  chartPen.fillStyle = C.field; chartPen.strokeStyle = C.ink; chartPen.lineWidth = 3 / scale; chartPen.lineJoin = 'round'; chartPen.stroke(land); chartPen.fill(land);
  for (const car of world.shuttles) { chartPen.beginPath(); chartPen.rect(car.x - 6 / scale, car.y - 6 / scale, 12 / scale, 12 / scale); chartPen.fillStyle = C.action; chartPen.fill(); chartPen.lineWidth = 2 / scale; chartPen.stroke(); }
  for (const line of world.lines) {
    if (line.dead) continue;
    chartPen.fillStyle = line === me ? C.action : C.ink;
    chartPen.beginPath(); chartPen.arc(line.x, line.y, (line === me ? 9 : 3 + Math.min(6, line.tail.length / 8)) / scale, 0, 7); chartPen.fill();
  }
}

function board() {
  const ranked = world.lines.filter(line => !line.dead).sort((a, b) => b.tail.length - a.tail.length), top = ranked.slice(0, 5);
  if (me && !me.dead && !top.includes(me)) top[4] = me;
  $('board').innerHTML = top.map(line => `<div class="${line === me ? 'me' : ''}">${faceTag(line.face)}<i>${ranked.indexOf(line) + 1}. ${line.name}</i><b>${line.tail.length + 1}</b></div>`).join('');
  if (me && !me.dead) $('mineCount').textContent = me.tail.length + 1;
}

// ---------- the loop ----------
open(where);
let last = performance.now(), ticks = 0, pace = 16, settled = 0, clock = 0;
function frame(now) {
  const took = now - last, dt = paused ? 0 : Math.max(0, Math.min(0.05, took / 1000)), t = clock += dt; last = now; // the game's own clock, which stops with it
  // `pace` is the usual time between frames. Two seconds of it staying over 24 ms, about 40 frames a second, is too slow.
  if (took < 250) pace += (took - pace) * 0.05;
  if (++settled > 120 && pace > 24 && quality < SHARP.length - 1) { quality++; settled = 0; pace = 16; fit(); }
  if (me && !me.dead && !paused) {
    if (keys.has('ArrowLeft') || keys.has('KeyA')) aim = me.a - 1.2;
    if (keys.has('ArrowRight') || keys.has('KeyD')) aim = me.a + 1.2;
    steer(me, aim, dash);
  }
  for (const event of paused ? [] : step(world, dt)) {
    if (event.type === 'join' && event.line === ME) navigator.vibrate?.(8);
    if (event.type === 'scatter') {
      puffs.push({ x: event.x, y: event.y, t });
      if (event.line === ME) { navigator.vibrate?.(60); finish(event); }
      else if (event.by === ME) say(`${world.lines.find(line => line.id === event.line).name} scattered on your line`);
    }
    if (event.type === 'arrive') {
      puffs.push({ x: event.x, y: event.y, t });
      const mine = event.onto.find(each => each.line === ME), car = event.name.toLowerCase();
      if (mine) { navigator.vibrate?.(30); say(`${mine.count} got off the ${car} straight onto your line`); }
      else if (me && !me.dead) say(event.onto.length ? `${world.lines.find(line => line.id === event.onto[0].line).name} met the ${car} and took its riders` : `The ${car} let ${event.count} off at ${event.stop}`);
    }
    if (event.type === 'lift') { puffs.push({ x: event.x, y: event.y, t }); if (event.line === ME) { navigator.vibrate?.(30); say(event.head ? `The ${event.name.toLowerCase()} hit you and took ${event.count}` : `The ${event.name.toLowerCase()} took ${event.count} off the back of your line`); } }
    if (event.type === 'dance' && event.line === ME) say(`${event.size} in line. Everybody dance`);
  }
  draw(t, dt);
  if (stick) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(stick.x0, stick.y0, REACH, 0, 7); ctx.fillStyle = C.paper; ctx.fill(); ctx.globalAlpha = 1; ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(stick.x, stick.y, 20, 0, 7); ctx.fillStyle = C.ink; ctx.fill();
  }
  if (ticks++ % 12 === 0) { board(); chart(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
