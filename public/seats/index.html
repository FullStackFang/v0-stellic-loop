<!doctype html>
<html lang="en" data-kit="loop">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seats · Loopd</title>
<meta name="description" content="Everyone gets kicked out. Put each one back in its own seat, as fast as you can.">
<style>
/* Seats, a doodle (app/c/doodles), in the works: the crowd ticket that once stood above the footer (public/demo/mockups-footer-seats.html),
   on a page of its own, with seats. A plain page, as Conga is. The footer is the bar alone now (openspec/changes/loop-foot-crowd-to-seats).

   */
@font-face { font-family: Archivo; src: url(/fonts/Archivo.ttf); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
:root { --field: oklch(96.4% 0.19 117); --field-shadow: oklch(80% 0.17 121); --ink: oklch(25% 0.07 252); --action: oklch(47.6% 0.13 250); --third: oklch(72% 0.2 350);
  --paper: oklch(99.3% 0.004 117); --page: oklch(96.2% 0.004 230); --stub: color-mix(in oklch, var(--field) 32%, var(--paper)); --sunk: color-mix(in oklab, var(--ink) 10%, var(--paper));
  --ease: cubic-bezier(.22, 1, .36, 1); }
:root[data-kit=cornell] { --third: oklch(80% 0.16 85); --field: oklch(82% 0.12 38); --field-shadow: oklch(67% 0.13 36); --ink: oklch(24% 0.035 30); --action: oklch(48.5% 0.185 27); }
:root[data-kit=columbia] { --third: oklch(74% 0.19 25); --field: oklch(87% 0.075 235); --field-shadow: oklch(71% 0.09 240); --ink: oklch(25% 0.06 255); --action: oklch(46% 0.14 255); }
:root[data-kit=nyu] { --third: oklch(86% 0.17 100); --field: oklch(85% 0.09 305); --field-shadow: oklch(69% 0.12 305); --ink: oklch(24% 0.08 305); --action: oklch(40% 0.2 305); }
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; letter-spacing: inherit; border: 0; background: none; padding: 0; cursor: pointer; } img { display: block; } a { color: inherit; text-decoration: none; }
body { overflow-x: clip; margin: 0; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; gap: 40px; padding: 28px 0; font-family: Archivo, system-ui, sans-serif; font-size: 15px; line-height: 1.4; letter-spacing: -0.012em; -webkit-font-smoothing: antialiased; background: var(--page); color: var(--ink); }
:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }

/* what the page is, above the ticket: the way back, its name, and that it is not finished */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 32px; }
.top a { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px 0 12px; border-radius: 99px; font-weight: 600; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink), 2px 2px 0 var(--ink); }
.top a svg { width: 16px; height: 16px; } .top .admit { font-size: 30px; padding: 6px 18px 9px; }
.works { padding: 6px 13px; border-radius: 99px; font-size: 13.5px; font-weight: 620; background: var(--ink); color: var(--paper); }
.top p { flex-basis: 100%; margin: 6px 0 0; }
.top p span { display: inline-block; padding: 6px 13px; border-radius: 12px 12px 12px 4px; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink); }

/* ---- the crowd ticket ---- */
.ft { padding-top: 0; }
/* The ticket goes where the hand takes it (a mouse or a pen; touch scrolls the page). Everyone in it rides along. */
.carry { position: relative; z-index: 3; margin: 0 32px 34px; transform-origin: 50% 100%; will-change: transform; }
.tk { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 232px; border-radius: 26px 26px 26px 7px; background: var(--paper); box-shadow: 0 0 0 1.5px var(--ink), 7px 7px 0 var(--field-shadow); cursor: grab; touch-action: pan-y; user-select: none; transition: box-shadow .25s var(--ease); }
.carry.held > .tk { cursor: grabbing; box-shadow: 0 0 0 1.5px var(--ink), 14px 16px 0 var(--field-shadow); }
.tear { position: relative; padding: 24px 22px 22px; display: flex; flex-direction: column; align-items: flex-start; gap: 26px; background: var(--field); border-radius: 0 26px 26px 0; border-left: 2px dashed var(--ink); }
.tear::before, .tear::after { content: ''; position: absolute; left: -13px; width: 24px; height: 24px; border-radius: 50%; background: var(--page); box-shadow: inset 0 0 0 1.5px var(--ink); }
.tear::before { top: -12px; clip-path: inset(50% 0 0 0); } .tear::after { bottom: -12px; clip-path: inset(0 0 50% 0); }
.admit { rotate: -4deg; padding: 6px 13px; white-space: nowrap; border-radius: 12px 12px 12px 4px; background: var(--ink); color: var(--field); font-size: 18px; font-weight: 760; font-stretch: 112%; letter-spacing: -0.035em; box-shadow: 3px 3px 0 var(--action); }
.code { align-self: stretch; height: 46px; margin-top: auto; background: repeating-linear-gradient(90deg, var(--ink) 0 3px, #0000 3px 5px, var(--ink) 5px 6px, #0000 6px 10px, var(--ink) 10px 14px, #0000 14px 16px, var(--ink) 16px 17px, #0000 17px 21px); }
/* the room: taller than today's 132px, to hold the seats above the heads */
.stage { position: relative; height: 196px; margin: 32px 24px 22px; border-radius: 16px 16px 16px 5px; background: var(--stub); box-shadow: inset 0 -9px 0 color-mix(in oklab, var(--field) 62%, var(--paper)); touch-action: pan-y; }
/* every pill sits on the top edge of the ticket itself, over the paper and clear of the stub */
.tags { position: absolute; z-index: 7; top: -17px; right: 268px; display: flex; align-items: center; gap: 8px; cursor: auto; }
/* new: once all are in, the ticket offers to drop them again */
/* it sits on the top edge of the ticket itself, over the paper, clear of the stub */
#redo { height: 34px; padding: 0 16px; border-radius: 99px; font-size: 13.5px; font-weight: 620; white-space: nowrap; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink), 2px 2px 0 var(--ink); transition: translate .15s var(--ease), box-shadow .15s var(--ease); }
#redo:hover { translate: -1px -1px; box-shadow: inset 0 0 0 1.5px var(--ink), 3px 3px 0 var(--ink); } #redo:active { translate: 2px 2px; box-shadow: inset 0 0 0 1.5px var(--ink); }
.tags small[hidden] { display: none; } .tags small { font-variant-numeric: tabular-nums; }
.tags #best { background: var(--sunk); color: var(--ink); }
@keyframes hit { from { background: oklch(58% 0.2 25); scale: 1.14; } } .tags small.hit { animation: hit .5s var(--ease); }
@keyframes no { 25% { translate: -6px 0; } 75% { translate: 6px 0; } } .seat.no { animation: no .28s 2; }
.tags small { display: inline-flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 99px; font-size: 13.5px; font-weight: 600; white-space: nowrap; background: var(--ink); color: var(--paper); transition: background-color .3s, color .3s; }
.tk.full .tags small { background: var(--action); }
.pet { position: absolute; z-index: 3; left: 0; bottom: 7px; width: 84px; height: 84px; object-fit: contain; object-position: 50% 100%; transform-origin: 50% 88%; cursor: grab; touch-action: none; will-change: transform; -webkit-user-drag: none; }
.pet.up { cursor: grabbing; z-index: 5; filter: drop-shadow(0 12px 0 color-mix(in oklab, var(--ink) 20%, transparent)); }

/* ---- flourishes. The animals are moved by the script through `transform`; these use `translate`, `scale` and `rotate`, which add to it. ---- */
/* while they are shown in their seats they bob, one after another */
@keyframes bob { 50% { translate: 0 -5px; } } .tk.look .pet { cursor: default; animation: bob 1.6s ease-in-out infinite; animation-delay: calc(var(--i) * -.21s); }
/* the kick: the whole ticket takes it */
@keyframes jolt { 18% { rotate: -1.4deg; translate: -7px 6px; } 42% { rotate: 1deg; translate: 5px -3px; } 68% { rotate: -.4deg; translate: -2px 1px; } } .tk.jolt { animation: jolt .5s var(--ease); }
/* its own seat: the animal lands with a squash, and a ring leaves the seat */
@keyframes pop { 0% { scale: 1.5; } 55% { scale: .86; } } .pet.pop { animation: pop .42s var(--ease); }
.seat::after { content: ""; position: absolute; inset: 0; border-radius: 50%; opacity: 0; box-shadow: 0 0 0 3px var(--action); }
@keyframes ring { from { opacity: 1; } to { opacity: 0; scale: 1.9; } } .seat.yes::after { animation: ring .55s var(--ease); }
/* not its seat: what it cost rises from the seat */
.fine { position: absolute; z-index: 8; top: 6px; margin-left: -22px; padding: 3px 9px; border-radius: 99px; font-size: 13px; font-weight: 700; background: oklch(58% 0.2 25); color: var(--paper); pointer-events: none; animation: rise .9s var(--ease) forwards; }
@keyframes rise { to { translate: 0 -44px; opacity: 0; } }
/* all in: they cheer down the row, ink flies from the ticket, and the time is stamped on the stub */
@keyframes cheer { 30% { translate: 0 -16px; } 60% { translate: 0 0; } } .tk.full .pet { animation: cheer .7s var(--ease) 2; animation-delay: calc(var(--i) * .06s); }
.drop { position: absolute; z-index: 9; left: 42%; top: 46%; width: var(--s); height: var(--s); border-radius: 50%; background: var(--c); pointer-events: none; animation: fly 1s cubic-bezier(.16, 1, .3, 1) forwards; }
@keyframes fly { from { scale: .3; } 70% { opacity: 1; } to { translate: var(--x) var(--y); opacity: 0; } }
.stamp { align-self: center; display: grid; justify-items: center; gap: 2px; rotate: 5deg; padding: 8px 18px 10px; border-radius: 14px 14px 14px 4px; background: var(--paper); box-shadow: inset 0 0 0 2px var(--ink), 4px 4px 0 var(--ink); animation: slam .45s var(--ease); }
.stamp[hidden] { display: none; } .stamp b { font-size: 34px; font-weight: 780; font-stretch: 108%; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; } .stamp small { font-size: 12.5px; font-weight: 640; }
.stamp.best { background: var(--third); } @keyframes slam { from { scale: 2.6; rotate: -14deg; opacity: 0; } 60% { scale: .94; } }
.tags #best.new { background: var(--third); }
/* "Kick them out" is the one thing to press before a round */
.tk.look #redo { background: var(--action); color: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink), 3px 3px 0 var(--ink); }

/* ---- your own animal (Ink+) ---- */
.mine, .inkask { display: inline-flex; align-items: center; gap: 8px; height: 38px; margin-left: auto; padding: 0 16px 0 5px; border-radius: 99px; font-weight: 600; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink), 2px 2px 0 var(--ink); }
.mine img { width: 28px; height: 28px; border-radius: 50%; object-fit: contain; background: var(--stub); } .inkask i { padding: 3px 9px; border-radius: 99px; font-style: normal; font-size: 12.5px; font-weight: 700; background: var(--ink); color: var(--field); }
.mines { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 12px 12px; border-radius: 16px 16px 16px 5px; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink), 4px 4px 0 var(--field-shadow); position: relative; margin-top: 8px; }
.mines[hidden] { display: none; } .mines > small { position: absolute; left: 14px; top: -12px; padding: 3px 11px 4px; border-radius: 99px; font-size: 12.5px; font-weight: 600; background: var(--ink); color: var(--paper); }
.mines button { width: 52px; height: 52px; border-radius: 50%; background: var(--stub); box-shadow: inset 0 0 0 1.5px var(--ink); } .mines button img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
.mines button[aria-pressed=true] { box-shadow: inset 0 0 0 1.5px var(--ink), 0 0 0 2px var(--page), 0 0 0 5px var(--action); }
/* a spark rides with it */
.spark { position: absolute; z-index: 6; left: 0; bottom: 91px; width: 0; height: 0; pointer-events: none; }
.spark::before { content: ""; position: absolute; left: -8px; top: -8px; width: 16px; height: 16px; background: var(--third); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: twinkle 2.6s ease-in-out infinite; }
@keyframes twinkle { 0%, 55%, 100% { scale: 0; rotate: 0deg; } 70% { scale: 1.25; rotate: 30deg; } 82% { scale: .8; } }

/* ---- new: the seats ---- */
.seat { position: absolute; top: 16px; width: 58px; height: 58px; margin-left: -29px; border-radius: 50%; background: var(--sunk); box-shadow: inset 0 3px 0 color-mix(in oklab, var(--ink) 24%, transparent); transition: box-shadow .2s; }
.seat.near { box-shadow: inset 0 3px 0 color-mix(in oklab, var(--ink) 24%, transparent), 0 0 0 2px var(--stub), 0 0 0 4.5px var(--action); }
.seat.taken { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink); }


@media (max-width: 860px) { .carry { margin: 0 16px 28px; } .top { margin: 0 16px; } .tk { grid-template-columns: minmax(0, 1fr); } .tear { display: none; } .tags { right: 26px; } .stage { margin: 22px 14px 16px; } .seat { width: 44px; height: 44px; margin-left: -22px; } .bar { padding: 12px 16px 14px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } .spark::before { scale: 1; } }
</style>
</head>
<body>

<header class="top"><a href="/c/doodles"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>Doodles</a><h1 class="admit" style="margin:0">Seats</h1><span class="works">In the works</span><span id="you"></span>
  <p><span>Remember who sits where. Everyone gets kicked out: put each one back in its own seat, as fast as you can. A wrong seat costs 2 seconds.</span></p></header>
<main class="ft">
  <div class="carry"><div class="tk">
    <div class="stage"></div>
    <div class="tear"><span class="admit">Admit everyone</span><span class="stamp" id="stamp" hidden><b></b><small></small></span><div class="code"></div></div>
    <div class="tags"><small role="timer">Remember who sits where</small><small id="best" hidden></small><button type="button" id="redo">Kick them out</button></div>
  </div></div>
</main>

<script>
// The crowd. It stood in a ticket above the footer until the footer became the bar alone (openspec/changes/loop-foot-crowd-to-seats);
// this is its only copy now. Each one has a place along the floor (x) and a height above it (y). They look toward the pointer, flip
// when poked, slide and pile up when the ticket is tipped, and get restless when left alone. Seats add `seat`, the index of the seat
// an animal is in, or null, and `home`, the seat that is its own. Only one out of its seat is pushed about; a seated one only turns its head.
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const CROWD = [9, 25, 2, 30, 15, 21, 19, 31, 0, 27, 12, 6, 23], SIZE = 84, GAP = 60, ROOF = 330, FALL = 2100, STEP = 96;
const animal = n => `/animals/${String(n + 1).padStart(2, '0')}.png`, clamp = (n, low, high) => Math.max(low, Math.min(high, n)), near = (d, reach) => Math.exp(-(d * d) / (2 * reach * reach));
const carry = document.querySelector('.carry'), stage = document.querySelector('.stage'), tk = document.querySelector('.tk'), pill = tk.querySelector(".tags small");
let wide = stage.clientWidth, count = clamp(Math.floor((wide - 40) / STEP), 4, CROWD.length);
const seatX = i => 44 + i * (wide - 88) / Math.max(1, count - 1), seatSize = () => innerWidth <= 860 ? 44 : 58;
// The height above the floor at which a seated one sits, and how small it is drawn there.
const seatY = () => stage.clientHeight - 7 - 16 - seatSize() + 3, small = () => (seatSize() - 8) / SIZE;
const seats = Array.from({ length: count }, (_, i) => { const el = document.createElement('i'); el.className = 'seat'; stage.append(el); return el; });
const crowd = CROWD.slice(0, count).map((face, i) => { const el = document.createElement('img'); el.className = 'pet'; el.src = animal(face); el.alt = ''; el.draggable = false; el.style.setProperty('--i', i); stage.append(el); return { el, seat: i, x: 0, y: 0, vx: 0, vy: 0, r: 0, vr: 0, lift: 0, vl: 0, held: false }; });
const place = () => { seats.forEach((el, i) => el.style.left = `${seatX(i)}px`); crowd.forEach(one => { if (one.seat !== null) { one.x = seatX(one.seat) - SIZE / 2; one.y = seatY(); } draw(one); }); };
const spark = Object.assign(document.createElement('i'), { className: 'spark', hidden: true }); stage.append(spark);
function draw(one) { const k = one.seat !== null ? small() : 1; one.el.style.transform = `translate(${one.x.toFixed(1)}px, ${(-one.y - one.lift).toFixed(1)}px) rotate(${one.r.toFixed(1)}deg) scale(${k.toFixed(2)})`;
  // the spark sits at the top right of your own animal, however small it is drawn
  if (one.mine) spark.style.transform = `translate(${(one.x + 42 + 26 * k).toFixed(1)}px, ${(-one.y + 74 - 60 * k).toFixed(1)}px)`; }

/** One on the floor or in the air, not held and not in a seat: the only kind the crowd's play moves. */
const out = one => !one.held && one.seat === null;
/** Where on the floor a point of the window is. */
const onFloor = (clientX, clientY) => { const box = stage.getBoundingClientRect(); return { x: clientX - box.left, y: box.bottom - 7 - clientY }; };

// The ticket: a spring to where the hand has it.
const lean = { x: 0, y: 0, r: 0, vx: 0, vy: 0, vr: 0, tx: 0, ty: 0, tr: 0, wasV: 0 };
let hand = null, pointer = null, grabbed = null, running = false, last = 0;
const wake = () => { if (!running && !document.hidden) { running = true; last = performance.now(); requestAnimationFrame(tick); } };
const hop = (one, speed) => { if (!reduce && out(one) && one.y === 0) { one.vy = speed; wake(); } };
function tick(now) {
  const dt = Math.min(.032, (now - last) / 1000) || .016; last = now;
  const stiff = hand ? 420 : 120, damp = hand ? 30 : 9;
  lean.vx += ((lean.tx - lean.x) * stiff - lean.vx * damp) * dt; lean.x += lean.vx * dt;
  lean.vy += ((lean.ty - lean.y) * stiff - lean.vy * damp) * dt; lean.y += lean.vy * dt;
  lean.vr += ((lean.tr - lean.r) * stiff - lean.vr * damp) * dt; lean.r += lean.vr * dt;
  carry.style.transform = lean.x || lean.y || lean.r ? `translate(${lean.x.toFixed(1)}px, ${lean.y.toFixed(1)}px) rotate(${lean.r.toFixed(2)}deg)` : '';
  // What the ticket does to those out of their seats: a tipped floor is a slope, and a ticket snatched away leaves them behind for a moment.
  const slope = 2900 * Math.sin(lean.r * Math.PI / 180), jolt = clamp((lean.vx - lean.wasV) / dt, -7000, 7000) * .8; lean.wasV = lean.vx;
  for (const one of crowd) { if (!out(one)) continue;
    const air = one.y > 0;
    one.vx += (slope - jolt - one.vx * (air ? .5 : 3.4)) * dt; one.x += one.vx * dt;
    if (air || one.vy > 0) {
      one.vy -= FALL * dt; one.y += one.vy * dt;
      if (one.y > ROOF) { one.y = ROOF; one.vy = -Math.abs(one.vy) * .4; }
      if (one.y <= 0) { one.y = 0; one.vy = one.vy < -300 ? -one.vy * .36 : 0; one.vr += one.vx * .5; }
    }
    if (one.x < 4) { one.x = 4; one.vx = Math.abs(one.vx) * .45; } else if (one.x > wide - SIZE - 4) { one.x = wide - SIZE - 4; one.vx = -Math.abs(one.vx) * .45; } }
  // Two on the floor cannot share a spot: they part, pass the push along, and a hard bump makes both hop.
  const floor = crowd.filter(one => out(one) && one.y < 40).sort((a, b) => a.x - b.x);
  for (let pass = 0; pass < 2; pass++) for (let at = 0; at < floor.length - 1; at++) {
    const a = floor[at], b = floor[at + 1], over = GAP - (b.x - a.x);
    if (over <= 0) continue;
    a.x -= over / 2; b.x += over / 2;
    const hit = a.vx - b.vx;
    if (hit > 0) { const mean = (a.vx + b.vx) / 2; a.vx = mean - hit * .2; b.vx = mean + hit * .2; if (!reduce && hit > 260 && a.y === 0 && b.y === 0) a.vy = b.vy = Math.min(hit * .45, 330); }
  }
  let moving = !!hand || !!grabbed || Math.abs(lean.vx) + Math.abs(lean.vy) + Math.abs(lean.vr) > .05 || Math.abs(lean.tx - lean.x) + Math.abs(lean.ty - lean.y) + Math.abs(lean.tr - lean.r) > .05;
  const look = grabbed ? grabbed.x + SIZE / 2 : pointer?.x ?? null;
  for (const one of crowd) {
    const dx = look === null ? 0 : look - (one.x + SIZE / 2), close = look === null ? 0 : near(dx, 110), head = clamp(dx / 380, -1, 1) * 11 * (1 - close * .6);
    // They turn to what they are looking at; one out of its seat also leans into a run and tries to stay upright on a tipped ticket.
    const turn = reduce ? 0 : one.held ? clamp(-one.vx * .045, -38, 38) : one.seat !== null ? head : head + clamp(one.vx * .04, -18, 18) - lean.r * .7;
    one.vr += ((turn - one.r) * 150 - one.vr * 13) * dt; one.r += one.vr * dt;
    // One on the floor near the pointer rises on tiptoe.
    const tiptoe = !reduce && out(one) && one.y === 0 && pointer && !grabbed ? 15 * close : 0;
    one.vl += ((tiptoe - one.lift) * 190 - one.vl * 15) * dt; one.lift += one.vl * dt;
    if (one.y > 0 || Math.abs(one.vx) + Math.abs(one.vy) + Math.abs(one.vr) + Math.abs(one.vl) > .3 || Math.abs(turn - one.r) + Math.abs(tiptoe - one.lift) > .05) moving = true;
    draw(one);
  }
  // At rest, or with the page out of sight, there is nothing to draw: the loop stops until something stirs.
  if (moving && !document.hidden) requestAnimationFrame(tick); else running = false;
}

// The game. Everyone has a seat of their own. A round shows them in it; "Kick them out" throws them all to the floor and starts
// the clock, which stops when each is back in its own seat. A wrong seat sends the animal back down and adds to the time.
const WRONG = 2, KEY = 'seats-best', button = document.getElementById('redo'), bestPill = document.getElementById('best');
let state = 'look', began = 0, fine = 0, took = 0, clock = 0;
const secs = n => `${n.toFixed(1)}s`, elapsed = () => (performance.now() - began) / 1000 + fine;
const kept = () => { try { return parseFloat(localStorage.getItem(KEY)) || null; } catch { return null; } };
const told = () => seats.forEach((el, i) => el.classList.toggle('taken', crowd.some(one => one.seat === i)));
function say() {
  tk.classList.toggle('full', state === 'done'); tk.classList.toggle('look', state === 'look');
  pill.textContent = state === 'look' ? 'Remember who sits where' : state === 'play' ? secs(elapsed()) : `All in: ${secs(took)}`;
  button.textContent = state === 'look' ? 'Kick them out' : state === 'play' ? 'Start over' : 'Again';
  const best = kept(); bestPill.hidden = best === null;
  const record = state === 'done' && best !== null && took <= best;
  if (best !== null) bestPill.textContent = record ? 'Your best yet' : `Best ${secs(best)}`;
  bestPill.classList.toggle('new', record);
  // the time is stamped on the stub
  stamp.hidden = state !== 'done'; stamp.classList.toggle('best', record);
  if (state === 'done') { stamp.querySelector('b').textContent = secs(took); stamp.querySelector('small').textContent = record ? 'Your best yet' : 'All in'; }
}
/** Ink flies from the ticket: drops in the colours of the school, each its own way. */
function burst() { if (reduce) return;
  const inks = ['var(--action)', 'var(--third)', 'var(--field-shadow)', 'var(--ink)'];
  for (let n = 0; n < 30; n++) { const drop = document.createElement('i'), turn = Math.random() * Math.PI * 2, far = 140 + Math.random() * 300;
    drop.className = 'drop'; drop.style.cssText = `--c:${inks[n % inks.length]};--s:${6 + Math.random() * 16}px;--x:${(Math.cos(turn) * far * 1.5).toFixed(0)}px;--y:${(Math.sin(turn) * far * .7 - 60).toFixed(0)}px;animation-delay:${(Math.random() * .12).toFixed(2)}s`;
    drop.addEventListener('animationend', () => drop.remove()); tk.append(drop); } }
const mixed = () => { const order = crowd.map((_, i) => i); for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } return order; };
const sit = (one, i) => { one.seat = i; one.x = seatX(i) - SIZE / 2; one.y = seatY(); one.vx = one.vy = one.r = one.vr = one.lift = one.vl = 0; draw(one); told(); };
/** A new round: everyone is given a seat, and shown in it. */
function round() { clearInterval(clock); state = 'look'; grabbed = null; const order = mixed(); crowd.forEach((one, i) => { one.home = order[i]; one.held = false; one.el.classList.remove('up'); sit(one, one.home); }); say(); }
/** Out they go, all at once and every which way, and the clock starts. With reduced motion they are on the floor at once. */
function kick() { state = 'play'; began = performance.now(); fine = 0; const spots = mixed(); again(tk); tk.classList.add('jolt');
  crowd.forEach((one, i) => { one.seat = null;
    if (reduce) { one.x = 20 + spots[i] * (wide - 40 - SIZE) / Math.max(1, count - 1); one.y = 0; one.vx = one.vy = 0; } else { one.vx = (Math.random() - .5) * 1800; one.vy = 250 + Math.random() * 450; }
    draw(one); });
  told(); say(); wake(); clock = setInterval(say, 100); }
function won() { clearInterval(clock); took = Math.round(elapsed() * 10) / 10; state = 'done'; const best = kept();
  if (best === null || took < best) { try { localStorage.setItem(KEY, secs(took)); } catch { /* shown, not kept */ } }
  say(); burst(); }
/** Lets an animation that has played be played again. */
const again = el => { el.classList.remove('hit', 'no', 'yes', 'pop', 'jolt'); void el.offsetWidth; };

const nearest = one => { let best = null, far = 46; seats.forEach((_, i) => { if (crowd.some(other => other !== one && other.seat === i)) return; const d = Math.hypot(seatX(i) - (one.x + SIZE / 2), seatY() + seatSize() / 2 - (one.y + SIZE / 2)); if (d < far) { far = d; best = i; } }); return best; };
/** Let go of one that was held: into its own seat, shaken off a wrong one with the clock charged, or flying with the throw. */
function drop(one) { one.held = false; grabbed = null; one.el.classList.remove('up'); seats.forEach(el => el.classList.remove('near'));
  const near = nearest(one);
  if (near !== null && near === one.home) { sit(one, near); again(one.el); one.el.classList.add('pop'); again(seats[near]); seats[near].classList.add('yes'); if (crowd.every(each => each.seat !== null)) won(); wake(); return; }
  // Not its seat: the seat shakes it off, and the clock is charged.
  if (near !== null) { fine += WRONG; again(seats[near]); seats[near].classList.add('no'); again(pill); pill.classList.add('hit');
    const cost = Object.assign(document.createElement('b'), { className: 'fine', textContent: `+${WRONG}s` }); cost.style.left = `${seatX(near)}px`; cost.addEventListener('animationend', () => cost.remove()); stage.append(cost); if (reduce) setTimeout(() => cost.remove(), 900); one.vx = clamp(one.vx, -260, 260); one.vy = Math.min(one.vy, 0); }
  one.vx = clamp(one.vx, -2200, 2200); one.vy = clamp(one.vy, -1600, 1900); if (one.y === 0 && one.vy <= 0) one.vy = 0;
  if (reduce) { one.y = 0; one.vx = one.vy = 0; draw(one); } wake(); }
// Pressing one. A seated one stays where it is. A pull picks one up, and only while the clock runs; a press with no pull is a poke:
// a flip, and the ones beside it on the floor hop.
for (const one of crowd) one.el.addEventListener('pointerdown', event => {
  event.preventDefault(); if (one.seat !== null) return;
  one.el.setPointerCapture(event.pointerId);
  const from = onFloor(event.clientX, event.clientY), grip = { x: from.x - one.x, y: from.y - one.y }, done = new AbortController(), until = { signal: done.signal };
  let far = 0, when = performance.now();
  one.el.addEventListener('pointermove', move => {
    const at = onFloor(move.clientX, move.clientY), now = performance.now(), dt = Math.max(.008, (now - when) / 1000), x = at.x - grip.x, y = Math.max(0, at.y - grip.y); when = now;
    far = Math.max(far, Math.hypot(at.x - from.x, at.y - from.y));
    if (far > 6 && !one.held && state === 'play' && one.seat === null) { one.held = true; grabbed = one; one.el.classList.add('up'); }
    if (!one.held) return;
    one.vx = one.vx * .55 + (x - one.x) / dt * .45; one.vy = one.vy * .55 + (y - one.y) / dt * .45; one.x = x; one.y = y;
    const spot = nearest(one); seats.forEach((el, i) => el.classList.toggle('near', i === spot)); wake();
  }, until);
  const up = () => {
    done.abort();
    if (one.held) return drop(one);
    if (reduce || one.seat !== null) return;
    if (one.y === 0) one.r += one.x > wide / 2 ? 360 : -360;
    hop(one, 640);
    crowd.forEach(other => { const away = Math.abs(other.x - one.x); if (other !== one && away < 300) setTimeout(() => hop(other, 420 - away), away * 1.1); });
    wake();
  };
  one.el.addEventListener('pointerup', up, until); one.el.addEventListener('pointercancel', up, until);
});

if (!reduce) {
  // Looking: at the pointer while it is over the ticket, which leans a little toward it.
  carry.addEventListener('pointermove', event => { pointer = onFloor(event.clientX, event.clientY); if (!hand) { const box = carry.getBoundingClientRect(); lean.tr = clamp((event.clientX - box.left) / box.width - .5, -.5, .5) * 1.2; } wake(); });
  carry.addEventListener('pointerleave', () => { pointer = null; if (!hand) lean.tr = 0; wake(); });
  // Picking the ticket up, with a mouse or a pen on its paper. Tip it and those on the floor slide to the low end and pile up; let go and
  // it swings back and they hop. Seated ones ride along in their seats. Touch scrolls the page as ever (touch-action: pan-y).
  tk.addEventListener('pointerdown', event => {
    if (event.pointerType === 'touch' || event.target.closest('.pet, .tags')) return;
    hand = { x: event.clientX, y: event.clientY }; tk.setPointerCapture(event.pointerId); carry.classList.add('held'); wake();
  });
  tk.addEventListener('pointermove', event => {
    if (!hand) return;
    const dx = event.clientX - hand.x, dy = event.clientY - hand.y;
    lean.tx = dx * .7; lean.ty = dy * .55; lean.tr = clamp(dx * .022 + dy * (hand.x > innerWidth / 2 ? .03 : -.03), -9, 9); wake();
  });
  const letGo = () => { if (!hand) return; hand = null; carry.classList.remove('held'); lean.tx = lean.ty = lean.tr = 0; crowd.forEach((one, at) => hop(one, 300 + 140 * Math.sin(at * 1.7))); wake(); };
  tk.addEventListener('pointerup', letGo); tk.addEventListener('pointercancel', letGo);
  // Left alone, one on the floor gets restless now and then.
  setInterval(() => { if (pointer || hand || grabbed || document.hidden) return; const floor = crowd.filter(one => out(one) && one.y === 0); if (floor.length) hop(floor[Math.floor(Math.random() * floor.length)], 330); }, 2600);
  document.addEventListener('visibilitychange', wake);
}

try { const kit = localStorage.getItem('loop-kit'); if (kit) document.documentElement.dataset.kit = kit; } catch { /* the first colours stay */ }

// Your own animal. The page arrives saying who is playing (app/seats writes `seatsPlayer` into it: null signed out), as Conga's does.
// With Ink+ one of your animals takes the first place in the crowd, with a spark, and you choose which. Without, a pill says what Ink+ gives.
const you = window.seatsPlayer ?? null, slot = document.getElementById('you'), picture = each => each.picture ?? animal(each.face - 1);
let chosen = 0; try { chosen = Number(localStorage.getItem('seats-own')) || 0; } catch { /* the first one */ }
function cast() {
  const faces = CROWD.slice(0, count), own = you?.ink ? you.animals[chosen = clamp(chosen, 0, you.animals.length - 1)] : null;
  // If the crowd already has that animal, the one it would have pushed out stands where it stood.
  if (own && !own.picture) { const twin = faces.indexOf(own.face - 1); if (twin > 0) faces[twin] = faces[0]; }
  crowd.forEach((one, i) => { one.mine = i === 0 && !!own; one.el.src = one.mine ? picture(own) : animal(faces[i]); });
  spark.hidden = !own;
}
if (you?.ink) {
  const open = Object.assign(document.createElement('button'), { className: 'mine', type: 'button' }), list = Object.assign(document.createElement('div'), { className: 'mines', hidden: true });
  const show = on => { list.hidden = !on; open.setAttribute('aria-expanded', on); };
  const fill = () => { open.innerHTML = `<img src="${picture(you.animals[chosen])}" alt="">You`; for (const button of list.querySelectorAll('button')) button.setAttribute('aria-pressed', Number(button.dataset.n) === chosen); };
  list.innerHTML = '<small>Your animals</small>' + you.animals.map((each, n) => `<button type="button" data-n="${n}" aria-label="Your animal ${n + 1}"><img src="${picture(each)}" alt=""></button>`).join('');
  list.addEventListener('click', event => { const button = event.target.closest('button'); if (!button) return; chosen = Number(button.dataset.n); try { localStorage.setItem('seats-own', chosen); } catch { /* shown, not kept */ } cast(); fill(); show(false); round(); });
  open.addEventListener('click', () => show(list.hidden));
  slot.replaceWith(open); open.after(list); cast(); fill(); show(false);
} else slot.outerHTML = '<a class="inkask" href="/c/ink"><i>Ink+</i>Play as your own animal</a>';
const stamp = document.getElementById('stamp');
place(); round();
addEventListener('resize', () => { wide = stage.clientWidth; place(); wake(); });
button.addEventListener('click', () => state === 'look' ? kick() : round());
</script>
</body>
