<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conga · place names</title>
<style>
@font-face { font-family: Archivo; src: url(../fonts/Archivo.ttf); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
:root { --ink: oklch(21% 0.016 30); --paper: oklch(99.2% 0.004 60); }
* { box-sizing: border-box; margin: 0; }
body { background: oklch(96.8% 0.01 70); color: var(--ink); font-family: Archivo, system-ui, sans-serif; padding: 28px 16px 60px; }
main { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
h1 { font-weight: 900; font-stretch: 112%; font-size: clamp(30px, 6vw, 46px); letter-spacing: -.02em; line-height: 1; }
.lead { font-size: 17px; font-weight: 500; line-height: 1.4; max-width: 72ch; margin-top: 10px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; }
.bar button { font: 700 15px Archivo, system-ui, sans-serif; color: var(--ink); background: var(--paper); border: 0; box-shadow: inset 0 0 0 2px var(--ink); border-radius: 999px; padding: 8px 16px 9px; cursor: pointer; }
.bar button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.frame { position: relative; overflow: hidden; border-radius: 22px 22px 22px 6px; box-shadow: 5px 5px 0 oklch(68% 0.14 33); }
.frame canvas { display: block; width: 100%; aspect-ratio: 16 / 9; }
@media (max-width: 640px) { .frame canvas { aspect-ratio: 9 / 14; } }
.note { padding: 10px 16px; border-radius: 16px 16px 16px 4px; background: var(--paper); box-shadow: inset 0 0 0 2px var(--ink); font-size: 15px; font-weight: 500; line-height: 1.4; max-width: 85ch; }
</style>
<main>
  <header>
    <h1>Conga · place names</h1>
    <p class="lead">Area names are painted into the ground, under everyone, so the animals walk over them. A building's name belongs to the building: it shows when your line comes near, and an animal in front of the building covers it as it covers the building. A line walks through so you can see.</p>
  </header>
  <div class="bar" id="picks"><button data-v="plaque">F · Plaque on the building</button><button data-v="front">G · Sign in front</button><button data-v="now">Today</button></div>
  <div class="bar" id="tones"><button data-t="paper">Paper plate</button><button data-t="ink">Ink plate</button></div>
  <div class="frame"><canvas id="c"></canvas></div>
  <p class="note" id="say"></p>
</main>
<script>
// Relative paths and no imports, so the page also works opened straight from the folder (file:///).
// Where the six toys sit on public/conga/scenery.v3.webp (from scenery.js).
const AT = {"stonehall":[1354,638,320,248],"clocktower":[1386,0,320,320],"armory":[1676,638,320,239],"chapel":[0,0,166,320],"pond":[966,322,320,281],"dorm":[1288,322,320,276]};
const toys = Object.assign(new Image(), { src: '../conga/scenery.v3.webp' });
const sheet = Object.assign(new Image(), { src: '../conga/animals-96.v1.webp' });
const ok = img => img.complete && img.naturalWidth;
const C = { ink: 'oklch(21% 0.016 30)', paper: 'oklch(99.2% 0.004 60)', coral: 'oklch(82% 0.12 38)', onDark: 'oklch(84% 0.115 38)', shadow: 'oklch(68% 0.14 33)', action: 'oklch(48.5% 0.185 27)', green: 'oklch(70% 0.15 147)' };
const SAY = {
  plaque: 'F: a name plate fixed low on the front of the building, in the app\'s card shape. It grows out from the wall as your line comes near and shrinks away as it leaves.',
  front: 'G: a small sign on a post, standing on the ground just in front of the building, in the app\'s card shape. It pops up as your line comes near; animals pass in front of it or behind it like anything else standing there.',
  now: 'Today: ink pills for buildings, paper pills for areas, drawn under the animals, so lines cover them.',
};
let look = 'plaque', tone = 'paper', W, H, ctx, k;
const things = [
  { name: 'Willard Straight', toy: 'stonehall', fx: 0.22, fy: 0.42, w: 150 },
  { name: 'McGraw Tower', toy: 'clocktower', fx: 0.43, fy: 0.3, w: 150 },
  { name: 'Barton Hall', toy: 'armory', fx: 0.66, fy: 0.46, w: 150 },
  { name: 'Sage Chapel', toy: 'chapel', fx: 0.86, fy: 0.3, w: 78 },
  { name: 'Beebe Lake', toy: 'pond', fx: 0.3, fy: 0.86, w: 220 },
  { name: 'Donlon', toy: 'dorm', fx: 0.78, fy: 0.86, w: 150 },
];
const zones = [{ name: 'Central Campus', fx: 0.47, fy: 0.68 }, { name: 'North Campus', fx: 0.84, fy: 0.64 }];
function fit() { const c = document.getElementById('c'), box = c.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); c.width = box.width * dpr; c.height = box.height * dpr; ctx = c.getContext('2d'); W = box.width < 640 ? 700 : 1400; k = box.width / W * dpr; H = box.height / box.width * W; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function text(t, size, weight = 700) { ctx.font = `${weight} ${size}px Archivo, system-ui, sans-serif`; return ctx.measureText(t).width; }
// A name plate in the app's card shape (one tight corner, hard ink shadow), grown from its foot by `grow`; on a post or not.
function plateAt(t, x, foot, grow, post) {
  ctx.save(); ctx.translate(x, foot); ctx.scale(grow, grow);
  const dark = tone === 'ink', w = text(t, 14, 700) + 22, top = post ? -60 : -30;
  if (post) { ctx.beginPath(); ctx.ellipse(0, 0, 10, 3.5, 0, 0, 7); ctx.fillStyle = 'oklch(24% 0.035 30 / .25)'; ctx.fill(); ctx.fillStyle = C.ink; rr(-2.5, top + 22, 5, -top - 22, 2.5); ctx.fill(); }
  rr(-w / 2 + 3, top + 3, w, 28, [10, 10, 10, 3]); ctx.fillStyle = C.ink; ctx.fill();
  rr(-w / 2, top, w, 28, [10, 10, 10, 3]); ctx.fillStyle = dark ? C.ink : C.paper; ctx.fill();
  if (!dark) { ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke(); }
  ctx.fillStyle = dark ? C.onDark : C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, 0, top + 15);
  ctx.restore();
}
// An area's name painted into the ground: big, wide letters a shade darker than the ground, with a lit lower edge so they read as pressed in.
function painted(t, x, y) {
  ctx.save(); ctx.font = '900 44px Archivo, system-ui, sans-serif'; ctx.letterSpacing = '1px'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'oklch(88% 0.08 45 / .9)'; ctx.fillText(t, x, y + 2);
  ctx.fillStyle = 'oklch(75% 0.135 36)'; ctx.fillText(t, x, y);
  ctx.restore();
}
// The label kinds.
function tile(t, x, y) { const w = text(t, 14, 680) + 20; rr(x - w / 2 + 3, y + 3, w, 26, [9, 9, 9, 3]); ctx.fillStyle = C.ink; ctx.fill(); rr(x - w / 2, y, w, 26, [9, 9, 9, 3]); ctx.fillStyle = C.paper; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke(); ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y + 14); return [x - w / 2, y, x + w / 2, y + 29]; }
function zonePill(t, x, y) { const w = text(t, 19, 760) + 32; rr(x - w / 2, y - 18, w, 36, 18); ctx.fillStyle = C.ink; ctx.fill(); ctx.fillStyle = C.onDark; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y + 1); return [x - w / 2, y - 18, x + w / 2, y + 18]; }
function sign(t, x, y) { const w = text(t, 13, 700) + 18; ctx.fillStyle = 'oklch(52% 0.06 50)'; ctx.fillRect(x - 2.5, y - 4, 5, 34); rr(x - w / 2, y - 26, w, 24, 5); ctx.fillStyle = 'oklch(95% 0.03 80)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'oklch(52% 0.06 50)'; ctx.stroke(); ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y - 13); return [x - w / 2, y - 26, x + w / 2, y + 30]; }
// The app's sign: a plate in the app's card shape (one tight corner, hard ink shadow) on a short ink post.
function plate(t, x, y, dark) {
  const w = text(t, 14, 700) + 22, top = y - 30;
  ctx.fillStyle = C.ink; rr(x - 2.5, top + 20, 5, 34, 2.5); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x, top + 54, 9, 3, 0, 0, 7); ctx.fillStyle = 'oklch(24% 0.035 30 / .25)'; ctx.fill();
  rr(x - w / 2 + 3, top + 3, w, 28, [10, 10, 10, 3]); ctx.fillStyle = C.ink; ctx.fill();
  rr(x - w / 2, top, w, 28, [10, 10, 10, 3]); ctx.fillStyle = dark ? C.ink : C.paper; ctx.fill();
  if (!dark) { ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke(); }
  ctx.fillStyle = dark ? C.onDark : C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, x, top + 15);
  return [x - w / 2, top, x + w / 2 + 3, top + 56];
}
const paperSign = (t, x, y) => plate(t, x, y, false), inkSign = (t, x, y) => plate(t, x, y, true);
function banner(t, x, y) { const w = text(t, 19, 800) + 36; rr(x - w / 2 + 4, y - 14, w, 34, 8); ctx.fillStyle = C.ink; ctx.fill(); rr(x - w / 2, y - 18, w, 34, 8); ctx.fillStyle = C.coral; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = C.ink; ctx.stroke(); ctx.fillStyle = C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y); return [x - w / 2, y - 18, x + w / 2, y + 20]; }
function oldPill(t, x, y, dark, size) { const w = text(t, size) + size * 1.2; rr(x - w / 2, y - size * 0.85, w, size * 1.7, size); ctx.fillStyle = dark ? C.ink : C.paper; ctx.fill(); ctx.fillStyle = dark ? C.paper : C.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y + 1); }
function draw(t) {
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.fillStyle = C.coral; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'oklch(77% 0.13 37)'; ctx.beginPath(); for (let x = 45; x < W; x += 90) for (let y = 45; y < H; y += 90) { ctx.moveTo(x + 5, y); ctx.arc(x, y, 5, 0, 7); } ctx.fill();
  rr(W * 0.47, H * 0.02, W * 0.2, H * 0.14, 26); ctx.fillStyle = C.green; ctx.fill();
  // A line weaving across the labels.
  const path = s => ({ x: (s * 140) % (W + 400) - 200, y: H * 0.55 + Math.sin(s * 0.9) * H * 0.18 });
  const s0 = t * 1.3, pts = Array.from({ length: 16 }, (_, i) => path(s0 - i * 0.22)), head = pts[0];
  const items = things.map(it => ({ ...it, x: W * it.fx, y: H * it.fy }));
  const zs = zones.map(z => ({ ...z, x: W * z.fx, y: H * z.fy }));
  if (look === 'now') { for (const z of zs) oldPill(z.name, z.x, z.y, false, 22); for (const it of items) oldPill(it.name, it.x, it.y + 20, true, 14); }
  else for (const z of zs) painted(z.name, z.x, z.y);
  // How near the line's head is to each building, 0 far to 1 close, eased so a name pops rather than fades slowly.
  const nearness = it => { const d = Math.hypot(head.x - it.x, head.y - (it.y - 40)), u = Math.max(0, Math.min(1, (360 - d) / 110)); return 1 - (1 - u) ** 3; };
  const toyHigh = it => it.w * AT[it.toy][3] / AT[it.toy][2];
  // Everything that stands, nearest the bottom last, so whoever is in front covers what is behind.
  const stand = [];
  for (const it of items) {
    const n = look === 'now' ? 0 : nearness(it);
    stand.push({ y: it.y, draw: () => { ctx.beginPath(); ctx.ellipse(it.x, it.y - 4, it.w * 0.42, it.w * 0.12, 0, 0, 7); ctx.fillStyle = 'oklch(24% 0.035 30 / .18)'; ctx.fill();
      if (ok(toys)) { const [sx, sy, sw, sh] = AT[it.toy]; ctx.drawImage(toys, sx, sy, sw, sh, it.x - it.w / 2, it.y - toyHigh(it), it.w, toyHigh(it)); }
      if (look === 'plaque' && n > 0.02) plateAt(it.name, it.x, it.y - toyHigh(it) * 0.1, 0.4 + 0.6 * n, false); } });
    if (look === 'front' && n > 0.02) stand.push({ y: it.y + 22, draw: () => plateAt(it.name, it.x - it.w * 0.22, it.y + 22, n, true) });
  }
  stand.push({ y: head.y, draw: () => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y + 13) : ctx.moveTo(p.x, p.y + 13)); ctx.lineJoin = ctx.lineCap = 'round'; ctx.strokeStyle = C.ink; ctx.lineWidth = 16; ctx.stroke(); ctx.strokeStyle = C.action; ctx.lineWidth = 10; ctx.stroke();
      if (ok(sheet)) for (let i = pts.length - 1; i >= 0; i--) { const f = 1 + (i * 5) % 36, size = i ? 42 : 58; ctx.drawImage(sheet, (f - 1) % 7 * 96, Math.floor((f - 1) / 7) * 96, 96, 96, pts[i].x - size / 2, pts[i].y - size / 2, size, size); } } });
  stand.sort((a, b) => a.y - b.y).forEach(s => s.draw());
}
const pickBox = document.getElementById('picks');
const mark = v => { look = v; pickBox.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); document.getElementById('say').textContent = SAY[v]; };
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
// With motion off, one still frame, drawn again whenever anything changes (a resize clears the canvas).
const once = () => { if (still) draw(4); };
pickBox.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { mark(b.dataset.v); once(); } });
const toneBox = document.getElementById('tones'), setTone = v => { tone = v; toneBox.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === v)); };
toneBox.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { setTone(b.dataset.t); once(); } });
setTone('paper'); mark('plaque'); fit(); new ResizeObserver(() => { fit(); once(); }).observe(document.getElementById('c'));
toys.addEventListener('load', once); sheet.addEventListener('load', once); document.fonts.ready.then(once);
const frame = now => { draw(now / 1000); requestAnimationFrame(frame); };
if (still) once(); else requestAnimationFrame(frame);
</script>
