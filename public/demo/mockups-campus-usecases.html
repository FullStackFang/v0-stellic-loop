<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loopd · Three use cases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
/* The three pitch use cases in the Loopd Campus look (docs/loop-campus-design.md: layout C, Cornell Coral).
   Coral holds the big areas with dark type. Carnelian is the action with white type. Hard shadows, one tight corner.
   The bar on top is outside the design: it switches use case and holds the demo controls. */
@property --drift { syntax: '<number>'; inherits: true; initial-value: 0; }
@keyframes drift { from { --drift: -1; } to { --drift: 1; } }
@keyframes pop { from { transform: scale(.2); opacity: 0; } }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  --F: oklch(82% 0.12 38); --A: oklch(48.5% 0.185 27); --A2: oklch(57% 0.2 30); --A4: oklch(34% 0.13 24); --P: oklch(84% 0.115 38); --H: oklch(68% 0.14 33);
  --ink: oklch(21% 0.016 30); --ink-2: oklch(30% 0.02 30); --bg: oklch(96.8% 0.01 70); --paper: oklch(99.2% 0.004 60);
  --mute: oklch(45% 0.016 40); --line: oklch(88% 0.012 50); --on-night: oklch(96.5% 0.008 70); --night-mute: oklch(75% 0.016 40);
  --on-field-2: color-mix(in oklch, var(--ink) 74%, var(--F)); --ok: oklch(46% 0.11 150); --ok-bg: oklch(93% 0.05 150);
  --r: 22px 22px 22px 6px; --ease: cubic-bezier(.22, 1, .36, 1); --bar: 45px;
  margin: 0; font-family: Archivo, system-ui, sans-serif; font-size: 15px; line-height: 1.45; letter-spacing: -0.012em;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; background: var(--bg); color: var(--ink); min-height: 100vh;
}
button { font: inherit; color: inherit; letter-spacing: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; } ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--A); outline-offset: 2px; }

/* compare bar (outside the design) */
.cmp { position: sticky; top: 0; z-index: 10; min-height: var(--bar); display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; padding: 6px 14px; background: var(--ink); color: var(--on-night); font-size: 13.5px; }
.cmp-set { display: flex; gap: 2px; padding: 3px; border-radius: 99px; background: color-mix(in oklch, var(--on-night) 10%, transparent); }
.cmp button { padding: 4px 12px; border-radius: 99px; font-weight: 520; white-space: nowrap; }
.cmp-set button[aria-pressed=true] { background: var(--paper); color: var(--ink); font-weight: 620; }
.cmp .demo { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--on-night) 34%, transparent); }
.cmp .demo:hover { background: color-mix(in oklch, var(--on-night) 12%, transparent); }
.cmp p { color: var(--night-mute); margin-left: auto; }

/* shell */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100vh - var(--bar)); overflow-x: clip; }
.nav { position: sticky; top: var(--bar); align-self: start; height: calc(100vh - var(--bar)); display: flex; flex-direction: column; gap: 6px; padding: 20px 14px 16px; background: var(--ink); color: var(--on-night); }
.wm { display: flex; align-items: center; gap: 9px; font-weight: 640; font-size: 19px; letter-spacing: -0.03em; padding: 0 8px 14px; --mark-top: var(--P); }
.mk svg { display: block; width: 100%; height: 100%; }
.wm .mk { width: 26px; height: 26px; }
.nav-label { font-size: 12.5px; color: var(--night-mute); padding: 12px 10px 4px; }
.links { display: grid; gap: 2px; }
.links a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; font-size: 14.5px; font-weight: 500; color: color-mix(in oklch, var(--on-night) 88%, transparent); }
.links a:hover { background: color-mix(in oklch, var(--on-night) 8%, transparent); }
.links a[data-on] { background: color-mix(in oklch, var(--on-night) 13%, transparent); color: var(--on-night); font-weight: 580; }
.links a[aria-current] { background: var(--F); color: var(--ink); font-weight: 600; }
.links i { width: 22px; height: 22px; border-radius: 7px 7px 7px 2px; display: grid; place-items: center; flex: none; font-style: normal; font-weight: 800; font-stretch: 75%; font-size: 12px; color: var(--paper); background: linear-gradient(135deg, var(--A), var(--A2) 60%, var(--A4)); }
.links small { margin-left: auto; font-size: 12px; color: var(--P); font-weight: 560; }
.acct { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px 0; border-top: 1px solid color-mix(in oklch, var(--on-night) 14%, transparent); font-size: 14px; font-weight: 540; }
.acct small { display: block; font-weight: 400; color: var(--P); font-size: 12.5px; }
.face { border-radius: 50%; object-fit: cover; background: oklch(85% 0.01 60); width: 32px; height: 32px; flex: none; display: block; }
.stack { display: flex; --ring: var(--paper); }
.stack .face { width: 26px; height: 26px; margin-left: -7px; box-shadow: 0 0 0 2px var(--ring); }
.stack .face:first-child { margin-left: 0; }
.face.new { animation: pop .5s var(--ease); }

.page { width: 100%; max-width: 1180px; padding: 0 32px 96px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; align-content: start; }
.hero { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: end; margin: 0 -32px; padding: 40px 32px 34px; background: var(--F); border-image: linear-gradient(var(--F), var(--F)) fill 0 / 0 / 0 100vw 0 0; }
.kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 560; }
.kicker i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
h1 { font-stretch: 112%; font-weight: 720; font-size: 62px; line-height: .96; letter-spacing: -0.05em; margin: 12px 0 10px; max-width: 14ch; }
.purpose { font-size: 17px; font-weight: 500; max-width: 46ch; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; margin: 22px 0 0; }
.meta > div { display: flex; align-items: center; gap: 12px; }
.meta b { display: block; font-weight: 600; } .meta b + span { font-size: 13.5px; color: var(--on-field-2); }
.meta .stack { --ring: var(--F); } .meta .stack .face { width: 34px; height: 34px; }
.tile { display: grid; justify-items: center; align-content: center; flex: none; line-height: 1; min-width: 48px; min-height: 48px; padding: 6px 6px 7px; border-radius: 12px 12px 12px 3px; background: var(--F); color: var(--ink); }
.tile small { font-size: 11px; font-weight: 600; } .tile b { font-weight: 640; font-size: 21px; margin-top: 2px; display: block; }
.tile.ink { background: var(--ink); color: var(--P); }
.tile.met { background: var(--A); color: var(--paper); }
.actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; font-weight: 580; white-space: nowrap; border-radius: 99px; background: var(--paper); box-shadow: 0 0 0 1.5px var(--ink) inset; transition: background-color .15s, transform .15s var(--ease); }
.btn:hover { background: color-mix(in oklch, var(--ink) 6%, var(--paper)); }
.btn.go { background: var(--A); color: var(--paper); box-shadow: 0 0 0 1.5px var(--ink) inset, 3px 3px 0 var(--ink); }
.btn.go:hover { background: var(--A2); }
.btn.go:active { transform: translate(2px, 2px); }
.btn.done { background: var(--ink); color: var(--on-night); box-shadow: none; cursor: default; }
.btn.sm { height: 36px; }

/* cover tile: the mark, or the thing the screen is about */
.cover { position: relative; overflow: hidden; isolation: isolate; width: 208px; aspect-ratio: 1; border-radius: var(--r); box-shadow: 6px 6px 0 var(--ink); color: var(--paper); --mark-top: var(--ink);
  animation: drift 16s ease-in-out infinite alternate;
  background:
    radial-gradient(34% 34% at 30% 20%, oklch(99% 0.02 80 / .7), transparent 70%),
    radial-gradient(58% 58% at calc(78% - var(--drift) * 7%) calc(30% + var(--drift) * 5%), var(--A2), transparent 72%),
    radial-gradient(46% 46% at calc(60% + var(--drift) * 6%) calc(82% - var(--drift) * 4%), var(--A4), transparent 70%),
    radial-gradient(50% 50% at calc(18% + var(--drift) * 4%) calc(80% + var(--drift) * 6%), oklch(68% 0.17 40), transparent 70%),
    var(--A); }
.cover .mk { position: absolute; inset: 14% 14% 18%; }
.cover .say { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; text-align: center; padding: 16px; gap: 6px; }
.say small { font-size: 12.5px; font-weight: 560; opacity: .9; }
.say strong { font-stretch: 108%; font-weight: 740; font-size: 32px; line-height: .98; letter-spacing: -0.045em; }
.say .big { font-size: 76px; line-height: .86; }
.say time { font-weight: 640; font-size: 16px; }
.blocks { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; width: 100%; margin-top: 4px; }
.blocks i { height: 7px; border-radius: 2px; background: oklch(99% 0.004 60 / .28); } .blocks i.on { background: var(--paper); }

/* cards */
.main { grid-column: 1; display: grid; gap: 28px; } .side { grid-column: 2; display: grid; gap: 20px; }
h2 { font-size: 20px; font-weight: 660; letter-spacing: -0.03em; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h2 span { font-size: 13.5px; font-weight: 520; color: var(--mute); display: inline-flex; align-items: center; gap: 8px; letter-spacing: -0.012em; }
.list, .card { background: var(--paper); border-radius: var(--r); box-shadow: 5px 5px 0 var(--H); } .list { overflow: hidden; }
.card { padding: 18px 20px; }
.card h3 { font-size: 13.5px; font-weight: 560; color: var(--mute); display: flex; justify-content: space-between; margin-bottom: 12px; }
.rw { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.rw:last-child { border: 0; }
.rw h3 { font-size: 16.5px; font-weight: 600; letter-spacing: -0.025em; }
.rw p { font-size: 13.5px; color: var(--mute); }
.rw .end { display: flex; align-items: center; gap: 12px; }
.pill { font-size: 12.5px; font-weight: 560; padding: 3px 10px; border-radius: 99px; background: var(--bg); color: var(--mute); white-space: nowrap; }
.pill.yes { background: var(--ok-bg); color: var(--ok); } .pill.hot { background: var(--F); color: var(--ink); } .pill.red { background: var(--A); color: var(--paper); }
.gauge { width: 30px; height: 30px; flex: none; transform: rotate(-90deg); }
.gauge circle { fill: none; stroke-width: 5; stroke: var(--line); transition: stroke .35s var(--ease); } .gauge circle.lit { stroke: var(--ink); }
.ann { background: var(--ink); color: var(--on-night); box-shadow: 5px 5px 0 var(--A); }
.ann h3 { color: var(--night-mute); }
.ann p { font-size: 18px; font-weight: 560; letter-spacing: -0.025em; line-height: 1.25; margin-bottom: 14px; color: var(--P); }
.who { display: flex; align-items: center; gap: 8px; font-size: 13.5px; } .who .face { width: 24px; height: 24px; } .who small { color: var(--night-mute); font-size: 12.5px; }
.kv { display: grid; gap: 12px; }
.kv li { display: flex; align-items: center; gap: 12px; }
.kv b { display: block; font-weight: 580; } .kv div span { font-size: 13px; color: var(--mute); }
.num { font-stretch: 108%; font-weight: 720; font-size: 26px; letter-spacing: -0.04em; width: 52px; flex: none; line-height: 1; }
.steps { counter-reset: s; display: grid; gap: 10px; font-size: 14px; }
.steps li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; counter-increment: s; }
.steps li::before { content: counter(s); width: 24px; height: 24px; border-radius: 8px 8px 8px 2px; background: var(--F); display: grid; place-items: center; font-weight: 640; font-size: 12.5px; }
.note { font-size: 13px; color: var(--mute); }

.blocks.three { grid-template-columns: repeat(3, 1fr); width: 70%; } .blocks.three i { height: 9px; }
.tile.plus { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn.picked { background: var(--ink); color: var(--P); box-shadow: none; }
.btn[disabled] { background: color-mix(in oklch, var(--ink) 12%, var(--F)); color: var(--on-field-2); box-shadow: none; cursor: default; }
.rw.add { background: color-mix(in oklch, var(--F) 16%, var(--paper)); }
.opts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 10px; }
.opts small { flex-basis: 100%; font-size: 12.5px; color: var(--mute); }
.field { height: 36px; padding: 0 14px; display: inline-flex; align-items: center; min-width: 190px; border-radius: 12px; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--mute); font-size: 14px; }
.opt { height: 36px; padding: 0 14px; border-radius: 99px; background: var(--F); font-weight: 560; font-size: 14px; white-space: nowrap; }
.opt:hover { background: var(--P); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.way { background: var(--paper); border-radius: var(--r); box-shadow: 5px 5px 0 var(--H); padding: 18px 20px 20px; display: grid; gap: 8px; align-content: start; justify-items: start; }
.way.pick { background: var(--F); box-shadow: 5px 5px 0 var(--ink); }
.way h3 { font-size: 15px; font-weight: 600; }
.way strong { font-stretch: 108%; font-weight: 740; font-size: 44px; line-height: 1; letter-spacing: -0.045em; }
.way strong small { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.way strong s { font-size: 17px; font-weight: 500; letter-spacing: -0.02em; color: var(--on-field-2); margin-left: 6px; }
.way p { font-size: 14px; color: var(--mute); max-width: 34ch; } .way.pick p { color: var(--on-field-2); }
.say .price { font-size: 38px; } .say #cd { font-size: 60px; line-height: .9; }
@media (max-width: 640px) { .two { grid-template-columns: 1fr; } }
.record-top { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 10px; flex-wrap: wrap; } .record-top h2 { margin: 0; }
.tabs { display: flex; gap: 4px; }
.tabs button { padding: 6px 14px; border-radius: 99px; font-weight: 540; color: var(--mute); } .tabs button span { opacity: .6; margin-left: 4px; font-weight: 400; }
.tabs button[aria-selected=true] { background: var(--ink); color: var(--P); }
.rw p b { font-weight: 600; color: var(--ink); }
.payrow { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; }
.payrow .btn { height: 46px; padding: 0 22px; font-size: 16px; }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.way.lv strong { font-size: 30px; }
.blocks.fifteen { grid-template-columns: repeat(15, 1fr); gap: 2px; } .blocks.fifteen i:nth-child(5), .blocks.fifteen i:nth-child(15) { height: 13px; margin-top: -3px; }
.rw .up { color: var(--A); font-weight: 560; }
.rw.locked h3, .rw.locked p, .rw.locked .tile { opacity: .5; }
@media (max-width: 760px) { .three { grid-template-columns: 1fr; } }
@media (max-width: 1020px) { .page { grid-template-columns: minmax(0, 1fr); } .side { grid-column: 1; } }
@media (max-width: 860px) {
  .app { display: block; } .nav { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 14px; }
  .nav-label, .acct small, div.acct { display: none; } button.acct { width: auto; margin: 0 0 0 auto; padding: 0; border: 0; } .lvl { left: auto; right: 14px; bottom: auto; top: calc(var(--bar) + 60px); } .wm { padding: 0 8px 0 0; } .links { display: flex; }
  .page { padding: 0 16px 64px; } .hero { grid-template-columns: 1fr; margin: 0 -16px; padding: 28px 16px; } .cover { width: 150px; } h1 { font-size: 44px; }
  .rw { grid-template-columns: auto minmax(0, 1fr); } .rw .end { grid-column: 2; }
}
.rw h3 .lvtag { margin-left: 8px; vertical-align: 2px; font-size: 11.5px; }
.find { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 14px; }
.find input { flex: 1 1 240px; height: 42px; padding: 0 18px; border: 0; border-radius: 99px; font: inherit; color: var(--ink); background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink); }
.find input::placeholder { color: var(--mute); } .find input:focus-visible { outline: 3px solid var(--A); outline-offset: 2px; }
.rw[hidden] { display: none; }
.regp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 12px 24px; align-items: stretch; padding-top: 12px; }
.regp p { font-size: 15.5px; color: var(--ink); max-width: 52ch; margin-bottom: 6px; } .regd { align-self: center; }
.regp ul { display: flex; flex-wrap: wrap; gap: 10px 26px; list-style: none; padding: 0; margin: 12px 0 0; font-size: 13px; line-height: 1.3; color: var(--mute); } .regp li.who { display: flex; align-items: center; gap: 8px; } .regp li.who .face { width: 30px; height: 30px; }
.regp li b { display: block; font-size: 14px; font-weight: 600; color: var(--ink); }
.going { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 13.5px; font-weight: 560; } .going .stack { --ring: color-mix(in oklch, var(--F) 16%, var(--paper)); }
.map { margin: 0; overflow: hidden; display: grid; grid-template-rows: minmax(104px, 1fr) auto; border-radius: 16px 16px 16px 5px; box-shadow: 0 0 0 1.5px var(--ink), 4px 4px 0 var(--H); background: var(--paper); }
.map iframe { display: block; width: 100%; height: 100%; border: 0; filter: sepia(.4) saturate(1.15) hue-rotate(-14deg) contrast(.96); }
.map figcaption { padding: 6px 12px 7px; font-size: 13px; color: var(--mute); border-top: 1.5px solid var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .map figcaption b { font-size: 14px; font-weight: 600; color: var(--ink); margin-right: 6px; }
.regact:empty { display: none; } .regact { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; } .regact small { flex: 1 1 260px; }
@media (max-width: 760px) { .regp { grid-template-columns: 1fr; } }
.pill.src { display: inline-block; margin-right: 7px; padding: 1px 8px 2px; font-size: 11.5px; font-weight: 620; color: var(--ink); background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink); text-decoration: none; transition: background-color .15s, color .15s; }

/* earning: what your activity is building toward, as stubs in the header */
.earn { display: flex; flex-wrap: wrap; gap: 10px 12px; margin-top: 22px; list-style: none; padding: 0; }
.earn li { display: flex; align-items: center; gap: 10px; padding: 7px 16px 7px 8px; border-radius: 99px; background: var(--paper); box-shadow: 3px 3px 0 var(--ink); line-height: 1.2; }
.earn b { display: block; font-size: 14.5px; font-weight: 640; letter-spacing: -0.02em; } .earn span { font-size: 12.5px; color: var(--mute); }
.earn .gauge { width: 32px; height: 32px; }
.earn .ready { background: var(--ink); color: var(--paper); box-shadow: 3px 3px 0 var(--A); padding-right: 8px; } .earn .ready span { color: var(--night-mute); } .earn .ready .gauge circle.lit { stroke: var(--P); }
.earn em { font-style: normal; font-size: 12.5px; font-weight: 640; padding: 5px 11px; border-radius: 99px; background: var(--A); color: var(--paper); margin-left: 4px; }
/* arrangements of the top bar (2, 3 and 4; 1 is the plain menu line) */
[data-menu=top] .nav { flex-wrap: wrap; } .nav .post { margin-left: 12px; } [data-menu=top] .post + .acct { margin-left: 16px; }
.nav .earn { margin: 0 0 0 auto; gap: 8px; } .nav .earn li { padding: 5px 14px 5px 6px; box-shadow: 2px 2px 0 var(--ink); } .nav .earn .ready { padding-right: 6px; box-shadow: 2px 2px 0 var(--A); } .nav .earn .gauge { width: 28px; height: 28px; } .nav .earn .ready .gauge circle.lit { stroke: var(--F); } .nav .earn .ready span { color: var(--night-mute); }
.earn.mini li > div > span { display: none; } .earn.mini b { font-size: 13.5px; } .nav .earn.mini li { padding: 4px 12px 4px 5px; } .nav .earn.mini .gauge { width: 24px; height: 24px; }
.nav .live { margin-left: auto; padding: 6px 14px; } .nav .live + .earn { margin-left: 10px; }
.nav[data-top="2"], .nav[data-top="3"] { padding-bottom: 9px; } .nav[data-top="2"] .links a:has(i) { padding: 6px; }
.nav[data-top="4"] { padding-bottom: 0; } .brk { flex-basis: 100%; height: 0; } .gap { grid-column: 1 / -1; height: 0; margin-bottom: -4px; }
/* menu across the top (an option): the rail's links become one coral line above the header, and the page takes the full width */
.app[data-menu=top] { display: block; min-height: 0; }

const makeEvents = () => [
  { id: 'cs', title: 'CS 2110 study group', by: 'Posted by Maya', day: 'Today', time: '3pm', ends: 'until 5pm', where: 'Northside Coffee', room: 'The back table', walk: 4, lat: 42.4534, lon: -76.4780, about: 'Problem set 6, worked through together. Bring a laptop.', kw: 'study homework work coffee cafe quiet class focus', giver: 'Northside Coffee', n: 3, get: ['A drink and a pastry, $4.50 each', 'A drink and a pastry, $4.00 each', 'A drink and a pastry, $3.50 each'], inn: ['maya', 'dev', 'you'], here: ['maya', 'dev'], now: true },
  { id: 'run', title: 'Sunset run, easy 5K', by: 'Posted by Kai', day: 'Today', time: '5pm', ends: 'about 40 minutes', where: 'Arts Quad', room: 'Meet at the statue', walk: 7, lat: 42.4488, lon: -76.4845, about: 'Conversation pace, nobody gets dropped. Loopd around Beebe Lake and back.', kw: 'exercise workout active fitness jog cardio outside outdoors tonight social', giver: 'Finger Lakes Running Co.', toward: [3, 5, 'group runs'], get: Array(3).fill('20% off Brooks running shoes'), inn: ['kai', 'june'], here: [] },
  { id: 'hoops', title: 'Pickup basketball', by: 'Posted by Tomás', day: 'Today', time: '6pm', ends: 'until 7pm', where: 'Helen Newman Hall', room: 'Court 2', walk: 12, lat: 42.4530, lon: -76.4772, about: 'Half court, first to 11, winners stay. All levels.', kw: 'exercise workout active sport sports game games play team tonight', giver: 'Cornell Rec', n: 6, get: ['The court held for the hour', 'The court held for the hour', 'The court held for the hour, and balls provided'], inn: ['tomas', 'dev', 'marcus', 'kai', 'priya'], here: [] },
  { id: 'chess', title: 'Blitz night', src: 'CampusGroups', by: 'Chess Club', day: 'Today', time: '7pm', ends: 'until 9:30pm', where: 'Willard Straight Hall', room: 'Room 414', walk: 6, lat: 42.4466, lon: -76.4857, going: 18, about: 'Five-minute games, all levels. Boards and clocks provided.', kw: 'games game play indoor chill board competitive tonight', giver: 'Chess Club', n: 3, get: ['Skip the $5 door', 'Skip the door, and a board held for you', 'Skip the door, a board held, and a seat at the final'], inn: [], here: [] },
  { id: 'bao', title: 'Dumpling night', by: 'Posted by Priya', day: 'Today', time: '8pm', ends: 'about 90 minutes', where: 'Bao House', room: 'Table booked under Priya', walk: 9, lat: 42.4420, lon: -76.4853, about: 'Order for the table and split it. Vegetarian is easy here.', kw: 'food eat dinner hungry dumplings restaurant social tonight', giver: 'Bao House', n: 4, get: ['Starters on the house', 'Starters and dessert on the house', 'Starters, dessert and a round of drinks'], inn: ['priya', 'tomas', 'june'], here: [] },
  { id: 'resume', title: 'Resume drop-in', src: 'CampusGroups', by: 'Career Services', day: 'Wed', time: '2pm', ends: 'until 4pm', where: 'Barnes Hall', room: 'Room 103', walk: 6, lat: 42.4460, lon: -76.4855, going: 9, about: 'Fifteen minutes with an advisor. Bring a printed copy.', kw: 'career job jobs internship help recruiting', inn: [], here: [] },
  { id: 'dance', title: 'Ballroom open floor', src: 'CampusGroups', by: 'Ballroom Dance Club', day: 'Wed', time: '8pm', ends: 'until 10pm', where: 'Willard Straight Hall', room: 'Memorial Room', walk: 6, lat: 42.4466, lon: -76.4857, going: 23, about: 'A short beginner lesson, then open dancing. No partner needed.', kw: 'dance dancing exercise active music social beginner', inn: [], here: [] },
  { id: 'talk', title: "Founders' fireside", src: 'CampusGroups', by: 'Entrepreneurship at Cornell', day: 'Thu', time: '5pm', ends: 'until 6:30pm', where: 'Sage Hall', room: 'Room B08', walk: 8, lat: 42.4459, lon: -76.4832, going: 64, about: 'Three alumni founders on their first year. Questions from the floor, pizza after.', kw: 'startup startups founders career learn network talk pizza', inn: ['marcus'], here: [] },
  { id: 'vball', title: 'Volleyball open gym', src: 'CampusGroups', by: 'Intramural Sports', day: 'Thu', time: '7pm', ends: 'until 9pm', where: 'Helen Newman Hall', room: 'Main gym', walk: 12, lat: 42.4530, lon: -76.4772, going: 14, about: 'Show up and get put on a side. Nets are up all night.', kw: 'exercise workout active sport sports game games play team', inn: [], here: [] },

  { id: 'demo', title: 'Demo night', src: 'Luma', by: 'Ithaca builders', day: 'Fri', time: '6pm', ends: 'until 8pm', where: 'Collegetown', room: 'Address shown once you register', walk: 9, lat: 42.4422, lon: -76.4850, going: 41, about: 'Six short demos of things people built this month, then open tables.', kw: 'startup startups tech build learn network talk', inn: ['dev'], here: [] },

  { id: 'hike', title: 'Sunrise hike', src: 'CampusGroups', by: 'Outing Club', day: 'Sat', time: '7am', ends: 'back by 9am', where: 'Cascadilla Gorge', room: 'Meet at the trailhead', walk: 11, lat: 42.4429, lon: -76.4897, going: 11, about: 'An easy two miles to watch the sun come up. Bring a headlamp and water.', kw: 'exercise active outdoors outside nature walk hiking morning', giver: 'Outing Club', n: 4, get: Array(3).fill('Gear rental waived'), inn: ['june', 'marcus'], here: [] },

let EVENTS = makeEvents();
// Rewards that build up with activity: [done, needed, reward, who gives it and for what]
const EARNING = [[1, 1, '$5 off any order', 'Collegetown Bagels · for 10 outings'], [3, 5, '20% off Brooks running shoes', 'Finger Lakes Running Co. · 3 of 5 group runs'], [2, 3, 'A free drink each', 'Northside Coffee · same group, 2 of 3 weeks']];
const SAY = ['exercise', 'eat with people', 'study', 'startups', 'tonight'];
const S1 = { sx: 0, q: '', view: 'best', open: null, pane: 'more', fresh: null, anim: false, copied: false, used: null, outings: 11, asked: {} };
// Why each person is suggested: how you already know them.
const WHY = { lena: 'Ran with you twice', kai: 'Ran with you last week', june: 'Studied with you last week', maya: 'In Team 4', dev: 'In Team 4', marcus: 'In Team 4', priya: 'In Supper Club', tomas: 'In Supper Club' };
// Matching: a word in the title, host or place counts most; a word in what the event is good for counts too. Stands in for a real meaning search.
const STOP = new Set('a an the to of in on at for and or with some something want i go do me my people'.split(' '));
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const hit = (words, t) => words.some(w => w === t || w.length > 2 && t.length > 2 && (w.startsWith(t) || t.startsWith(w)));
const fit = (d, q) => { const head = `${d.title} ${d.by} ${d.where} ${d.src || ''}`.toLowerCase().split(/[^a-z0-9]+/), kw = d.kw.split(' ');
  return q.toLowerCase().split(/[^a-z0-9]+/).filter(t => t && !STOP.has(t)).reduce((s, t) => s + (hit(head, t) ? 3 : hit(kw, t) ? 2 : 0), 0); };

const pull = d => (d.inn.includes('you') ? 4 : 0) + Math.min(d.inn.filter(k => k !== 'you').length, 2) + (d.get ? 2 : 0) + (d.n && d.n - d.inn.length === 1 ? 2 : 0) + (d.day === 'Today' ? 1 : 0);

function pick() {
  const q = S1.q.trim(), cg = S1.view === 'cg', pool = EVENTS.filter(d => !cg || d.src === 'CampusGroups');
  if (!q) { if (cg) return { rows: pool, rest: [], line: `All ${pool.length} CampusGroups events this week` };
    const best = [...pool].sort((a, b) => pull(b) - pull(a)).slice(0, 5), rest = pool.filter(d => !best.includes(d));
    return { rows: pool.filter(d => best.includes(d)), rest, mark: `${rest.length} more this week`, line: `Your best 5 of ${pool.length} this week` }; }

    <div class="lvl-top">${ava('big')}<div><strong>Stephen Fang</strong><span>${LEVELS[lv][0]} · level ${lv + 1} of 3</span></div>
      <div class="lvbar" style="--to:${Math.min(1, n / top)}"><i></i>${LEVELS.slice(1).map(l => `<em style="left:${l[1] / top * 100}%" class="${n >= l[1] ? 'hit' : ''}"></em>`).join('')}</div>
      <p><span><b>${n}</b> / ${top} outings</span><span>${next ? `${next[1] - n} more to ${next[0]}` : 'Top level'}</span></p></div>
    <div class="lvl-body"><div class="lvstats"><div><b>${n}</b><span>outings</span></div><div><b>6</b><span>rewards used</span></div><div><b>$31</b><span>saved</span></div></div><p>An outing is any time you check in with at least one other person.</p>
      <ul>${LEVELS.map((l, i) => `<li class="${i === lv ? 'now' : ''}"><b>${i + 1}</b><div><strong>${l[0]}</strong><span>${l[2]}</span></div><small>${i === lv ? 'You' : i < lv ? 'Passed' : `${l[1] - n} to go`}</small></li>`).join('')}</ul></div></div>`;
  if ($('me')) { $('me').onclick = e => { e.stopPropagation(); setLevel(!lvOpen); }; $('me').onmouseenter = () => { if (!lvOpen) setLevel(true); }; }
}
document.addEventListener('click', e => { if (lvOpen && !e.target.closest('.lvl')) setLevel(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && lvOpen) setLevel(false); });

const UCS = [['This week', uc1], ['Club event with a quota', uc2], ['Team dinner that decides itself', uc3], ['Paying', uc4]];
let cur = Math.max(0, Math.min(3, (parseInt(location.hash.slice(1)) || 1) - 1)), timer;
function draw() {
  document.body.dataset.pal = PAL;
  clearInterval(timer);
  $('ucs').innerHTML = UCS.map((u, i) => `<button aria-pressed="${i === cur}" data-u="${i}">${i + 1} · ${u[0]}</button>`).join('');
  $('ucs').querySelectorAll('button').forEach(b => b.onclick = () => { cur = +b.dataset.u; history.replaceState(null, '', '#' + (cur + 1)); draw(); scrollTo(0, 0); });
  UCS[cur][1](); levelCard();
  timer = setInterval(() => { if ($('clk')) $('clk').textContent = clock(); }, 1000);
}
draw();
</script>
</body>
</html>
