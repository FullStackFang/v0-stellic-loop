<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conga · the rope</title>
<style>
@font-face { font-family: Archivo; src: url(../fonts/Archivo.ttf); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
:root { --ink: oklch(21% 0.016 30); --paper: oklch(99.2% 0.004 60); }
* { box-sizing: border-box; margin: 0; }
body { background: oklch(96.8% 0.01 70); color: var(--ink); font-family: Archivo, system-ui, sans-serif; padding: 28px 16px 60px; }
main { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
h1 { font-weight: 900; font-stretch: 112%; font-size: clamp(30px, 6vw, 46px); letter-spacing: -.02em; line-height: 1; }
.lead { font-size: 17px; font-weight: 500; line-height: 1.4; max-width: 72ch; margin-top: 10px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; }
.bar button { font: 700 15px Archivo, system-ui, sans-serif; color: var(--ink); background: var(--paper); border: 0; box-shadow: inset 0 0 0 2px var(--ink); border-radius: 999px; padding: 8px 16px 9px; cursor: pointer; }
.bar button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.frame { position: relative; overflow: hidden; border-radius: 22px 22px 22px 6px; box-shadow: 5px 5px 0 oklch(68% 0.14 33); }
.frame canvas { display: block; width: 100%; aspect-ratio: 16 / 9; }
@media (max-width: 640px) { .frame canvas { aspect-ratio: 3 / 4; } }
.note { padding: 10px 16px; border-radius: 16px 16px 16px 4px; background: var(--paper); box-shadow: inset 0 0 0 2px var(--ink); font-size: 15px; font-weight: 500; line-height: 1.45; max-width: 85ch; }
</style>
<main>
  <header>
    <h1>Conga · the rope</h1>
    <p class="lead">What joins a line together, in the line's own colour, made of something that belongs on a felt mat. Two lines walk through, at the game's own scale.</p>
  </header>
  <div class="bar"><button data-v="a">A · Felt ribbon</button><button data-v="b">B · Pom-pom garland</button><button data-v="c">C · Sewn into the mat</button><button data-v="d">D · Felt bunting</button><button data-v="now">Today</button></div>
  <div class="frame"><canvas></canvas></div>
  <p class="note"></p>
</main>
<script>
const sheet = Object.assign(new Image(), { src: '../conga/animals-96.v1.webp' });
const FELT = { mat: 'oklch(80% 0.11 38)', grass: 'oklch(70% 0.12 145)', grassThread: 'oklch(90% 0.09 130)', thread: 'oklch(94% 0.04 60)', under: 'oklch(35% 0.06 40 / .3)' };
const LINES = [{ colour: 'oklch(60% 0.2 305)', faces: [23, 9, 14, 2, 22, 30, 7, 17, 26, 12, 5, 19], loop: [0.3, 0.52, 0.2, 0.3], speed: 70, wave: 0.6 }, { colour: 'oklch(70% 0.13 195)', faces: [4, 11, 28, 3, 15, 33, 8, 21, 10, 27, 6, 18], loop: [0.7, 0.6, 0.18, 0.26], speed: -60, wave: 1 }];
const SAY = {
  a: 'A · Felt ribbon. A flat strip of felt in the line\'s colour, lying on the mat with the felt\'s thickness under it and a light running stitch down its middle, like the roads and lawns. Reads as sewn onto the mat, not as a rope floating over it.',
  b: 'B · Pom-pom garland. No rope: little felt pom-poms in the line\'s colour, two between each pair of animals, on a thin thread. Soft and toy-like, and the most playful.',
  c: 'C · Sewn into the mat. The line is embroidered into the felt: a thick running stitch in the line\'s colour from animal to animal, as if the line were sewn on as it walks. The lightest of the four, and the most part of the mat.',
  d: 'D · Felt bunting. A thin thread with little felt pennants hanging off it, in the line\'s colour and a paler shade in turn, like a party garland. Fits "conga".',
  now: 'Today: twisted yarn, a thick round rope with darker and lighter strands.',
};
let look = 'a', ctx, W, H, k, clock = 0;
const seeded = seed => () => { seed = seed + 0x6d2b79f5 | 0; let v = Math.imul(seed ^ seed >>> 15, 1 | seed); v = v + Math.imul(v ^ v >>> 7, 61 | v) ^ v; return ((v ^ v >>> 14) >>> 0) / 4294967296; };
const fibreTile = (() => { const c = document.createElement('canvas'); c.width = c.height = 160; const pen = c.getContext('2d'), r = seeded(11); pen.lineWidth = 0.8;
  for (let i = 0; i < 900; i++) { const x = r() * 160, y = r() * 160, a = r() * Math.PI, l = 3 + r() * 7; pen.strokeStyle = r() < 0.5 ? 'rgba(255,255,255,.11)' : 'rgba(60,30,20,.08)'; pen.beginPath(); pen.moveTo(x, y); pen.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); pen.stroke(); }
  return c; })();
function tone(colour, { light = 0, chroma = 1, alpha = 1 } = {}) {
  const got = /oklch\(\s*([\d.]+)%?\s+([\d.]+)\s+([\d.]+)/.exec(colour);
  return `oklch(${Math.min(97, Math.max(15, Number(got[1]) + light))}% ${(Number(got[2]) * chroma).toFixed(3)} ${got[3]} / ${alpha})`;
}
function stitch(colour, width = 2.6, dash = [9, 7]) {
  ctx.save(); ctx.setLineDash(dash); ctx.lineCap = 'round'; ctx.lineWidth = width;
  ctx.strokeStyle = 'rgba(40,25,20,.28)'; ctx.translate(0, 1.2); ctx.stroke(); ctx.translate(0, -1.2);
  ctx.strokeStyle = colour; ctx.stroke(); ctx.restore();
}
function feltPiece(fill, drop = 3) { ctx.save(); ctx.translate(0, drop); ctx.fillStyle = FELT.under; ctx.fill(); ctx.restore(); ctx.fillStyle = fill; ctx.fill(); }
function sprite(face, x, y, size) { if (!sheet.complete || !sheet.naturalWidth) return; ctx.drawImage(sheet, (face - 1) % 7 * 96, Math.floor((face - 1) / 7) * 96, 96, 96, x - size / 2, y - size / 2, size, size); }
/** The smooth curve through the animals, a little below their middles, where a rope lies on the ground. */
function curve(points, low = 13) {
  ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y + low);
  for (let i = 1; i < points.length - 1; i++) ctx.quadraticCurveTo(points[i].x, points[i].y + low, (points[i].x + points[i + 1].x) / 2, (points[i].y + points[i + 1].y) / 2 + low);
  ctx.lineTo(points.at(-1).x, points.at(-1).y + low);
}
/** Points along the curve, `gap` apart, for things strung on it. */
function along(points, gap, low = 13) {
  const out = []; let carry = gap / 2;
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1], d = Math.hypot(b.x - a.x, b.y - a.y);
    for (let s = carry; s < d; s += gap) out.push({ x: a.x + (b.x - a.x) * s / d, y: a.y + (b.y - a.y) * s / d + low, a: Math.atan2(b.y - a.y, b.x - a.x) });
    carry = (carry - d) % gap; if (carry < 0) carry += gap;
  }
  return out;
}
const JOIN = {
  now(points, c) {
    curve(points); ctx.lineJoin = ctx.lineCap = 'round';
    ctx.save(); ctx.translate(0, 4); ctx.strokeStyle = 'oklch(35% 0.08 35 / .25)'; ctx.lineWidth = 15; ctx.stroke(); ctx.restore();
    ctx.strokeStyle = c; ctx.lineWidth = 13; ctx.stroke();
    ctx.lineCap = 'butt'; ctx.setLineDash([3, 5]); ctx.globalAlpha = 0.55; ctx.strokeStyle = tone(c, { light: -14 }); ctx.stroke();
    ctx.lineDashOffset = 4; ctx.globalAlpha = 0.5; ctx.strokeStyle = tone(c, { light: 20, chroma: 0.6 }); ctx.lineWidth = 7; ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset = 0; ctx.globalAlpha = 1;
  },
  a(points, c) {
    curve(points); ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
    ctx.save(); ctx.translate(0, 3); ctx.strokeStyle = FELT.under; ctx.lineWidth = 16; ctx.stroke(); ctx.restore();
    ctx.strokeStyle = c; ctx.lineWidth = 16; ctx.stroke();
    stitch(tone(c, { light: 28, chroma: 0.4 }), 2.2, [7, 6]);
  },
  b(points, c) {
    curve(points); ctx.lineCap = 'round'; ctx.strokeStyle = tone(c, { light: -18, chroma: 0.6 }); ctx.lineWidth = 2; ctx.stroke();
    for (const p of along(points, 16.5)) {
      ctx.beginPath(); ctx.ellipse(p.x, p.y + 4, 8, 3.5, 0, 0, 7); ctx.fillStyle = 'oklch(35% 0.06 40 / .22)'; ctx.fill();
      const g = ctx.createRadialGradient(p.x - 2.5, p.y - 3, 1, p.x, p.y, 9); g.addColorStop(0, tone(c, { light: 18, chroma: 0.7 })); g.addColorStop(1, tone(c, { light: -8 }));
      ctx.beginPath(); ctx.arc(p.x, p.y, 8.5, 0, 7); ctx.fillStyle = g; ctx.fill();
    }
  },
  c(points, c) {
    curve(points, 16); ctx.lineJoin = 'round';
    stitch(c, 6, [13, 8]);
    ctx.save(); ctx.setLineDash([13, 8]); ctx.lineCap = 'round'; ctx.lineWidth = 1.6; ctx.translate(0, -1.4); ctx.strokeStyle = tone(c, { light: 24, chroma: 0.5 }); ctx.stroke(); ctx.restore();
  },
  d(points, c) {
    curve(points, 4); ctx.lineCap = 'round'; ctx.strokeStyle = tone(c, { light: -22, chroma: 0.5 }); ctx.lineWidth = 2; ctx.stroke();
    along(points, 17, 4).forEach((p, n) => {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a + (Math.cos(p.a) < 0 ? Math.PI : 0));
      ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.lineTo(0, 15); ctx.closePath(); feltPiece(n % 2 ? tone(c, { light: 20, chroma: 0.6 }) : c, 2);
      ctx.restore();
    });
  },
};
function draw() {
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.fillStyle = FELT.mat; ctx.fillRect(0, 0, W, H);
  ctx.beginPath(); ctx.roundRect(W * 0.58, H * 0.05, W * 0.34, H * 0.22, 34); feltPiece(FELT.grass); ctx.beginPath(); ctx.roundRect(W * 0.58 + 12, H * 0.05 + 12, W * 0.34 - 24, H * 0.22 - 24, 24); stitch(FELT.grassThread);
  const p = ctx.createPattern(fibreTile, 'repeat'); p.setTransform(new DOMMatrix().scale(0.55)); ctx.fillStyle = p; ctx.fillRect(0, 0, W, H);
  const sprites = [];
  for (const line of LINES) {
    // Each line walks round a wavy loop, so it stays in view.
    const [cx, cy, rx, ry] = line.loop.map((v, n) => v * (n % 2 ? H : W)), r = (rx + ry) / 2, dir = Math.sign(line.speed);
    const at = a => ({ x: cx + Math.cos(a) * rx * (1 + 0.08 * Math.sin(a * 5 * line.wave)), y: cy + Math.sin(a) * ry });
    const step = i => 0.5 - 0.5 * Math.cos((clock * 7 - i * 0.7) * 2), head = clock * line.speed / r;
    const points = line.faces.map((face, i) => { const q = at(head - dir * 33 * i / r); return { x: q.x, y: q.y - step(i) * 2.5, face, size: i ? 42 : 58 }; });
    JOIN[look](points, line.colour);
    sprites.push(...points);
  }
  for (const s of sprites.sort((a, b) => a.y - b.y)) sprite(s.face, s.x, s.y, s.size);
}
const canvas = document.querySelector('canvas'), note = document.querySelector('.note');
function fit() { const box = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); canvas.width = box.width * dpr; canvas.height = box.height * dpr; ctx = canvas.getContext('2d'); W = box.width < 640 ? 600 : 920; k = box.width / W * dpr; H = box.height / box.width * W; }
fit(); addEventListener('resize', fit);
const pick = v => { look = v; note.textContent = SAY[v]; document.querySelectorAll('.bar button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v))); };
document.querySelectorAll('.bar button').forEach(b => b.onclick = () => pick(b.dataset.v)); pick('a');
let last = performance.now();
requestAnimationFrame(function frame(now) { clock += Math.min(0.05, (now - last) / 1000); last = now; draw(); requestAnimationFrame(frame); });
</script>
