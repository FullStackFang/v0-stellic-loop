<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conga · water, grass and trees</title>
<style>
@font-face { font-family: Archivo; src: url(/fonts/Archivo.ttf); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
:root { --field: oklch(82% 0.12 38); --ink: oklch(24% 0.035 30); --paper: oklch(99.2% 0.004 60); --action: oklch(48.5% 0.185 27); --town: #f0e8d4; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--town); color: var(--ink); font-family: Archivo, system-ui, sans-serif; padding: 28px clamp(16px, 3vw, 40px) 60px; }
h1 { font-weight: 900; font-stretch: 112%; font-size: clamp(28px, 4vw, 44px); letter-spacing: -.02em; line-height: 1; }
.lead { display: inline-block; margin: 14px 0 26px; padding: 10px 18px; border-radius: 16px 16px 16px 4px; background: var(--paper); box-shadow: inset 0 0 0 2px var(--ink); font-size: 16px; font-weight: 500; line-height: 1.4; max-width: 78ch; }
.looks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 44px 28px; }
@media (max-width: 900px) { .looks { grid-template-columns: minmax(0, 1fr); } }
.look { position: relative; display: grid; gap: 10px; padding: 34px 12px 12px; background: var(--paper); border-radius: 24px 24px 24px 6px; box-shadow: 6px 6px 0 var(--ink), inset 0 0 0 2px var(--ink); }
/* The name is a tab that overlaps the top of the panel it names. */
.look h2 { position: absolute; top: -18px; left: 18px; padding: 7px 18px; border-radius: 99px; background: var(--ink); color: var(--paper); font-weight: 900; font-stretch: 110%; font-size: 18px; }
.look.now h2 { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.look p { padding: 0 8px; font-size: 15px; font-weight: 500; line-height: 1.4; }
.views { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.views figure { position: relative; }
.views iframe { display: block; width: 100%; aspect-ratio: 1 / 1; border: 0; border-radius: 14px; box-shadow: inset 0 0 0 2px var(--ink); background: var(--field); pointer-events: none; }
.views figcaption { position: absolute; left: 8px; bottom: 8px; padding: 3px 10px; border-radius: 99px; background: var(--paper); box-shadow: inset 0 0 0 2px var(--ink); font-size: 12px; font-weight: 700; }
.try { justify-self: start; margin: 2px 8px 4px; padding: 10px 20px; border-radius: 99px; background: var(--action); color: var(--paper); font-weight: 800; font-size: 15px; text-decoration: none; box-shadow: 3px 3px 0 var(--ink); }
</style>
</head>
<body>
<h1>Water, grass and trees</h1>
<p class="lead">Three ways to draw them, beside how they look now. Each view is the real game, held still on one place: a lake and a quad in Ithaca, and the river round Roosevelt Island. "Play this one" opens the whole game in that look.</p>
<div class="looks" id="looks"></div>
<script>
const LOOKS = [
  ['a', 'A · Ink bands', 'Strong flat blue that pales in steps toward the shore, like depth lines on a chart. Lawns are mown in stripes. Round trees with a hard shadow.'],
  ['b', 'B · Linocut', 'Dark water with pale cut marks that drift, and a broken line of foam along the shore. Deep grass with tufts. Scalloped trees.'],
  ['c', 'C · Cut paper', 'Pale water that steps down from the shore. Lakes are sunk into the ground and lawns are raised off it, each with a hard shadow, like the buildings.'],
  ['', 'Now', 'Blue squiggles on paper for water, flat green with a white edge, bubble trees scattered across each lawn.'],
];
const VIEWS = [['Lake', 'map=cornell&at=Beebe%20Lake'], ['Quad', 'map=cornell&at=Arts%20Quad&dx=-60'], ['River', 'map=cornell-tech&at=Four%20Freedoms%20Park&dy=60']];
document.getElementById('looks').innerHTML = LOOKS.map(([id, name, says]) => `<section class="look ${id ? '' : 'now'}"><h2>${name}</h2>
  <div class="views">${VIEWS.map(([label, query]) => `<figure><iframe src="./mockups-conga.html?look=${id}&${query}" title="${name}, ${label}" loading="lazy"></iframe><figcaption>${label}</figcaption></figure>`).join('')}</div>
  <p>${says}</p>${id ? `<a class="try" href="./mockups-conga.html?look=${id}" target="_blank">Play this one</a>` : ''}</section>`).join('');
</script>
</body>
</html>
