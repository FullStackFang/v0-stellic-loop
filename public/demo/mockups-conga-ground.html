<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conga · the ground</title>
<style>
@font-face { font-family: Archivo; src: url(../fonts/Archivo.ttf); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
:root { --ink: oklch(21% 0.016 30); --paper: oklch(99.2% 0.004 60); }
* { box-sizing: border-box; margin: 0; }
body { background: oklch(96.8% 0.01 70); color: var(--ink); font-family: Archivo, system-ui, sans-serif; padding: 28px 16px 60px; }
main { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
h1 { font-weight: 900; font-stretch: 112%; font-size: clamp(30px, 6vw, 46px); letter-spacing: -.02em; line-height: 1; }
.lead { font-size: 17px; font-weight: 500; line-height: 1.4; max-width: 72ch; margin-top: 10px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; }
.bar button { font: 700 15px Archivo, system-ui, sans-serif; color: var(--ink); background: var(--paper); border: 0; box-shadow: inset 0 0 0 2px var(--ink); border-radius: 999px; padding: 8px 16px 9px; cursor: pointer; }
.bar button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.frame { position: relative; overflow: hidden; border-radius: 22px 22px 22px 6px; box-shadow: 5px 5px 0 oklch(68% 0.14 33); }
.frame canvas { display: block; width: 100%; aspect-ratio: 16 / 9; }
@media (max-width: 640px) { .frame canvas { aspect-ratio: 3 / 4; } }
.note { padding: 10px 16px; border-radius: 16px 16px 16px 4px; background: var(--paper); box-shadow: inset 0 0 0 2px var(--ink); font-size: 15px; font-weight: 500; line-height: 1.4; max-width: 85ch; }
</style>
<main>
  <header>
    <h1>Conga · the ground</h1>
    <p class="lead">The animals and buildings are soft toys, so the ground should be made of something a toy would stand on. Two materials, each carried through everything: grass, the sports field, the road, the seam between areas, the edge of the ground and the ropes. Two lines walk through.</p>
  </header>
  <div class="bar" id="picks"><button data-v="clay">E · Clay</button><button data-v="felt">F · Felt playmat</button><button data-v="now">Today</button></div>
  <div class="frame"><canvas id="c"></canvas></div>
  <p class="note" id="say"></p>
</main>
<script>
// Relative paths and no imports, so the page also works opened straight from the folder (file:///).
const AT = { tree: [0, 1128, 128, 128], cafe: [473, 0, 298, 320] };
const toys = Object.assign(new Image(), { src: '../conga/scenery.v3.webp' });
const sheet = Object.assign(new Image(), { src: '../conga/animals-96.v1.webp' });
const ok = img => img.complete && img.naturalWidth;
const C = { ink: 'oklch(24% 0.035 30)', paper: 'oklch(99.2% 0.004 60)', field: 'oklch(82% 0.12 38)', dot: 'oklch(77% 0.13 37)', action: 'oklch(48.5% 0.185 27)', town: '#f0e8d4', roof: '#f5eedc', twine: '#fbf7ec' };
const SAY = {
  clay: 'E · Clay, like the water you picked. The ground is one soft slab with a lit lip and a soft shadow under it. Grass is pressed into it, darker where it dips under the edge and lit along its far side, with a fine fingerprint grain. The road is a smooth sand-coloured groove that curves. Areas meet at a soft seam, the dots are little dimples, and a rope is a rolled clay cord with a highlight along it.',
  felt: 'F · Felt playmat. Everything is felt with a fibre grain, sewn together. Grass and the field are felt patches with a running stitch round them; the field\'s lines are white stitching. The road is warm grey felt with yellow stitches down the middle. Areas meet at a sewn seam, the edge of the mat is stitched, and a rope is twisted yarn.',
  now: 'Today: an inked edge with an ink shadow, linocut grass with tufts and a green outline, a plain cream road, a dashed line between areas, and ropes with an ink outline and twine dashes.',
};
let look = 'clay', W, H, ctx, k, base, baseFor = '';
function fit() { const c = document.getElementById('c'), box = c.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); c.width = box.width * dpr; c.height = box.height * dpr; ctx = c.getContext('2d'); W = box.width < 640 ? 800 : 1400; k = box.width / W * dpr; H = box.height / box.width * W; baseFor = ''; }
const P = (fx, fy) => [W * fx, H * fy];
// The same random numbers every time, so the grain does not crawl.
const seeded = seed => () => { seed = seed + 0x6d2b79f5 | 0; let v = Math.imul(seed ^ seed >>> 15, 1 | seed); v = v + Math.imul(v ^ v >>> 7, 61 | v) ^ v; return ((v ^ v >>> 14) >>> 0) / 4294967296; };

// ---------- the scene's shapes ----------
function scene() {
  const land = new Path2D(), edge = [P(0.06, 0.1), P(0.5, 0.06), P(0.95, 0.09), P(0.96, 0.9), P(0.55, 0.94), P(0.05, 0.91)];
  // Rounded corners, so the slab or mat is soft.
  const n = edge.length, mid = i => [(edge[i][0] + edge[(i + 1) % n][0]) / 2, (edge[i][1] + edge[(i + 1) % n][1]) / 2];
  land.moveTo(...mid(n - 1)); for (let i = 0; i < n; i++) land.arcTo(...edge[i], ...mid(i), 40); land.closePath();
  const lawn = rounded(W * 0.12, H * 0.17, W * 0.28, H * 0.3, [40, 40, 40, 12]);
  const field = { x: W * 0.64, y: H * 0.56, w: W * 0.26, h: H * 0.27, turn: -0.08 };
  const fieldPath = new Path2D(); { const m = new DOMMatrix().translate(field.x + field.w / 2, field.y + field.h / 2).rotate(field.turn * 180 / Math.PI); const r = rounded(-field.w / 2, -field.h / 2, field.w, field.h, [22, 22, 22, 8]); fieldPath.addPath(r, m); }
  const roadMid = curve(P(0.03, 0.78), P(0.45, 0.52), P(0.98, 0.68), 60);
  const seam = curve(P(0.55, 0.07), P(0.47, 0.5), P(0.53, 0.93), 40);
  return { land, lawn, field, fieldPath, roadMid, road: band(roadMid, 58), seam, cafe: { x: W * 0.78, y: H * 0.42 },
    trees: [[W * 0.165, H * 0.29], [W * 0.355, H * 0.26], [W * 0.29, H * 0.44]] };
}
function rounded(x, y, w, h, r) { const p = new Path2D(); p.roundRect(x, y, w, h, r); return p; }
function curve([ax, ay], [cx, cy], [bx, by], n) { return Array.from({ length: n + 1 }, (_, i) => { const t = i / n, u = 1 - t; return [u * u * ax + 2 * u * t * cx + t * t * bx, u * u * ay + 2 * u * t * cy + t * t * by]; }); }
function band(pts, w) { const side = s => pts.map((p, i) => { const a = pts[Math.min(i + 1, pts.length - 1)], b = pts[Math.max(i - 1, 0)], ang = Math.atan2(a[1] - b[1], a[0] - b[0]); return [p[0] - Math.sin(ang) * w / 2 * s, p[1] + Math.cos(ang) * w / 2 * s]; });
  const p = new Path2D(), l = side(1), r = side(-1).reverse(); p.moveTo(...l[0]); l.forEach(q => p.lineTo(...q)); r.forEach(q => p.lineTo(...q)); p.closePath(); return p; }
const along = (path, pts) => { path.moveTo(...pts[0]); pts.forEach(q => path.lineTo(...q)); return path; };

// ---------- light, in screen pixels (shadows ignore the canvas transform) ----------
/** A soft shadow cast inside a shape from its top edge: the shape is pressed into what is round it. */
function innerShadow(path, colour, blur, dy) {
  ctx.save(); ctx.clip(path);
  ctx.shadowColor = colour; ctx.shadowBlur = blur * k; ctx.shadowOffsetY = dy * k;
  const out = new Path2D(); out.rect(-W, -H, W * 3, H * 3); out.addPath(path); ctx.fillStyle = 'black'; ctx.fill(out, 'evenodd');
  ctx.restore();
}
/** A lit lip just inside a shape's lower edge. */
function litLip(path, colour, width, dy) { ctx.save(); ctx.clip(path); ctx.translate(0, -dy); ctx.strokeStyle = colour; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.stroke(path); ctx.restore(); }
function softDrop(path, colour, blur, dy) { ctx.save(); ctx.shadowColor = colour; ctx.shadowBlur = blur * k; ctx.shadowOffsetY = dy * k; ctx.fillStyle = colour; ctx.fill(path); ctx.restore(); }

// ---------- grain ----------
const grains = {};
function grain(kind) {
  if (grains[kind]) return grains[kind];
  const tile = document.createElement('canvas'); tile.width = tile.height = 160; const g = tile.getContext('2d'), r = seeded(kind === 'felt' ? 11 : 7);
  if (kind === 'felt') { for (let i = 0; i < 900; i++) { const x = r() * 160, y = r() * 160, a = r() * Math.PI, l = 3 + r() * 7; g.strokeStyle = r() < 0.5 ? 'rgba(255,255,255,.16)' : 'rgba(60,30,20,.12)'; g.lineWidth = 0.8; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); } }
  else { for (let i = 0; i < 120; i++) { const x = r() * 160, y = r() * 160; g.fillStyle = r() < 0.5 ? 'rgba(255,255,255,.07)' : 'rgba(40,30,20,.04)'; g.beginPath(); g.ellipse(x, y, 3 + r() * 6, 2 + r() * 3, r() * 3, 0, 7); g.fill(); } }
  return grains[kind] = ctx.createPattern(tile, 'repeat');
}
const fillGrain = (path, kind) => { ctx.save(); ctx.clip(path); ctx.fillStyle = grain(kind); ctx.fillRect(0, 0, W, H); ctx.restore(); };
function stitch(path, colour, width = 2.6, dash = [9, 7]) { ctx.save(); ctx.setLineDash(dash); ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(40,25,20,.28)'; ctx.lineWidth = width; ctx.translate(0, 1.2); ctx.stroke(path); ctx.translate(0, -1.2); ctx.strokeStyle = colour; ctx.stroke(path); ctx.restore(); }
/** The same outline, `by` inside. Only for the rounded rectangles here. */
const shrink = (x, y, w, h, r, by) => rounded(x + by, y + by, w - by * 2, h - by * 2, r.map(v => Math.max(2, v - by)));

// ---------- the ground, drawn once per look and size ----------
function paintBase(s) {
  ctx.setTransform(k, 0, 0, k, 0, 0);
  if (look === 'clay') {
    ctx.fillStyle = 'oklch(92% 0.025 75)'; ctx.fillRect(0, 0, W, H);
    softDrop(s.land, 'oklch(45% 0.1 35 / .45)', 30, 12);
    ctx.fillStyle = C.field; ctx.fill(s.land); fillGrain(s.land, 'clay');
    litLip(s.land, 'oklch(95% 0.05 55 / .35)', 10, 3);
    ctx.save(); ctx.clip(s.land);
    // Dimples: each dot is pressed in, dark above and lit below.
    for (let x = 45; x < W; x += 90) for (let y = 45; y < H; y += 90) { ctx.beginPath(); ctx.arc(x, y + 1.6, 5, 0, 7); ctx.fillStyle = 'oklch(92% 0.06 50 / .7)'; ctx.fill(); ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fillStyle = 'oklch(74% 0.13 36)'; ctx.fill(); }
    // The seam between areas: a soft groove.
    const seam = along(new Path2D(), s.seam);
    ctx.lineCap = 'round'; ctx.strokeStyle = 'oklch(93% 0.05 50 / .7)'; ctx.lineWidth = 5; ctx.translate(0, 3); ctx.stroke(seam); ctx.translate(0, -3);
    ctx.strokeStyle = 'oklch(72% 0.13 35)'; ctx.lineWidth = 6; ctx.stroke(seam);
    // The road: a smooth groove of sand-coloured clay.
    ctx.fillStyle = 'oklch(89% 0.04 65)'; ctx.fill(s.road); fillGrain(s.road, 'clay');
    innerShadow(s.road, 'oklch(45% 0.08 40 / .55)', 12, 6); litLip(s.road, 'oklch(98% 0.02 70 / .8)', 5, 2);
    // Grass, pressed in.
    for (const g of [s.lawn, s.fieldPath]) {
      ctx.fillStyle = 'oklch(73% 0.11 140)'; ctx.fill(g); fillGrain(g, 'clay');
      if (g === s.fieldPath) fieldLines(s, 'oklch(97% 0.02 120 / .9)', false);
      innerShadow(g, 'oklch(30% 0.07 150 / .6)', 16, 8); litLip(g, 'oklch(92% 0.08 130 / .75)', 5, 2);
    }
    ctx.restore();
  } else if (look === 'felt') {
    ctx.fillStyle = 'oklch(90% 0.02 70)'; ctx.fillRect(0, 0, W, H); fillGrain(new Path2D(`M0 0H${W}V${H}H0Z`), 'felt');
    softDrop(s.land, 'oklch(40% 0.06 40 / .35)', 10, 4);
    ctx.fillStyle = 'oklch(80% 0.11 38)'; ctx.fill(s.land); fillGrain(s.land, 'felt');
    ctx.save(); ctx.clip(s.land);
    // The road: warm grey felt sewn on, yellow stitches down the middle.
    softDrop(s.road, 'oklch(35% 0.05 40 / .3)', 5, 2);
    ctx.fillStyle = 'oklch(72% 0.025 55)'; ctx.fill(s.road); fillGrain(s.road, 'felt');
    stitch(along(new Path2D(), s.roadMid), 'oklch(90% 0.15 95)', 4, [16, 14]);
    // Patches of grass, each with a running stitch round it.
    softDrop(s.lawn, 'oklch(35% 0.06 40 / .3)', 5, 2); softDrop(s.fieldPath, 'oklch(35% 0.06 40 / .3)', 5, 2);
    for (const g of [s.lawn, s.fieldPath]) { ctx.fillStyle = 'oklch(70% 0.12 145)'; ctx.fill(g); fillGrain(g, 'felt'); }
    stitch(shrink(W * 0.12, H * 0.17, W * 0.28, H * 0.3, [40, 40, 40, 12], 9), 'oklch(90% 0.09 130)');
    fieldLines(s, 'oklch(98% 0.01 90)', true);
    ctx.save(); ctx.translate(s.field.x + s.field.w / 2, s.field.y + s.field.h / 2); ctx.rotate(s.field.turn); stitch(rounded(-s.field.w / 2 + 9, -s.field.h / 2 + 9, s.field.w - 18, s.field.h - 18, [14, 14, 14, 4]), 'oklch(90% 0.09 130)'); ctx.restore();
    // The seam between areas: two rows of stitching.
    const seam = along(new Path2D(), s.seam); ctx.strokeStyle = 'oklch(70% 0.12 36)'; ctx.lineWidth = 3; ctx.stroke(seam);
    ctx.save(); ctx.translate(-8, 0); stitch(seam, 'oklch(92% 0.05 50)', 2.4, [7, 7]); ctx.translate(16, 0); stitch(seam, 'oklch(92% 0.05 50)', 2.4, [7, 7]); ctx.restore();
    ctx.restore();
    // The mat's edge, stitched all round.
    ctx.save(); ctx.clip(s.land); ctx.lineWidth = 26; ctx.strokeStyle = 'oklch(76% 0.12 37)'; ctx.stroke(s.land); ctx.restore();
    ctx.save(); ctx.clip(s.land); ctx.translate(0, 0); const inner = new Path2D(); inner.addPath(s.land, new DOMMatrix().translate(W / 2, H / 2).scale(0.985, 0.975).translate(-W / 2, -H / 2)); stitch(inner, 'oklch(94% 0.04 60)', 2.6, [10, 8]); ctx.restore();
  } else {
    ctx.fillStyle = C.town; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(14, 14); ctx.fillStyle = C.ink; ctx.fill(s.land); ctx.restore(); ctx.fillStyle = C.field; ctx.fill(s.land); ctx.strokeStyle = C.ink; ctx.lineWidth = 10; ctx.lineJoin = 'round'; ctx.stroke(s.land);
    ctx.save(); ctx.clip(s.land);
    ctx.fillStyle = C.dot; ctx.beginPath(); for (let x = 45; x < W; x += 90) for (let y = 45; y < H; y += 90) { ctx.moveTo(x + 5, y); ctx.arc(x, y, 5, 0, 7); } ctx.fill();
    ctx.strokeStyle = C.dot; ctx.lineWidth = 5; ctx.setLineDash([4, 18]); ctx.lineCap = 'round'; ctx.stroke(along(new Path2D(), s.seam)); ctx.setLineDash([]);
    ctx.fillStyle = C.roof; ctx.fill(s.road);
    for (const g of [s.lawn, s.fieldPath]) {
      ctx.fillStyle = 'oklch(70% 0.15 147)'; ctx.fill(g); ctx.save(); ctx.clip(g); ctx.strokeStyle = 'oklch(80% 0.15 140)'; ctx.lineWidth = 2.5; ctx.lineCap = ctx.lineJoin = 'round'; ctx.beginPath();
      for (let x = 0; x < W; x += 64) for (let y = 0; y < H; y += 64) for (const [tx, ty] of [[12, 16], [44, 40], [20, 54]]) { ctx.moveTo(x + tx - 4, y + ty - 7); ctx.lineTo(x + tx, y + ty); ctx.lineTo(x + tx + 4, y + ty - 7); }
      ctx.stroke(); ctx.restore(); ctx.strokeStyle = 'oklch(58% 0.13 148)'; ctx.lineWidth = 6; ctx.stroke(g);
    }
    ctx.restore();
  }
}
function fieldLines(s, colour, sewn) {
  ctx.save(); ctx.translate(s.field.x + s.field.w / 2, s.field.y + s.field.h / 2); ctx.rotate(s.field.turn);
  const w = s.field.w - 56, h = s.field.h - 56, lines = new Path2D(); lines.rect(-w / 2, -h / 2, w, h); lines.moveTo(0, -h / 2); lines.lineTo(0, h / 2); lines.moveTo(h * 0.2, 0); lines.arc(0, 0, h * 0.2, 0, 7);
  if (sewn) stitch(lines, colour, 3, [8, 6]); else { ctx.strokeStyle = colour; ctx.lineWidth = 4; ctx.stroke(lines); }
  ctx.restore();
}

// ---------- ropes ----------
function ropePath(pts) { const p = new Path2D(), low = 13; p.moveTo(pts[0].x, pts[0].y + low); for (let i = 1; i < pts.length - 1; i++) p.quadraticCurveTo(pts[i].x, pts[i].y + low, (pts[i].x + pts[i + 1].x) / 2, (pts[i].y + pts[i + 1].y) / 2 + low); p.lineTo(pts.at(-1).x, pts.at(-1).y + low); return p; }
function rope(pts, L) {
  const p = ropePath(pts); ctx.lineJoin = ctx.lineCap = 'round';
  if (look === 'now') { ctx.strokeStyle = C.ink; ctx.lineWidth = 16; ctx.stroke(p); ctx.strokeStyle = L.colour; ctx.lineWidth = 10; ctx.stroke(p); ctx.lineCap = 'butt'; ctx.setLineDash([5, 9]); ctx.globalAlpha = 0.55; ctx.strokeStyle = C.twine; ctx.lineWidth = 3; ctx.stroke(p); ctx.setLineDash([]); ctx.globalAlpha = 1; return; }
  // A soft shadow on the ground under it.
  ctx.save(); ctx.translate(0, 5); ctx.strokeStyle = 'oklch(35% 0.08 35 / .28)'; ctx.lineWidth = 14; ctx.filter = 'blur(2px)'; ctx.stroke(p); ctx.restore();
  if (look === 'clay') {
    ctx.strokeStyle = L.deep; ctx.lineWidth = 14; ctx.stroke(p);
    ctx.save(); ctx.translate(0, -1.5); ctx.strokeStyle = L.colour; ctx.lineWidth = 11; ctx.stroke(p); ctx.restore();
    ctx.save(); ctx.translate(0, -4); ctx.strokeStyle = L.light; ctx.lineWidth = 3.5; ctx.stroke(p); ctx.restore();
  } else {
    // Yarn: the colour, then the twist as short slanted strands of a lighter and a darker shade.
    ctx.strokeStyle = L.colour; ctx.lineWidth = 13; ctx.stroke(p);
    ctx.lineCap = 'butt'; ctx.setLineDash([3, 5]); ctx.strokeStyle = L.deep; ctx.lineWidth = 13; ctx.globalAlpha = 0.55; ctx.stroke(p);
    ctx.lineDashOffset = 4; ctx.strokeStyle = L.light; ctx.lineWidth = 7; ctx.globalAlpha = 0.5; ctx.stroke(p); ctx.setLineDash([]); ctx.lineDashOffset = 0; ctx.globalAlpha = 1;
  }
}
function toyAt(name, x, y, width) { if (!ok(toys)) return; const [sx, sy, sw, sh] = AT[name], h = width * sh / sw; ctx.beginPath(); ctx.ellipse(x, y - 4, width * 0.42, width * 0.12, 0, 0, 7); ctx.fillStyle = 'oklch(24% 0.035 30 / .18)'; ctx.fill(); ctx.drawImage(toys, sx, sy, sw, sh, x - width / 2, y - h, width, h); }
function animal(f, x, y, size) { if (ok(sheet)) ctx.drawImage(sheet, (f - 1) % 7 * 96, Math.floor((f - 1) / 7) * 96, 96, 96, x - size / 2, y - size / 2, size, size); }
const lines = [
  { colour: 'oklch(52% 0.19 27)', deep: 'oklch(38% 0.14 25)', light: 'oklch(72% 0.13 30)', cx: 0.5, cy: 0.5, rx: 0.33, ry: 0.32, speed: 0.22, n: 14, gap: 0.13, face0: 1 },
  { colour: 'oklch(64% 0.19 350)', deep: 'oklch(47% 0.15 350)', light: 'oklch(82% 0.1 350)', cx: 0.3, cy: 0.7, rx: 0.14, ry: 0.15, speed: -0.4, n: 9, gap: 0.24, face0: 9 },
];
let S;
function draw(t) {
  const key = `${look} ${W} ${H} ${k}`;
  if (baseFor !== key) {
    S = scene(); base = document.createElement('canvas'); base.width = ctx.canvas.width; base.height = ctx.canvas.height;
    const was = ctx; ctx = base.getContext('2d'); paintBase(S); ctx = was; grains.clay = grains.felt = undefined; baseFor = key;
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(base, 0, 0);
  ctx.setTransform(k, 0, 0, k, 0, 0);
  const stand = [];
  for (const [x, y] of S.trees) stand.push({ y, draw: () => toyAt('tree', x, y, 84) });
  stand.push({ y: S.cafe.y, draw: () => toyAt('cafe', S.cafe.x, S.cafe.y, 150) });
  for (const L of lines) {
    const at = u => ({ x: W * (L.cx + Math.cos(u) * L.rx), y: H * (L.cy + Math.sin(u) * L.ry) });
    const pts = Array.from({ length: L.n + 1 }, (_, i) => at(t * L.speed - Math.sign(L.speed) * i * L.gap));
    rope(pts, L);
    pts.forEach((p, i) => stand.push({ y: p.y, draw: () => animal(1 + (L.face0 + i * 5) % 36, p.x, p.y, i ? 42 : 58) }));
  }
  stand.sort((a, b) => a.y - b.y).forEach(e => e.draw());
}
const pickBox = document.getElementById('picks');
const mark = v => { look = v; baseFor = ''; pickBox.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); document.getElementById('say').textContent = SAY[v]; };
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const once = () => { if (still) draw(3); };
pickBox.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { mark(b.dataset.v); once(); } });
mark('clay'); fit(); new ResizeObserver(() => { fit(); once(); }).observe(document.getElementById('c'));
toys.addEventListener('load', once); sheet.addEventListener('load', once); document.fonts.ready.then(once);
const frame = now => { draw(now / 1000); requestAnimationFrame(frame); };
if (still) once(); else requestAnimationFrame(frame);
</script>
