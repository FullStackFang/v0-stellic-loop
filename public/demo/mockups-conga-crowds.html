<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conga · crowds</title>
<style>
@font-face { font-family: Archivo; src: url(/fonts/Archivo.ttf); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
:root { --field: oklch(82% 0.12 38); --ink: oklch(24% 0.035 30); --paper: oklch(99.2% 0.004 60); }
* { box-sizing: border-box; margin: 0; }
body { background: #f0e8d4; color: var(--ink); font-family: Archivo, system-ui, sans-serif; padding: 28px 16px 60px; }
main { max-width: 1180px; margin: 0 auto; display: grid; gap: 30px; }
h1 { font-weight: 900; font-stretch: 112%; font-size: clamp(30px, 6vw, 46px); letter-spacing: -.02em; line-height: 1; }
.lead { font-size: 17px; font-weight: 500; line-height: 1.4; max-width: 68ch; margin-top: 10px; }
.one { position: relative; padding-top: 14px; }
.tab { position: absolute; z-index: 3; left: 18px; top: 0; font-size: 15px; font-weight: 700; padding: 5px 14px 6px; border-radius: 9px 9px 9px 3px; background: var(--ink); color: var(--paper); white-space: nowrap; }
.frame { position: relative; overflow: hidden; border-radius: 26px 26px 26px 6px; box-shadow: 6px 6px 0 var(--ink), inset 0 0 0 2px var(--ink); background: var(--field); }
.frame canvas { display: block; width: 100%; aspect-ratio: 16 / 9; }
@media (max-width: 640px) { .frame canvas { aspect-ratio: 4 / 5; } }
.frame::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 2px var(--ink); pointer-events: none; }
.picks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.picks button { font: 700 15px Archivo, system-ui, sans-serif; color: var(--ink); background: var(--paper); border: 0; box-shadow: inset 0 0 0 2px var(--ink); border-radius: 999px; padding: 8px 16px 9px; cursor: pointer; }
.picks button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.note { margin-top: 14px; padding: 10px 16px; border-radius: 16px 16px 16px 4px; background: var(--paper); box-shadow: inset 0 0 0 2px var(--ink); font-size: 15px; font-weight: 500; line-height: 1.4; max-width: 80ch; }
</style>

<main>
  <header>
    <h1>Conga · crowds</h1>
    <p class="lead">Three ways a big, dense pocket of animals turns up on the bigger grounds, and how you find it. Each plays live; tap through them.</p>
  </header>
  <section class="one"><span class="tab">Where the crowd comes from</span><div class="frame"><canvas id="scene"></canvas></div>
    <div class="picks"><button data-kind="spill">A · Spill</button><button data-kind="class">B · Class lets out</button><button data-kind="parade">C · Parade</button></div>
    <p class="note" id="note"></p></section>
</main>

<script>
const C = { field: 'oklch(82% 0.12 38)', dot: 'oklch(77% 0.13 37)', ink: 'oklch(24% 0.035 30)', paper: 'oklch(99.2% 0.004 60)', action: 'oklch(48.5% 0.185 27)', twine: '#fbf7ec', roof: '#f5eedc', trim: '#dccfae' };
const NOTES = {
  spill: 'When a line is scattered its animals no longer fly off across the map: they tumble a short way and sit in a tight heap where it fell, on a ring of the lost line\'s colour that fades as they wander. Everyone sees it: "Glee Club spilled 36", and a ping on the small map. The bigger the line, the bigger the prize, so taking down a long line is worth the risk.',
  class: 'Every minute or so one building on the ground lets a class out. A ring round its door fills for five seconds, with "Class out at Olin Library in 3", so lines race over; then a crowd pours out of the door in a fan. The ping on the small map shows the building from the countdown on.',
  parade: 'Now and then a parade crosses the ground: a tight column of strays walking together behind a banner, with a ping on the small map that moves with it. It does not wait, so the line that cuts across its path, rather than chasing its tail, takes the most.',
};
const COLS = 7, SHEET = 96;
const sheet = Object.assign(new Image(), { src: '/conga/animals-96.v1.webp' });
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('scene'), ctx = canvas.getContext('2d');
let kind = 'spill', box, dpr, k, W, H;

function sprite(face, x, y, size) { if (sheet.complete && sheet.naturalWidth) ctx.drawImage(sheet, (face - 1) % COLS * SHEET, Math.floor((face - 1) / COLS) * SHEET, SHEET, SHEET, x - size / 2, y - size / 2, size, size); }
function pill(text, x, y, fill, ink, size = 14) {
  ctx.font = `700 ${size}px Archivo, system-ui, sans-serif`;
  const width = ctx.measureText(text).width + size * 1.4, high = size * 1.7;
  ctx.beginPath(); ctx.roundRect(x - width / 2, y - high / 2, width, high, high / 2); ctx.fillStyle = fill; ctx.fill();
  ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y + 1);
  return width;
}
function rope(points, colour) {
  if (points.length < 2) return;
  const low = 13;
  ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y + low);
  for (let i = 1; i < points.length - 1; i++) ctx.quadraticCurveTo(points[i].x, points[i].y + low, (points[i].x + points[i + 1].x) / 2, (points[i].y + points[i + 1].y) / 2 + low);
  ctx.lineTo(points.at(-1).x, points.at(-1).y + low);
  ctx.lineJoin = ctx.lineCap = 'round';
  ctx.strokeStyle = C.ink; ctx.lineWidth = 16; ctx.stroke(); ctx.strokeStyle = colour; ctx.lineWidth = 10; ctx.stroke();
  ctx.lineCap = 'butt'; ctx.setLineDash([5, 9]); ctx.globalAlpha = 0.55; ctx.strokeStyle = C.twine; ctx.lineWidth = 3; ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
}
function seeded(seed) { return () => { seed = seed + 0x6d2b79f5 | 0; let v = Math.imul(seed ^ seed >>> 15, 1 | seed); v = v + Math.imul(v ^ v >>> 7, 61 | v) ^ v; return ((v ^ v >>> 14) >>> 0) / 4294967296; }; }

// ---------- a small world: lines that walk, strays that wander and are drawn in ----------
const GAP = 33, SPEED = 150, TURN = 2.6, JOIN = 38, PULL = 150, LOOP = 15;
let random, lines, strays, pocket, clock, hall, parade, puffs;
const face = () => 1 + Math.floor(random() * 36);
function line(name, colour, x, y, a, n, faceNo) {
  const l = { name, colour, x, y, a, want: a, face: faceNo, path: [{ x, y }], tail: [], dead: false };
  for (let i = 0; i < n; i++) l.tail.push({ face: face(), x: x - Math.cos(a) * GAP * (i + 1), y: y - Math.sin(a) * GAP * (i + 1) });
  for (let i = 1; i <= n * 7; i++) l.path.push({ x: x - Math.cos(a) * 5 * i, y: y - Math.sin(a) * 5 * i });
  return l;
}
function reset() {
  random = seeded(23); clock = 0; puffs = []; pocket = null; parade = null;
  W = box.width < 640 ? 900 : 1500; k = box.width / W; H = box.height / k;
  strays = Array.from({ length: Math.round(W * H / 60000) }, () => ({ x: 40 + random() * (W - 80), y: 40 + random() * (H - 80), face: face(), a: random() * 7, hop: random() * 7, vx: 0, vy: 0 }));
  hall = { x: W * 0.72, y: H * 0.24, w: Math.min(260, W * 0.22), h: 150, name: 'Olin Library' };
  if (kind === 'spill') {
    lines = [line('You', C.action, W * 0.2, H * 0.4, 0.15, 12, 12), line('Glee Club', 'oklch(74% 0.2 140)', W * 0.7, H * 0.72, -2.75, 36, 5), line('Risley', 'oklch(62% 0.2 262)', W * 0.88, H * 0.18, 2.8, 9, 22)];
    lines[1].want = lines[1].a;
  } else if (kind === 'class') {
    lines = [line('You', C.action, W * 0.25, H * 0.7, -0.4, 12, 12), line('Rowing', 'oklch(62% 0.24 320)', W * 0.9, H * 0.85, -2.2, 14, 30), line('Risley', 'oklch(62% 0.2 262)', W * 0.12, H * 0.2, 0.3, 9, 22)];
    strays = strays.filter(s => !(Math.abs(s.x - hall.x) < hall.w / 2 + 20 && Math.abs(s.y - hall.y) < hall.h / 2 + 20));
  } else {
    lines = [line('You', C.action, W * 0.45, H * 0.85, -1.4, 12, 12), line('Hotelies', 'oklch(76% 0.13 195)', W * 0.85, H * 0.15, 2.5, 14, 9)];
    parade = { t: 0, members: Array.from({ length: 30 }, (_, i) => ({ face: face(), lag: i, x: 0, y: 0, hop: random() * 7, free: false })) };
  }
}
// The parade's road: in from the left, a long curve across the middle, and out on the right.
const road = u => ({ x: -120 + (W + 240) * u, y: H * (0.42 + 0.16 * Math.sin(u * Math.PI * 1.6)) });

function walk(l, dt) {
  const turn = TURN * dt, d = Math.atan2(Math.sin(l.want - l.a), Math.cos(l.want - l.a));
  l.a += Math.max(-turn, Math.min(turn, d));
  l.x = Math.max(30, Math.min(W - 30, l.x + Math.cos(l.a) * SPEED * dt)); l.y = Math.max(30, Math.min(H - 30, l.y + Math.sin(l.a) * SPEED * dt));
  if (Math.hypot(l.x - l.path[0].x, l.y - l.path[0].y) >= 5) l.path.unshift({ x: l.x, y: l.y });
  let px = l.x, py = l.y, walked = 0, need = GAP, i = 0, n = 0;
  for (; n < l.path.length && i < l.tail.length; n++) {
    const q = l.path[n], length = Math.hypot(q.x - px, q.y - py);
    while (i < l.tail.length && walked + length >= need) { const u = length ? (need - walked) / length : 0, f = l.tail[i++], e = Math.min(1, dt * 14); f.x += (px + (q.x - px) * u - f.x) * e; f.y += (py + (q.y - py) * u - f.y) * e; need += GAP; }
    walked += length; px = q.x; py = q.y;
  }
  for (; i < l.tail.length; i++) { const f = l.tail[i]; f.x += (px - f.x) * 0.2; f.y += (py - f.y) * 0.2; }
  if (l.path.length > n + 2) l.path.length = n + 2;
}
function aim(l, x, y) { l.want = Math.atan2(y - l.y, x - l.x); }
function nearest(l) { let best = null, far = Infinity; for (const s of strays) { const d = Math.hypot(s.x - l.x, s.y - l.y); if (d < far) { far = d; best = s; } } return best; }

function tick(dt) {
  clock += dt;
  if (clock > LOOP) reset();
  const target = pocket && pocket.left > 0 ? pocket : null;
  // What happens in each.
  if (kind === 'spill') {
    const glee = lines[1];
    if (!glee.dead && clock > 2.2) {
      glee.dead = true;
      puffs.push({ x: glee.x, y: glee.y, t: clock, colour: glee.colour });
      // Its animals tumble a short way and settle in a heap round where the line was.
      const cx = glee.x, cy = glee.y;
      pocket = { x: cx, y: cy, r: 110, colour: glee.colour, left: 11, life: 11, said: `Glee Club spilled ${glee.tail.length + 1}` };
      for (const f of [{ x: glee.x, y: glee.y, face: glee.face }, ...glee.tail]) {
        const a = random() * 7, r = Math.sqrt(random()) * 95;
        strays.push({ x: f.x, y: f.y, face: f.face, a: random() * 7, hop: random() * 7, vx: 0, vy: 0, to: { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r * 0.7 } });
      }
      glee.tail = [];
    }
  } else if (kind === 'class') {
    if (clock > 1 && !pocket) pocket = { x: hall.x, y: hall.y + hall.h / 2 + 70, r: 120, colour: C.action, left: 12, life: 12, count: 5, said: '' };
    if (pocket) {
      const was = pocket.count; pocket.count = Math.max(0, 6 - clock);
      pocket.said = pocket.count > 0 ? `Class out at ${hall.name} in ${Math.ceil(pocket.count)}` : `Class out at ${hall.name}`;
      // Out they pour, a few at a time, fanning out from the door.
      if (pocket.count === 0 && was >= 0 && (pocket.out ?? 0) < 32 && (pocket.next = (pocket.next ?? 0) - dt) <= 0) {
        pocket.next = 0.05; pocket.out = (pocket.out ?? 0) + 1;
        const a = Math.PI / 2 + (random() - 0.5) * 1.6, r = 30 + random() * 120;
        strays.push({ x: hall.x + (random() - 0.5) * 30, y: hall.y + hall.h / 2, face: face(), a: random() * 7, hop: random() * 7, vx: 0, vy: 0, to: { x: hall.x + Math.cos(a) * r, y: hall.y + hall.h / 2 + 20 + Math.sin(a) * r * 0.8 } });
      }
    }
  } else {
    parade.t += dt;
    const head = Math.min(1.1, parade.t / 13);
    pocket = { ...road(Math.max(0, head - 0.06)), r: 140, colour: 'oklch(88% 0.17 98)', left: 1, life: 1, said: 'Parade' };
    for (const m of parade.members) {
      if (m.free) continue;
      const p = road(head - m.lag * 0.0075), side = ((m.lag % 3) - 1) * 26;
      const q = road(head - m.lag * 0.0075 + 0.001), n = Math.atan2(q.y - p.y, q.x - p.x) + Math.PI / 2;
      m.x = p.x + Math.cos(n) * side; m.y = p.y + Math.sin(n) * side; m.hop += dt * 8;
    }
  }
  if (pocket) pocket.left -= dt;

  // Lines: yours and the others go for the crowd once it is there, else for the nearest stray.
  for (const l of lines) {
    if (l.dead) continue;
    const go = kind === 'parade' ? road(Math.min(1.1, parade.t / 13) + 0.12) : target;
    if (kind === 'spill' && l === lines[1]) { walk(l, dt); continue; } // Glee Club walks straight on, into trouble
    if (go && (kind !== 'class' || pocket.count === 0 || l !== lines[2])) aim(l, go.x, go.y);
    else { const s = nearest(l); if (s) aim(l, s.x, s.y); }
    walk(l, dt);
    if (l.tail.length > 60) l.tail.length = 60;
  }
  // Parade members a head reaches leave the parade and are drawn in like any stray.
  if (parade) for (const m of parade.members) if (!m.free && lines.some(l => Math.hypot(l.x - m.x, l.y - m.y) < PULL)) { m.free = true; strays.push({ x: m.x, y: m.y, face: m.face, a: 0, hop: m.hop, vx: 0, vy: 0 }); }
  for (let i = strays.length - 1; i >= 0; i--) {
    const s = strays[i];
    let head = null, close = PULL;
    for (const l of lines) { if (l.dead) continue; const d = Math.hypot(l.x - s.x, l.y - s.y); if (d < close) { close = d; head = l; } }
    if (head && close < JOIN) { head.tail.unshift({ face: s.face, x: s.x, y: s.y }); strays.splice(i, 1); continue; }
    s.hop += dt * (head ? 11 : 3);
    if (s.to) { s.x += (s.to.x - s.x) * Math.min(1, dt * 4); s.y += (s.to.y - s.y) * Math.min(1, dt * 4); if (Math.hypot(s.to.x - s.x, s.to.y - s.y) < 2) delete s.to; }
    s.a += (random() - 0.5) * 2 * dt;
    let vx = Math.cos(s.a) * 8, vy = Math.sin(s.a) * 8;
    if (head) { const pull = (170 + 280 * (1 - close / PULL)) / close; vx += (head.x - s.x) * pull; vy += (head.y - s.y) * pull; }
    s.x = Math.max(20, Math.min(W - 20, s.x + vx * dt)); s.y = Math.max(20, Math.min(H - 20, s.y + vy * dt));
  }
}

// ---------- drawing ----------
function draw() {
  ctx.setTransform(dpr * k, 0, 0, dpr * k, 0, 0);
  ctx.fillStyle = C.field; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = C.dot; ctx.beginPath(); for (let x = 45; x < W; x += 90) for (let y = 45; y < H; y += 90) { ctx.moveTo(x + 5, y); ctx.arc(x, y, 5, 0, 7); } ctx.fill();

  // The building, in Class lets out: hard shadow, roof, its name, and the ring round its door counting down.
  if (kind === 'class') {
    const { x, y, w, h } = hall;
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.roundRect(x - w / 2 + 10, y - h / 2 + 10, w, h, 8); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, 8); ctx.fillStyle = C.roof; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.stroke();
    ctx.beginPath(); ctx.roundRect(x - w / 2 + 14, y - h / 2 + 14, w - 28, h - 28, 5); ctx.strokeStyle = C.trim; ctx.lineWidth = 4; ctx.stroke();
    // the door
    ctx.beginPath(); ctx.roundRect(x - 22, y + h / 2 - 8, 44, 16, 4); ctx.fillStyle = pocket && pocket.count === 0 ? C.paper : C.ink; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.stroke();
    pill(hall.name, x, y - h / 2 - 2, C.ink, C.paper, 14);
    if (pocket && pocket.count > 0) {
      const dx = x, dy = y + h / 2 + 4;
      ctx.beginPath(); ctx.arc(dx, dy, 46, 0, 7); ctx.fillStyle = 'oklch(48.5% 0.185 27 / .18)'; ctx.fill();
      ctx.beginPath(); ctx.arc(dx, dy, 46, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - pocket.count / 5)); ctx.strokeStyle = C.action; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.stroke(); ctx.lineCap = 'butt';
    }
  }
  // The crowd's ground: a ring of its colour that fades as the crowd thins out.
  if (pocket && kind !== 'parade' && (kind === 'spill' || pocket.count === 0) && pocket.left > 0) {
    const a = Math.min(1, pocket.left / pocket.life * 1.4);
    ctx.save(); ctx.globalAlpha = a;
    ctx.beginPath(); ctx.ellipse(pocket.x, pocket.y, pocket.r, pocket.r * 0.72, 0, 0, 7); ctx.fillStyle = pocket.colour.replace(')', ' / .2)'); ctx.fill();
    ctx.setLineDash([12, 10]); ctx.lineDashOffset = -clock * 12; ctx.strokeStyle = pocket.colour; ctx.lineWidth = 4; ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  }
  // The parade's road dust.
  if (kind === 'parade') for (const m of parade.members) if (!m.free) { ctx.beginPath(); ctx.ellipse(m.x - 10, m.y + 16, 16, 6, 0, 0, 7); ctx.fillStyle = 'oklch(96% 0.01 60 / .35)'; ctx.fill(); }

  for (const l of lines) if (!l.dead) rope([{ x: l.x, y: l.y }, ...l.tail], l.colour);
  const sprites = [];
  for (const l of lines) if (!l.dead) { l.tail.forEach(f => sprites.push({ ...f, size: 42 })); sprites.push({ x: l.x, y: l.y, face: l.face, size: 58, front: true }); }
  for (const s of strays) sprites.push({ x: s.x, y: s.y - (s.to ? 6 : (0.5 - 0.5 * Math.cos(s.hop)) * 3), face: s.face, size: 40 });
  if (parade) for (const m of parade.members) if (!m.free) sprites.push({ x: m.x, y: m.y - Math.abs(Math.sin(m.hop)) * 7, face: m.face, size: 40 });
  sprites.sort((a, b) => (a.front ? 1 : 0) - (b.front ? 1 : 0) || a.y - b.y);
  for (const s of sprites) sprite(s.face, s.x, s.y, s.size);
  // The parade's banner, carried at the front.
  if (kind === 'parade') { const front = parade.members.find(m => !m.free); if (front) pill('Parade', front.x, front.y - 42, 'oklch(88% 0.17 98)', C.ink, 15); }

  for (const p of puffs) { const age = (clock - p.t) / 0.7; if (age > 1) continue; ctx.strokeStyle = p.colour; ctx.globalAlpha = 1 - age; ctx.lineWidth = 10 * (1 - age) + 2; ctx.beginPath(); ctx.arc(p.x, p.y, 30 + age * 140, 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
  for (const l of lines) if (!l.dead) pill(`${l.name} · ${l.tail.length + 1}`, l.x, l.y - 46, l.name === 'You' ? C.action : C.ink, C.paper, 13);

  // On the screen, as the game would show it: the notice at the top, and the ping on the small map.
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const narrow = box.width < 640;
  if (pocket && pocket.said && (kind !== 'parade' || parade.t < 4)) pill(kind === 'parade' ? 'A parade is crossing the Arts Quad' : pocket.said, box.width / 2, 28, C.ink, C.paper, narrow ? 12 : 15);
  const mr = narrow ? 40 : 56, mx = 16 + mr, my = box.height - 16 - mr;
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, 7); ctx.fillStyle = C.paper; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.arc(mx, my, mr - 5, 0, 7); ctx.clip();
  const s = (mr - 5) * 2 / Math.max(W, H), ox = mx - W * s / 2, oy = my - H * s / 2;
  ctx.fillStyle = C.field; ctx.fillRect(ox, oy, W * s, H * s);
  for (const l of lines) if (!l.dead) { ctx.beginPath(); ctx.arc(ox + l.x * s, oy + l.y * s, l.name === 'You' ? 4.5 : 3, 0, 7); ctx.fillStyle = l.name === 'You' ? C.action : C.ink; ctx.fill(); }
  if (pocket && pocket.left > 0) {
    const px = ox + pocket.x * s, py = oy + pocket.y * s, beat = still ? 0.4 : (clock % 1.2) / 1.2;
    ctx.beginPath(); ctx.arc(px, py, 5 + beat * 14, 0, 7); ctx.strokeStyle = pocket.colour; ctx.globalAlpha = 1 - beat; ctx.lineWidth = 2.5; ctx.stroke(); ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(px, py, 5, 0, 7); ctx.fillStyle = pocket.colour; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.restore();
}

// ---------- the choices ----------
function mark() {
  document.querySelectorAll('[data-kind]').forEach(b => b.setAttribute('aria-pressed', b.dataset.kind === kind));
  document.getElementById('note').textContent = NOTES[kind];
}
document.addEventListener('click', e => { const b = e.target.closest('[data-kind]'); if (!b) return; kind = b.dataset.kind; mark(); reset(); if (still) settle(); });
mark();
const settle = () => { for (let n = 0; n < 60 * 5; n++) tick(1 / 60); draw(); };
function layout() { const got = canvas.getBoundingClientRect(); box = got; dpr = Math.min(2, devicePixelRatio || 1); canvas.width = Math.round(got.width * dpr); canvas.height = Math.round(got.height * dpr); reset(); if (still) settle(); }
new ResizeObserver(layout).observe(canvas);
if (!still) {
  let last = performance.now();
  const frame = now => { const dt = Math.min(0.05, (now - last) / 1000); last = now; if (box) { tick(dt); draw(); } requestAnimationFrame(frame); };
  requestAnimationFrame(frame);
}
</script>
