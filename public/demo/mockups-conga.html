<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Conga · playable mockup</title>
<link rel="modulepreload" href="./conga/sim.js"><link rel="modulepreload" href="./conga/maps.js">
<style>
@font-face { font-family: Archivo; src: url(/fonts/Archivo.ttf); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
:root { --field: oklch(82% 0.12 38); --dot: oklch(77% 0.13 37); --ink: oklch(24% 0.035 30); --action: oklch(48.5% 0.185 27); --action-hover: oklch(54% 0.19 27);
  --paper: oklch(99.2% 0.004 60); --mute: oklch(45% 0.016 40); --line: oklch(88% 0.012 50); --expo: cubic-bezier(.16, 1, .3, 1); }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow: hidden; background: #f0e8d4; color: var(--ink); font-family: Archivo, system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
/* One animal's face, cut from the sheet all of them are on: seven across, six down. */
.face { display: block; aspect-ratio: 1; background: var(--sheet) 0 0 / 700% 600% no-repeat; }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
.hud[hidden], .dash[hidden] { display: none; }

.hud { position: fixed; z-index: 2; pointer-events: none; background: var(--paper); box-shadow: 3px 3px 0 var(--ink), inset 0 0 0 2px var(--ink); }
.mine { top: max(14px, env(safe-area-inset-top)); left: 14px; display: flex; align-items: center; gap: 8px; padding: 5px 16px 5px 6px; border-radius: 99px; }
.mine .face { width: 40px; border-radius: 50%; background-color: var(--field); }
.mine b { font-weight: 900; font-size: 26px; font-stretch: 110%; line-height: 1; font-variant-numeric: tabular-nums; }
.mine span { font-size: 13px; font-weight: 600; color: var(--mute); }

.board { top: max(14px, env(safe-area-inset-top)); right: 14px; width: 190px; padding: 6px; border-radius: 16px 16px 16px 4px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.board div { display: flex; align-items: center; gap: 7px; padding: 2px 8px 2px 3px; border-radius: 99px; font-size: 13px; font-weight: 600; }
.board div.me { background: var(--ink); color: var(--paper); }
.board .face { width: 24px; flex: none; }
.board i { flex: 1; font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.board b { font-weight: 900; font-variant-numeric: tabular-nums; }

.map { left: 14px; bottom: max(14px, env(safe-area-inset-bottom)); width: 104px; height: 104px; border-radius: 50%; padding: 6px; }
.map canvas { width: 100%; height: 100%; display: block; }

.dash { position: fixed; z-index: 2; right: 18px; bottom: max(18px, env(safe-area-inset-bottom)); width: 92px; height: 92px; border-radius: 50%; background: var(--action); color: var(--paper);
  font-weight: 900; font-size: 18px; font-stretch: 110%; box-shadow: 4px 4px 0 var(--ink); touch-action: none; transition: transform .12s var(--expo), box-shadow .12s var(--expo); }
.dash:active, .dash.on { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); background: var(--action-hover); }

.say { position: fixed; z-index: 3; top: max(18px, env(safe-area-inset-top)); left: 50%; padding: 9px 20px; border-radius: 99px; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 15px; white-space: nowrap;
  transform: translate(-50%, -80px); opacity: 0; transition: transform .45s var(--expo), opacity .2s; pointer-events: none; }
.say.show { transform: translate(-50%, 0); opacity: 1; }

.card { position: fixed; z-index: 4; left: 50%; top: 50%; width: min(520px, calc(100vw - 32px)); padding: 26px 26px 24px; background: var(--paper); border-radius: 26px 26px 26px 6px; box-shadow: 7px 7px 0 var(--ink), inset 0 0 0 2px var(--ink);
  transform: translate(-50%, -50%); transition: transform .5s var(--expo), opacity .25s; display: grid; gap: 16px; }
.card[hidden] { display: grid; opacity: 0; transform: translate(-50%, -42%) scale(.96); pointer-events: none; }
.card h1 { font-weight: 900; font-stretch: 112%; font-size: clamp(30px, 8vw, 44px); line-height: .98; letter-spacing: -.02em; }
.card p { font-size: 16px; line-height: 1.4; font-weight: 500; }
.faces { display: flex; gap: 8px; align-items: center; }
.faces button { flex: 1; aspect-ratio: 1; min-width: 0; padding: 4px; border-radius: 50%; background: var(--field); box-shadow: inset 0 0 0 2px var(--ink); transition: transform .15s var(--expo); }
.faces button .face { width: 100%; }
.faces button[aria-pressed="true"] { background: var(--paper); box-shadow: inset 0 0 0 4px var(--action), 3px 3px 0 var(--ink); transform: translateY(-4px); }
.faces .more { aspect-ratio: auto; flex: none; padding: 10px 14px; border-radius: 99px; background: var(--paper); font-weight: 700; font-size: 14px; }
.go { justify-self: start; padding: 14px 34px; border-radius: 99px; background: var(--action); color: var(--paper); font-weight: 900; font-stretch: 110%; font-size: 19px; box-shadow: 4px 4px 0 var(--ink); transition: transform .12s var(--expo), box-shadow .12s var(--expo), background .12s; }
.go:hover { background: var(--action-hover); }
.go:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; }
.where { display: flex; gap: 4px; padding: 4px; border-radius: 99px; box-shadow: inset 0 0 0 2px var(--ink); }
.where button { padding: 9px 14px; border-radius: 99px; background: none; font-weight: 700; font-size: 14px; white-space: nowrap; }
.where button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.score { display: flex; gap: 10px; align-items: stretch; }
.score div { flex: 1; padding: 12px 16px; border-radius: 16px 16px 16px 4px; background: var(--field); display: grid; gap: 2px; }
.score div + div { background: var(--ink); color: var(--paper); }
.score b { font-weight: 900; font-stretch: 112%; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.score span { font-size: 13px; font-weight: 700; }
@media (max-width: 560px) { .board { width: 142px; padding: 4px; } .board div { font-size: 12px; gap: 5px; padding-right: 7px; } .board .face { width: 20px; } .board div:nth-child(n+4):not(.me) { display: none; }
  .mine span:not(.face) { display: none; } .say { top: calc(max(14px, env(safe-area-inset-top)) + 124px); font-size: 14px; } .map { width: 84px; height: 84px; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud mine" id="mine" hidden><span class="face" id="mineFace"></span><b id="mineCount">1</b><span>in your line</span></div>
<div class="hud board" id="board"></div>
<div class="hud map"><canvas id="map" width="184" height="184"></canvas></div>
<button class="dash" id="dash" hidden>Dash</button>
<div class="say" id="say"></div>

<section class="card" id="start">
  <h1>Longest line wins</h1>
  <p>Walk into a stray and it joins your line. Walk into another line and yours scatters for anyone to grab.</p>
  <div class="faces" id="faces"></div>
  <div class="row"><button class="go" id="go">Start</button><div class="where" id="where"></div></div>
</section>

<section class="card" id="over" hidden>
  <h1 id="overHead">Scattered</h1>
  <div class="score"><div><b id="overCount">1</b><span>in your line</span></div><div><b id="overBest">1</b><span>your best</span></div></div>
  <button class="go" id="again">Again</button>
</section>

<script type="module">
import { createWorld, addLine, place, steer, step, FACES, PLAZA } from './conga/sim.js';
import { MAPS } from './conga/maps.js';

const $ = id => document.getElementById(id);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
// Outside the ground is the print map's paper, and its blue where there is water (components/campus/near.tsx).
const C = { field: css('--field'), dot: css('--dot'), ink: css('--ink'), paper: css('--paper'), action: css('--action'), town: '#f0e8d4', twine: '#fbf7ec', water: '#3f86de', sea: '#c9dcf3', roof: '#f5eedc', trim: '#dccfae', green: 'oklch(87% 0.1 140)', tree: 'oklch(71% 0.14 148)', blossom: 'oklch(84% 0.1 0)', panel: '#c5d6ea', stone: '#d9d4c7', lamp: '#ffe27a', cab: '#fccc0a' };
// Every animal is on one sheet (scripts/conga-atlas.mjs), seven across, with its ground shadow already under it.
// A small screen takes the small sheet. The version is in the name so the file can be kept by the browser for good.
const COLS = 7, SHEET = Math.min(innerWidth, innerHeight * 1.25) / 760 * Math.min(2, devicePixelRatio || 1) > 1.4 ? 192 : 96;
const sheet = Object.assign(new Image(), { src: `./conga/animals-${SHEET}.v1.webp` });
document.documentElement.style.setProperty('--sheet', `url(${sheet.src})`);
const cut = face => `background-position: ${(face - 1) % COLS / (COLS - 1) * 100}% ${Math.floor((face - 1) / COLS) / (Math.ceil(FACES / COLS) - 1) * 100}%`;
const faceTag = face => `<span class="face" style="${cut(face)}"></span>`;
const keep = { get: key => { try { return localStorage.getItem(key); } catch { return null; } }, set: (key, value) => { try { localStorage.setItem(key, value); } catch {} } };

// The other lines. In live play these are people; here each one is a bot with its own nerve and temper.
const GROUPS = { cornell: ['Donlon 2F', 'CS 2110', 'Team 4', 'Risley', 'Big Red Band', 'Club Frisbee', 'Glee Club', 'West Campus', 'Olin late shift', 'Slope Day crew', 'Ag Quad lab'],
  'cornell-tech': ['Bloomberg 2F', 'Tata studio', 'The House 12', 'Studio team 4', 'Johnson MBA', 'Tram regulars', 'Jacobs', 'Health Tech', 'Connective Media', 'Urban Tech', 'Cafe line'] };
const tint = n => `oklch(64% 0.17 ${[125, 235, 80, 305, 165, 0, 200, 140, 55, 270, 330][n]})`;
const ME = 'me';
const colour = id => id === ME ? C.action : tint(id);

let world, map, land, blossoms = [], me = null, aim = 0;
let best = Number(keep.get('conga-best')) || 1, picked = Number(keep.get('conga-face')) || 1 + Math.floor(Math.random() * FACES), where = MAPS[keep.get('conga-map')] ? keep.get('conga-map') : 'cornell';
window.conga = { get world() { return world; } }; // for poking at the game from the console

/** Opens a ground: its own world, with the bots already walking it. In the app this is the campus you are on. */
function open(id) {
  where = id; map = MAPS[id]; me = null;
  world = createWorld(Math.random, map.rings, map.holes, map.shuttles ?? []);
  // Roosevelt Island's cherry trees: a row just in from the west shore.
  blossoms = [];
  if (map.axis != null) {
    const a = map.axis * Math.PI / 180, shore = map.rings[0], mid = [shore.reduce((sum, q) => sum + q[0], 0) / shore.length, shore.reduce((sum, q) => sum + q[1], 0) / shore.length];
    shore.forEach((from, i) => { const to = shore[(i + 1) % shore.length], far = Math.hypot(to[0] - from[0], to[1] - from[1]);
      for (let d = 40; d < far; d += 85) { const x = from[0] + (to[0] - from[0]) * d / far, y = from[1] + (to[1] - from[1]) * d / far; if ((x - mid[0]) * Math.cos(a) + (y - mid[1]) * Math.sin(a) < -60) blossoms.push([x + Math.cos(a) * 38, y + Math.sin(a) * 38]); } });
  }
  GROUPS[id].forEach((name, i) => addLine(world, { id: i, face: 1 + Math.floor(Math.random() * FACES), name, bot: { skill: 0.35 + Math.random() * 0.65, aggro: Math.random() }, start: 3 + Math.floor(Math.random() * 14) }));
  for (let i = 0; i < 240; i++) step(world, 1 / 30); // let the bots spread out before anyone looks
  land = new Path2D();
  for (const ring of map.rings) { ring.forEach(([x, y], i) => i ? land.lineTo(x, y) : land.moveTo(x, y)); land.closePath(); }
  const lead = world.lines.reduce((a, b) => a.tail.length >= b.tail.length ? a : b);
  cam.x = lead.x; cam.y = lead.y;
  for (const button of $('where').children) button.setAttribute('aria-pressed', button.dataset.map === id);
}

// ---------- the cards ----------
function offer() {
  const set = new Set([picked]);
  while (set.size < 6) set.add(1 + Math.floor(Math.random() * FACES));
  $('faces').replaceChildren(...[...set].map(face => {
    const button = document.createElement('button');
    button.setAttribute('aria-pressed', face === picked);
    button.setAttribute('aria-label', `Animal ${face}`);
    button.innerHTML = faceTag(face);
    button.onclick = () => { picked = face; for (const other of $('faces').children) other.setAttribute('aria-pressed', other === button); };
    return button;
  }), Object.assign(document.createElement('button'), { className: 'more', textContent: 'Others', onclick: () => offer() }));
}
offer();
$('where').replaceChildren(...Object.entries(MAPS).map(([id, each]) => {
  const button = Object.assign(document.createElement('button'), { textContent: each.name, onclick: () => { keep.set('conga-map', id); open(id); } });
  button.dataset.map = id;
  return button;
}));

function begin() {
  keep.set('conga-face', picked);
  if (me) place(world, me);
  else me = addLine(world, { id: ME, face: picked, name: 'You' });
  me.face = picked;
  aim = me.a;
  $('start').hidden = $('over').hidden = true;
  $('mine').hidden = false; $('dash').hidden = !touched;
  $('mineFace').style.cssText = cut(picked);
}
$('go').onclick = $('again').onclick = begin;

function finish(event) {
  best = Math.max(best, event.size);
  keep.set('conga-best', best);
  const by = world.lines.find(line => line.id === event.by);
  $('overHead').textContent = by ? `You walked into ${by.name}` : 'Scattered';
  $('overCount').textContent = event.size;
  $('overBest').textContent = best;
  $('mine').hidden = $('dash').hidden = true;
  setTimeout(() => { $('over').hidden = false; }, 900);
}

let quiet = 0;
function say(text) { $('say').textContent = text; $('say').classList.add('show'); clearTimeout(quiet); quiet = setTimeout(() => $('say').classList.remove('show'), 2400); }

// ---------- steering ----------
const canvas = $('game'), ctx = canvas.getContext('2d');
let dash = false, wide = 0, tall = 0, dpr = 1;
// On a touch screen the thumb steers like a stick: the line heads the way the thumb has moved from where it went down,
// so it can stay in a corner and never covers the animal. `stick` is that thumb. A mouse just points where to go.
let stick = null, touched = matchMedia('(pointer: coarse)').matches;
const REACH = 46;
const keys = new Set();
function point(event) { if (me && !me.dead) aim = Math.atan2(event.clientY - tall / 2, event.clientX - wide / 2); }
addEventListener('pointerdown', event => { if (event.pointerType !== 'mouse' && !touched) { touched = true; if (me && !me.dead) $('dash').hidden = false; } }, true);
canvas.addEventListener('pointerdown', event => {
  if (event.pointerType === 'mouse') { point(event); dash = true; }
  else if (!stick) stick = { id: event.pointerId, x0: event.clientX, y0: event.clientY, x: event.clientX, y: event.clientY };
});
addEventListener('pointermove', event => {
  if (event.pointerType === 'mouse') return void (event.target === canvas && point(event));
  if (!stick || event.pointerId !== stick.id) return;
  stick.x = event.clientX; stick.y = event.clientY;
  const dx = stick.x - stick.x0, dy = stick.y - stick.y0, far = Math.hypot(dx, dy);
  if (far > 8 && me && !me.dead) aim = Math.atan2(dy, dx);
  if (far > REACH) { stick.x0 += dx * (1 - REACH / far); stick.y0 += dy * (1 - REACH / far); } // the stick is dragged along behind a thumb that goes further
});
for (const type of ['pointerup', 'pointercancel']) addEventListener(type, event => { if (event.pointerType === 'mouse') dash = false; else if (stick && event.pointerId === stick.id) stick = null; });
// Leaving the window with a key or the button held would leave it held.
addEventListener('blur', () => { keys.clear(); dash = false; stick = null; $('dash').classList.remove('on'); });
for (const [type, on] of [['pointerdown', true], ['pointerup', false], ['pointercancel', false], ['pointerleave', false]]) $('dash').addEventListener(type, event => { event.preventDefault(); dash = on; $('dash').classList.toggle('on', on); });
addEventListener('keydown', event => { keys.add(event.code); if (event.code === 'Space') { event.preventDefault(); if (me && !me.dead) dash = true; else if (!event.repeat) begin(); } });
addEventListener('keyup', event => { keys.delete(event.code); if (event.code === 'Space') dash = false; });
addEventListener('contextmenu', event => event.preventDefault());

// How sharp the picture is drawn. A device that cannot keep up steps down: fewer pixels first, then plain water too.
// The number of pixels is most of the cost of a frame, far more than the rules.
const SHARP = [2, 1.5, 1];
let quality = 0;
function fit() {
  dpr = Math.min(SHARP[quality], devicePixelRatio || 1); wide = innerWidth; tall = innerHeight;
  canvas.width = wide * dpr; canvas.height = tall * dpr;
}
addEventListener('resize', fit); fit();

// ---------- drawing ----------
const cam = { x: 0, y: 0, z: 1 }, puffs = [];
const SIZE = { stray: 40, tail: 42, head: 58 };
// The print map's water: blue waves on its paper.
const waves = (() => {
  const tile = document.createElement('canvas'), pen = tile.getContext('2d');
  tile.width = tile.height = 48;
  pen.fillStyle = C.town; pen.fillRect(0, 0, 48, 48);
  pen.strokeStyle = C.water; pen.lineWidth = 4; pen.lineCap = 'round';
  for (const y of [12, 36]) { pen.beginPath(); pen.moveTo(-4, y); pen.bezierCurveTo(8, y - 9, 16, y - 9, 24, y); pen.bezierCurveTo(32, y + 9, 40, y + 9, 52, y); pen.stroke(); }
  return ctx.createPattern(tile, 'repeat');
})();

function sprite(face, x, y, size, tilt = 0, alpha = 1) {
  const sx = (face - 1) % COLS * SHEET, sy = Math.floor((face - 1) / COLS) * SHEET;
  if (alpha !== 1) ctx.globalAlpha = alpha;
  if (!sheet.complete || !sheet.naturalWidth) { ctx.fillStyle = C.paper; ctx.beginPath(); ctx.arc(x, y, size * 0.36, 0, 7); ctx.fill(); }
  else if (tilt) { ctx.save(); ctx.translate(x, y); ctx.rotate(tilt); ctx.drawImage(sheet, sx, sy, SHEET, SHEET, -size / 2, -size / 2, size, size); ctx.restore(); }
  else ctx.drawImage(sheet, sx, sy, SHEET, SHEET, x - size / 2, y - size / 2, size, size);
  if (alpha !== 1) ctx.globalAlpha = 1;
}

function pill(text, x, y, fill, ink, size = 13, dot = '') {
  size = Math.max(size, 11 / cam.z); // never under 11 px on the screen, however far out the view is
  ctx.font = `700 ${size}px Archivo, system-ui, sans-serif`;
  const lead = dot ? size : 0, width = ctx.measureText(text).width + size * 1.4 + lead, high = size * 1.7;
  ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x - width / 2, y - high / 2, width, high, high / 2); ctx.fill();
  if (dot) { ctx.fillStyle = dot; ctx.beginPath(); ctx.arc(x - width / 2 + size * 0.95, y, size * 0.36, 0, 7); ctx.fill(); }
  ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x + lead / 2, y + 1);
}

// The rope a line holds: baker's twine in the line's colour, drawn as one smooth curve through the animals.
function rope(points, stripe) {
  const low = 13;
  ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y + low);
  for (let i = 1; i < points.length - 1; i++) ctx.quadraticCurveTo(points[i].x, points[i].y + low, (points[i].x + points[i + 1].x) / 2, (points[i].y + points[i + 1].y) / 2 + low);
  ctx.lineTo(points.at(-1).x, points.at(-1).y + low);
  ctx.lineJoin = ctx.lineCap = 'round';
  ctx.strokeStyle = C.ink; ctx.lineWidth = 13; ctx.stroke();
  ctx.strokeStyle = C.twine; ctx.lineWidth = 8; ctx.stroke();
  ctx.lineCap = 'butt'; ctx.setLineDash([8, 8]); ctx.strokeStyle = stripe; ctx.stroke(); ctx.setLineDash([]);
}

// ---------- what makes a ground its own place ----------
const turned = (thing, work) => { ctx.save(); ctx.translate(thing.x, thing.y); ctx.rotate(thing.turn); work(thing.w, thing.h); ctx.restore(); };
const box = (w, h, r = 6, x = 0, y = 0) => { ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, r); };
const inked = (fill, width = 4) => { ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = width; ctx.stroke(); };
const ring = (x, y, r, sides = 0) => { ctx.beginPath(); if (!sides) ctx.arc(x, y, r, 0, 7); else { for (let n = 0; n < sides; n++) ctx.lineTo(x + Math.cos((n + 0.5) * Math.PI * 2 / sides) * r, y + Math.sin((n + 0.5) * Math.PI * 2 / sides) * r); ctx.closePath(); } };
// A building's hard shadow. A tall building throws a longer one.
function shadow(thing, long = 10) { ctx.fillStyle = C.ink; for (let d = long; d > 0; d -= 4) { ctx.save(); ctx.translate(d, d); shape(thing); ctx.fill(); ctx.restore(); } }
// For a building that is not one box: moves the pen, inside turned(), to where its shadow falls, down and to the right on the page.
const cast = (thing, d = 9) => ctx.translate(d * (Math.cos(thing.turn) + Math.sin(thing.turn)), d * (Math.cos(thing.turn) - Math.sin(thing.turn)));
function tree(x, y, r = 11, fill = C.tree) { ring(x, y, r); inked(fill, 2.5); ctx.fillStyle = 'rgba(255,255,255,.4)'; ring(x - r * 0.3, y - r * 0.3, r * 0.28); ctx.fill(); }
// The same scatter every frame: a number from 0 to 1 that depends only on the thing and which tree it is.
const chance = (thing, k) => { const v = Math.sin(thing.x * 12.9898 + thing.y * 4.1414 + k * 78.233) * 43758.5453; return v - Math.floor(v); };

/** How each well-known building is drawn, from above. Anything not here is a plain roof. */
const LOOK = {
  // Its whole roof is one canopy of solar panels.
  'Bloomberg Center': thing => { shadow(thing); turned(thing, (w, h) => {
    box(w, h); inked(C.roof); box(w - 14, h - 14, 3); inked(C.panel, 2.5);
    ctx.beginPath(); for (let y = -h / 2 + 19; y < h / 2 - 8; y += 12) { ctx.moveTo(-w / 2 + 7, y); ctx.lineTo(w / 2 - 7, y); } ctx.moveTo(0, -h / 2 + 7); ctx.lineTo(0, h / 2 - 7); ctx.lineWidth = 1.5; ctx.stroke(); }); },
  // Two wings of glass with a cut between them.
  'Tata': thing => { shadow(thing, 14); turned(thing, (w, h) => {
    box(w, h); inked(C.roof);
    ctx.beginPath(); ctx.moveTo(-w / 2 + 6, -h / 2 + 6); ctx.lineTo(w / 2 - 6, -h / 2 + 6); ctx.lineTo(w / 2 - 6, -h * 0.12); ctx.lineTo(-w / 2 + 6, h * 0.14); ctx.closePath(); inked(C.panel, 2.5);

  const ranked = world.lines.filter(line => !line.dead).sort((a, b) => b.tail.length - a.tail.length), top = ranked.slice(0, 5);
  if (me && !me.dead && !top.includes(me)) top[4] = me;
  $('board').innerHTML = top.map(line => `<div class="${line === me ? 'me' : ''}">${faceTag(line.face)}<i>${ranked.indexOf(line) + 1}. ${line.name}</i><b>${line.tail.length + 1}</b></div>`).join('');
  if (me && !me.dead) $('mineCount').textContent = me.tail.length + 1;
}

// ---------- the loop ----------
open(where);
let last = performance.now(), ticks = 0, pace = 16, settled = 0;
function frame(now) {
  const took = now - last, dt = Math.max(0, Math.min(0.05, took / 1000)), t = now / 1000; last = now;
  // `pace` is the usual time between frames. Two seconds of it staying over 24 ms, about 40 frames a second, is too slow.
  if (took < 250) pace += (took - pace) * 0.05;
  if (++settled > 120 && pace > 24 && quality < SHARP.length - 1) { quality++; settled = 0; pace = 16; fit(); }
  if (me && !me.dead) {
    if (keys.has('ArrowLeft') || keys.has('KeyA')) aim = me.a - 1.2;
    if (keys.has('ArrowRight') || keys.has('KeyD')) aim = me.a + 1.2;
    steer(me, aim, dash);
  }
  for (const event of step(world, dt)) {
    if (event.type === 'join' && event.line === ME) navigator.vibrate?.(8);
    if (event.type === 'scatter') {
      puffs.push({ x: event.x, y: event.y, t });
      if (event.line === ME) { navigator.vibrate?.(60); finish(event); }
      else if (event.by === ME) say(`${world.lines.find(line => line.id === event.line).name} scattered on your line`);
    }
    if (event.type === 'arrive') {
      puffs.push({ x: event.x, y: event.y, t });
      const mine = event.onto.find(each => each.line === ME), car = event.name.toLowerCase();
      if (mine) { navigator.vibrate?.(30); say(`${mine.count} got off the ${car} straight onto your line`); }
      else if (me && !me.dead) say(event.onto.length ? `${world.lines.find(line => line.id === event.onto[0].line).name} met the ${car} and took its riders` : `The ${car} let ${event.count} off at the station`);
    }
    if (event.type === 'lift') { puffs.push({ x: event.x, y: event.y, t }); if (event.line === ME) { navigator.vibrate?.(30); say(event.head ? `The ${event.name.toLowerCase()} hit you and took ${event.count}` : `The ${event.name.toLowerCase()} took ${event.count} off the back of your line`); } }
    if (event.type === 'dance' && event.line === ME) say(`${event.size} in line. Everybody dance`);
  }
  draw(t, dt);
  if (stick) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(stick.x0, stick.y0, REACH, 0, 7); ctx.fillStyle = C.paper; ctx.fill(); ctx.globalAlpha = 1; ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(stick.x, stick.y, 20, 0, 7); ctx.fillStyle = C.ink; ctx.fill();
  }
  if (ticks++ % 12 === 0) { board(); chart(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
