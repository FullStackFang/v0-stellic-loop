<!doctype html>
<html lang="en" data-kit="cornell">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The small loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
/* A small, simpler loader for buttons, rows and small parts of a page, where the Saving seats ticket (openspec/changes/loop-loading-seats) is too big.
   Row 0 is what the spec has today (three faces). A, B and C are simpler takes. Each is drawn in the same four places so they can be compared.
   Kit tokens of app/c/campus.css. The dark strip, the lettered bars and the frame tabs belong to the mockup. */
:root { --field: oklch(82% 0.12 38); --field-shadow: oklch(67% 0.13 36); --ink: oklch(24% 0.035 30); --action: oklch(48.5% 0.185 27);
  --paper: oklch(99.3% 0.004 117); --page: oklch(96.2% 0.004 230); --mute: oklch(46.5% 0.012 245); --on-ink: oklch(99.4% 0.003 230); --on-ink-mute: oklch(82% 0.02 245);
  --stub: color-mix(in oklab, var(--field) 34%, var(--paper)); --sunk: color-mix(in oklab, var(--ink) 10%, var(--paper));
  --r: 22px 22px 22px 6px; --expo: cubic-bezier(.16, 1, .3, 1); }
:root[data-kit=loop] { --field: oklch(96.4% 0.19 117); --field-shadow: oklch(80% 0.17 121); --ink: oklch(25% 0.07 252); --action: oklch(47.6% 0.13 250); }
:root[data-kit=columbia] { --field: oklch(87% 0.075 235); --field-shadow: oklch(71% 0.09 240); --ink: oklch(25% 0.06 255); --action: oklch(46% 0.14 255); }
:root[data-kit=cuny] { --field: oklch(88% 0.13 88); --field-shadow: oklch(74% 0.14 80); --ink: oklch(24% 0.08 265); --action: oklch(38% 0.18 264); }
:root[data-kit=nyu] { --field: oklch(85% 0.09 305); --field-shadow: oklch(69% 0.12 305); --ink: oklch(24% 0.08 305); --action: oklch(40% 0.2 305); }
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, p, ul, figure { margin: 0; padding: 0; }
button { font: inherit; color: inherit; letter-spacing: inherit; border: 0; background: none; padding: 0; cursor: pointer; } img { display: block; }
body { margin: 0; font-family: Archivo, system-ui, sans-serif; font-size: 15px; line-height: 1.4; letter-spacing: -0.012em; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; background: var(--page); color: var(--ink); }
:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }

.mock { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px 22px; flex-wrap: wrap; padding: 8px 32px; background: #1d1f24; color: #d6d8dd; font-size: 13.5px; }
.mock b { color: #fff; font-weight: 640; } .mock > span { margin-right: auto; } .mock div { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; } .mock small { margin-right: 6px; font-size: 13px; }
.mock button { height: 30px; padding: 0 14px; border-radius: 99px; font-weight: 580; box-shadow: inset 0 0 0 1.5px #5b5f69; } .mock button[aria-pressed=true] { background: #fff; color: #1d1f24; box-shadow: none; }

main { display: grid; gap: 58px; max-width: 1080px; margin: 0 auto; padding: 30px 32px 90px; }
.dir { display: grid; gap: 34px; }
.head { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; padding: 10px 12px 10px 10px; border-radius: var(--r); background: var(--ink); color: var(--on-ink); }
.head i { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px 12px 12px 3px; background: var(--field); color: var(--ink); font-style: normal; font-size: 22px; font-weight: 820; }
.head b { font-size: 21px; font-weight: 720; font-stretch: 112%; letter-spacing: -0.04em; } .head span { margin-right: auto; color: var(--on-ink-mute); font-size: 14.5px; }
.head button { height: 36px; padding: 0 16px; border-radius: 99px; background: var(--paper); color: var(--ink); font-weight: 600; font-size: 14px; }

.frames { display: flex; flex-wrap: wrap; gap: 40px 24px; justify-content: space-between; }
.bx { position: relative; flex: none; width: 220px; height: 214px; display: grid; align-content: center; justify-items: center; gap: 14px; padding: 30px 18px 22px; border-radius: var(--r); background: var(--paper); box-shadow: inset 0 0 0 2px var(--ink), 6px 6px 0 var(--field-shadow); }
.bx > figcaption { position: absolute; z-index: 5; top: -13px; left: 18px; padding: 3px 12px 4px; border-radius: 99px; background: var(--ink); color: var(--on-ink); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.bx.wide { width: 280px; }
.tk { display: grid; grid-template-columns: 1fr 62px; width: 100%; height: 66px; filter: drop-shadow(0 0 .7px var(--ink)) drop-shadow(0 0 .7px var(--ink)) drop-shadow(4px 4px 0 var(--ink)); } .tk > span { display: grid; align-content: center; background: var(--paper); }
.tk-main { gap: 4px; padding: 0 10px 0 14px; border-radius: 5px 0 0 5px; } .tk-main small { font-size: 12px; font-weight: 620; color: var(--mute); } .tk-main b { font-size: 15.5px; font-weight: 760; letter-spacing: -0.04em; line-height: 1; white-space: nowrap; }
.tk > .tk-stub { justify-items: center; border-left: 1.5px dashed var(--ink); border-radius: 0 5px 5px 0; background: var(--action); }
.btn { display: inline-flex; align-items: center; gap: 9px; height: 42px; padding: 0 20px 0 14px; border-radius: 99px; background: var(--action); color: var(--paper); font-weight: 680; font-size: 15px; box-shadow: 3px 3px 0 var(--ink); }
.rows { display: grid; gap: 8px; width: 100%; } .rows > span { display: flex; align-items: center; gap: 9px; height: 44px; padding: 0 8px 0 7px; border-radius: 99px; background: var(--page); box-shadow: inset 0 0 0 1.5px var(--ink); font-weight: 620; font-size: 14.5px; }
.rows img.who { width: 30px; height: 30px; border-radius: 50%; } .rows > span > i { margin-left: auto; font-style: normal; display: inline-flex; align-items: center; justify-content: center; min-width: 62px; height: 30px; padding: 0 12px; border-radius: 99px; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink); font-size: 13px; font-weight: 640; }
.rows > span > i.busy { background: var(--stub); }
.map { display: grid; place-items: center; align-content: center; gap: 12px; width: 100%; height: 150px; border-radius: 14px 14px 14px 4px; background: var(--sunk); box-shadow: inset 0 0 0 1.5px var(--ink); }
.say { padding: 4px 13px 5px; border-radius: 99px; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink); font-size: 13px; font-weight: 640; white-space: nowrap; }
.sizes { display: flex; align-items: flex-end; justify-content: center; gap: 16px; } .sizes > span { display: grid; justify-items: center; gap: 12px; } .sizes small { padding: 1px 9px 2px; border-radius: 99px; background: var(--ink); color: var(--on-ink); font-size: 11.5px; font-weight: 640; }

/* the loaders. --s is the height of the loader. */
.ld { --s: 24px; position: relative; flex: none; display: inline-flex; }
/* 0 · in the spec today: three faces fill in */
.l-three img { width: var(--s); height: var(--s); border-radius: 50%; background: var(--sunk); box-shadow: 0 0 0 1.5px var(--paper); animation: three 2.2s var(--expo) calc(var(--i) * .28s) infinite backwards; } .l-three img + img { margin-left: calc(var(--s) * -.28); }
@keyframes three { 0% { opacity: 0; transform: scale(.2); } 14%, 72% { opacity: 1; transform: none; } 84%, 100% { opacity: 0; transform: scale(.2); } }
/* A · one seat: a single seat, a new face every beat */
.seat { position: relative; display: block; width: var(--s); height: var(--s); border-radius: 50%; background: var(--sunk); box-shadow: inset 0 calc(var(--s) * .07) 0 color-mix(in oklab, var(--ink) 24%, transparent), 0 0 0 1.5px var(--paper); }
.seat img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; animation: one 3.2s var(--expo) calc(var(--i) * .8s) infinite; } .seat img:first-child { opacity: 1; }
@keyframes one { 0% { opacity: 0; transform: scale(.3); } 5%, 21% { opacity: 1; transform: none; } 26%, 100% { opacity: 0; transform: scale(.3); } }
/* B · mini ticket: the ticket at the size of a word. One seat, and the stub inks in on each face. */
.l-tk { display: inline-grid; grid-template-columns: auto calc(var(--s) * .52); height: var(--s); filter: drop-shadow(0 0 .6px var(--ink)) drop-shadow(0 0 .6px var(--ink)) drop-shadow(calc(var(--s) * .09) calc(var(--s) * .09) 0 var(--ink)); }
.l-tk > span { display: grid; place-items: center; padding: 0 calc(var(--s) * .14); background: var(--paper); border-radius: calc(var(--s) * .14) 0 0 calc(var(--s) * .14); } .l-tk .seat { --s2: calc(var(--s) * .72); width: var(--s2); height: var(--s2); box-shadow: none; }
.l-tk > i { position: relative; overflow: hidden; border-left: 1px dashed var(--ink); border-radius: 0 calc(var(--s) * .14) calc(var(--s) * .14) 0; background: var(--stub); }
.l-tk > i::before { content: ""; position: absolute; inset: 0; background: var(--action); animation: inked .8s var(--expo) infinite; }
@keyframes inked { 0%, 22% { clip-path: inset(100% 0 0); } 42%, 84% { clip-path: inset(0); } 100% { clip-path: inset(100% 0 0); } }
/* C · your blot: your own face, and the ink under it welling up */
.l-blot { width: var(--s); height: var(--s); } .l-blot img { position: relative; width: 100%; height: 100%; }
.l-blot svg { position: absolute; inset: -46%; width: 192%; height: 192%; overflow: visible; } .l-blot .school { fill: var(--field); } .l-blot .dark { fill: var(--action); } .l-blot .seep { fill: var(--action); opacity: .42; }
.l-blot .body { transform-origin: 0 0; animation: well 1.9s cubic-bezier(.6, 0, .2, 1) infinite; } .l-blot .drop { transform-box: fill-box; transform-origin: center; animation: spit 1.9s var(--expo) infinite; }
@keyframes well { 0%, 100% { transform: scale(.62) rotate(-14deg); } 38%, 70% { transform: none; } }
@keyframes spit { 0%, 26% { translate: var(--dx) var(--dy); scale: .2; opacity: 0; } 44%, 70% { translate: 0 0; scale: 1; opacity: 1; } 86%, 100% { translate: 0 0; scale: 1; opacity: 0; } }
/* on the action colour the dark ink would vanish, so the loader gets a paper plate there */
.tk-stub .l-blot, .btn .l-blot { border-radius: 50%; box-shadow: 0 0 0 calc(var(--s) * .34) var(--paper); margin: 0 calc(var(--s) * .3); }
@media (prefers-reduced-motion: reduce) { .ld *, .ld *::before { animation: none !important; } }
</style>
</head>
<body>
<div class="mock">
  <span><b>The small loader</b> · for buttons, rows and small parts of a page</span>
  <div id="kits"><small>School</small></div>
</div>
<main id="main"></main>
<script>
const TURN = Math.PI * 2, STEPS = 96;
const hash = text => [...text].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261);
function run(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const out = (angle, far) => [Math.cos(angle) * far, Math.sin(angle) * far], fix = n => Math.round(n * 10) / 10;
function pool(next, r) {
  const spin = next() * TURN, ran = next() * TURN, rounds = [[0, 0, r]];
  for (let i = 0; i < 6; i++) rounds.push([...out(spin + (i + (next() - .5) * .4) / 6 * TURN, r - 20 + next() * 4), 22 + next() * 4]);
  rounds.push([...out(ran, r + 1), 11], [...out(ran, r + 10), 6]);
  return { rounds, ran };
}
const sway = (waves, angle) => waves.reduce((sum, [times, size, shift]) => sum + Math.sin(angle * times + shift) * size, 0);
const drawn = (reach, k = 1, x = 0, y = 0) => 'M' + reach.map((far, at) => { const [px, py] = out(at / STEPS * TURN, far * k); return fix(px + x) + ' ' + fix(py + y); }).join('L') + 'Z';
function edge(rounds, next) {
  let reach = Array.from({ length: STEPS }, (_, at) => {
    const angle = at / STEPS * TURN; let far = 0;
    for (const [x, y, r] of rounds) { const from = Math.hypot(x, y), off = angle - Math.atan2(y, x), under = r * r - (from * Math.sin(off)) ** 2; if (under >= 0) far = Math.max(far, from * Math.cos(off) + Math.sqrt(under)); }
    return far;
  });
  for (let pass = 0; pass < 2; pass++) reach = reach.map((far, at) => (reach[(at + STEPS - 1) % STEPS] + far * 2 + reach[(at + 1) % STEPS]) / 4);
  const waves = [[2, 2], [3, 1.6], [5, 1.1], [13, .5], [29, .3]].map(([times, size]) => [times, size, next() * TURN]);
  return reach.map((far, at) => far + sway(waves, at / STEPS * TURN));
}
function crept(reach, next) { const waves = [[4, 1.3], [9, .9], [17, .5]].map(([times, size]) => [times, size, next() * TURN]); return reach.map((far, at) => far + 3.4 + sway(waves, at / STEPS * TURN)); }
const thrown = (next, toward, from, count, wide = 1.2) => Array.from({ length: count }, () => { const [x, y] = out(toward + (next() - .5) * wide, from + 2 + next() * 22); return [fix(x), fix(y), fix(2 + next() * next() * 2.8)]; });
function inkBlot(seed) {
  const next = run(hash(seed)), wide = pool(next, 55), middle = pool(next, 41);
  const blot = { schoolDrops: thrown(next, wide.ran + 2.5 + next() * 1.5, 68, 3), darkDrops: thrown(next, middle.ran + 2.2 + next() * 1.8, 58, 5), school: edge(wide.rounds, next) }; blot.dark = edge(middle.rounds, next); blot.seep = crept(blot.dark, next);
  // A splat throws more than a blot that has dried on a face: drops all the way round. (New for the ending; not in the app.)
  blot.flung = thrown(next, 0, 66, 9, TURN);
  return blot;
}

const face = n => `/animals/${String(n).padStart(2, '0')}.png`, MINE = 12, FACES = [5, 8, 17, MINE];
const imgs = list => list.map((n, i) => `<img style="--i:${i}" src="${face(n)}" alt="">`).join('');
const seat = () => `<span class="seat">${imgs(FACES)}</span>`;
function blot(seed) {
  const b = inkBlot(seed), drop = ([x, y, r]) => `<circle class="drop" style="--dx:${fix(-x * .7)}px;--dy:${fix(-y * .7)}px" cx="${x}" cy="${y}" r="${fix(r * 1.3)}"/>`;
  return `<svg viewBox="-80 -80 160 160" aria-hidden="true"><g class="body"><path class="school" d="${drawn(b.school)}"/><path class="seep" d="${drawn(b.seep)}"/><path class="dark" d="${drawn(b.dark)}"/></g><g class="school">${b.schoolDrops.map(drop).join('')}</g><g class="dark">${b.darkDrops.map(drop).join('')}</g></svg>`;
}
const LOADERS = {
  three: s => `<span class="ld l-three" style="--s:${s}px">${imgs([5, 8, MINE])}</span>`,
  a: s => `<span class="ld" style="--s:${s}px">${seat()}</span>`,
  b: s => `<span class="ld l-tk" style="--s:${s}px"><span>${seat()}</span><i></i></span>`,
  c: s => `<span class="ld l-blot" style="--s:${s}px">${blot('Maya')}<img src="${face(MINE)}" alt=""></span>`,
};
const frames = (L, part) => `
  <figure class="bx"><figcaption>In a button</figcaption><span class="tk"><span class="tk-main"><small>Thu 7:30 pm</small><b>Trivia night</b></span><span class="tk-stub">${L(22)}</span></span><span class="btn">${L(22)}Posting</span></figure>
  <figure class="bx"><figcaption>In a list</figcaption><span class="rows"><span><img class="who" src="${face(21)}" alt="">Sam<i>Invite</i></span><span><img class="who" src="${face(37)}" alt="">Josh<i class="busy">${L(22)}</i></span><span><img class="who" src="${face(9)}" alt="">Dana<i>Invite</i></span></span></figure>
  <figure class="bx"><figcaption>A small part of a page</figcaption><span class="map">${L(part)}<span class="say">Looping you in…</span></span></figure>
  <figure class="bx wide"><figcaption>Sizes</figcaption><span class="sizes">${[16, 24, 40].map(s => `<span>${L(s)}<small>${s}</small></span>`).join('')}</span></figure>`;
const DIRS = [['0', 'Three faces', 'In the spec today. Three faces fill in, then start again.', 'three', 34], ['A', 'One seat', 'One seat, a new face every beat. The smallest; it fits anywhere a dot would.', 'a', 44],
  ['B', 'Mini ticket', 'The ticket at the size of a word: one seat, and the stub inks in on each face.', 'b', 44], ['C', 'Your blot', 'Your own face, with your ink welling up under it. The plan shows: no blot on Free.', 'c', 44]];
document.getElementById('main').innerHTML = DIRS.map(([key, name, line, kind, part]) => `<section class="dir"><div class="head"><i>${key}</i><b>${name}</b><span>${line}</span></div><div class="frames">${frames(LOADERS[kind], part)}</div></section>`).join('');
const KITS = [['cornell', 'Cornell'], ['columbia', 'Columbia'], ['nyu', 'NYU'], ['cuny', 'CUNY'], ['loop', 'Loop']];
document.getElementById('kits').insertAdjacentHTML('beforeend', KITS.map(([slug, name]) => `<button aria-pressed="${slug === 'cornell'}" data-v="${slug}">${name}</button>`).join(''));
document.getElementById('kits').addEventListener('click', event => {
  const button = event.target.closest('button'); if (!button) return;
  for (const each of button.parentElement.querySelectorAll('button')) each.setAttribute('aria-pressed', each === button);
  document.documentElement.dataset.kit = button.dataset.v;
});
</script>
</body>
</html>
