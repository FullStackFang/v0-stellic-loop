<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loopd card in chat · directions</title>
<style>
@font-face{font-family:Archivo;src:url(../fonts/Archivo.ttf);font-weight:100 900;font-stretch:62% 125%;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:#e9e8e3;color:#1f1e1d;padding:20px 16px 48px}
body[data-theme=dark]{background:#141413;color:#eeece6}
.top{max-width:1500px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.top h1{font-size:18px;font-weight:600;margin:0}
.top p{margin:0;opacity:.7;flex:1 1 320px}
.seg{display:inline-flex;border-radius:999px;padding:3px;background:rgba(127,127,127,.18)}
.seg button{font:inherit;border:0;background:none;color:inherit;padding:5px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:#1f1e1d;color:#fff}
body[data-theme=dark] .seg button[aria-pressed=true]{background:#eeece6;color:#141413}
.grid{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;align-items:start}
.col h2{font-size:13px;font-weight:600;margin:0 0 2px}
.col .why{font-size:12.5px;opacity:.7;margin:0 0 10px;min-height:36px}

/* A neutral stand-in for the assistant's chat, light and dark. */
.chat{--chat-bg:#faf9f5;--chat-ink:#1f1e1d;--chat-soft:#6b6a65;--chat-line:#dedcd3;--chat-bubble:#efede5;
 background:var(--chat-bg);color:var(--chat-ink);border-radius:14px;padding:16px 14px 18px;border:1px solid var(--chat-line)}
body[data-theme=dark] .chat{--chat-bg:#262624;--chat-ink:#eeece6;--chat-soft:#a8a69f;--chat-line:#3d3c38;--chat-bubble:#3a3936}
.you{margin:0 0 14px auto;width:fit-content;max-width:85%;background:var(--chat-bubble);padding:8px 12px;border-radius:14px}
.says{margin:0 0 10px}
.tool{font-size:12px;color:var(--chat-soft);margin:0 0 8px}

/* ---------- Now: the card as it ships, drawn with the chat's own colours ---------- */
.now{font-size:14px;color:var(--chat-ink);border:1px solid var(--chat-line);border-radius:10px;padding:12px 14px}
.now .head{font-weight:600}
.now .item{padding:10px 0 0;margin:10px 0 0;border-top:1px solid var(--chat-line)}
.now .meta,.now .quiet{color:var(--chat-soft);font-size:12px}
.now .words{margin:2px 0}
.now .row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.now button{min-height:32px;padding:5px 11px;font:inherit;color:inherit;cursor:pointer;background:var(--chat-bubble);border:1px solid var(--chat-line);border-radius:8px}
.now button[aria-pressed=true]{background:var(--chat-ink);color:var(--chat-bg);border-color:transparent}
.now .note{margin-top:6px;font-weight:500}
.now .brand,.now .chip{display:none}

/* ---------- Loopd's own values (app/loop.css) ---------- */
.lpc{--navy:oklch(35.4% 0.095 252);--blue:oklch(47.6% 0.13 250);--lime:oklch(96.4% 0.19 117);--teal:oklch(37.3% 0.052 206);--aqua:oklch(90.4% 0.1 194);
 --surface:oklch(99.3% 0.003 230);--canvas:oklch(96.2% 0.004 230);--sunk:oklch(97.7% 0.006 240);--line:oklch(90.6% 0.008 240);--line-2:oklch(85.5% 0.011 240);--muted:oklch(46.5% 0.012 245);--pale-blue:oklch(95.3% 0.017 245);
 --on-dark:oklch(99.4% 0.003 230);--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
 font-family:Archivo,system-ui,sans-serif;font-size:14px;line-height:1.45;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lpc p{margin:0}
.lpc .brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:15px;letter-spacing:-.035em}
.lpc .brand svg{width:20px;height:20px;flex:none}
.lpc .chip{margin-left:auto;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--lime);color:var(--navy);letter-spacing:-.01em}
.lpc .head{display:none}
.lpc .meta{font:12px var(--mono);letter-spacing:0}
.lpc .words{font-size:15px;font-weight:480;letter-spacing:-.03em;margin:3px 0 2px}
.lpc .quiet{font-size:12.5px}
.lpc .row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.lpc button{height:32px;padding:0 13px;border:0;border-radius:56px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:background-color .15s,transform .1s}
.lpc button:active{transform:translateY(1px)}
.lpc .note{margin-top:6px;font-size:12.5px;font-weight:500}

/* A · Accent: sits on the chat's own background; Loopd shows in the mark, the type and the pills. */
.a{color:var(--chat-ink);padding:2px 2px 0}
.a .brand svg{color:var(--blue)}
.a .item{padding:12px 0 0;margin:12px 0 0;border-top:1px solid var(--chat-line)}
.a .meta,.a .quiet{color:var(--chat-soft)}
.a button{background:transparent;color:inherit;box-shadow:inset 0 0 0 1px var(--chat-soft)}
.a button:hover{background:var(--chat-bubble)}
.a button[aria-pressed=true],.a button.go{background:var(--blue);color:var(--on-dark);box-shadow:none}
body[data-theme=dark] .a .brand svg{color:var(--aqua)}
body[data-theme=dark] .a button[aria-pressed=true],body[data-theme=dark] .a button.go{background:var(--aqua);color:var(--navy)}

/* B · Panel: Loopd's panel with the tight corner and the teal plate on top. */
.b{background:var(--surface);color:var(--navy);border:1px solid var(--line);border-radius:24px 24px 24px 6px;overflow:hidden}
.b .brand{background:var(--teal);color:var(--on-dark);padding:12px 16px}
.b .brand svg{color:var(--aqua)}
.b .item{padding:13px 16px 14px;border-top:1px solid var(--line)}
.b .item:first-of-type{border-top:0}
.b .meta{color:var(--muted)}.b .quiet{color:var(--muted)}
.b button{background:var(--surface);color:var(--navy);box-shadow:inset 0 0 0 1px var(--line-2)}
.b button:hover{background:var(--pale-blue)}
.b button[aria-pressed=true],.b button.go{background:var(--blue);color:var(--on-dark);box-shadow:none}
.b .note{color:var(--teal)}
body[data-theme=dark] .b{--surface:oklch(24% 0.045 252);--line:oklch(99% 0.003 230 / .13);--line-2:oklch(99% 0.003 230 / .3);--muted:oklch(99% 0.003 230 / .66);--pale-blue:oklch(99% 0.003 230 / .09);color:var(--on-dark)}
body[data-theme=dark] .b button{color:var(--on-dark)}
body[data-theme=dark] .b button[aria-pressed=true],body[data-theme=dark] .b button.go{background:var(--aqua);color:var(--navy)}
body[data-theme=dark] .b .note{color:var(--aqua)}

/* C · Plate: the whole card is the teal plate; aqua type, lime for what is chosen. */
.c{background:var(--teal);color:oklch(99.4% 0.003 230 / .82);border-radius:24px 24px 24px 6px;padding:14px 16px 16px}
.c .brand{color:var(--on-dark)}.c .brand svg{color:var(--aqua)}
.c .item{padding:12px 0 0;margin:12px 0 0;border-top:1px solid oklch(99.4% 0.003 230 / .16)}
.c .meta{color:var(--aqua)}.c .words{color:var(--on-dark)}
.c .quiet{color:oklch(99.4% 0.003 230 / .7)}
.c button{background:oklch(99.4% 0.003 230 / .1);color:var(--on-dark);box-shadow:inset 0 0 0 1px oklch(99.4% 0.003 230 / .28)}
.c button:hover{background:oklch(99.4% 0.003 230 / .18)}
.c button[aria-pressed=true],.c button.go{background:var(--lime);color:var(--navy);box-shadow:none}
.c .note{color:var(--lime)}
</style>
</head>
<body data-theme="light">
<div class="top">
  <h1>Loopd card in chat</h1>
  <p>The same result, four ways. Every button works: tap an option, tap "I'm in". Switch the chat between light and dark.</p>
  <div class="seg" role="group" aria-label="Chat theme"><button aria-pressed="true" data-t="light">Light chat</button><button aria-pressed="false" data-t="dark">Dark chat</button></div>
</div>
<div class="grid" id="grid"></div>
<script>
(function(){
var cols=[
 {k:'now',cls:'now',title:'Now · what shipped',why:'Takes every colour and the font from the chat. Nothing says Loopd.'},
 {k:'a',cls:'lpc a',title:'A · Accent',why:'Still sits on the chat background. Loopd shows in the mark, Archivo, mono tags and pill buttons.'},
 {k:'b',cls:'lpc b',title:'B · Panel',why:'Loopd’s own panel: tight corner, teal plate on top, blue for what you chose. Has its own dark version.'},
 {k:'c',cls:'lpc c',title:'C · Plate',why:'The whole card is the teal plate, the same in light and dark. Lime marks what you chose.'}
];
var n=0;
function rings(){
 var id='r'+(n++),c=[[50,35],[35.5,60],[64.5,60]],r=21;
 function p(i){return 'M'+(c[i][0]-r)+' '+c[i][1]+'a'+r+' '+r+' 0 1 0 '+2*r+' 0a'+r+' '+r+' 0 1 0 '+(-2*r)+' 0';}
 var s='<svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><defs>';
 for(var i=0;i<3;i++)s+='<mask id="'+id+i+'" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="white"/><path d="'+p((i+2)%3)+'" stroke="black" stroke-width="15.3"/></mask>';
 s+='</defs>';
 for(var j=0;j<3;j++)s+='<g mask="url(#'+id+j+')"><path d="'+p(j)+'" stroke="'+(j===0?'oklch(96.4% 0.19 117)':'currentColor')+'" stroke-width="9"/></g>';
 return s+'</svg>';
}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function card(col){
 var st={pick:null,in:false,counts:[4,3,2]};
 var root=el('div',col.cls);
 function draw(){
  root.textContent='';
  var brand=el('div','brand');brand.innerHTML=rings()+'<span>Loopd</span><span class="chip">3 waiting</span>';root.appendChild(brand);
  root.appendChild(el('p','head','3 things from your groups.'));
  // ask
  var a=el('section','item');
  a.appendChild(el('p','meta','Ask #4 in @nbae-6561, closes Thu Nov 19, 6:00 PM. '+(9+(st.pick!==null?1:0))+' of 14 answered.'));
  a.appendChild(el('p','words','Which night works for the valuation case prep?'));
  var row=el('div','row');
  ['Tue Nov 17','Wed Nov 18','Thu Nov 19'].forEach(function(label,i){
   var b=el('button','',label+' ('+(st.counts[i]+(st.pick===i?1:0))+')');b.type='button';b.setAttribute('aria-pressed',st.pick===i?'true':'false');
   b.onclick=function(){st.pick=st.pick===i?null:i;draw();};row.appendChild(b);
  });
  a.appendChild(row);
  if(st.pick!==null)a.appendChild(el('p','note','Saved.'));
  root.appendChild(a);
  // event
  var e=el('section','item');
  e.appendChild(el('p','meta','Event @nbae-6561/case-prep: Wed Nov 18, 7:00 PM to 9:00 PM.'));
  e.appendChild(el('p','words','Valuation case prep'));
  e.appendChild(el('p','quiet','Place: Sage Hall B09'));
  e.appendChild(el('p','quiet',(6+(st.in?1:0))+' interested'+(st.in?', including you':'')+'.'));
  var r2=el('div','row');
  if(st.in){var t=el('button','','Take it back');t.type='button';t.onclick=function(){st.in=false;draw();};r2.appendChild(t);}
  else{var y=el('button','go',"I'm in");y.type='button';y.onclick=function(){st.in=true;draw();};r2.appendChild(y);var no=el('button','','Not for me');no.type='button';r2.appendChild(no);}
  e.appendChild(r2);
  if(st.in)e.appendChild(el('p','note','Saved.'));
  root.appendChild(e);
  // announcement
  var x=el('section','item');
  x.appendChild(el('p','meta','Announcement in @nbae-6561.'));
  x.appendChild(el('p','words','Deck template is in the shared folder. Use v3, not the one from the syllabus.'));
  root.appendChild(x);
 }
 draw();return root;
}
var grid=document.getElementById('grid');
cols.forEach(function(col){
 var c=el('div','col');c.appendChild(el('h2','',col.title));c.appendChild(el('p','why',col.why));
 var chat=el('div','chat');
 chat.appendChild(el('p','you','Can you help me outline the DCF section?'));
 chat.appendChild(el('p','tool','Loopd · waiting'));
 chat.appendChild(card(col));
 var says=el('p','says','Three things are waiting in your investment banking group: an ask about case prep night, the prep session itself, and a note on the deck template. Now, the DCF outline:');says.style.marginTop='12px';chat.appendChild(says);
 c.appendChild(chat);grid.appendChild(c);
});
document.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){
 document.body.dataset.theme=b.dataset.t;
 document.querySelectorAll('.seg button').forEach(function(o){o.setAttribute('aria-pressed',o===b?'true':'false');});
};});
})();
</script>
</body>
</html>
