<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Team links · three directions</title>
<style>
@font-face{font-family:Archivo;src:url(/fonts/Archivo.ttf);font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{
  --canvas:oklch(96.2% 0.004 230);--surface:oklch(99.3% 0.003 230);--sunk:oklch(97.7% 0.006 240);
  --line:oklch(90.6% 0.008 240);--line-2:oklch(85.5% 0.011 240);
  --navy:oklch(35.4% 0.095 252);--ink-2:oklch(35.4% 0.095 252 / .85);--muted:oklch(46.5% 0.012 245);
  --blue:oklch(47.6% 0.13 250);--lime:oklch(96.4% 0.19 117);--teal:oklch(37.3% 0.052 206);--aqua:oklch(90.4% 0.1 194);
  --plum:oklch(42.6% 0.13 322);--pale-blue:oklch(95.3% 0.017 245);--pale-plum:oklch(94.4% 0.011 320);
  --on-dark:oklch(99.4% 0.003 230);--on-dark-78:oklch(99.4% 0.003 230 / .78);--on-dark-50:oklch(99.4% 0.003 230 / .5);
  --r-lg:24px 24px 24px 6px;--r-md:16px 16px 16px 4px;--r-sm:10px 10px 10px 3px;--pill:56px;--ease:cubic-bezier(.22,1,.36,1);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--navy);font:14px/1.45 Archivo,system-ui,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
h1,h2,h3,p,ul{margin:0;padding:0}ul{list-style:none}
h1,h2,h3{font-weight:500;letter-spacing:-.035em}
a{color:inherit;text-decoration:none}
button,input{font:inherit;letter-spacing:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono);letter-spacing:0;font-size:12.5px}
.muted{color:var(--muted)}

/* chrome around the mockup: not part of the design */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 20px;background:oklch(24% 0.06 252);color:var(--on-dark-78)}
.bar b{color:var(--on-dark);font-weight:520}
.pick{display:flex;gap:4px;flex-wrap:wrap}
.pick:first-of-type{margin-left:auto}
.pick button{height:32px;padding:0 14px;border:0;border-radius:var(--pill);background:oklch(99.4% 0.003 230 / .1);color:var(--on-dark-78)}
.pick button[aria-pressed=true]{background:var(--aqua);color:var(--navy);font-weight:550}
.pick button:disabled{opacity:.4;cursor:default}
.why{padding:12px 20px;color:var(--muted);font-size:13.5px;background:var(--surface);border-bottom:1px solid var(--line);max-width:none}
.why b{color:var(--navy);font-weight:550}

/* the app shell */
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:calc(100vh - 100px)}
.rail{background:var(--navy);color:var(--on-dark-78);padding:16px 10px}
.rail .word{display:flex;align-items:center;gap:8px;color:var(--on-dark);font-size:17px;font-weight:560;padding:0 8px 14px}
.rail .word svg{width:22px;height:22px;color:var(--aqua)}
.rail p{font-size:12.5px;color:var(--on-dark-50);padding:10px 8px 6px}
.rail a{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:10px;white-space:nowrap}
.rail a svg{width:16px;height:16px;flex:none}
.rail a:hover{background:oklch(99.4% 0.003 230 / .07)}
.rail a[aria-current]{background:oklch(99.4% 0.003 230 / .12);color:var(--on-dark)}
.main{padding:0 32px 60px;max-width:1180px;width:100%;container-type:inline-size}
body.phone .shell{grid-template-columns:minmax(0,1fr)}body.phone .rail{display:none}
body.phone .main{max-width:390px;padding:0 16px 40px;margin:0 auto;box-shadow:0 0 0 1px var(--line-2)}
.crumbs{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:52px;flex-wrap:wrap}
.crumbs b{color:var(--navy);font-weight:500}.crumbs .today{margin-left:auto}

/* the team page as it is today */
.plate{background:var(--teal);color:var(--on-dark-78);border-radius:var(--r-lg);min-height:132px;padding:18px 22px 18px 20px;display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:24px;align-items:center}
.plate > svg{width:88px;height:88px;color:var(--aqua)}
.plate h1{font-size:28px;line-height:1.1;margin:4px 0 6px;color:var(--aqua)}
.plate h1 + p{font-size:15px;max-width:560px}
.dateblock{display:flex;align-items:center;gap:14px;padding:10px 16px 10px 14px;border-radius:var(--r-md);box-shadow:inset 0 0 0 1px oklch(90.4% 0.1 194 / .3)}
.dateblock time{display:flex;flex-direction:column;align-items:center;line-height:1;font-size:12px}
.dateblock time b{font-size:38px;font-weight:450;letter-spacing:-.04em;color:var(--aqua);margin:2px 0}
.dateblock div span{display:block;font-size:12.5px}.dateblock div b{font-size:14px;font-weight:500;color:var(--on-dark)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.facts > a{border-left:1px solid var(--line);padding:12px 18px;min-width:0}
.facts > a:first-child{border-left:0}.facts > a:hover{background:var(--pale-blue)}
.facts b{display:block;font-size:15.5px;font-weight:500;letter-spacing:-.025em}
.facts span{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.record{display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:20px;margin-top:20px;align-items:start}
.tabs{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.tabs a{height:34px;padding:0 14px;border-radius:var(--pill);color:var(--ink-2);display:flex;gap:7px;align-items:center;white-space:nowrap;cursor:pointer}
.tabs a span{font-size:12.5px;opacity:.7}
.tabs a:hover{background:var(--pale-blue);color:var(--navy)}
.tabs a[aria-current]{background:var(--blue);color:var(--on-dark);font-weight:500}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.list > li{border-top:1px solid var(--line)}.list > li:first-child{border-top:0}
.row{display:grid;grid-template-columns:44px 124px minmax(0,1fr) 150px 52px;column-gap:16px;align-items:center;min-height:54px;padding:11px 20px}
.row:hover,.lrow:hover{background:var(--sunk)}
.num{font-family:var(--mono);letter-spacing:0;font-size:12.5px;color:var(--muted)}
.topic{font-size:13px;color:var(--muted)}
.stmt{font-weight:480;overflow-wrap:anywhere}
.who{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px}
.face{width:24px;height:24px;border-radius:50%;background:var(--pale-blue);display:grid;place-items:center;font-size:11.5px;font-weight:550;flex:none}
.who small{display:block;font-size:12px;color:var(--muted)}
.date{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.aside{display:flex;flex-direction:column;gap:14px}
.editor{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px}
.editor h2{font-size:15px;margin-bottom:6px}
.editor p{font-size:13.5px;color:var(--muted)}
.meta{font-size:13px;color:var(--muted);margin:0 2px 10px;max-width:72ch}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:0;border-radius:var(--pill);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);font-size:13.5px;font-weight:500;white-space:nowrap;transition:background-color .15s var(--ease),color .15s var(--ease)}
.btn:hover{background:var(--pale-blue)}
.btn.fill{background:var(--blue);color:var(--on-dark);box-shadow:none}.btn.fill:hover{background:var(--navy)}
.btn.sm{height:28px;padding:0 11px;font-size:12.5px}
.btn.quiet{box-shadow:none;background:transparent;color:var(--muted)}.btn.quiet:hover{background:var(--pale-plum);color:var(--plum)}
.go{color:var(--blue);font-weight:500;font-size:13.5px;white-space:nowrap}.go:hover{color:var(--navy)}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--pill);font-size:12px;font-weight:500;letter-spacing:-.01em;background:var(--pale-blue);color:var(--navy);white-space:nowrap}
.chip.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--muted)}
.empty{padding:22px 20px;background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-md);color:var(--muted);max-width:none}

/* the new piece: a link. One tile, one name, where it points */
.tile{width:30px;height:30px;border-radius:var(--r-sm);background:var(--pale-blue);color:var(--blue);display:grid;place-items:center;flex:none}
.tile svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tile.text{background:var(--canvas);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}

/* A · Shelf: a row of links between the plate and the facts */
.shelf{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin-top:12px}
.shelf h2{font-size:13px;font-weight:400;color:var(--muted)}
.shelf ul{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.shelf li a{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 12px 4px;font-size:13.5px;max-width:100%;transition:border-color .15s var(--ease)}
.shelf li a:hover{border-color:var(--blue)}
.shelf li b{display:block;font-weight:520;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.shelf li small{display:block;font-size:12px;color:var(--muted)}
.shelf li a.new{border-style:dashed;background:transparent;color:var(--ink-2)}
.shelf .go{margin-left:2px}

/* C · Side panel: links at the top of the right column */
.side-links{padding:16px 8px 12px!important}
.side-links h2,.side-links > p{padding:0 10px}
.side-links h2{display:flex;align-items:baseline;gap:8px}.side-links h2 span{font-size:12.5px;font-weight:400;color:var(--muted)}
.side-links li a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px}
.side-links li a:hover{background:var(--sunk)}
.side-links li b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-links li small{display:block;font-size:12px;color:var(--muted)}
.side-links li div{min-width:0}
.side-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding:10px 10px 0;border-top:1px solid var(--line)}

/* the full list: B's tab, and the Resources page in A and C */
.lhead{display:flex;align-items:baseline;gap:10px;margin:22px 2px 8px}
.lhead h3{font-size:15px}.lhead span{font-size:13px;color:var(--muted)}
.lrow{display:grid;grid-template-columns:30px minmax(0,1fr) 128px 52px auto;column-gap:14px;align-items:center;min-height:58px;padding:10px 20px}
.lwhat{min-width:0}
.lwhat a{font-weight:520;color:var(--blue);text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color .15s var(--ease)}
.lwhat a:hover{text-decoration-color:currentColor}
.lwhat .host{font-size:12.5px;color:var(--muted);margin-left:8px;white-space:nowrap}
.lwhat p{font-size:13.5px;color:var(--ink-2);margin-top:1px;overflow-wrap:anywhere}
.lacts{display:flex;gap:2px;justify-content:flex-end}
.add{margin-top:14px;padding:18px 20px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.add h3{font-size:15px;margin-bottom:12px}
.add-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) minmax(0,1.4fr) auto;gap:12px;align-items:end}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2);min-width:0}
.field input{height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--navy);font-size:14px;min-width:0;width:100%}
.field input::placeholder{color:oklch(46.5% 0.012 245 / .75)}
.field input:hover{border-color:oklch(75% 0.04 245)}
.add-row .btn{height:38px}
.hint{font-size:12.5px;color:var(--muted);margin-top:10px;max-width:78ch}
.err{font-size:13px;color:var(--plum);font-weight:500;margin-top:10px}
/* the one box: paste a link, drop a file, or paste text */
.compose{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 10px;align-items:start;padding:8px 14px 8px 8px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.compose:hover{border-color:oklch(75% 0.04 245)}
.compose:focus-within{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.compose.drag{background:var(--pale-blue);border-style:dashed;border-color:var(--blue)}
.plus{width:34px;height:34px;border:0;border-radius:var(--r-sm);background:var(--blue);color:var(--on-dark);display:grid;place-items:center;transition:background-color .15s var(--ease)}
.plus:hover{background:var(--navy)}
.plus svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.compose textarea{border:0;background:transparent;resize:none;outline:0;height:34px;padding:7px 0;font:inherit;font-size:14.5px;line-height:20px;letter-spacing:inherit;color:var(--navy);width:100%}
.compose textarea::placeholder{color:var(--muted)}
.pickfile{align-self:center;cursor:pointer}
#detect{grid-column:1 / -1;display:grid;grid-template-columns:minmax(150px,auto) minmax(0,.9fr) minmax(0,1.3fr) auto;gap:12px;align-items:end;margin-top:8px;padding:12px 0 6px 6px;border-top:1px solid var(--line)}
#detect[hidden]{display:none}
#detect .btn{height:38px}
.found{display:flex;align-items:center;gap:10px;min-width:0;align-self:center}
.found b{display:block;font-weight:520}.found small{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
@container (max-width:900px){#detect{grid-template-columns:1fr 1fr}#detect .found,#detect .btn{grid-column:1 / -1}#detect .btn{justify-content:center}}
@container (max-width:620px){#detect{grid-template-columns:1fr}#detect > *{grid-column:1}.pickfile{grid-column:2 / -1;padding:2px 0 6px}}
.tags{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;margin-top:5px!important;font-size:12.5px!important;color:var(--muted)!important}
.tags .chip{margin-right:8px}
.tags span:not(.chip) + span:not(.chip)::before{content:'·';margin:0 7px}
.who small{white-space:nowrap}

/* in chat: the assistant's side of the same thing. The chat around the card is not Loop's to style */
.chats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:20px;align-items:start;margin-top:8px}
.chats h3{font-size:15px}.chats h3 + p{font-size:13px;color:var(--muted);margin:2px 0 10px;min-height:38px}
.chat{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:0;background:oklch(98.2% 0.004 90);border:1px solid oklch(88% 0.008 90);border-radius:14px;padding:14px;color:oklch(24% 0.005 90)}
.me{margin:0 0 12px auto;width:fit-content;max-width:85%;background:oklch(93.5% 0.006 90);padding:9px 13px;border-radius:14px}
.attach{display:flex;align-items:center;gap:8px;margin-bottom:7px;padding:6px 10px;border-radius:10px;background:oklch(98.2% 0.004 90);font-size:12.5px}
.attach svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.says{margin:0 2px 12px}
.card{font:14px/1.45 Archivo,system-ui,sans-serif;letter-spacing:-.01em;background:var(--surface);color:var(--navy);border:1px solid var(--line);border-radius:24px 24px 24px 6px;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;padding:11px 16px;background:var(--teal);color:var(--on-dark);font-size:15px;font-weight:500;letter-spacing:-.03em}
.brand svg{width:20px;height:20px;color:var(--aqua)}
.cbody{padding:13px 16px 15px}
.cmeta{color:var(--muted);font:12px/1.4 var(--mono);letter-spacing:0}
.words{margin:3px 0 2px;font-size:15px;font-weight:500;letter-spacing:-.025em}
.quiet{color:var(--muted);font-size:12.5px}
.citem{padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}
.facts2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 16px;margin:0;font-size:13.5px}
.facts2 dt{color:var(--muted)}.facts2 dd{margin:0;overflow-wrap:anywhere}
.crow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.card button{min-height:32px;padding:5px 13px;border:0;border-radius:var(--pill);font-size:13px;font-weight:500;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);transition:background-color .15s var(--ease)}
.card button:hover{background:var(--pale-blue)}
.card button.go{color:var(--on-dark);background:var(--blue);box-shadow:none}
.page-h{font-size:30px;line-height:1.1;margin:2px 0 8px}
.page-h + p{color:var(--muted);max-width:68ch;font-size:14.5px}
.texts-more{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

@container (max-width:900px){
  .record{grid-template-columns:minmax(0,1fr)}
  .add-row{grid-template-columns:1fr 1fr}.add-row .wide,.add-row .btn{grid-column:1 / -1}.add-row .btn{justify-content:center}
}
@container (max-width:620px){
  .crumbs .today{margin-left:0;flex-basis:100%}.crumbs{padding:8px 0}
  .plate{grid-template-columns:56px minmax(0,1fr);gap:14px;padding:16px;min-height:0}.plate > svg{width:56px;height:56px}
  .plate h1{font-size:22px}.plate h1 + p{font-size:13.5px}.dateblock{grid-column:1 / -1;justify-self:start}
  .facts{grid-template-columns:1fr 1fr}.facts > a:nth-child(3){border-left:0}.facts > a:nth-child(n+3){border-top:1px solid var(--line)}.facts > a{padding:10px 14px}
  .row{grid-template-columns:36px minmax(0,1fr);row-gap:6px;column-gap:10px;padding:12px 14px}.row > *:not(.num){grid-column:2}.row > .num{grid-row:1 / span 4;align-self:start}.date{text-align:left}
  .lrow{grid-template-columns:30px minmax(0,1fr);row-gap:6px;column-gap:10px;padding:12px 14px;align-items:start}.lrow > *:not(.tile){grid-column:2}.lacts{justify-content:flex-start;margin-left:-11px}
  .lwhat .host{display:block;margin-left:0}
  .add-row{grid-template-columns:1fr}.add{padding:16px 14px}
  .shelf li b{max-width:150px}
  .shelf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.shelf h2{grid-column:1}.shelf .go{grid-column:2;grid-row:1}
  .shelf ul{grid-column:1 / -1;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.shelf li{flex:none}
  .page-h{font-size:24px}
}
@media (max-width:820px){.shell{grid-template-columns:minmax(0,1fr)}.rail{display:none}.main{padding:0 16px 40px}}
</style>
</head>
<body>
<div class="bar"><b>Team links</b><span>Where a team's links and texts live</span>
  <div class="pick" role="group" aria-label="Direction">
    <button data-dir="a">A · Shelf</button>
    <button data-dir="b">B · Tab</button>
    <button data-dir="c">C · Side panel</button>
  </div>
  <div class="pick" role="group" aria-label="Page">
    <button data-page="team">Team page</button>
    <button data-page="resources">Resources page</button>
    <button data-page="chat">In chat</button>
  </div>
  <div class="pick" role="group" aria-label="View">
    <button id="empty" aria-pressed="false">No links yet</button>
    <button id="phone" aria-pressed="false">Phone width</button>
  </div>
</div>
<p class="why" id="why"></p>
<div class="shell">
  <nav class="rail" aria-label="Team 1"><div class="word"><svg data-rings></svg>Loop</div><p>Team 1</p>
    <a href="#" data-go="team"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 7 8 2.5 13.5 7v6.5h-11z"/></svg>Team</a>
    <a href="#"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.6-2.6 2.5-4 5-4s4.4 1.4 5 4"/></svg>Members</a>
    <a href="#" data-go="resources"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 2.5h5.5L12 5v8.5H4zM9.5 2.5V5H12M6 8h4M6 10.5h4"/></svg>Resources</a>
    <a href="#"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6.5 9.5 9.5 6.5M7 4.5l1-1a3 3 0 0 1 4.5 4.5l-1 1M9 11.5l-1 1A3 3 0 0 1 3.500 8l1-1"/></svg>Connections</a></nav>
  <div class="main" id="main"></div>
</div>
<script>
const RINGS='<path d="M29 35a21 21 0 1 0 42 0a21 21 0 1 0 -42 0" stroke="var(--lime)" stroke-width="9"/><path d="M14.5 60a21 21 0 1 0 42 0a21 21 0 1 0 -42 0" stroke="currentColor" stroke-width="9"/><path d="M43.5 60a21 21 0 1 0 42 0a21 21 0 1 0 -42 0" stroke="currentColor" stroke-width="9"/>';
const rings=()=>`<svg viewBox="0 0 100 100" fill="none" aria-hidden="true">${RINGS}</svg>`;
document.querySelectorAll('svg[data-rings]').forEach(el=>{el.setAttribute('viewBox','0 0 100 100');el.setAttribute('fill','none');el.innerHTML=RINGS;});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// One world, drawn three ways. Today is 16 Nov 2026.
const GLYPH={
  folder:'<path d="M2 4.500h4l1.500 1.500H14v6.500H2z"/>',
  doc:'<path d="M4 2.500h5.500L12 5v8.500H4zM9.500 2.500V5H12M6 8h4M6 10.500h4"/>',
  sheet:'<path d="M2.500 3.500h11v9h-11zM2.500 6.500h11M2.500 9.500h11M6.500 3.500v9"/>',
  slides:'<path d="M2.500 3.500h11v7h-11zM8 10.500v3M5.500 13.500h5"/>',
  site:'<circle cx="8" cy="8" r="5.500"/><path d="M2.500 8h11M8 2.500c2.200 2 2.200 9 0 11M8 2.500c-2.200 2-2.200 9 0 11"/>',
  text:'<path d="M3 4.500h10M3 8h10M3 11.500h6"/>',
};
const kind=url=>/drive\.google\.com\/drive\/folders|\/folders?\//.test(url)?'folder':/\/spreadsheets\//.test(url)?'sheet':/\/presentation\//.test(url)?'slides':/docs\.google\.com|\.docx?$|notion\./.test(url)?'doc':'site';
const host=url=>{try{return new URL(url).hostname.replace(/^www\./,'');}catch{return '';}};
const KNOWN=/(^|\.)(google\.com|sharepoint\.com|office\.com|dropbox\.com|box\.com|figma\.com|cornell\.edu)$/;
const tile=k=>`<span class="tile${k==='text'?' text':''}" aria-hidden="true"><svg viewBox="0 0 16 16">${GLYPH[k]}</svg></span>`;
const SEED=[
  {url:'https://drive.google.com/drive/folders/1AbCdEfGh',name:'Team 1 shared folder',tags:['Folder','Whole team'],via:'',note:'Everything we work on. Drafts in Drafts, finished files in Final.',by:'you',day:'Nov 13'},
  {url:'https://docs.google.com/presentation/d/1pitch',name:'Pitch deck, working copy',tags:['Slides','Final deck','Whole team','Due Dec 8'],via:'',note:'The live deck. Edit here, never a copy.',by:'priya',day:'Nov 14'},
  {url:'https://docs.google.com/spreadsheets/d/1model',name:'Financial model',tags:['Spreadsheet','Final deck','For marcus'],via:'Claude',note:'Five year model. Assumptions is the sheet to change.',by:'marcus',day:'Nov 14'},
  {url:'https://canvas.cornell.edu/courses/61830/assignments/syllabus',name:'NBAE 6830 syllabus',tags:['Syllabus','NBAE 6830','Whole team'],via:'',note:'Deliverable dates and how each one is graded.',by:'you',day:'Nov 13'},
  {url:'https://docs.google.com/document/d/1notes',name:'Customer interview notes',tags:['Notes','Interviews','12 so far'],via:'Claude',note:'Twelve interviews so far, newest at the top.',by:'elena',day:'Nov 15'},
  {url:'https://drive.google.com/drive/folders/1Research',name:'Market research folder',tags:['Folder','Sources'],via:'',note:'Reports and articles we cite. Look here before searching the web.',by:'marcus',day:'Nov 15'},
  {url:'https://docs.google.com/document/d/1talk',name:'Talk track',tags:['Draft','Dry run','For priya, marcus, elena','Due Nov 19'],via:'Claude',note:'Who says what in the ten minutes.',by:'priya',day:'Nov 16'},
  {url:'https://www.figma.com/file/abc123',name:'Product mockups',tags:['Design','Slides 6 to 8'],via:'',note:'Screens for slides 6 to 8.',by:'elena',day:'Nov 16'},
  {url:'https://hbsp.harvard.edu/import/1234567',name:'Case packet',tags:['Reading','NBAE 6830','Needs course login'],via:'',note:'Opens only with your own course login.',by:'you',day:'Nov 13'},
];
const TEXTS=[
  {tags:['Assignment','Final deck','Whole team','Due Dec 8'],via:'',name:'Final pitch assignment brief',meta:'Version 2 · 6 pages',state:'Ready',by:'you',day:'Nov 13'},
  {tags:['Rubric','Final deck'],via:'',name:'Grading rubric',meta:'Version 1 · 2 pages',state:'Ready',by:'you',day:'Nov 13'},
  {tags:['Transcript','Interviews'],via:'Claude',name:'Interview transcript, pasted',meta:'Version 1',state:'Reading',by:'elena',day:'Nov 16'},
];
// Newest first, like every other list on the team page.
let links=SEED.slice().sort((a,b)=>b.day.localeCompare(a.day));
const state={dir:'b',page:'team',tab:'decisions',phone:false,empty:false,error:''};
const SHOWN=5;
const cur=()=>state.empty?[]:links, texts=()=>state.empty?[]:TEXTS;
const plural=(n,one,many=one+'s')=>`${n} ${n===1?one:many}`;
const count=()=>`${plural(cur().length,'link')} and ${plural(texts().length,'text')}`;
const person=(by,via)=>`<div class="who"><span class="face" aria-hidden="true">${by[0].toUpperCase()}</span><div>${by==='you'?'You':esc(by)}${via?`<small>via ${esc(via)}</small>`:''}</div></div>`;
const tagLine=t=>t&&t.length?`<p class="tags"><span class="chip">${esc(t[0])}</span>${t.slice(1).map(x=>`<span>${esc(x)}</span>`).join('')}</p>`:`<p class="tags"><span class="chip off">Not described yet</span><span>An assistant fills this in when it first reads it</span></p>`;

const WHY={
  a:'<b>A · Shelf.</b> The first five links sit under the plate on every tab, one click from anywhere. The Resources page keeps the full list and is where links are added. Costs one row of height above the record.',
  b:'<b>B · Tab.</b> Resources stop being a separate page and become a tab of the team page, next to Outputs. One box at the top takes anything: paste a link, drop a file, or paste text, and it shows what it found before you add it. The rail\'s Resources opens this tab.',
  c:'<b>C · Side panel.</b> Links head the right column, beside the record, on every tab. Nothing moves in the main column. On a narrow window or a phone the column drops below the record, so the links end up at the bottom.',
};
const SAME=' In all three: Loop keeps the address, a name and one line on what it is for, never the file. Your assistant gets the list with the brief and opens each link with your own access.';

function plate(){return `<header class="plate">${rings()}
  <div><p class="mono">@nbae-6830/team-1</p><h1>Team 1</h1><p>Pitch a new venture to the NBAE 6830 panel: a deck, a model and a ten minute talk.</p></div>
  <div class="dateblock"><time><span>Dec</span><b>8</b><span>2026</span></time><div><span>Deadline</span><b>22 days left</b></div></div></header>`;}
function facts(){return `<nav class="facts" aria-label="Where the team stands">
  <a href="#"><b>4 decisions</b><span>Latest Nov 15 · pricing</span></a><a href="#"><b>3 open claims</b><span>None past due</span></a>
  <a href="#"><b>2 outputs</b><span>No conflicts flagged</span></a><a href="#"><b>2 events</b><span>Final deck · Dry run</span></a></nav>`;}
const DECISIONS=[[14,'pricing','Price at 29 dollars a seat per month, with no free tier in the pitch.','priya','Nov 15'],[11,'market','Size the market bottom up from the 4,200 clinics in the three launch states.','marcus','Nov 14'],[9,'scope','The deck stops at twelve slides. Appendix slides do not count.','you','Nov 14'],[6,'roles','Elena presents the product, Marcus the numbers, Priya opens and closes.','elena','Nov 13']];
function decisions(){return `<ul class="list">${DECISIONS.map(([n,t,s,by,day])=>`<li class="row"><span class="num">#${n}</span><span class="topic">${t}</span><p class="stmt">${s}</p>${person(by)}<span class="date">${day}</span></li>`).join('')}</ul>`;}
function tabs(){
  const all=[['decisions','Decisions',4],['claims','Claims',3],['outputs','Outputs',2],...(state.dir==='b'?[['resources','Resources',cur().length+texts().length]]:[]),['events','Events',2],['ideas','Ideas'],['travel','Travel'],['asks','Asks',1],['brief','Brief'],['mine','Your saves']];
  return `<nav class="tabs" aria-label="Team sections">${all.map(([k,l,n])=>`<a data-tab="${k}"${k===state.tab?' aria-current="page"':''}>${l}${n===undefined?'':`<span>${n}</span>`}</a>`).join('')}</nav>`;
}
function shelf(){
  const list=cur();
  if(!list.length)return `<section class="shelf" aria-label="Links"><h2>Links</h2><ul><li><a href="#" class="new" data-go="resources"><span class="tile" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M8 3.500v9M3.500 8h9"/></svg></span><div><b>Add a link</b><small>The shared folder, the syllabus</small></div></a></li></ul></section>`;
  return `<section class="shelf" aria-label="Links"><h2>Links</h2><ul>${list.slice(0,SHOWN).map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer nofollow" title="${esc(l.note)}">${tile(kind(l.url))}<div><b>${esc(l.name)}</b><small>${esc(host(l.url))}</small></div></a></li>`).join('')}</ul>
    <a href="#" class="go" data-go="resources">All ${count()} →</a></section>`;
}
function sidePanel(){
  const list=cur();
  return `<section class="editor side-links"><h2>Links <span>${list.length||''}</span></h2>
    ${list.length?`<ul>${list.slice(0,SHOWN).map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer nofollow" title="${esc(l.note)}">${tile(kind(l.url))}<div><b>${esc(l.name)}</b><small>${esc(host(l.url))}</small></div></a></li>`).join('')}</ul>
    <div class="side-foot"><a href="#" class="go" data-go="resources">All ${count()} →</a><a href="#" class="btn sm" data-go="resources">Add</a></div>`
    :`<p>No links yet. Add the shared folder or the syllabus and every teammate's assistant can find it.</p><div class="side-foot" style="border:0;padding-top:4px"><a href="#" class="btn sm" data-go="resources">Add a link</a></div>`}</section>`;
}
function aside(){return `<aside class="aside">${state.dir==='c'?sidePanel():''}
  <section class="editor"><h2>Announcements</h2><p class="stmt" style="color:var(--navy)">Dry run is Thursday 6pm in Sage 141. Bring the deck as it stands.</p><p style="margin-top:6px">#12 · Nov 15 · priya</p></section>
  <section class="editor"><h2>Your assistant</h2><p>Connect Claude or another assistant once, and it reads this record before it drafts anything for the team.</p><p style="margin-top:12px"><a href="#" class="btn">Connect an assistant →</a></p></section></aside>`;}

/** The full list and the add form: B's tab, and the Resources page in A and C. */
function library(){
  const list=cur(),tx=texts();
  return `<form class="compose" id="compose" novalidate>
    <button type="button" class="plus" id="plus" aria-label="Add a link, a file or text"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
    <textarea id="box" rows="1" aria-label="Add to resources" placeholder="Paste a link, drop a file, or paste text. Loop works out which."></textarea>
    <label class="pickfile go">Choose a file<input type="file" id="file" accept=".pdf,.txt,.md" hidden></label>
    <div id="detect" hidden></div></form>
  <p class="meta">The tags under each one are worked out by an assistant from what it read: what it is, what it is for, who it is for, and any date in it. Nobody types them.</p>
  ${list.length?`<ul class="list">${list.map((l,i)=>`<li class="lrow">${tile(kind(l.url))}
    <div class="lwhat"><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer nofollow">${esc(l.name)}</a><span class="host">${esc(host(l.url))}${KNOWN.test(host(l.url))?'':' · unrecognised host'}</span>${l.note?`<p>${esc(l.note)}</p>`:''}${tagLine(l.tags)}</div>
    ${person(l.by,l.via)}<span class="date">${l.day}</span><div class="lacts"><button class="btn sm quiet" data-remove="${i}">Remove</button></div></li>`).join('')}</ul>`
  :`<p class="empty">No links yet. Add the team's shared folder, the syllabus, or any page your assistants should know about.</p>`}
  <div class="lhead"><h3>Texts</h3><span>Pasted or read from a file. The file itself is not kept.</span></div>
  ${tx.length?`<ul class="list">${tx.map(t=>`<li class="lrow">${tile('text')}<div class="lwhat"><a href="#">${esc(t.name)}</a><span class="host">${esc(t.meta)}</span>${tagLine(t.tags)}</div>${person(t.by,t.via)}<span class="date">${t.day}</span><div class="lacts"><span class="chip${t.state==='Ready'?'':' off'}">${t.state}</span></div></li>`).join('')}</ul>`:`<p class="empty">No texts yet.</p>`}`;
}

// The one box. What is in it decides what it becomes: a link, a text, or a file read for its words.
let found=null;
const KIND_NAME={folder:'Folder',doc:'Document',sheet:'Spreadsheet',slides:'Slides',site:'Page'};
function sortBox(value,file){
  if(file)return {type:'file',key:'file '+file.name,file};
  const v=value.trim();
  if(!v)return null;
  if(/^https:\/\/[^\s.]+\.\S+$/.test(v))return {type:'link',key:'link '+kind(v)+host(v),url:v};
  if(/^(http:\/\/|www\.)\S+$/i.test(v))return {type:'bad',key:'bad'};
  return {type:'text',key:'text',text:v};
}
function showFound(next){
  const el=document.getElementById('detect');
  if(!el||(next?.key??'')===(found?.key??'')){found=next&&{...next};return;}
  found=next;el.hidden=!next;
  if(!next){el.innerHTML='';return;}
  const size=n=>n>1e6?`${(n/1e6).toFixed(1)} MB`:`${Math.max(1,Math.round(n/1e3))} KB`;
  el.innerHTML=next.type==='bad'?`<p class="err" role="alert" style="grid-column:1 / -1;margin:0">Links need to start with https.</p>`
   :next.type==='link'?`<div class="found">${tile(kind(next.url))}<div><b>Link</b><small>${esc(host(next.url))}${KNOWN.test(host(next.url))?'':' · unrecognised host'}</small></div></div>
     <label class="field">Name<input name="name" maxlength="80" value="${esc(`${KIND_NAME[kind(next.url)]} on ${host(next.url)}`)}"></label>
     <p class="hint" style="margin:0;align-self:center">Nothing else to fill in. An assistant works out what it is for, and for whom, when it first reads it.</p><button class="btn fill">Add link</button>`
   :next.type==='file'?`<div class="found">${tile('text')}<div><b>File</b><small>${esc(next.file.name)} · ${size(next.file.size)}</small></div></div>
     <label class="field">Name<input name="name" maxlength="80" value="${esc(next.file.name.replace(/\.[a-z0-9]+$/i,''))}"></label>
     <p class="hint" style="margin:0;align-self:center">Loop reads the words and does not keep the file. An assistant tags it when it first reads it.</p><button class="btn fill">Add text</button>`
   :`<div class="found">${tile('text')}<div><b>Text</b><small>Searchable by assistants</small></div></div>
     <label class="field">Name<input name="name" maxlength="80" placeholder="Interview transcript"></label>
     <p class="hint" style="margin:0;align-self:center">Kept as pasted. An assistant tags it when it first reads it.</p><button class="btn fill">Add text</button>`;
}
document.addEventListener('input',e=>{
  if(e.target.id==='box'){e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,140)+'px';showFound(sortBox(e.target.value));}
  if(e.target.id==='file'&&e.target.files[0]){document.getElementById('box').value='';showFound(sortBox('',e.target.files[0]));}
});
document.addEventListener('keydown',e=>{if(e.target.id==='box'&&e.key==='Enter'&&!e.shiftKey&&found?.type==='link'){e.preventDefault();document.getElementById('compose').requestSubmit();}});
for(const type of ['dragover','dragleave','drop'])document.addEventListener(type,e=>{
  const zone=e.target.closest?.('#compose');if(!zone)return;
  e.preventDefault();zone.classList.toggle('drag',type==='dragover');
  if(type==='drop'&&e.dataTransfer.files[0])showFound(sortBox('',e.dataTransfer.files[0]));
  else if(type==='drop'){const box=document.getElementById('box');box.value=e.dataTransfer.getData('text');showFound(sortBox(box.value));}
});

function render(){
  const {dir}=state;
  if(dir==='b'&&state.page==='resources')state.page='team';
  document.body.classList.toggle('phone',state.phone);
  document.querySelectorAll('[data-dir]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dir===dir));
  document.querySelectorAll('[data-page]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.page===state.page);b.disabled=dir==='b'&&b.dataset.page==='resources';});
  document.getElementById('phone').setAttribute('aria-pressed',state.phone);document.getElementById('empty').setAttribute('aria-pressed',state.empty);
  document.getElementById('why').innerHTML=WHY[dir]+SAME;
  const onResources=state.page==='resources'||(dir==='b'&&state.tab==='resources');
  document.querySelectorAll('.rail a').forEach(a=>{const on=a.dataset.go&&(a.dataset.go==='resources')===onResources;on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current');});
  const main=document.getElementById('main');
  if(state.page==='chat'){
    document.getElementById('why').innerHTML='<b>In chat.</b> You hand your assistant a file and say where it should go in a few words, or none. It reads the file, works out the tags and the group, and saves. It only stops to ask when it cannot tell, and then it asks on a Loop card, one tap to answer. Tap a group on the right to see it save.';
    const doc='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.500h5.500L12 5v8.500H4zM9.500 2.500V5H12M6 8h4M6 10.500h4"/></svg>';
    const facts=rows=>`<dl class="facts2">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
    const saved=(group,name,sum,rows)=>`<div class="card"><div class="brand">${rings()}Loop</div><div class="cbody">
      <p class="cmeta">Saved to ${group} · just now</p><p class="words">${name}</p><p class="quiet">${sum}</p>
      <div class="citem">${facts(rows)}</div><div class="crow"><button class="go">Open in Loop</button><button>Change a tag</button><button>Undo</button></div></div></div>`;
    const memo=[['Kind','Draft'],['About','Deal memo, valuation section'],['For','Whole team'],['Date in it','Due Nov 24'],['Read from','Valuation memo, draft 2.docx']];
    main.innerHTML=`<p class="crumbs"><span>Outside Loop</span><span>›</span><b>Your assistant's chat</b></p>
    <div class="chats">
      <div><h3>It can tell: saved, nothing asked</h3><p>The file names the team and the date, so there is nothing to ask.</p>
        <div class="chat"><div class="me"><div class="attach">${doc}Team1 - Loop what to prove before December 4.docx</div>Put this where the team can find it.</div>
        <p class="says">Saved to Team 1. It is a plan for the whole team, with a December 4 date in it.</p>
        ${saved('Team 1','Loop: what to prove before December 4','The three things the pilot has to show by December 4, and who checks each one.',[['Kind','Plan'],['About','Loop pilot'],['For','Whole team'],['Date in it','Dec 4'],['Read from','Team1 - Loop what to prove before December 4.docx']])}</div></div>
      <div><h3>It cannot tell: one question, then saved</h3><p>Two groups fit, so it asks before saving. Everything else is already worked out.</p>
        <div class="chat"><div class="me"><div class="attach">${doc}Valuation memo, draft 2.docx</div>Save this to Loop.</div>
        ${state.asked?`<p class="says">Saved to ${state.asked}.</p>${saved(state.asked,'Valuation memo, draft 2','Draft of the valuation section: comparable companies and a first DCF range.',[['Kind','Draft'],...memo.slice(1)])}`
        :`<p class="says">One question before I save this.</p>
        <div class="card"><div class="brand">${rings()}Loop</div><div class="cbody">
          <p class="cmeta">Not saved yet</p><p class="words">Which group is this for?</p>
          <p class="quiet">It reads like NBAE 6561 work, but Team 1 also has an open claim on valuation.</p>
          <div class="crow"><button data-ask="NBAE 6561 Investment Banking">NBAE 6561 Investment Banking</button><button data-ask="Team 1">Team 1</button><button data-ask="NBAE 6830 Innovation and New Venture Creation">NBAE 6830</button></div>
          <div class="citem"><p class="quiet" style="margin-bottom:8px">Already worked out from the file</p>${facts(memo)}</div></div></div>`}</div></div>
    </div>`;
    return;
  }
  if(state.page==='resources'){
    main.innerHTML=`<p class="crumbs"><span>NBAE 6830</span><span>›</span><span>Team 1</span><span>›</span><b>Resources</b></p>
      <h1 class="page-h">Resources</h1><p>What Team 1 works from: links to where the files live, and texts your assistants can search.</p>
      <div class="lhead"><h3>Links</h3><span>${plural(cur().length,'link')}${dir==='a'&&cur().length>SHOWN?`, the first ${SHOWN} show on the team page`:dir==='c'&&cur().length>SHOWN?`, the first ${SHOWN} show beside the record`:''}</span></div>${library()}`;
  }else{
    main.innerHTML=`<p class="crumbs"><span>NBAE 6830</span><span>›</span><b>Team 1</b><span class="today">Today is 2026-11-16 (America/New_York)</span></p>
      ${plate()}${dir==='a'?shelf():''}${facts()}
      <div class="record"><div>${tabs()}${state.tab==='resources'&&dir==='b'?`<section aria-label="Resources">${library()}</section>`:state.tab==='decisions'?decisions():`<p class="empty">This tab is unchanged and not drawn in this mockup.</p>`}</div>${aside()}</div>`;
  }
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-dir],[data-page],[data-tab],[data-go],[data-remove],[data-ask],#phone,#empty');
  if(!t)return;
  if(t.dataset.dir){if(state.page==='chat')state.page='team';state.dir=t.dataset.dir;state.tab=state.dir==='b'?'resources':'decisions';}
  else if(t.dataset.page){state.page=t.dataset.page;state.asked='';}
  else if(t.dataset.ask)state.asked=t.dataset.ask;
  else if(t.dataset.tab)state.tab=t.dataset.tab;
  else if(t.dataset.go){e.preventDefault();if(t.dataset.go==='team'){state.page='team';if(state.dir==='b')state.tab='decisions';}else if(state.dir==='b')state.tab='resources';else state.page='resources';window.scrollTo(0,0);}
  else if(t.dataset.remove){links.splice(+t.dataset.remove,1);}
  else if(t.id==='phone')state.phone=!state.phone;
  else if(t.id==='empty')state.empty=!state.empty;
  state.error='';render();
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(!found||found.type==='bad'){document.getElementById('box').focus();return;}
  const data=new FormData(e.target),name=String(data.get('name')??'').trim();
  if(state.empty){state.empty=false;links=[];TEXTS.length=0;}
  if(found.type==='link')links.unshift({url:found.url,name:name||host(found.url),note:String(data.get('note')??'').trim(),by:'you',day:'Nov 16'});
  else TEXTS.unshift({name:name||(found.type==='file'?found.file.name:found.text.slice(0,40)),meta:'Version 1',state:'Reading',by:'you',day:'Nov 16'});
  found=null;render();
});
document.addEventListener('click',e=>{if(e.target.closest('#plus'))document.getElementById('box').focus();});
// A view can be linked: #b, #c-phone, #a-resources, #a-empty.
const want=location.hash.slice(1).split('-');
if('abc'.includes(want[0])&&want[0])state.dir=want[0];
state.tab=state.dir==='b'?'resources':'decisions';
if(want.includes('resources'))state.page='resources';
if(want.includes('chat'))state.page='chat';
state.phone=want.includes('phone');state.empty=want.includes('empty');
render();
// For a screenshot of the box at work: #b-link, #b-text.
const demo=want.includes('link')?'https://drive.google.com/drive/folders/1FinalDeck':want.includes('text')?'Notes from the call with Dr. Okafor: clinics lose about four hours a week to rebooking.':'';
if(demo&&document.getElementById('box')){const box=document.getElementById('box');box.value=demo;box.dispatchEvent(new Event('input',{bubbles:true}));}
</script>
