<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faces: PNG beside WebP</title>
<style>
  @font-face { font-family: Archivo; src: url(/fonts/Archivo.ttf) format('truetype'); font-weight: 100 900; font-stretch: 62% 125%; }
  :root { --ink: oklch(25% 0.07 252); --paper: oklch(99.3% 0.004 117); --page: oklch(96.2% 0.004 230); --field: oklch(96.4% 0.19 117); --line: oklch(90.6% 0.008 240); --mute: oklch(46.5% 0.012 245); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 600 15px/1.4 Archivo, system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 20px; background: var(--field); border-bottom: 1.5px solid var(--ink); }
  h1 { margin: 0; font-size: 20px; font-weight: 800; font-stretch: 112%; }
  header p { margin: 0; flex: 1 1 320px; color: var(--ink); }
  .pills { display: flex; gap: 6px; }
  button { font: inherit; font-weight: 700; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; padding: 18px 20px 40px; }
  .face { background: var(--paper); border: 1.5px solid var(--ink); border-radius: 14px; overflow: hidden; }
  .face b { display: flex; justify-content: space-between; padding: 7px 12px; border-bottom: 1px solid var(--line); font-weight: 800; }
  .face b span { color: var(--mute); font-weight: 600; }
  .ground { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 6px 10px; padding: 10px 12px; }
  .ground.dark { background: var(--ink); color: var(--paper); }
  .ground .k { grid-row: span 2; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  .set { display: flex; align-items: center; gap: 12px; }
  .set i { width: 40px; font-style: normal; font-size: 12px; font-weight: 800; padding: 2px 0; text-align: center; border-radius: 999px; background: var(--field); color: var(--ink); }
  .set img { display: block; }
  body.blink .set.webp { visibility: hidden; }
</style>
</head>
<body>
<header>
  <h1>Faces: PNG beside WebP</h1>
  <p>Each face at the sizes the app draws it (26, 32, 38 and 96 px), on the ticket's paper and on ink: today's PNG above, the WebP below. "Flip" shows one row that swaps between PNG and WebP once a second, so a difference shows as a flicker.</p>
  <div class="pills"><button id="side" aria-pressed="true">Side by side</button><button id="flip" aria-pressed="false">Flip</button></div>
</header>
<main id="faces"></main>
<script>
  const sizes = [26, 32, 38, 96];
  const set = (n, ext) => `<div class="set ${ext}"><i>${ext === 'png' ? 'PNG' : 'WebP'}</i>${sizes.map(s => `<img data-n="${n}" src="/animals/${n}.${ext}" width="${s}" height="${s}" alt="">`).join('')}</div>`;
  const faces = document.getElementById('faces');
  const kb = {};
  for (let i = 1; i <= 48; i++) {
    const n = String(i).padStart(2, '0');
    faces.insertAdjacentHTML('beforeend', `<section class="face"><b>${n}<span id="kb${n}"></span></b>
      <div class="ground"><span class="k">Paper</span>${set(n, 'png')}${set(n, 'webp')}</div>
      <div class="ground dark"><span class="k">Ink</span>${set(n, 'png')}${set(n, 'webp')}</div></section>`);
    Promise.all(['png', 'webp'].map(e => fetch(`/animals/${n}.${e}`).then(r => r.blob()).then(b => Math.round(b.size / 1024))))
      .then(([p, w]) => { document.getElementById('kb' + n).textContent = `${p} kB → ${w} kB`; });
  }
  let timer = 0, showWebp = false;
  const side = document.getElementById('side'), flip = document.getElementById('flip');
  const left = () => document.querySelectorAll('.set.png img');
  side.onclick = () => { clearInterval(timer); document.body.classList.remove('blink'); side.ariaPressed = 'true'; flip.ariaPressed = 'false'; left().forEach(img => img.src = `/animals/${img.dataset.n}.png`); };
  flip.onclick = () => { document.body.classList.add('blink'); side.ariaPressed = 'false'; flip.ariaPressed = 'true'; clearInterval(timer);
    timer = setInterval(() => { showWebp = !showWebp; left().forEach(img => img.src = `/animals/${img.dataset.n}.${showWebp ? 'webp' : 'png'}`); }, 1000); };
</script>
</body>
</html>
