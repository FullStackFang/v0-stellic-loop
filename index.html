<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loop — Your people, on repeat</title>

  <!-- Tailwind (Play CDN) — layout utilities only; all color/shape/type is token-driven -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Pulse Design System type: Gabarito (display) · Figtree (UI/body) · IBM Plex Mono (numerals) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Lucide icons via CDN (the DS icon set). Icons are also embedded inline below as an
       SVG-path fallback so a blocked CDN never yields empty glyphs on camera. -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- React + Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    // Force the CLASSIC JSX runtime (React.createElement via the global React).
    Babel.registerPreset('react-classic', {
      presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]],
    });
  </script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink:      'var(--text-primary)',
            'ink-2':  'var(--text-secondary)',
            'ink-3':  'var(--text-tertiary)',
            accent:   'var(--accent)',
            paper:    'var(--bg-page)',
            surface:  'var(--bg-surface)',
            sunken:   'var(--bg-sunken)',
            hair:     'var(--border-hairline)',
          },
          fontFamily: {
            display: ['Gabarito', 'system-ui', 'sans-serif'],
            sans:    ['Figtree', 'system-ui', 'sans-serif'],
            mono:    ['IBM Plex Mono', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>

  <style>
    /* ===== Pulse Design System — token layer (design.md D1), Daylight (default) ===== */
    :root{
      --paper-0:#fffdf8; --paper-1:#f9f4ec; --paper-2:#f0e8da; --paper-3:#e3d8c6;
      --ink-0:#1f1a17; --ink-1:#352d28; --ink-2:#6a5e56; --ink-3:#98897e; --ink-4:#c5b8aa;
      --carnelian-100:#f8e6e3; --carnelian-200:#f0c5c0; --carnelian-300:#e08d84; --carnelian-400:#cf5347;
      --carnelian-500:#b31b1b; --carnelian-600:#8a1414; --carnelian-700:#680f0f;
      --moss-500:#3d8a5f; --amber-500:#b6862b; --amber-600:#8a641f; --rose-500:#a04f6a; --slate-500:#59657a;
      /* semantic */
      --bg-page:var(--paper-1); --bg-surface:var(--paper-0); --bg-raised:#fffefb; --bg-sunken:var(--paper-2);
      --bg-blush:var(--carnelian-100); --bg-inverse:var(--ink-0); --bg-scrim:rgba(31,26,23,.44);
      --text-primary:var(--ink-0); --text-secondary:var(--ink-2); --text-tertiary:var(--ink-3);
      --text-inverse:var(--paper-0); --text-link:var(--carnelian-600);
      --border-hairline:var(--paper-3); --border-strong:var(--ink-0); --border-quiet:rgba(31,26,23,.08);
      --accent:var(--carnelian-500); --accent-strong:var(--carnelian-600); --accent-quiet:var(--carnelian-100); --accent-ink:var(--paper-0);
      --status-live:var(--moss-500); --status-forming:var(--amber-500); --status-full:var(--carnelian-500);
      --unit-dorm:var(--rose-500); --unit-class:var(--slate-500); --unit-major:var(--amber-600);
      --focus-ring:var(--carnelian-500);
      /* type */
      --font-display:'Gabarito',system-ui,sans-serif; --font-sans:'Figtree',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
      /* radii */
      --radius-md:14px; --radius-lg:22px; --radius-xl:28px; --radius-2xl:34px; --radius-pill:999px;
      /* shadows (warm) */
      --shadow-card:0 1px 2px rgba(80,40,30,.05),0 4px 14px -10px rgba(80,40,30,.14);
      --shadow-raised:0 8px 26px -12px rgba(80,40,30,.2); --shadow-pop:0 28px 60px -24px rgba(80,40,30,.3);
      --glow-accent:0 6px 18px -10px var(--carnelian-500);
      /* motion */
      --dur-1:120ms; --dur-2:180ms; --dur-3:260ms; --dur-4:420ms;
      --ease-out:cubic-bezier(.2,.8,.2,1); --ease-settle:cubic-bezier(.16,1,.3,1); --ease-pop:cubic-bezier(.34,1.56,.64,1);
    }
    /* ===== Big Red Night ===== */
    :root[data-theme="afterdark"]{
      --bg-page:#181310; --bg-surface:#211a16; --bg-raised:#2a221d; --bg-sunken:#12100c; --bg-blush:#2c1815;
      --text-primary:#f8f1e8; --text-secondary:#bcafa2; --text-tertiary:#8d8074;
      --border-hairline:#342a24; --border-strong:#4e4139; --border-quiet:rgba(248,241,232,.1);
      --accent:var(--carnelian-400); --accent-strong:var(--carnelian-300); --accent-quiet:rgba(207,83,71,.16); --accent-ink:#1a0d0b;
      --focus-ring:var(--carnelian-300);
      --shadow-card:0 1px 2px rgba(0,0,0,.4); --shadow-raised:0 8px 26px -12px rgba(0,0,0,.7); --shadow-pop:0 28px 60px -24px rgba(0,0,0,.8);
    }

    html, body { height: 100%; }
    body{
      margin:0; background:var(--bg-sunken);
      font-family:var(--font-sans); color:var(--text-primary);
      -webkit-font-smoothing:antialiased;
      transition: background var(--dur-3) var(--ease-out);
    }
    input, select, textarea, button { font-family: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    :focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }

    /* ---- phone frame ---- */
    .phone{
      width:390px; max-width:100vw; height:800px; background:var(--bg-surface);
      border:1px solid var(--border-hairline); border-radius:40px; overflow:hidden;
      position:relative; display:flex; flex-direction:column; box-shadow:var(--shadow-pop);
    }
    .no-scrollbar::-webkit-scrollbar{ width:0; height:0; }
    .no-scrollbar{ scrollbar-width:none; }

    /* ---- typography helpers ---- */
    .pls-display{ font-family:var(--font-display); letter-spacing:-.02em; }
    .pls-mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
    .pls-kicker{ font-family:var(--font-sans); font-weight:600; text-transform:uppercase; letter-spacing:.08em; font-size:11.5px; color:var(--text-tertiary); }

    /* ---- buttons ---- */
    .pls-btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px;
      padding:0 20px; border-radius:var(--radius-pill); font-family:var(--font-sans); font-weight:600; font-size:15px;
      cursor:pointer; border:1px solid transparent; user-select:none;
      transition:background var(--dur-1) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), transform var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out); }
    .pls-btn:disabled{ opacity:.4; cursor:default; }
    .pls-btn--block{ width:100%; }
    .pls-btn--sm{ min-height:38px; font-size:14px; padding:0 16px; }
    .pls-btn--primary{ background:var(--accent); color:var(--accent-ink); box-shadow:var(--glow-accent); }
    .pls-btn--primary:not(:disabled):active{ background:var(--accent-strong); box-shadow:none; transform:translateY(1px); }
    .pls-btn--secondary{ background:var(--bg-surface); color:var(--text-primary); border-color:var(--border-strong); }
    .pls-btn--secondary:not(:disabled):active{ background:var(--bg-sunken); transform:translateY(1px); }
    .pls-btn--ghost{ background:transparent; color:var(--text-secondary); }
    .pls-btn--ghost:not(:disabled):active{ background:var(--bg-sunken); }

    .pls-iconbtn{ display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px;
      border-radius:var(--radius-pill); background:transparent; color:var(--text-secondary); border:none; cursor:pointer;
      position:relative; transition:background var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out); }
    .pls-iconbtn:active{ background:var(--bg-sunken); }

    /* ---- surfaces ---- */
    .pls-card{ background:var(--bg-surface); border:1px solid var(--border-hairline); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); }
    .pls-card--outline{ border:1.5px solid var(--border-strong); box-shadow:none; }
    .pls-card--sunken{ background:var(--bg-sunken); border:1px solid var(--border-hairline); box-shadow:none; }
    .pls-blush{ background:var(--bg-blush); border:1px solid var(--border-quiet); border-radius:24px; }
    .pls-banner{ background:var(--accent-quiet); border:1px solid var(--border-quiet); border-radius:12px; }

    /* ---- badge / chip ---- */
    .pls-badge{ display:inline-flex; align-items:center; gap:4px; text-transform:uppercase; letter-spacing:.06em;
      font-weight:700; font-size:10.5px; line-height:1; padding:3px 7px; border-radius:5px; }
    .pls-chip{ display:inline-flex; align-items:center; gap:5px; font-weight:600; font-size:12px; line-height:1;
      padding:5px 10px; border-radius:var(--radius-pill); border:1px solid var(--border-hairline);
      background:var(--bg-surface); color:var(--text-secondary); }
    .pls-chip--accent{ background:var(--accent-quiet); border-color:transparent; color:var(--accent-strong); }
    .pls-chip--static{ background:var(--bg-sunken); border-color:transparent; color:var(--text-tertiary); }

    /* ---- inputs ---- */
    .pls-input{ width:100%; background:var(--bg-surface); border:1px solid var(--border-hairline); border-radius:12px;
      padding:13px 14px; font-size:16px; color:var(--text-primary); outline:none;
      transition:border-color var(--dur-1) var(--ease-out); }
    .pls-input:focus{ border-color:var(--focus-ring); }
    .pls-input::placeholder{ color:var(--text-tertiary); }
    .pls-fieldwrap{ display:flex; align-items:center; gap:8px; background:var(--bg-surface);
      border:1px solid var(--border-hairline); border-radius:12px; padding:11px 14px;
      transition:border-color var(--dur-1) var(--ease-out); }
    .pls-fieldwrap:focus-within{ border-color:var(--focus-ring); }

    /* ---- avatar ---- */
    .pls-avatar{ display:flex; align-items:center; justify-content:center; border-radius:var(--radius-pill);
      font-family:var(--font-mono); font-weight:500; flex-shrink:0; user-select:none; line-height:1; }

    /* ---- chrome ---- */
    .pls-header{ position:relative; z-index:40; background:var(--bg-surface); border-bottom:1px solid var(--border-hairline);
      display:flex; align-items:center; gap:6px; padding:0 12px; height:56px; flex-shrink:0; }
    .pls-tabbar{ z-index:40; height:64px; background:var(--bg-surface); border-top:1px solid var(--border-hairline);
      display:flex; align-items:stretch; flex-shrink:0; }
    .pls-tab{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
      font-size:10.5px; font-weight:600; color:var(--text-tertiary); background:none; border:none; cursor:pointer; }
    .pls-tab__glyph{ display:flex; align-items:center; justify-content:center; width:46px; height:28px;
      border-radius:var(--radius-pill); position:relative; transition:background var(--dur-1) var(--ease-out); }
    .pls-tab--active{ color:var(--accent-strong); }
    .pls-tab--active .pls-tab__glyph{ background:var(--accent-quiet); }
    .pls-fab{ position:absolute; right:18px; bottom:80px; width:56px; height:56px; border-radius:var(--radius-pill);
      background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center;
      border:none; cursor:pointer; box-shadow:var(--glow-accent), var(--shadow-raised); z-index:45;
      transition:transform var(--dur-1) var(--ease-out); }
    .pls-fab:active{ transform:translateY(1px) scale(.97); }

    /* ---- sheet / scrim / toast ---- */
    .pls-scrim{ position:absolute; inset:0; background:var(--bg-scrim); backdrop-filter:blur(2px);
      -webkit-backdrop-filter:blur(2px); z-index:60; display:flex; align-items:flex-end; animation:scrim-in var(--dur-2) ease both; }
    .pls-sheet{ width:100%; background:var(--bg-surface); border-top-left-radius:var(--radius-xl); border-top-right-radius:var(--radius-xl);
      box-shadow:var(--shadow-pop); padding:8px 20px 24px; max-height:86%; overflow-y:auto;
      animation:sheet-up var(--dur-3) var(--ease-settle) both; }
    .pls-grab{ width:40px; height:5px; border-radius:999px; background:var(--border-hairline); margin:6px auto 14px; }
    .pls-toast{ display:flex; align-items:center; gap:12px; background:var(--bg-inverse); color:var(--text-inverse);
      border-radius:var(--radius-lg); padding:11px 14px; box-shadow:var(--shadow-pop); }

    /* ---- live dot ---- */
    .pls-livedot{ position:relative; width:9px; height:9px; flex-shrink:0; display:inline-block; }
    .pls-livedot__core{ position:absolute; inset:0; border-radius:50%; background:var(--status-live); }
    .pls-livedot__ring{ position:absolute; inset:0; border-radius:50%; background:var(--status-live);
      animation:pulse-ring 1.8s var(--ease-out) infinite; }

    /* ---- motion keyframes ---- */
    @keyframes pulse-ring{ 0%{ transform:scale(1); opacity:.5; } 70%{ transform:scale(2.6); opacity:0; } 100%{ opacity:0; } }
    @keyframes pulse-fold-in{ from{ opacity:0; transform:translateY(6px) scale(.92); } to{ opacity:1; transform:none; } }
    @keyframes pulse-fill{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
    @keyframes sheet-up{ from{ transform:translateY(100%); } to{ transform:none; } }
    @keyframes scrim-in{ from{ opacity:0; } to{ opacity:1; } }
    @keyframes fade-in{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
    @keyframes rise{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
    @keyframes toast-in{ from{ opacity:0; transform:translateY(-14px); } to{ opacity:1; transform:none; } }
    @keyframes pop{ from{ opacity:0; transform:scale(.9); } to{ opacity:1; transform:scale(1); } }
    @keyframes pulse-dot{ 0%,60%,100%{ opacity:.3; transform:translateY(0); } 30%{ opacity:1; transform:translateY(-3px); } }
    .fade-in{ animation:fade-in var(--dur-3) var(--ease-out) both; }
    .rise{ animation:rise var(--dur-3) var(--ease-settle) both; }
    .fold-in{ animation:pulse-fold-in var(--dur-3) var(--ease-pop) both; }
    .toast-in{ animation:toast-in var(--dur-3) var(--ease-out) both; }
    .pop{ animation:pop var(--dur-3) var(--ease-pop) both; }

    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{ animation-duration:1ms !important; animation-iteration-count:1 !important; transition-duration:1ms !important; }
    }
  </style>
</head>

    function parseIntent(raw){
      const text = (raw||'').trim();
      for (const c of COURSES) {
        const [dept, num] = c.code.split(' ');
        if (new RegExp('\\b'+dept+'\\s?'+num+'\\b','i').test(text)) return { type:'study', target:c.code, raw:text };
      }
      const m = text.match(/\b([A-Z]{2,5})\s?(\d{4})\b/);
      if (m) return { type:'study', target:`${m[1]} ${m[2]}`, raw:text };
      const bare = text.match(/\b(\d{4})\b/);
      if (bare) { const c = COURSES.find(c => c.code.endsWith(bare[1])); if (c) return { type:'study', target:c.code, raw:text }; }
      const t = text.toLowerCase();
      const kw = [
        { re:/\b(box|boxing)\b/,               target:'boxing',      type:'activity' },
        { re:/\b(climb|boulder|bouldering)\b/, target:'bouldering',  type:'activity' },
        { re:/\b(dinner|eat)\b/,               target:'dinner crew', type:'social' },
        { re:/\b(run|running)\b/,              target:'running',     type:'activity' },
      ];
      for (const k of kw) if (k.re.test(t)) return { type:k.type, target:k.target, raw:text };
      return { type:'unknown', target:null, raw:text };
    }

    function hashInt(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
    function initials(name){ const p=name.trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase(); }

              borderRadius:999, background:'var(--accent)', color:'var(--accent-ink)', fontSize:10, fontWeight:500,
              display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 0 0 2px var(--bg-surface)' }}>{badge}</span>
          )}
        </button>
      );

    function Badge({ children, hue='var(--text-secondary)' }){
      return <span className="pls-badge" style={{ color:hue, background:`color-mix(in srgb, ${hue} 14%, var(--bg-surface))` }}>{children}</span>;
    }
    function Chip({ children, variant='default', icon }){
      const cls = 'pls-chip' + (variant!=='default' ? ' pls-chip--'+variant : '');
      return <span className={cls}>{icon && <Icon name={icon} size={13} />}{children}</span>;
    }
    function LiveDot(){
      return (
        <span className="pls-livedot" aria-label="live">
          <span className="pls-livedot__ring" /><span className="pls-livedot__core" />
        </span>
      );
    }
    function Card({ children, variant='default', className='', style, onClick }){
      const cls = 'pls-card' + (variant==='outline'?' pls-card--outline':variant==='sunken'?' pls-card--sunken':'') + ' ' + className;
      return <div className={cls} style={style} onClick={onClick}>{children}</div>;
    }
    function Banner({ icon, title, children, className='' }){
      return (
        <div className={"pls-banner p-3.5 flex gap-3 items-start rise "+className}>
          {icon && <span style={{ color:'var(--accent-strong)', flexShrink:0 }}><Icon name={icon} size={18} /></span>}
          <div className="min-w-0">
            <p style={{ fontWeight:600, fontSize:14, color:'var(--text-primary)' }}>{title}</p>
            {children && <p className="text-[13px] mt-0.5" style={{ color:'var(--text-secondary)' }}>{children}</p>}
          </div>
        </div>

    function EmptyState({ icon='radio', title, children }){
      return (
        <div className="text-center px-6 py-8">
          <div className="mx-auto mb-3 flex items-center justify-center pls-card--sunken pls-card"
               style={{ width:52, height:52, borderRadius:'50%' }}>
            <Icon name={icon} size={22} style={{ color:'var(--text-tertiary)' }} />
          </div>
          <p className="pls-display" style={{ fontWeight:700, fontSize:17, color:'var(--text-primary)' }}>{title}</p>
          <p className="text-[13.5px] mt-1.5 leading-relaxed" style={{ color:'var(--text-secondary)' }}>{children}</p>
        </div>
      );

    // Private feedback — like / neutral / dislike. Only the viewer ever sees it.
    function FeedbackControl({ value, onChange, size=32 }){
      const opts = [
        { k:'like',    icon:'thumbs-up',   hue:'var(--status-live)' },
        { k:'neutral', icon:'minus',       hue:'var(--text-tertiary)' },
        { k:'dislike', icon:'thumbs-down', hue:'var(--unit-dorm)' },
      ];
      return (
        <div className="flex items-center gap-1.5">
          {opts.map(o=>{
            const on = value===o.k;
            return (
              <button key={o.k} aria-label={o.k} aria-pressed={on} onClick={()=>onChange(on?null:o.k)}
                style={{ width:size, height:size, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center',
                  border:'1px solid '+(on?o.hue:'var(--border-hairline)'),
                  background: on?`color-mix(in srgb, ${o.hue} 16%, var(--bg-surface))`:'transparent',
                  color: on?o.hue:'var(--text-tertiary)', cursor:'pointer', transition:'all var(--dur-1) var(--ease-out)' }}>
                <Icon name={o.icon} size={Math.round(size*0.5)} />
              </button>
            );
          })}
        </div>
      );

    /* ============================================================
       DOMAIN PRIMITIVES
    ============================================================ */
    function RhythmLine({ text, icon='repeat' }){
      return (
        <div className="flex items-center gap-1.5 pls-mono" style={{ fontSize:12.5, color:'var(--text-secondary)' }}>
          <Icon name={icon} size={14} style={{ color:'var(--text-tertiary)' }} />{text}
        </div>
      );
    }
    function UnitKicker({ unit }){
      const hue = UNIT_HUE[unit.kind] || 'var(--text-tertiary)';
      return (
        <div className="pls-kicker flex items-center gap-1.5">
          <span style={{ width:6, height:6, borderRadius:'50%', background:hue, display:'inline-block' }} />
          <span style={{ color:hue }}>{unit.label}</span>
        </div>
      );
    }
    function DropMeter({ count, target }){
      const full = count >= target;
      const fill = full ? 'var(--status-full)' : 'var(--status-forming)';
      return (
        <div>
          <div className="flex items-baseline justify-between mb-1.5">
            <span className="pls-mono" style={{ fontSize:13, color: full ? 'var(--status-full)' : 'var(--text-primary)' }}>
              {count}/{target} <span style={{ color:'var(--text-tertiary)' }}>intents</span>
            </span>
            <span className="text-[12px]" style={{ color:'var(--text-secondary)' }}>
              {full ? 'the drop is firing' : `fires when ${target} want it`}
            </span>
          </div>
          <div style={{ position:'relative', height:10, borderRadius:999, background:'var(--bg-sunken)', overflow:'hidden' }}>
            <div style={{ width:(Math.min(count,target)/target*100)+'%', height:'100%', background:fill,
              transformOrigin:'left', animation:'pulse-fill var(--dur-4) var(--ease-settle) both', borderRadius:999 }} />
            <div style={{ position:'absolute', inset:0, display:'flex' }}>
              {Array.from({ length:target }).map((_,i)=>(
                <div key={i} style={{ flex:1, borderRight: i<target-1 ? '1px solid var(--bg-surface)' : 'none', opacity:.55 }} />
              ))}
            </div>
          </div>
        </div>
      );
    }
    function DigitBox({ v }){
      return (
        <span className="pls-mono" style={{ background:'var(--bg-surface)', border:'1px solid var(--border-quiet)',
          borderRadius:8, padding:'6px 8px', fontSize:20, fontWeight:500, color:'var(--text-primary)', minWidth:30, textAlign:'center' }}>{v}</span>
      );
    }
    function DropCountdown({ start=6*3600+42*60+9 }){
      const [s, setS] = useState(start);
      useEffect(()=>{ const t = setInterval(()=> setS(x => x>0 ? x-1 : 0), 1000); return ()=>clearInterval(t); }, []);
      const hh = String(Math.floor(s/3600)).padStart(2,'0');
      const mm = String(Math.floor((s%3600)/60)).padStart(2,'0');
      const ss = String(s%60).padStart(2,'0');
      const Colon = () => <span className="pls-mono" style={{ color:'var(--accent)', fontSize:18, fontWeight:500 }}>:</span>;
      return (
        <div className="flex items-center gap-1.5">
          <DigitBox v={hh} /><Colon /><DigitBox v={mm} /><Colon /><DigitBox v={ss} />
        </div>
      );
    }

    function LoopCard({ loop, variant='default', onOpen, showAction=true }){
      const forming = loop.status === 'forming';
      const n = loop.memberIds.length;
      return (
        <Card variant={variant} className="p-4 rise">
          <button onClick={onOpen} className="w-full text-left" style={{ background:'none', border:'none', cursor:'pointer', display:'block', padding:0 }}>
            <div className="flex items-start justify-between gap-2">
              <div className="min-w-0 flex-1">

              </div>
              {showAction && <Icon name="chevron-right" size={18} style={{ color:'var(--text-tertiary)', marginTop:4 }} />}
            </div>

            {forming ? (
              <div className="mt-3"><DropMeter count={loop.drop.count} target={loop.drop.target} /></div>
            ) : (
              <div className="mt-2 space-y-1.5">
                <RhythmLine text={loop.rhythm} />
                <div className="flex items-center gap-1.5" style={{ fontSize:12.5, color:'var(--text-secondary)' }}>
                  {loop.live

              <div className="text-right">

                      <div className="pls-mono" style={{ fontSize:11.5, color:'var(--text-tertiary)' }}>{n} in{loop.startedWeek?` · since wk ${loop.startedWeek}`:''}</div>

            </div>
          </button>

    function IntentCard({ raw, author, unit, sameCount, onSame }){

       CHROME

    function StatusBar(){

          <span className="flex items-center gap-1.5">
            <span className="pls-mono" style={{ fontSize:11, color:'var(--text-secondary)' }}>5G</span>
            <span style={{ width:20, height:11, borderRadius:3, border:'1.5px solid var(--text-secondary)', position:'relative', display:'inline-block' }}>

    /* ============================================================
       SHEETS  (compose intent · spin-up draft)
    ============================================================ */
    function Sheet({ kicker, title, onClose, children }){
      return (
        <div className="pls-scrim" onClick={onClose}>
          <div className="pls-sheet" onClick={e=>e.stopPropagation()}>
            <div className="pls-grab" />
            <div className="flex items-start justify-between mb-4">
              <div>
                {kicker && <div className="pls-kicker mb-1">{kicker}</div>}
                <h2 className="pls-display" style={{ fontWeight:700, fontSize:22, color:'var(--text-primary)', lineHeight:1.15 }}>{title}</h2>

              <IconButton name="x" size={20} label="Close" onClick={onClose} className="-mr-2" />

          </div>

    function ComposeSheet({ onClose, onSubmit }){
      const [text, setText] = useState('');

        <Sheet kicker="Drop an intent" title="What are you trying to make happen?" onClose={onClose}>
          <div className="pls-fieldwrap" style={{ alignItems:'flex-start', padding:'12px 14px' }}>
            <span style={{ color:'var(--accent)', marginTop:2 }}><Icon name="circle-dot" size={18} /></span>
            <textarea value={text} onChange={e=>setText(e.target.value)} rows={3} autoFocus

            <div className="flex items-center gap-1.5 mb-3 text-[12.5px]" style={{ color:'var(--text-tertiary)' }}>
              <Icon name="quote" size={13} /><span className="truncate">from “{d.raw}”</span>
            </div>

          <LoopCard loop={preview} variant="outline" showAction={false} onOpen={()=>{}} />
          <div className="mt-4 space-y-3">

              <label className="block"><span className="pls-kicker">Time</span>

            <button onClick={()=>set('repeat', !d.repeat)} className="flex items-center gap-2.5" style={{ background:'none', border:'none', cursor:'pointer', padding:0 }}>
              <span style={{ width:22, height:22, borderRadius:6, display:'flex', alignItems:'center', justifyContent:'center',
                background: d.repeat?'var(--accent)':'transparent', border:'1.5px solid '+(d.repeat?'var(--accent)':'var(--border-strong)'),
                color:'var(--accent-ink)', transition:'all var(--dur-1) var(--ease-out)' }}>

    function SafetySheet({ subject, onClose, onSend }){
      const [text, setText] = useState('');

        <Sheet kicker="Confidential" title="Report a safety concern" onClose={onClose}>

            <span style={{ color:'var(--accent-strong)', flexShrink:0 }}><Icon name="shield" size={18} /></span>
            <p className="text-[13.5px]" style={{ color:'var(--text-primary)', lineHeight:1.5 }}>

            <Button block onClick={()=>onSend(text)} disabled={!text.trim()} icon="shield">Send to {first}</Button>
          </div>
        </Sheet>
      );

    /* ============================================================
       SHARE — "drop a loop": a simulated SMS / WhatsApp OG unfurl.
       No backend: we render the rich link preview exactly as it
       lands in a friend's texts, then fold them in from the tap.
       (Real og: tags are the documented later upgrade, like Layer B.)
    ============================================================ */
    function loopSlug(id){ return 'loop.so/j/' + (hashInt(id||'loop').toString(36).slice(0,4)); }

    function OgUnfurl({ loop }){
      const count  = (loop.memberIds ? loop.memberIds.length : 3);
      const line   = loop.nextLine || loop.rhythm || 'meets this week';
      const course = (loop.target || 'study').toString();
      return (
        <div style={{ borderRadius:14, overflow:'hidden', border:'1px solid rgba(0,0,0,.10)', background:'#fff', width:242 }}>
          <div style={{ background:'#FF5C3A', padding:'13px 14px 12px', color:'#fff' }}>
            <div style={{ display:'flex', alignItems:'center', gap:6, fontWeight:800, letterSpacing:'-.02em', fontSize:15 }}>
              <Icon name="flame" size={16} /> Loop
            </div>
            <div style={{ marginTop:9, fontSize:11.5, fontWeight:600, opacity:.94, letterSpacing:'.02em' }}>{course} · study loop</div>
          </div>
          <div style={{ padding:'11px 13px 12px' }}>
            <div style={{ fontWeight:700, fontSize:13.5, color:'#111', lineHeight:1.25 }}>{loop.title}</div>
            <div style={{ fontSize:12, color:'#555', marginTop:3 }}>{line}</div>
            <div style={{ display:'flex', alignItems:'center', gap:5, marginTop:8, fontSize:11.5, color:'#FF5C3A', fontWeight:600 }}>
              <Icon name="flame" size={13} /> {count} already in · same faces weekly
            </div>
            <div style={{ marginTop:8, fontSize:10.5, letterSpacing:'.05em', color:'#9AA0A6', textTransform:'uppercase' }}>{loopSlug(loop.id)}</div>
          </div>
        </div>
      );
    }

    const CHAT_THEME = {
      messages: { header:'#F7F7F8', headerInk:'#111', pane:'#fff',     out:'#0B93F6', outInk:'#fff',    in:'#E9E9EB', inInk:'#111',    sub:'iMessage' },
      whatsapp: { header:'#008069', headerInk:'#fff', pane:'#EFEAE2', out:'#D9FDD3', outInk:'#111B21', in:'#fff',    inInk:'#111B21', sub:'WhatsApp' },
    };

    function ChatBubble({ side, theme, children }){
      const out = side==='out';
      return (
        <div style={{ display:'flex', justifyContent: out?'flex-end':'flex-start', marginTop:6 }}>
          <div style={{ maxWidth:'86%', background: out?theme.out:theme.in, color: out?theme.outInk:theme.inInk,
            borderRadius:16, padding:'8px 10px', fontSize:13.5, lineHeight:1.4, boxShadow:'0 1px 1px rgba(0,0,0,.08)',
            borderBottomRightRadius: out?4:16, borderBottomLeftRadius: out?16:4 }}>
            {children}

    function TypingBubble({ theme }){
      return (
        <div style={{ display:'flex', justifyContent:'flex-start', marginTop:6 }}>
          <div style={{ background:theme.in, borderRadius:16, borderBottomLeftRadius:4, padding:'10px 12px', display:'flex', gap:4 }}>
            {[0,1,2].map(i=>(
              <span key={i} style={{ width:6, height:6, borderRadius:'50%', background:'#9AA0A6',
                display:'inline-block', animation:`pulse-dot 1s ${i*0.18}s infinite ease-in-out` }} />
            ))}
          </div>
        </div>

    }

    function ShareSheet({ loop, onClose, onSent }){
      const [channel, setChannel] = useState(null);   // null = channel picker, else the thread
      const [step, setStep]       = useState(0);       // 0 sent · 1 typing · 2 reply · 3 folded in
      const [copied, setCopied]   = useState(false);
      useEffect(()=>{
        if(!channel) return;
        setStep(0);
        const a = setTimeout(()=>setStep(1), 850);
        const b = setTimeout(()=>setStep(2), 2050);
        const c = setTimeout(()=>setStep(3), 3350);
        return ()=>{ clearTimeout(a); clearTimeout(b); clearTimeout(c); };
      }, [channel]);

      if(!channel){
        const copy = () => { try{ navigator.clipboard && navigator.clipboard.writeText('https://'+loopSlug(loop.id)); }catch(e){} setCopied(true); };
        const Ch = ({ id, icon, label, bg }) => (
          <button onClick={()=>setChannel(id)} className="rise"
            style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:9, padding:'16px 10px',
              borderRadius:16, border:'1px solid var(--border-hairline)', background:'var(--bg-surface)', cursor:'pointer' }}>

        return (
          <Sheet kicker="Drop this loop" title="Send it to a friend" onClose={onClose}>
            <p className="text-[13px] leading-relaxed" style={{ color:'var(--text-secondary)' }}>
              This is exactly what lands in their texts. One tap folds them straight into the rhythm — no cold DM, no feed to scroll.
            </p>
            <div className="mt-3.5 flex justify-center"><OgUnfurl loop={loop} /></div>

      }

      const th   = CHAT_THEME[channel];
      const done = step>=3;
      return (
        <Sheet kicker={th.sub} title="Text a friend" onClose={onClose}>
          <div style={{ borderRadius:16, overflow:'hidden', border:'1px solid var(--border-hairline)' }}>

              <span>Kaia · Donlon 3F</span>

            </div>
            <div style={{ background:th.pane, padding:'12px 12px 16px', minHeight:236 }}>
              <div style={{ textAlign:'center', fontSize:10.5, color:'#9AA0A6', marginBottom:4 }}>now</div>
              <ChatBubble side="out" theme={th}>
                <div style={{ marginBottom:7 }}>come lock in with us 🔒 dropping you the loop</div>
                <OgUnfurl loop={loop} />

              {step===1 && <TypingBubble theme={th} />}
              {step>=2 && (
                <div className="fade-in">
                  <ChatBubble side="in" theme={th}>omg yes i've been meaning to start {loop.target} hw early 😭 count me in</ChatBubble>
                </div>

              {done && (
                <div className="fade-in" style={{ textAlign:'center', marginTop:12 }}>
                  <span style={{ display:'inline-flex', alignItems:'center', gap:6, background:'var(--accent-quiet)', color:'var(--accent-strong)',

          </div>
          <div className="mt-4">
            <Button block disabled={!done} onClick={()=>onSent('Kaia')} icon="users">
              {done ? "Done — she's folded in" : 'She taps the loop…'}
            </Button>

          <button onClick={()=>setChannel(null)} className="w-full mt-2 text-center"
            style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-tertiary)', fontSize:12.5 }}>
            ← try another app

        </Sheet>

            {toast.userId

            <button onClick={onClose} aria-label="Dismiss" style={{ background:'none', border:'none', color:'inherit', opacity:.7, cursor:'pointer', padding:4 }}>

    function SuggestionCard({ card, actions }){
      if (card.kind === 'join') {
        const l = card.loop;
        return <LoopCard loop={l} onOpen={()=>actions.openLoop(l.id)} />;
      }
      if (card.kind === 'spinup') {
        return (
          <Card className="p-4 rise">
            <div className="flex items-center gap-2 mb-1">
              <Chip variant="accent" icon="plus">spin up</Chip>
              <span className="pls-kicker" style={{ color:'var(--unit-class)' }}>{card.target.toLowerCase()} · section</span>
            </div>
            <h3 className="pls-display" style={{ fontWeight:700, fontSize:18, color:'var(--text-primary)' }}>Start a {card.target} loop</h3>
            <p className="text-[13px] mt-1" style={{ color:'var(--text-secondary)' }}>{card.subtitle}</p>
            <div className="mt-3"><Button variant="secondary" size="sm" onClick={()=>actions.startSpinup(card.target)} icon="plus">Spin one up</Button></div>
          </Card>
        );
      }
      // forming
      const l = card.loop;
      return (
        <Card className="p-4 rise">
          <UnitKicker unit={l.unit} />
          <h3 className="pls-display" style={{ fontWeight:700, fontSize:18, marginTop:4, color:'var(--text-primary)' }}>{l.title}</h3>
          <div className="mt-3"><DropMeter count={l.drop.count} target={l.drop.target} /></div>
          <div className="mt-3"><Button variant="secondary" size="sm" onClick={()=>actions.wantThis(l.id)} icon="plus">I want this too</Button></div>
        </Card>
      );
    }

    function LoopDetail({ loop, viewerId='sarah', onBack, actions, highlightId, banner, theme, feedback }){
      const isMember = loop.memberIds.includes(viewerId);
      const forming = loop.status === 'forming';
      const isHost = loop.coordinatorId===viewerId;
      const others = loop.memberIds.filter(id => id!==viewerId);
      return (
        <div className="h-full flex flex-col fade-in">

    /* ============================================================

    // Animate a number from 0 → target on mount, so the dashboard reads as live.
    function useCountUp(target, dur=1100){
      const [v, setV] = useState(0);
      useEffect(()=>{
        let raf, start;
        const step = (t)=>{
          if(start==null) start=t;
          const p = Math.min(1, (t-start)/dur);
          const eased = 1 - Math.pow(1-p, 3);   // easeOutCubic
          setV(target*eased);
          if(p<1) raf=requestAnimationFrame(step);
          else setV(target);
        };
        raf=requestAnimationFrame(step);
        return ()=>cancelAnimationFrame(raf);
      }, [target, dur]);
      return v;
    }
    function CountStat({ value, label, suffix='', icon, accent, dur=1100 }){
      const v = useCountUp(value, dur);
      const shown = Math.round(v).toLocaleString() + suffix;
      return (
        <div className="flex flex-col gap-0.5">
          <div className="flex items-center gap-1" style={{ color: accent?'var(--accent-strong)':'var(--text-tertiary)' }}>
            {icon && <Icon name={icon} size={13} />}
            <span className="pls-kicker" style={{ color:'inherit' }}>{label}</span>
          </div>
          <span className="pls-mono" style={{ fontSize:26, fontWeight:500, lineHeight:1.05,
            color: accent?'var(--accent-strong)':'var(--text-primary)' }}>{shown}</span>
        </div>
      );
    }
    // A crew's avatar row (display-only — no tap-through to a profile; guardrail preserved).
    function CrewFaces({ members, size=22, max=3 }){
      const shown = members.slice(0, max);

            <div key={m.id} style={{ marginLeft:-8, zIndex:10-i }}><Avatar id={m.id} name={m.name} size={size} ring /></div>

                 className="pls-avatar text-[10px] font-semibold">+{extra}</div>
          )}
        </div>
      );
    }

            <Card className="p-4">
              <div className="space-y-3">
                {COHORT_HOUSES.map((h,i)=>(
                  <div key={h.dorm} className="flex items-center gap-3">
                    <span className="pls-mono text-[12px]" style={{ width:16, color:'var(--text-tertiary)', flexShrink:0 }}>{i+1}</span>
                    <div className="min-w-0 flex-1">
                      <div className="flex items-center justify-between mb-1">
                        <span className="truncate" style={{ fontSize:13.5, fontWeight:i===0?700:500,
                          color: i===0?'var(--accent-strong)':'var(--text-primary)' }}>{h.dorm}</span>
                        <span className="pls-mono text-[12px]" style={{ color:'var(--text-secondary)' }}>{h.pct}%</span>
                      </div>
                      <div style={{ height:6, borderRadius:999, background:'var(--bg-sunken)', overflow:'hidden' }}>
                        <div style={{ height:'100%', width:h.pct+'%', borderRadius:999,
                          background: i===0?'var(--accent)':'color-mix(in srgb, var(--accent) 55%, var(--bg-sunken))',

              <div className="pls-kicker mb-1.5 flex items-center gap-1.5"><Icon name="shield" size={12} />No scoreboard for people</div>
              <p className="text-[13px] leading-relaxed" style={{ color:'var(--text-secondary)' }}>
                Crews and houses show up here — never individuals. Nobody in the Class of {COHORT.classOf} is ranked, scored, or told where they land. The only thing Loop counts is how often the same people come back.
              </p>
            </Card>

          <TabBar active="class" unread={unread}
            onHome={actions.goHome} onClass={()=>{}} onAlerts={actions.openNotifications} onYou={actions.openYou} />

      );
    }

    /* ============================================================
       ADVISOR DASHBOARD — Dana's view (staff surface, not the student
       app). Shows caseload belonging as ONE number + a reach-out list,
       never intents or messages (§2 guardrail). This is the "why it
       matters to the institution" perspective.
    ============================================================ */
    function AdvisorDashboard({ state, actions }){
      const { campus, theme } = state;
      const inLoop = Math.round(ADVISOR_CASELOAD * campus.inLoopPct/100);
      const notYet = ADVISOR_CASELOAD - inLoop;
      const pctIn = useCountUp(campus.inLoopPct, 1100);
      const ring = Math.round(pctIn);
      return (
        <div className="h-full flex flex-col" style={{ position:'relative' }}>
          <AppHeader
            left={
              <div className="flex items-center gap-2">
                <div style={{ width:30, height:30, borderRadius:9, background:'var(--accent-quiet)', color:'var(--accent-strong)',
                  display:'flex', alignItems:'center', justifyContent:'center' }}><Icon name="heart-handshake" size={16} /></div>
                <div className="leading-none">
                  <div className="pls-display" style={{ fontWeight:800, fontSize:16, color:'var(--text-primary)' }}>Advising & Wellbeing</div>
                  <div className="pls-kicker" style={{ fontSize:10 }}>{COUNSELOR.name} · staff view</div>
                </div>
              </div>
            }
            right={<IconButton name={theme==='afterdark'?'sun':'moon'} size={20} label="Toggle theme" onClick={actions.toggleTheme} />} />

          <div className="flex-1 overflow-y-auto no-scrollbar px-5 pt-4 pb-8 fade-in">
            <div className="flex items-center gap-1.5 pls-kicker" style={{ color:'var(--accent-strong)' }}>
              <LiveDot />your caseload, right now
            </div>
            <h1 className="pls-display mt-1" style={{ fontWeight:800, fontSize:26, lineHeight:1.05, color:'var(--text-primary)' }}>
              {inLoop} of {ADVISOR_CASELOAD} advisees<br/>are in a loop.
            </h1>

            {/* belonging ring */}
            <Card className="p-4 mt-4">
              <div className="flex items-center gap-4">
                <div style={{ position:'relative', width:92, height:92, flexShrink:0 }}>
                  <div style={{ position:'absolute', inset:0, borderRadius:'50%',
                    background:`conic-gradient(var(--accent) ${ring*3.6}deg, var(--bg-sunken) 0deg)` }} />
                  <div style={{ position:'absolute', inset:9, borderRadius:'50%', background:'var(--bg-surface)',
                    display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}>
                    <span className="pls-mono" style={{ fontSize:22, fontWeight:500, color:'var(--text-primary)', lineHeight:1 }}>{ring}%</span>
                    <span className="pls-kicker" style={{ fontSize:8.5 }}>in a loop</span>
                  </div>
                </div>
                <div className="min-w-0 flex-1">
                  <p className="text-[13px] leading-relaxed" style={{ color:'var(--text-secondary)' }}>
                    Students in at least one loop stay enrolled and see you earlier. Loop shares this as <span style={{ color:'var(--text-primary)', fontWeight:600 }}>one number</span> — a sign of who to reach out to, never their conversations.
                  </p>
                  <div className="flex items-center gap-4 mt-3">
                    <div className="flex flex-col">
                      <span className="pls-mono" style={{ fontSize:18, fontWeight:500, color:'var(--status-live)' }}>{inLoop}</span>
                      <span className="text-[11px]" style={{ color:'var(--text-tertiary)' }}>connected</span>
                    </div>
                    <div className="flex flex-col">
                      <span className="pls-mono" style={{ fontSize:18, fontWeight:500, color:'var(--accent-strong)' }}>{notYet}</span>
                      <span className="text-[11px]" style={{ color:'var(--text-tertiary)' }}>not yet</span>
                    </div>
                  </div>
                </div>
              </div>
            </Card>

            {/* reach-out list */}
            <div className="mt-6 flex items-center gap-1.5">
              <Icon name="life-buoy" size={17} style={{ color:'var(--accent)' }} />
              <h2 className="pls-display" style={{ fontWeight:700, fontSize:16, color:'var(--text-primary)' }}>Who to reach out to</h2>
            </div>
            <p className="text-[12px] mt-0.5 mb-3" style={{ color:'var(--text-secondary)' }}>Advisees in no loop yet — a nudge from you, not an algorithm.</p>

            <div className="space-y-2.5">
              {ADVISOR_REACH.map((s,i)=>(
                <Card key={s.id} className="p-3.5 rise" style={{ animationDelay:(i*45)+'ms' }}>
                  <div className="flex items-center gap-3">
                    <Avatar id={s.id} name={s.name} size={40} />
                    <div className="min-w-0 flex-1">
                      <div className="flex items-center gap-2">
                        <span className="truncate" style={{ fontWeight:600, fontSize:14, color:'var(--text-primary)' }}>{s.name}</span>
                        <span className="pls-chip pls-chip--static" style={{ flexShrink:0 }}>{s.dorm}</span>
                      </div>
                      <div className="pls-mono text-[11px] mt-0.5" style={{ color:'var(--accent-strong)' }}>{s.signal}</div>
                      <p className="text-[12px] mt-1" style={{ color:'var(--text-secondary)' }}>{s.note}</p>
                    </div>
                  </div>
                  <div className="mt-3">
                    <Button size="sm" variant="secondary" icon="message-square" onClick={()=>actions.advisorReach(s.name)}>Reach out</Button>
                  </div>

              ))}

            <Card variant="sunken" className="p-4 mt-5">
              <div className="pls-kicker mb-1.5 flex items-center gap-1.5"><Icon name="shield" size={12} />What you never see</div>
              <p className="text-[13px] leading-relaxed" style={{ color:'var(--text-secondary)' }}>
                No intents, no messages, no who-likes-whom. Only whether a student has landed in a loop — the one signal that predicts whether they'll stay. Everything else stays on their phone.
              </p>
            </Card>
          </div>
        </div>
      );
    }

    /* ============================================================
       APP  — state machine + all mutations
    ============================================================ */
    function App(){
      const [screen, setScreen] = useState('splash');   // splash|email|basics|intent|home|class|loop|notifs|you|advisor
      const [sheet, setSheet]   = useState(null);        // null|compose|spinup|safety|share
      const [theme, setTheme]   = useState('daylight');  // daylight|afterdark
      const [user, setUser]     = useState(null);
      const [viewerId, setViewerId] = useState('sarah'); // whose perspective the phone is showing
      const [loops, setLoops]   = useState(seedLoops);
      const [suggestions, setSuggestions] = useState(null);
      const [activeLoopId, setActiveLoopId] = useState(null);
      const [highlightId, setHighlightId]   = useState(null);
      const [detailBanner, setDetailBanner] = useState(null);
      const [draft, setDraft]   = useState(null);
      const [nudge, setNudge]   = useState(null);
      const [notifs, setNotifs] = useState([]);
      const [toast, setToast]   = useState(null);
      const [foldedIn, setFoldedIn] = useState(false);
      const [feedback, setFeedback] = useState({});
      const [safetySubject, setSafetySubject] = useState(null);
      const [shareLoopId, setShareLoopId]     = useState(null);
      const campus = useMemo(()=> buildCampus(COHORT.enrolling), []);

      useEffect(()=>{
        const root = document.documentElement;
        if (theme==='afterdark') root.setAttribute('data-theme','afterdark');
        else root.removeAttribute('data-theme');
      }, [theme]);

      const toastTimer = useRef(null);
      const showToast = (t) => {
        setToast(t); clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(()=>setToast(null), 7000);
      };
      const toggleTheme = () => setTheme(t => t==='afterdark' ? 'daylight' : 'afterdark');
      const unread = notifs.filter(n=>n.unread).length;

      /* ----- onboarding ----- */
      const start   = () => setScreen('email');
      const verify  = (email) => { setUser(u=>({ ...(u||{}), email })); setScreen('basics'); };
      const basics  = (b) => { setUser({ id:'sarah', ...b }); setScreen('intent'); };
      const firstIntent = (text) => { runIntent(text); setScreen('home'); };

      /* ----- intent -> suggestions (S6) ----- */
      const runIntent = (raw) => {
        const parse = parseIntent(raw);
        if (isSpinup(raw)) { startSpinupFromText(raw, parse); return; }
        const cards = [];
        const activeJoin = loops.find(l => l.target===parse.target && l.status==='active');
        if (activeJoin) cards.push({ kind:'join', loop:activeJoin });
        if (parse.type==='study' && parse.target) cards.push({ kind:'spinup', target:parse.target, subtitle:'11 others on your floor dropped this' });
        const forming = loops.find(l => l.target===parse.target && l.status==='forming');
        if (forming) cards.push({ kind:'forming', loop:forming });
        if (cards.length===0) cards.push({ kind:'spinup', target: parse.target || raw.trim(), subtitle:'Be the one who starts it — Loop fills the seats.' });
        setSuggestions({ raw: raw.trim().toLowerCase(), parse, cards });
      };
      const openCompose = () => setSheet('compose');
      const submitCompose = (raw) => { setSheet(null); runIntent(raw); if(screen!=='home') setScreen('home'); };
      const noop = () => {};

      /* ----- fold in (join a running loop) ----- */
      const foldIn = (loopId) => {
        setLoops(ls => ls.map(l => l.id===loopId && !l.memberIds.includes(viewerId)
          ? { ...l, memberIds:[...l.memberIds, viewerId] } : l));
        const l = loops.find(x=>x.id===loopId);
        setSuggestions(null);
        showToast({ title:`Folded in — ${l?.title}`, body:`Same faces, every week. The crew already knows the rhythm.` });
        openLoop(loopId);
        if (loopId==='sunday-hw' && viewerId==='sarah' && !foldedIn) armFoldIn();
      };
      const leaveLoop = (loopId) => {
        setLoops(ls => ls.map(l => l.id===loopId ? { ...l, memberIds:l.memberIds.filter(id=>id!==viewerId) } : l));
        showToast({ title:'Left the loop.', body:'The rhythm holds without you. Nobody sees a thing.' });
        setScreen('home');
      };
      const wantThis = (loopId) => {
        let fired = false;
        setLoops(ls => ls.map(l => {
          if (l.id!==loopId || l.status!=='forming') return l;
          const count = Math.min(l.drop.target, l.drop.count + 1);
          if (count >= l.drop.target) fired = true;
          return { ...l, drop:{ ...l.drop, count } };
        }));
        const l = loops.find(x=>x.id===loopId);
        const next = Math.min(l.drop.target, l.drop.count + 1);
        if (next >= l.drop.target) showToast({ icon:'zap', title:'The drop fired.', body:`${l.title} just crystallized into a loop.` });
        else showToast({ icon:'circle-dot', title:'Dropped.', body:`${next}/${l.drop.target} in — ${l.drop.target-next} more and this drop fires.` });
      };

      /* ----- open a loop ----- */
      const openLoop = (loopId, highlight=null) => {
        setActiveLoopId(loopId); setHighlightId(highlight);
        setDetailBanner(highlight==='maya' ? { title:'Folded in. Maya knows the rhythm now.', body:'She lives on Donlon 2F and takes CS 2110 — seated straight into a loop that already meets.' } : null);
        setScreen('loop');
        setNotifs(ns => ns.map(n => ({ ...n, unread:false })));
      };
      const openNotifications = () => setScreen('notifs');
      const openYou = () => setScreen('you');
      const openClass = () => setScreen('class');
      const goHome = () => setScreen('home');

      /* ----- private feedback (like/neutral/dislike; only you see it) ----- */
      const setFeedbackFor = (id, v) => setFeedback(f => { const n={...f}; if(v==null) delete n[id]; else n[id]=v; return n; });

      /* ----- safety report → assigned counselor (confidential) ----- */
      const openSafety = (subject) => { setSafetySubject(subject); setSheet('safety'); };
      const openShare  = (loopId)  => { setShareLoopId(loopId); setSheet('share'); };
      const sendSafety = () => {
        const s = safetySubject; setSheet(null); setSafetySubject(null);
        showToast({ icon:'shield', title:`Sent privately to ${COUNSELOR.name}.`,
          body: s ? `Your concern about ${s} is confidential — never shown to the loop. She'll reach out.` : `It's confidential — never shown to the loop. She'll reach out.` });
      };
      const messageCounselor = () => showToast({ icon:'message-square', title:`Message sent to ${COUNSELOR.name}.`, body:`${COUNSELOR.hours}. She'll reply here.` });

      /* ----- spin-up (S8) ----- */
      const startSpinup = (target) => { setDraft({ ...buildDraft({ target }, ''), raw:`set up a study loop for ${target}`.toLowerCase(), target }); setSheet('spinup'); };
      const startSpinupFromText = (raw, parse) => { setDraft({ ...buildDraft(parse, raw), raw:raw.toLowerCase() }); setSheet('spinup'); };
      const sendDraft = (d) => {
        // Host "next session" mode: don't spawn a new loop — just send the next beat to the crew.
        if (d.host) {
          setSheet(null);
          showToast({ icon:'send', title:'Next session sent to the crew',
            body:`${d.day} · ${d.time} · ${d.location} — ${d.count||0} regulars, same faces. Loop reminds them.` });
          if (d.loopId) openLoop(d.loopId);
          return;
        }
        const id = 'spun-' + d.title.replace(/\s+/g,'-').toLowerCase();
        const crew = [viewerId, 'josh', 'lydia', 'ryan'].filter((x,i,a)=>a.indexOf(x)===i);
        const newLoop = {
          id, title:d.title, target:d.target, unit:{ kind:'class', label:`${d.target.toLowerCase()} · section` },
          status:'active', rhythm:`${d.day} · ${d.time} · ${d.location}${d.repeat?' · weekly':''}`,
          nextLine:`${d.day} · ${d.time} · ${d.location}`, live:true,
          memberIds:crew, cap:6, spun:true,
          startedWeek:3, streakWeeks:1, streakLeaderId:viewerId, coordinatorId:viewerId,
          seniority:Object.fromEntries(crew.map(x=>[x,3])),
        };
        setLoops(ls => [newLoop, ...ls]);
        setSheet(null); setSuggestions(null);
        showToast({ title:'Sent. 3 classmates already folded in.', body:'Loop holds the time, the place, and the next one.' });
        openLoop(id);
        armRecurrence(newLoop);
      };

      /* ----- recurrence nudge (the payoff, §5.5) ----- */
      const armRecurrence = (baseLoop) => {
        setNudge({
          kicker:'Two weeks later',
          body:`hw3 is due thursday. Loop drafted the next ${baseLoop.target} session — same faces?`,
          cta:'Bring the crew back', base:baseLoop,
        });
      };
      const tapNudge = () => {
        if (!nudge) return;
        const base = nudge.base;
        const recurId = base.id + '-hw3';
        let existing = loops.find(l=>l.id===recurId);
        if (!existing) {
          existing = { ...base, id:recurId, title:`${base.target} · HW3 grind`, live:false,
            streakWeeks:(base.streakWeeks||1)+2,
            timeMarker:'Started Week 3 on a pretext · same faces since', sameCrew:true };
          setLoops(ls => [existing, ...ls.filter(l=>l.id!==base.id)]);
        }
        setNudge(null);
        openLoop(recurId);
      };

      /* ----- fold-in (Maya, S9) ----- */
      const armFoldIn = () => {
        setFoldedIn(true);
        setTimeout(() => {
          setLoops(ls => ls.map(l => l.id==='sunday-hw' && !l.memberIds.includes('maya')
            ? { ...l, memberIds:[...l.memberIds, 'maya'] } : l));
          setNotifs(ns => [{ id:'foldin-maya', type:'foldin', userId:'maya', target:'CS 2110',
            loopId:'sunday-hw', loopTitle:'Sunday HW crew', unread:true }, ...ns]);
          showToast({ userId:'maya', title:'Maya folded into your Sunday HW crew',
            body:'Donlon 2F · CS 2110 — she knows the rhythm now',
            open:{ loopId:'sunday-hw', highlight:'maya' } });
        }, 2600);
      };

      /* ----- host controls (coordinator perspective) ----- */
      const hostDraftNext = (loop) => {
        const base = buildDraft({ target: loop.target }, '');
        setDraft({ ...base, title:`${loop.target} · next session`, target:loop.target, raw:'', host:true, loopId:loop.id, count:loop.memberIds.length });
        setSheet('spinup');
      };
      const messageCrew = (loop) => showToast({ icon:'message-square', title:`Sent to the ${loop.title}`, body:`${loop.memberIds.length} regulars get it — no new thread, no cold DM.` });

      /* ----- advisor controls ----- */
      const advisorReach = (name) => showToast({ icon:'heart-handshake', title:`Reached out to ${name.split(' ')[0]}`, body:`A warm note from you — Loop never tells them how you knew.` });

      /* ----- persona switcher (out-of-frame; brings the demo alive) ----- */
      const switchPersona = (pid) => {
        const p = PERSONA_BY_ID[pid];
        if (!p) return;
        clearTimeout(toastTimer.current);
        setViewerId(pid);
        setSheet(null); setSuggestions(null); setActiveLoopId(null); setHighlightId(null);
        setDetailBanner(null); setDraft(null); setNudge(null); setToast(null);
        setSafetySubject(null); setShareLoopId(null); setFeedback({}); setFoldedIn(false);
        setUser({ id:p.id, name:p.name, dorm:p.dorm, major:p.major, year:p.year });

        let ls = seedLoops();
        if (pid==='maya') {
          // latecomer: seat her into a loop that already meets — no cold start
          ls = ls.map(l => l.id==='sunday-hw'
            ? { ...l, memberIds:[...l.memberIds, 'maya'], seniority:{ ...l.seniority, maya:12 }, foldedInFor:'maya' }
            : l);
        }
        setLoops(ls);

        // host sees Maya's fold-in already waiting; others start clean
        setNotifs(pid==='josh'
          ? [{ id:'foldin-maya', type:'foldin', userId:'maya', target:'CS 2110', loopId:'sunday-hw', loopTitle:'Sunday HW crew', unread:true }]
          : []);

        // seeker lands with her intent already dropped, so the suggestions show
        if (pid==='sarah') {
          const raw = 'lock in for cs 2110';
          const parse = parseIntent(raw);
          const cards = [];
          const activeJoin = ls.find(l => l.target===parse.target && l.status==='active');
          if (activeJoin) cards.push({ kind:'join', loop:activeJoin });
          cards.push({ kind:'spinup', target:parse.target, subtitle:'11 others on your floor dropped this' });
          const forming = ls.find(l => l.target===parse.target && l.status==='forming');
          if (forming) cards.push({ kind:'forming', loop:forming });
          setSuggestions({ raw, parse, cards });
        }
        setScreen(p.land);
      };

      const actions = {
        openCompose, noop, foldIn, leaveLoop, wantThis, openLoop, openNotifications,
        startSpinup, tapNudge, toggleTheme, openYou, openClass, goHome,
        setFeedbackFor, openSafety, messageCounselor, openShare,
        hostDraftNext, messageCrew, advisorReach,
      };

      const activeLoop = loops.find(l => l.id===activeLoopId);
      const shareLoop  = loops.find(l => l.id===shareLoopId);

      const reset = () => {
        clearTimeout(toastTimer.current);
        setScreen('splash'); setSheet(null); setUser(null); setViewerId('sarah'); setLoops(seedLoops());
        setSuggestions(null); setActiveLoopId(null); setHighlightId(null); setDetailBanner(null);
        setDraft(null); setNudge(null); setNotifs([]); setToast(null); setFoldedIn(false);
        setSheet(null); setFeedback({}); setSafetySubject(null); setShareLoopId(null);
      };

      return (
        <>
          <div className="phone">
            <StatusBar />
            <div style={{ flex:1, position:'relative', overflow:'hidden' }}>
              <Toast toast={toast}
                onTap={()=>{ if(toast?.open){ openLoop(toast.open.loopId, toast.open.highlight); } else { openNotifications(); } setToast(null); }}
                onClose={()=>setToast(null)} />

              {screen==='splash' && <Splash onStart={start} theme={theme} onToggleTheme={toggleTheme} />}
              {screen==='email'  && <EmailVerify onBack={()=>setScreen('splash')} onNext={verify} />}
              {screen==='basics' && <Basics onBack={()=>setScreen('email')} onNext={basics} />}
              {screen==='intent' && <FirstIntent onBack={()=>setScreen('basics')} onNext={firstIntent} />}
              {screen==='home'   && user && (
                <Home state={{ user, viewerId, loops, suggestions, nudge, unread, theme, campus }} actions={actions} />
              )}
              {screen==='loop'   && activeLoop && (
                <LoopDetail loop={activeLoop} viewerId={viewerId} highlightId={highlightId} banner={detailBanner} theme={theme} feedback={feedback}
                  onBack={()=>setScreen('home')} actions={actions} />
              )}
              {screen==='class'  && (
                <ClassDashboard state={{ campus, theme, unread }} actions={actions} />
              )}
              {screen==='advisor' && (
                <AdvisorDashboard state={{ campus, theme }} actions={actions} />
              )}
              {screen==='you'    && user && (
                <YouScreen state={{ user, viewerId, loops, campus, theme, unread, feedbackCount: Object.keys(feedback).length }} actions={actions} />
              )}
              {screen==='notifs' && (
                <Notifications items={notifs} onBack={()=>setScreen('home')} actions={actions} />
              )}

              {sheet==='compose' && <ComposeSheet onClose={()=>setSheet(null)} onSubmit={submitCompose} />}
              {sheet==='spinup' && draft && <SpinUpSheet draft={draft} onClose={()=>setSheet(null)} onSend={sendDraft} />}
              {sheet==='safety' && <SafetySheet subject={safetySubject} onClose={()=>{ setSheet(null); setSafetySubject(null); }} onSend={sendSafety} />}
              {sheet==='share' && shareLoop && <ShareSheet loop={shareLoop}
                onClose={()=>{ setSheet(null); setShareLoopId(null); }}
                onSent={(name)=>{ setSheet(null); setShareLoopId(null);
                  showToast({ icon:'users', title:`${name} folded in from your drop`, body:`Straight into ${shareLoop.title} — no cold DM, no feed.` }); }} />}
            </div>
          </div>

          {/* out-of-frame demo switcher — cycle the phone through each point of view.
              Not part of the app UI; it's the director's console for the demo. */}
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:8 }}>
            <div className="pls-kicker" style={{ fontSize:10, color:'var(--text-tertiary)' }}>view the demo as</div>
            <div style={{ display:'flex', gap:6, flexWrap:'wrap', justifyContent:'center', maxWidth:390 }}>
              {PERSONAS.map(p => {
                const on = viewerId===p.id;
                return (
                  <button key={p.id} onClick={()=>switchPersona(p.id)}
                    style={{ display:'flex', alignItems:'center', gap:7, cursor:'pointer',
                      padding:'5px 11px 5px 5px', borderRadius:999,
                      background: on ? 'var(--accent-quiet)' : 'var(--bg-surface)',
                      border:'1px solid '+(on ? 'transparent' : 'var(--border-hairline)'),
                      boxShadow: on ? 'var(--glow-accent)' : 'none',
                      transition:'background var(--dur-1), box-shadow var(--dur-2)' }}>
                    <Avatar id={p.id} name={p.name} size={24} ring={false} />
                    <span style={{ textAlign:'left', lineHeight:1.1 }}>
                      <span style={{ display:'block', fontSize:12.5, fontWeight:600,
                        color: on ? 'var(--accent-strong)' : 'var(--text-primary)' }}>{p.name.split(' ')[0]}</span>
                      <span style={{ display:'block', fontSize:10, color:'var(--text-tertiary)' }}>{p.role}</span>
                    </span>
                  </button>
                );
              })}
            </div>
            <button onClick={reset} className="flex items-center gap-1.5"
              style={{ background:'none', border:'none', cursor:'pointer', fontSize:12, color:'var(--text-tertiary)' }}>
              <Icon name="rotate-ccw" size={13} />restart demo
            </button>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
