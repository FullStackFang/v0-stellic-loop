<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loop — Your people, on repeat</title>

  <!-- Tailwind (Play CDN) — layout utilities only; all color/shape/type is token-driven -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Pulse Design System type: Gabarito (display) · Figtree (UI/body) · IBM Plex Mono (numerals) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Lucide icons via CDN (the DS icon set). Icons are also embedded inline below as an
       SVG-path fallback so a blocked CDN never yields empty glyphs on camera. -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- React + Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    // Force the CLASSIC JSX runtime (React.createElement via the global React).
    Babel.registerPreset('react-classic', {
      presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]],
    });
  </script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink:      'var(--text-primary)',
            'ink-2':  'var(--text-secondary)',
            'ink-3':  'var(--text-tertiary)',
            accent:   'var(--accent)',
            paper:    'var(--bg-page)',
            surface:  'var(--bg-surface)',
            sunken:   'var(--bg-sunken)',
            hair:     'var(--border-hairline)',
          },
          fontFamily: {
            display: ['Gabarito', 'system-ui', 'sans-serif'],
            sans:    ['Figtree', 'system-ui', 'sans-serif'],
            mono:    ['IBM Plex Mono', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>

  <style>
    /* ===== Pulse Design System — token layer (design.md D1), Daylight (default) ===== */
    :root{
      --paper-0:#fffdf8; --paper-1:#f9f4ec; --paper-2:#f0e8da; --paper-3:#e3d8c6;
      --ink-0:#1f1a17; --ink-1:#352d28; --ink-2:#6a5e56; --ink-3:#98897e; --ink-4:#c5b8aa;
      --carnelian-100:#f8e6e3; --carnelian-200:#f0c5c0; --carnelian-300:#e08d84; --carnelian-400:#cf5347;
      --carnelian-500:#b31b1b; --carnelian-600:#8a1414; --carnelian-700:#680f0f;
      --moss-500:#3d8a5f; --amber-500:#b6862b; --amber-600:#8a641f; --rose-500:#a04f6a; --slate-500:#59657a;
      /* semantic */
      --bg-page:var(--paper-1); --bg-surface:var(--paper-0); --bg-raised:#fffefb; --bg-sunken:var(--paper-2);
      --bg-blush:var(--carnelian-100); --bg-inverse:var(--ink-0); --bg-scrim:rgba(31,26,23,.44);
      --text-primary:var(--ink-0); --text-secondary:var(--ink-2); --text-tertiary:var(--ink-3);
      --text-inverse:var(--paper-0); --text-link:var(--carnelian-600);
      --border-hairline:var(--paper-3); --border-strong:var(--ink-0); --border-quiet:rgba(31,26,23,.08);
      --accent:var(--carnelian-500); --accent-strong:var(--carnelian-600); --accent-quiet:var(--carnelian-100); --accent-ink:var(--paper-0);
      --status-live:var(--moss-500); --status-forming:var(--amber-500); --status-full:var(--carnelian-500);
      --unit-dorm:var(--rose-500); --unit-class:var(--slate-500); --unit-major:var(--amber-600);
      --focus-ring:var(--carnelian-500);
      /* type */
      --font-display:'Gabarito',system-ui,sans-serif; --font-sans:'Figtree',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
      /* radii */
      --radius-md:14px; --radius-lg:22px; --radius-xl:28px; --radius-2xl:34px; --radius-pill:999px;
      /* shadows (warm) */
      --shadow-card:0 1px 2px rgba(80,40,30,.05),0 4px 14px -10px rgba(80,40,30,.14);
      --shadow-raised:0 8px 26px -12px rgba(80,40,30,.2); --shadow-pop:0 28px 60px -24px rgba(80,40,30,.3);
      --glow-accent:0 6px 18px -10px var(--carnelian-500);
      /* motion */
      --dur-1:120ms; --dur-2:180ms; --dur-3:260ms; --dur-4:420ms;
      --ease-out:cubic-bezier(.2,.8,.2,1); --ease-settle:cubic-bezier(.16,1,.3,1); --ease-pop:cubic-bezier(.34,1.56,.64,1);
    }
    /* ===== Big Red Night ===== */
    :root[data-theme="afterdark"]{
      --bg-page:#181310; --bg-surface:#211a16; --bg-raised:#2a221d; --bg-sunken:#12100c; --bg-blush:#2c1815;
      --text-primary:#f8f1e8; --text-secondary:#bcafa2; --text-tertiary:#8d8074;
      --border-hairline:#342a24; --border-strong:#4e4139; --border-quiet:rgba(248,241,232,.1);
      --accent:var(--carnelian-400); --accent-strong:var(--carnelian-300); --accent-quiet:rgba(207,83,71,.16); --accent-ink:#1a0d0b;
      --focus-ring:var(--carnelian-300);
      --shadow-card:0 1px 2px rgba(0,0,0,.4); --shadow-raised:0 8px 26px -12px rgba(0,0,0,.7); --shadow-pop:0 28px 60px -24px rgba(0,0,0,.8);
    }

    html, body { height: 100%; }
    body{
      margin:0; background:var(--bg-sunken);
      font-family:var(--font-sans); color:var(--text-primary);
      -webkit-font-smoothing:antialiased;
      transition: background var(--dur-3) var(--ease-out);
    }
    input, select, textarea, button { font-family: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    :focus-visible{ outline:2px solid var(--focus-ring); outline-offset:2px; }

    /* ---- phone frame ---- */
    .phone{
      width:390px; max-width:100vw; height:800px; background:var(--bg-surface);
      border:1px solid var(--border-hairline); border-radius:40px; overflow:hidden;
      position:relative; display:flex; flex-direction:column; box-shadow:var(--shadow-pop);
    }
    .no-scrollbar::-webkit-scrollbar{ width:0; height:0; }
    .no-scrollbar{ scrollbar-width:none; }

    /* ---- typography helpers ---- */
    .pls-display{ font-family:var(--font-display); letter-spacing:-.02em; }
    .pls-mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
    .pls-kicker{ font-family:var(--font-sans); font-weight:600; text-transform:uppercase; letter-spacing:.08em; font-size:11.5px; color:var(--text-tertiary); }

    /* ---- buttons ---- */
    .pls-btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px;
      padding:0 20px; border-radius:var(--radius-pill); font-family:var(--font-sans); font-weight:600; font-size:15px;
      cursor:pointer; border:1px solid transparent; user-select:none;
      transition:background var(--dur-1) var(--ease-out), box-shadow var(--dur-2) var(--ease-out), transform var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out); }
    .pls-btn:disabled{ opacity:.4; cursor:default; }
    .pls-btn--block{ width:100%; }
    .pls-btn--sm{ min-height:38px; font-size:14px; padding:0 16px; }
    .pls-btn--primary{ background:var(--accent); color:var(--accent-ink); box-shadow:var(--glow-accent); }
    .pls-btn--primary:not(:disabled):active{ background:var(--accent-strong); box-shadow:none; transform:translateY(1px); }
    .pls-btn--secondary{ background:var(--bg-surface); color:var(--text-primary); border-color:var(--border-strong); }
    .pls-btn--secondary:not(:disabled):active{ background:var(--bg-sunken); transform:translateY(1px); }
    .pls-btn--ghost{ background:transparent; color:var(--text-secondary); }
    .pls-btn--ghost:not(:disabled):active{ background:var(--bg-sunken); }

    .pls-iconbtn{ display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px;
      border-radius:var(--radius-pill); background:transparent; color:var(--text-secondary); border:none; cursor:pointer;
      position:relative; transition:background var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out); }
    .pls-iconbtn:active{ background:var(--bg-sunken); }

    /* ---- account trigger + anchored menu (header) ---- */
    .pls-avbtn{ width:44px; height:44px; border-radius:var(--radius-pill); background:transparent; border:none; cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center; transition:background var(--dur-1) var(--ease-out); }
    .pls-avbtn:active{ background:var(--bg-sunken); }
    .pls-avbtn .pls-avatar{ box-shadow:0 0 0 1.5px var(--border-hairline); transition:box-shadow var(--dur-2) var(--ease-out); }
    .pls-avbtn[aria-expanded="true"] .pls-avatar{ box-shadow:0 0 0 2px var(--accent); }
    .pls-pop-scrim{ position:absolute; inset:0; z-index:58; }
    .pls-pop{ position:absolute; top:calc(56px + 46px); right:12px; width:264px; z-index:60; background:var(--bg-surface);
      border:1px solid var(--border-hairline); border-radius:18px; box-shadow:var(--shadow-pop); padding:6px;
      transform-origin:top right; animation:pop-in var(--dur-3) var(--ease-settle) both; }
    .pls-pop::before{ content:""; position:absolute; top:-6px; right:26px; width:11px; height:11px; background:var(--bg-surface);
      border-left:1px solid var(--border-hairline); border-top:1px solid var(--border-hairline); transform:rotate(45deg); }
    .pls-pop__hr{ border:0; border-top:1px solid var(--border-hairline); margin:2px 6px; }
    .pls-pop__item{ width:100%; display:flex; align-items:center; gap:10px; padding:10px; border:none; background:none; cursor:pointer;
      color:var(--text-primary); font-size:14px; font-weight:500; border-radius:11px; text-align:left; transition:background var(--dur-1) var(--ease-out); }
    .pls-pop__item:hover, .pls-pop__item:focus-visible{ background:var(--bg-sunken); outline:none; }
    .pls-seg{ display:flex; background:var(--bg-sunken); border-radius:11px; padding:3px; position:relative; }
    .pls-seg__thumb{ position:absolute; top:3px; bottom:3px; left:3px; width:calc(50% - 3px); border-radius:9px; background:var(--bg-surface);
      box-shadow:var(--shadow-card); transition:transform var(--dur-3) var(--ease-settle); }
    .pls-seg[data-dark="true"] .pls-seg__thumb{ transform:translateX(100%); }
    .pls-seg--3 .pls-seg__thumb{ width:calc((100% - 6px) / 3); transform:translateX(calc(var(--seg-i, 0) * 100%)); }
    .pls-seg__dot{ position:absolute; top:6px; right:8px; width:6px; height:6px; border-radius:50%; background:var(--accent); }
    .pls-seg__opt{ flex:1; border:none; background:transparent; cursor:pointer; color:var(--text-secondary); font-size:12.5px; font-weight:600;
      padding:7px 4px; border-radius:9px; display:flex; align-items:center; justify-content:center; gap:6px; position:relative; z-index:1;
      transition:color var(--dur-2) var(--ease-out); }
    .pls-seg__opt[aria-pressed="true"]{ color:var(--text-primary); }
    @keyframes pop-in{ from{ opacity:0; transform:translateY(-6px) scale(.94); } to{ opacity:1; transform:none; } }
    /* theme change: circular wipe from the control that was tapped (View Transitions; instant swap where unsupported) */
    ::view-transition-old(root), ::view-transition-new(root){ animation:none; mix-blend-mode:normal; }
    ::view-transition-new(root){ animation:theme-wipe 520ms var(--ease-out) both; }
    @keyframes theme-wipe{ from{ clip-path:circle(0 at var(--wipe-x,50%) var(--wipe-y,50%)); } to{ clip-path:circle(150% at var(--wipe-x,50%) var(--wipe-y,50%)); } }

    /* ---- surfaces ---- */
    .pls-card{ background:var(--bg-surface); border:1px solid var(--border-hairline); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); }
    .pls-card--outline{ border:1.5px solid var(--border-strong); box-shadow:none; }
    .pls-card--sunken{ background:var(--bg-sunken); border:1px solid var(--border-hairline); box-shadow:none; }
    .pls-blush{ background:var(--bg-blush); border:1px solid var(--border-quiet); border-radius:24px; }
    .pls-banner{ background:var(--accent-quiet); border:1px solid var(--border-quiet); border-radius:12px; }

    /* ---- badge / chip ---- */
    .pls-badge{ display:inline-flex; align-items:center; gap:4px; text-transform:uppercase; letter-spacing:.06em;
      font-weight:700; font-size:10.5px; line-height:1; padding:3px 7px; border-radius:5px; }
    .pls-chip{ display:inline-flex; align-items:center; gap:5px; font-weight:600; font-size:12px; line-height:1;
      padding:5px 10px; border-radius:var(--radius-pill); border:1px solid var(--border-hairline);
      background:var(--bg-surface); color:var(--text-secondary); }
    .pls-chip--accent{ background:var(--accent-quiet); border-color:transparent; color:var(--accent-strong); }
    .pls-chip--static{ background:var(--bg-sunken); border-color:transparent; color:var(--text-tertiary); }

    /* ---- inputs ---- */
    .pls-input{ width:100%; background:var(--bg-surface); border:1px solid var(--border-hairline); border-radius:12px;
      padding:13px 14px; font-size:16px; color:var(--text-primary); outline:none;
      transition:border-color var(--dur-1) var(--ease-out); }
    .pls-input:focus{ border-color:var(--focus-ring); }
    .pls-input::placeholder{ color:var(--text-tertiary); }
    .pls-fieldwrap{ display:flex; align-items:center; gap:8px; background:var(--bg-surface);
      border:1px solid var(--border-hairline); border-radius:12px; padding:11px 14px;
      transition:border-color var(--dur-1) var(--ease-out); }
    .pls-fieldwrap:focus-within{ border-color:var(--focus-ring); }

    /* ---- avatar ---- */
    .pls-avatar{ display:flex; align-items:center; justify-content:center; border-radius:var(--radius-pill);
      font-family:var(--font-mono); font-weight:500; flex-shrink:0; user-select:none; line-height:1; }

    /* ---- chrome ---- */
    .pls-header{ position:relative; z-index:40; background:var(--bg-surface); border-bottom:1px solid var(--border-hairline);
      display:flex; align-items:center; gap:6px; padding:0 12px; height:56px; flex-shrink:0; }
    .pls-tabbar{ z-index:40; height:64px; background:var(--bg-surface); border-top:1px solid var(--border-hairline);
      display:flex; align-items:stretch; flex-shrink:0; }
    .pls-tab{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
      font-size:10.5px; font-weight:600; color:var(--text-tertiary); background:none; border:none; cursor:pointer; }
    .pls-tab__glyph{ display:flex; align-items:center; justify-content:center; width:46px; height:28px;
      border-radius:var(--radius-pill); position:relative; transition:background var(--dur-1) var(--ease-out); }
    .pls-tab--active{ color:var(--accent-strong); }
    .pls-tab--active .pls-tab__glyph{ background:var(--accent-quiet); }
    .pls-fab{ position:absolute; right:18px; bottom:80px; width:56px; height:56px; border-radius:var(--radius-pill);
      background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center;
      border:none; cursor:pointer; box-shadow:var(--glow-accent), var(--shadow-raised); z-index:45;
      transition:transform var(--dur-1) var(--ease-out); }
    .pls-fab:active{ transform:translateY(1px) scale(.97); }

    /* ---- sheet / scrim / toast ---- */
    .pls-scrim{ position:absolute; inset:0; background:var(--bg-scrim); backdrop-filter:blur(2px);
      -webkit-backdrop-filter:blur(2px); z-index:60; display:flex; align-items:flex-end; animation:scrim-in var(--dur-2) ease both; }
    .pls-sheet{ width:100%; background:var(--bg-surface); border-top-left-radius:var(--radius-xl); border-top-right-radius:var(--radius-xl);
      box-shadow:var(--shadow-pop); padding:8px 20px 24px; max-height:94%; overflow-y:auto; scrollbar-width:none;
      animation:sheet-up var(--dur-3) var(--ease-settle) both; }
    .pls-sheet::-webkit-scrollbar{ width:0; height:0; }
    .pls-grab{ width:40px; height:5px; border-radius:999px; background:var(--border-hairline); margin:6px auto 14px; }
    .pls-toast{ display:flex; align-items:center; gap:12px; background:var(--bg-inverse); color:var(--text-inverse);
      border-radius:var(--radius-lg); padding:11px 14px; box-shadow:var(--shadow-pop); }

    /* ---- live dot ---- */
    .pls-livedot{ position:relative; width:9px; height:9px; flex-shrink:0; display:inline-block; }
    .pls-livedot__core{ position:absolute; inset:0; border-radius:50%; background:var(--status-live); }
    .pls-livedot__ring{ position:absolute; inset:0; border-radius:50%; background:var(--status-live);
      animation:pulse-ring 1.8s var(--ease-out) infinite; }

    /* ---- motion keyframes ---- */
    @keyframes pulse-ring{ 0%{ transform:scale(1); opacity:.5; } 70%{ transform:scale(2.6); opacity:0; } 100%{ opacity:0; } }
    @keyframes pulse-fold-in{ from{ opacity:0; transform:translateY(6px) scale(.92); } to{ opacity:1; transform:none; } }
    @keyframes pulse-fill{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
    @keyframes sheet-up{ from{ transform:translateY(100%); } to{ transform:none; } }
    @keyframes scrim-in{ from{ opacity:0; } to{ opacity:1; } }
    @keyframes fade-in{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
    @keyframes rise{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
    @keyframes toast-in{ from{ opacity:0; transform:translateY(-14px); } to{ opacity:1; transform:none; } }
    @keyframes pop{ from{ opacity:0; transform:scale(.9); } to{ opacity:1; transform:scale(1); } }
    @keyframes pulse-dot{ 0%,60%,100%{ opacity:.3; transform:translateY(0); } 30%{ opacity:1; transform:translateY(-3px); } }
    @keyframes demo-in{ from{ opacity:0; transform:translateY(9px); } to{ opacity:1; transform:none; } }
    .fade-in{ animation:fade-in var(--dur-3) var(--ease-out) both; }
    .rise{ animation:rise var(--dur-3) var(--ease-settle) both; }
    .fold-in{ animation:pulse-fold-in var(--dur-3) var(--ease-pop) both; }
    .toast-in{ animation:toast-in var(--dur-3) var(--ease-out) both; }
    .pop{ animation:pop var(--dur-3) var(--ease-pop) both; }

    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{ animation-duration:1ms !important; animation-iteration-count:1 !important; transition-duration:1ms !important; }
      ::view-transition-new(root){ animation:none; }
    }

    /* ===== The Floor — intent momentum field (S6) ===== */
    .flr-week{ display:flex; gap:6px; margin:2px 0 16px; }
    .flr-wc{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:6px 0; border-radius:11px; cursor:pointer; border:1px solid var(--border-hairline); background:var(--bg-surface); transition:background var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out); }
    .flr-wc:active{ transform:scale(.95); }
    .flr-wc__d{ font-size:11.5px; font-weight:700; color:var(--text-secondary); font-family:var(--font-display); }
    .flr-wc__dot{ width:5px; height:5px; border-radius:50%; background:transparent; }
    .flr-wc--has .flr-wc__dot{ background:var(--accent); } .flr-wc--has .flr-wc__d{ color:var(--text-primary); }
    .flr-wc--on{ background:var(--accent); border-color:var(--accent); } .flr-wc--on .flr-wc__d{ color:var(--accent-ink); } .flr-wc--on .flr-wc__dot{ background:var(--accent-ink); }
    .flr-sec{ font-family:var(--font-sans); font-weight:700; text-transform:uppercase; letter-spacing:.07em; font-size:11px; color:var(--text-tertiary); margin:6px 2px 10px; display:flex; align-items:center; gap:7px; }
    .flr-hero{ border-radius:22px; border:1px solid color-mix(in srgb,var(--status-forming) 30%,var(--border-hairline)); background:linear-gradient(165deg, color-mix(in srgb,var(--status-forming) 12%,var(--bg-surface)), var(--bg-surface)); padding:16px 17px; margin-bottom:18px; cursor:pointer; box-shadow:var(--shadow-card); }
    .flr-badge{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--status-forming); background:color-mix(in srgb,var(--status-forming) 16%,var(--bg-surface)); padding:4px 9px; border-radius:99px; }
    .flr-hero__t{ font-family:var(--font-display); font-weight:800; font-size:24px; letter-spacing:-.02em; margin:11px 0 3px; line-height:1.08; color:var(--text-primary); }
    .flr-hero__meta{ font-size:12.5px; color:var(--text-secondary); display:flex; align-items:center; gap:7px; }
    .flr-hero__stat{ display:flex; align-items:flex-end; gap:12px; margin:13px 0 4px; }
    .flr-hero__nn{ font-family:var(--font-mono); font-weight:500; font-size:29px; color:var(--accent-strong); line-height:.9; }
    .flr-hero__ll{ font-size:12px; color:var(--text-secondary); padding-bottom:3px; }
    .flr-mini{ height:8px; border-radius:99px; background:var(--bg-sunken); overflow:hidden; margin-top:6px; } .flr-mini>i{ display:block; height:100%; border-radius:99px; background:var(--status-forming); }
    .flr-acts{ display:flex; gap:9px; margin-top:14px; }
    .flr-row{ display:flex; align-items:center; gap:13px; padding:13px 2px; border-bottom:1px solid var(--border-hairline); cursor:pointer; }
    .flr-row:active{ background:var(--bg-sunken); border-radius:12px; }
    .flr-row__rank{ font-family:var(--font-mono); font-size:12px; color:var(--text-tertiary); width:14px; text-align:center; flex:0 0 auto; }

    /* ============================================================

    function parseIntent(raw){
      const text = (raw||'').trim();
      for (const c of COURSES) {
        const [dept, num] = c.code.split(' ');
        if (new RegExp('\\b'+dept+'\\s?'+num+'\\b','i').test(text)) return { type:'study', target:c.code, raw:text };
      }
      const m = text.match(/\b([A-Z]{2,5})\s?(\d{4})\b/);
      if (m) return { type:'study', target:`${m[1]} ${m[2]}`, raw:text };
      const bare = text.match(/\b(\d{4})\b/);
      if (bare) { const c = COURSES.find(c => c.code.endsWith(bare[1])); if (c) return { type:'study', target:c.code, raw:text }; }
      const t = text.toLowerCase();
      const kw = [
        { re:/\b(box|boxing)\b/,               target:'boxing',      type:'activity' },
        { re:/\b(climb|boulder|bouldering)\b/, target:'bouldering',  type:'activity' },
        { re:/\b(dinner|eat)\b/,               target:'dinner crew', type:'social' },
        { re:/\b(run|running)\b/,              target:'running',     type:'activity' },
      ];
      for (const k of kw) if (k.re.test(t)) return { type:k.type, target:k.target, raw:text };
      return { type:'unknown', target:null, raw:text };
    }
    function isSpinup(raw){
      return /\b(set ?up|start|create|organi[sz]e|spin)\b/i.test(raw) && /\b(session|study|grind|group|crew|loop)\b/i.test(raw);
    }
    function buildDraft(parse, raw){
      const hw = (raw.match(/\bhw\s?(\d+)\b/i) || [])[1];
      return {
        target: parse.target || 'CS 2110',
        title:  hw ? `HW${hw} grind` : 'Study session',
        day:'Thu', time:'7:00p', location:'Mann', repeat:true,
      };
    }

    /* ============================================================

    const AV_HUES = ['var(--carnelian-500)','var(--rose-500)','var(--slate-500)','var(--moss-500)','var(--amber-600)','var(--carnelian-600)'];
    function hashInt(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
    function initials(name){ const p=name.trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase(); }
    function Avatar({ id, name, size=38, ring=true }){
      const label = name || USERS[id]?.name || '?';
      const hue = AV_HUES[hashInt(id||label) % AV_HUES.length];
      return (
        <div aria-label={label} className="pls-avatar"
          style={{ width:size, height:size, fontSize:Math.round(size*0.34),
                   background:`color-mix(in srgb, ${hue} 20%, var(--bg-surface))`, color:hue,
                   boxShadow: ring ? '0 0 0 2px var(--bg-surface)' : 'none' }}>
          {initials(label)}
        </div>
      );
    }
    function AvatarStack({ ids, size=30, max=5 }){
      const shown = ids.slice(0, max);
      const extra = ids.length - shown.length;
      return (
        <div className="flex items-center" style={{ paddingLeft:8 }}>
          {shown.map((id,i)=>(
            <div key={id} style={{ marginLeft:-8, zIndex:10-i }}><Avatar id={id} size={size} ring /></div>

                 className="pls-avatar text-[11px] font-semibold">+{extra}</div>
          )}
        </div>
      );

    function Wordmark({ size=24 }){
      return (
        <span className="pls-display" style={{ fontWeight:800, fontSize:size, letterSpacing:'-.03em',
          color:'var(--text-primary)', display:'inline-flex', alignItems:'baseline', lineHeight:1 }}>
          Loop
          <span style={{ width:Math.max(5,size*0.17), height:Math.max(5,size*0.17), borderRadius:'50%',
            background:'var(--accent)', display:'inline-block', marginLeft:2 }} />
        </span>
      );
    }
    function Button({ children, onClick, disabled, variant='primary', icon, iconRight, block, size, className='', style }){
      const cls = ['pls-btn','pls-btn--'+variant, block?'pls-btn--block':'', size==='sm'?'pls-btn--sm':'', className].join(' ');
      return (
        <button className={cls} onClick={onClick} disabled={disabled} style={style}>
          {icon && <Icon name={icon} size={18} />}{children}{iconRight && <Icon name={iconRight} size={18} />}
        </button>
      );
    }
    function IconButton({ name, onClick, size=20, label, badge, className='' }){
      return (
        <button aria-label={label} onClick={onClick} className={"pls-iconbtn "+className}>
          <Icon name={name} size={size} />
          {badge>0 && (
            <span className="pls-mono" style={{ position:'absolute', top:6, right:6, minWidth:16, height:16, padding:'0 4px',
              borderRadius:999, background:'var(--accent)', color:'var(--accent-ink)', fontSize:10, fontWeight:500,
              display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 0 0 2px var(--bg-surface)' }}>{badge}</span>
          )}
        </button>
      );
    }
    function Badge({ children, hue='var(--text-secondary)' }){
      return <span className="pls-badge" style={{ color:hue, background:`color-mix(in srgb, ${hue} 14%, var(--bg-surface))` }}>{children}</span>;
    }
    function Chip({ children, variant='default', icon }){
      const cls = 'pls-chip' + (variant!=='default' ? ' pls-chip--'+variant : '');
      return <span className={cls}>{icon && <Icon name={icon} size={13} />}{children}</span>;
    }
    function LiveDot(){
      return (
        <span className="pls-livedot" aria-label="live">
          <span className="pls-livedot__ring" /><span className="pls-livedot__core" />
        </span>
      );
    }
    function Card({ children, variant='default', className='', style, onClick }){
      const cls = 'pls-card' + (variant==='outline'?' pls-card--outline':variant==='sunken'?' pls-card--sunken':'') + ' ' + className;
      return <div className={cls} style={style} onClick={onClick}>{children}</div>;
    }
    function Banner({ icon, title, children, className='' }){
      return (
        <div className={"pls-banner p-3.5 flex gap-3 items-start rise "+className}>
          {icon && <span style={{ color:'var(--accent-strong)', flexShrink:0 }}><Icon name={icon} size={18} /></span>}
          <div className="min-w-0">
            <p style={{ fontWeight:600, fontSize:14, color:'var(--text-primary)' }}>{title}</p>
            {children && <p className="text-[13px] mt-0.5" style={{ color:'var(--text-secondary)' }}>{children}</p>}
          </div>
        </div>
      );
    }
    function EmptyState({ icon='radio', title, children }){
      return (
        <div className="text-center px-6 py-8">
          <div className="mx-auto mb-3 flex items-center justify-center pls-card--sunken pls-card"
               style={{ width:52, height:52, borderRadius:'50%' }}>
            <Icon name={icon} size={22} style={{ color:'var(--text-tertiary)' }} />
          </div>
          <p className="pls-display" style={{ fontWeight:700, fontSize:17, color:'var(--text-primary)' }}>{title}</p>
          <p className="text-[13.5px] mt-1.5 leading-relaxed" style={{ color:'var(--text-secondary)' }}>{children}</p>
        </div>
      );
    }

    // Private feedback — like / neutral / dislike. Only the viewer ever sees it.
    function FeedbackControl({ value, onChange, size=32 }){
      const opts = [
        { k:'like',    icon:'thumbs-up',   hue:'var(--status-live)' },
        { k:'neutral', icon:'minus',       hue:'var(--text-tertiary)' },
        { k:'dislike', icon:'thumbs-down', hue:'var(--unit-dorm)' },
      ];
      return (
        <div className="flex items-center gap-1.5">
          {opts.map(o=>{
            const on = value===o.k;
            return (
              <button key={o.k} aria-label={o.k} aria-pressed={on} onClick={()=>onChange(on?null:o.k)}
                style={{ width:size, height:size, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center',
                  border:'1px solid '+(on?o.hue:'var(--border-hairline)'),
                  background: on?`color-mix(in srgb, ${o.hue} 16%, var(--bg-surface))`:'transparent',
                  color: on?o.hue:'var(--text-tertiary)', cursor:'pointer', transition:'all var(--dur-1) var(--ease-out)' }}>
                <Icon name={o.icon} size={Math.round(size*0.5)} />
              </button>
            );
          })}
        </div>
      );
    }

    /* ============================================================
       DOMAIN PRIMITIVES
    ============================================================ */
    function RhythmLine({ text, icon='repeat' }){
      return (
        <div className="flex items-center gap-1.5 pls-mono" style={{ fontSize:12.5, color:'var(--text-secondary)' }}>
          <Icon name={icon} size={14} style={{ color:'var(--text-tertiary)' }} />{text}
        </div>
      );
    }
    function UnitKicker({ unit }){
      const hue = UNIT_HUE[unit.kind] || 'var(--text-tertiary)';
      return (
        <div className="pls-kicker flex items-center gap-1.5">
          <span style={{ width:6, height:6, borderRadius:'50%', background:hue, display:'inline-block' }} />
          <span style={{ color:hue }}>{unit.label}</span>
        </div>
      );
    }
    function DropMeter({ count, target }){
      const full = count >= target;
      const fill = full ? 'var(--status-full)' : 'var(--status-forming)';
      return (
        <div>
          <div className="flex items-baseline justify-between mb-1.5">
            <span className="pls-mono" style={{ fontSize:13, color: full ? 'var(--status-full)' : 'var(--text-primary)' }}>
              {count}/{target} <span style={{ color:'var(--text-tertiary)' }}>intents</span>
            </span>
            <span className="text-[12px]" style={{ color:'var(--text-secondary)' }}>
              {full ? 'the drop is firing' : `fires when ${target} want it`}
            </span>
          </div>
          <div style={{ position:'relative', height:10, borderRadius:999, background:'var(--bg-sunken)', overflow:'hidden' }}>
            <div style={{ width:(Math.min(count,target)/target*100)+'%', height:'100%', background:fill,
              transformOrigin:'left', animation:'pulse-fill var(--dur-4) var(--ease-settle) both', borderRadius:999 }} />
            <div style={{ position:'absolute', inset:0, display:'flex' }}>
              {Array.from({ length:target }).map((_,i)=>(
                <div key={i} style={{ flex:1, borderRight: i<target-1 ? '1px solid var(--bg-surface)' : 'none', opacity:.55 }} />
              ))}
            </div>
          </div>
        </div>
      );
    }
    function DigitBox({ v }){
      return (
        <span className="pls-mono" style={{ background:'var(--bg-surface)', border:'1px solid var(--border-quiet)',
          borderRadius:8, padding:'6px 8px', fontSize:20, fontWeight:500, color:'var(--text-primary)', minWidth:30, textAlign:'center' }}>{v}</span>
      );
    }
    function DropCountdown({ start=6*3600+42*60+9 }){
      const [s, setS] = useState(start);
      useEffect(()=>{ const t = setInterval(()=> setS(x => x>0 ? x-1 : 0), 1000); return ()=>clearInterval(t); }, []);
      const hh = String(Math.floor(s/3600)).padStart(2,'0');
      const mm = String(Math.floor((s%3600)/60)).padStart(2,'0');
      const ss = String(s%60).padStart(2,'0');
      const Colon = () => <span className="pls-mono" style={{ color:'var(--accent)', fontSize:18, fontWeight:500 }}>:</span>;
      return (
        <div className="flex items-center gap-1.5">
          <DigitBox v={hh} /><Colon /><DigitBox v={mm} /><Colon /><DigitBox v={ss} />
        </div>
      );
    }

    /* Private rating card — asked once a loop wraps. Rates the loop itself and
       each of the crew; nothing here is ever shown to anyone else. */
    function LoopRatingCard({ ratingId, memberIds, viewerId, feedback, actions, question="How was this loop for you?" }){
      const others = memberIds.filter(id => id!==viewerId);
      return (
        <div>
          <div className="pls-kicker mb-2 flex items-center gap-1.5"><Icon name="circle" size={10} />Private · only you see this</div>
          <Card variant="sunken" className="p-4">
            <div className="flex items-center justify-between gap-3">
              <span className="text-[13.5px]" style={{ color:'var(--text-primary)', fontWeight:500 }}>{question}</span>
              <FeedbackControl value={feedback[ratingId]} onChange={v=>actions.setFeedbackFor(ratingId, v)} />
            </div>
            {others.length>0 && (
              <div className="mt-3 pt-3 space-y-2.5" style={{ borderTop:'1px solid var(--border-hairline)' }}>
                {others.map(id=>(
                  <div key={id} className="flex items-center justify-between gap-2">
                    <div className="flex items-center gap-2 min-w-0">
                      <Avatar id={id} size={28} />
                      <span className="text-[13px] truncate" style={{ color:'var(--text-secondary)' }}>{USERS[id]?.name.split(' ')[0]}</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <FeedbackControl value={feedback[ratingId+':'+id]} onChange={v=>actions.setFeedbackFor(ratingId+':'+id, v)} size={30} />
                      <button aria-label={"Report a concern about "+USERS[id]?.name.split(' ')[0]} onClick={()=>actions.openSafety(USERS[id]?.name.split(' ')[0])}
                        style={{ width:30, height:30, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', border:'1px solid var(--border-hairline)', background:'transparent', color:'var(--text-tertiary)', cursor:'pointer' }}>
                        <Icon name="flag" size={14} />
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </Card>
        </div>
      );
    }

    /* The ask-for-feedback moment: opens when a loop wraps, and again from
       Past loops on You for anything not yet rated. */
    function RateSheet({ wrapped: w, viewerId, feedback, actions, onClose }){
      const memberIds = w.faces.map(f=>f.id);
      const rated = !!feedback[w.id];
      return (
        <Sheet kicker={"Loop wrapped · "+w.when} title={w.title} onClose={onClose}>
          <div className="flex items-center justify-between gap-3">
            <p className="text-[13px] leading-relaxed" style={{ color:'var(--text-secondary)' }}>
              {w.reason[0].toUpperCase()+w.reason.slice(1)} · {w.sessions} sessions · same faces. Take a second — it only tunes who you get seated with next.
            </p>
            <CrewFaces members={w.faces.filter(f=>f.id!==viewerId)} size={24} max={4} />
          </div>
          <div className="mt-4">
            <LoopRatingCard ratingId={w.id} memberIds={memberIds} viewerId={viewerId} feedback={feedback} actions={actions} />
          </div>
          <div className="mt-4">
            <Button block onClick={onClose} icon={rated?'check':undefined}>{rated ? 'Done' : 'Skip for now'}</Button>
          </div>
        </Sheet>
      );
    }

    function LoopCard({ loop, variant='default', onOpen, showAction=true, onShare, onCalendar }){
      const forming = loop.status === 'forming';
      const n = loop.memberIds.length;
      return (
        <Card variant={variant} className="p-4 rise">
          <button onClick={onOpen} className="w-full text-left" style={{ background:'none', border:'none', cursor:'pointer', display:'block', padding:0 }}>
            <div className="flex items-start justify-between gap-2">
              <div className="min-w-0 flex-1">
                <UnitKicker unit={loop.unit} />
                <h3 className="pls-display truncate" style={{ fontWeight:700, fontSize:19, marginTop:4, color:'var(--text-primary)' }}>{loop.title}</h3>
              </div>
              {showAction && <Icon name="chevron-right" size={18} style={{ color:'var(--text-tertiary)', marginTop:4 }} />}
            </div>

            {forming ? (
              <div className="mt-3"><DropMeter count={loop.drop.count} target={loop.drop.target} /></div>
            ) : (
              <div className="mt-2 space-y-1.5">
                <RhythmLine text={loop.rhythm} />
                <div className="flex items-center gap-1.5" style={{ fontSize:12.5, color:'var(--text-secondary)' }}>
                  {loop.live
                    ? <><LiveDot /><span className="pls-mono">meeting now</span></>
                    : <><Icon name="clock" size={13} style={{ color:'var(--text-tertiary)' }} /><span className="pls-mono">next · {loop.nextLine}</span></>}
                </div>
              </div>
            )}

            <div className="flex items-center justify-between mt-3">
              <AvatarStack ids={loop.memberIds} />
              <div className="text-right">
                {forming
                  ? <span className="pls-mono" style={{ fontSize:12, color:'var(--text-secondary)' }}>{loop.drop.count}/{loop.drop.target} in</span>
                  : <>
                      {loop.streakWeeks && (
                        <div className="flex items-center justify-end gap-1 text-[12.5px]" style={{ color:'var(--text-primary)', fontWeight:600 }}>
                          <Icon name="flame" size={13} style={{ color:'var(--status-forming)' }} />{loop.streakWeeks}-wk streak
                        </div>
                      )}
                      <div className="pls-mono" style={{ fontSize:11.5, color:'var(--text-tertiary)' }}>{n} in{loop.startedWeek?` · since wk ${loop.startedWeek}`:''}</div>
                    </>}
              </div>
            </div>
          </button>
          {(onShare || onCalendar) && (
            <div className="grid gap-2.5 mt-3 pt-3" style={{ gridTemplateColumns:(onShare&&onCalendar)?'1fr 1fr':'1fr', borderTop:'1px solid var(--border-hairline)' }}>
              {onCalendar && <Button variant="secondary" size="sm" icon="calendar" onClick={onCalendar}>Add to calendar</Button>}
              {onShare && <Button variant="secondary" size="sm" icon="share-2" onClick={onShare}>Share</Button>}
            </div>
          )}
        </Card>
      );
    }

    function IntentCard({ raw, author, unit, sameCount, onSame }){
      return (
        <Card className="p-4 rise">
          <div className="flex items-start gap-2">
            <span style={{ color:'var(--accent)', marginTop:2, flexShrink:0 }}><Icon name="circle-dot" size={18} /></span>
            <p className="pls-display" style={{ fontWeight:600, fontSize:17, lineHeight:1.35, color:'var(--text-primary)' }}>“{raw}”</p>
          </div>
          <div className="flex items-center justify-between mt-3">
            <div className="flex items-center gap-2 min-w-0">
              <Avatar id={author} size={26} />
              <span className="text-[12.5px] truncate" style={{ color:'var(--text-secondary)' }}>{USERS[author]?.name.split(' ')[0]}</span>
              <Chip variant="static">{unit}</Chip>
            </div>
          </div>
          <div className="flex items-center justify-between mt-3 pt-3" style={{ borderTop:'1px solid var(--border-hairline)' }}>
            <span className="text-[13px]" style={{ color:'var(--text-secondary)' }}>
              <span className="pls-mono" style={{ color:'var(--text-primary)' }}>{sameCount}</span> want the same
            </span>
            {onSame && <Button variant="secondary" size="sm" onClick={onSame} icon="plus">Same</Button>}
          </div>
        </Card>
      );
    }

    /* ============================================================
       CHROME
    ============================================================ */
    function StatusBar(){
      return (
        <div className="flex items-center justify-between px-6 pt-3 pb-1" style={{ flexShrink:0 }}>
          <span className="pls-mono" style={{ fontSize:12.5, color:'var(--text-primary)', fontWeight:500 }}>9:41</span>
          <span className="flex items-center gap-1.5">
            <span className="pls-mono" style={{ fontSize:11, color:'var(--text-secondary)' }}>5G</span>
            <span style={{ width:20, height:11, borderRadius:3, border:'1.5px solid var(--text-secondary)', position:'relative', display:'inline-block' }}>
              <span style={{ position:'absolute', inset:1.5, right:5, borderRadius:1, background:'var(--text-secondary)' }} />
            </span>
          </span>
        </div>
      );
    }
    function AppHeader({ left, title, kicker, right, onBack }){
      return (
        <div className="pls-header">
          {onBack && <IconButton name="chevron-left" size={22} label="Back" onClick={onBack} className="-ml-1" />}
          {left}
          <div className="flex-1 min-w-0">
            {kicker && <div className="pls-kicker">{kicker}</div>}
            {title && <h1 className="pls-display truncate" style={{ fontWeight:700, fontSize:17, color:'var(--text-primary)' }}>{title}</h1>}
          </div>
          <div className="flex items-center">{right}</div>
        </div>
      );
    }
    /* Account trigger: your avatar in the header. Opens an anchored menu (identity, profile, theme).
       The menu portals into .phone so its scrim covers the whole screen, not just the header. */
    function AccountTrigger({ user, viewerId, theme, actions, hideProfile }){
      const [open, setOpen] = useState(false);
      const persona = PERSONA_BY_ID[viewerId];
      const name = user?.name || persona?.name || 'You';
      const line = [user?.dorm || persona?.dorm, user?.major || persona?.major].filter(Boolean).join(' · ')
        || (persona?.role==='advisor' ? 'Advising & Wellbeing · staff view' : '');
      const staff = persona?.role==='advisor';
      const tag  = staff ? '' : [user?.year && `Class of ${user.year}`, persona?.tag].filter(Boolean).join(' · ');
      const dark = theme==='afterdark';
      useEffect(()=>{
        if(!open) return;
        const onKey = e => { if(e.key==='Escape') setOpen(false); };
        window.addEventListener('keydown', onKey);
        return ()=>window.removeEventListener('keydown', onKey);
      }, [open]);
      const pick = (t, e) => { if(t!==theme) actions.setTheme(t, e.currentTarget); };
      return (
        <>
          <button className="pls-avbtn" aria-label="Account" aria-haspopup="menu" aria-expanded={open} onClick={()=>setOpen(o=>!o)}>
            <Avatar id={viewerId} name={name} size={30} ring={false} />
          </button>
          {open && ReactDOM.createPortal((
            <>
              <div className="pls-pop-scrim" onClick={()=>setOpen(false)} />
              <div className="pls-pop" role="menu" aria-label="Account">
                <div className="flex items-center gap-3" style={{ padding:'10px 10px 12px' }}>
                  <Avatar id={viewerId} name={name} size={40} ring={false} />
                  <div className="min-w-0">
                    <div className="pls-display truncate" style={{ fontWeight:700, fontSize:15.5, lineHeight:1.1, color:'var(--text-primary)' }}>{name}</div>
                    {line && <div className="truncate" style={{ fontSize:12, color:'var(--text-secondary)', marginTop:3 }}>{line}</div>}
                    {tag  && <div className="pls-mono truncate" style={{ fontSize:11, color:'var(--text-tertiary)', marginTop:2 }}>{tag}</div>}
                  </div>
                </div>
                {!hideProfile && !staff && (
                  <>
                    <hr className="pls-pop__hr" />
                    <button className="pls-pop__item" role="menuitem" onClick={()=>{ setOpen(false); actions.openYou(); }}>
                      <Icon name="circle" size={17} style={{ color:'var(--text-secondary)' }} />Your profile
                      <Icon name="chevron-right" size={15} style={{ marginLeft:'auto', color:'var(--text-tertiary)' }} />
                    </button>
                  </>
                )}
                <hr className="pls-pop__hr" />
                <div style={{ padding:'6px 10px 10px' }}>
                  <div className="pls-kicker" style={{ marginBottom:6 }}>Theme</div>
                  <div className="pls-seg" data-dark={dark} role="radiogroup" aria-label="Theme">
                    <span className="pls-seg__thumb" />
                    <button className="pls-seg__opt" role="radio" aria-checked={!dark} aria-pressed={!dark} onClick={e=>pick('daylight', e)}>
                      <Icon name="sun" size={14} />Daylight
                    </button>
                    <button className="pls-seg__opt" role="radio" aria-checked={dark} aria-pressed={dark} onClick={e=>pick('afterdark', e)}>
                      <Icon name="moon" size={14} />Big Red Night
                    </button>
                  </div>
                </div>
                <div style={{ padding:'6px 10px 6px', fontSize:11, color:'var(--text-tertiary)' }}>Loop never shows anyone your activity.</div>
              </div>
            </>
          ), document.querySelector('.phone') || document.body)}
        </>
      );
    }
    /* Staff tab context — App provides { staff, onStaff } for the current viewer so the
       tab bar can grow a 5th tab (Floor / CS 2110) for RA/TA personas without every
       screen threading it through. Null for plain students. */
    const StaffCtx = React.createContext(null);
    function TabBar({ active='pulse', unread=0, onHome, onClass, onAlerts, onYou }){
      const staffCtx = useContext(StaffCtx);
      const Tab = ({ id, icon, label, onClick, badge }) => (
        <button className={"pls-tab"+(active===id?' pls-tab--active':'')} onClick={onClick}>
          <span className="pls-tab__glyph">
            <Icon name={icon} size={20} stroke={active===id?2.4:2} />
            {id==='alerts' && unread>0 && (
              <span style={{ position:'absolute', top:2, right:8, width:7, height:7, borderRadius:'50%', background:'var(--accent)', boxShadow:'0 0 0 2px var(--bg-surface)' }} />
            )}
            {badge && (
              <span className="pls-mono" style={{ position:'absolute', top:0, right:2, fontSize:7.5, fontWeight:700, letterSpacing:'.06em', padding:'2px 4px', borderRadius:999, background:'var(--accent)', color:'var(--accent-ink)', lineHeight:1 }}>{badge}</span>
            )}
          </span>
          {label}
        </button>
      );
      const staff = staffCtx?.staff;
      return (
        <div className="pls-tabbar">
          <Tab id="pulse"  icon="radio"          label="Home"   onClick={onHome} />
          <Tab id="class"  icon="graduation-cap" label="Class"  onClick={onClass} />
          {staff && <Tab id="staff" icon={staff.kind==='ra' ? 'house' : 'book-open'} label={staff.tab} badge={staff.badge} onClick={staffCtx.onStaff} />}
          <Tab id="alerts" icon="bell"           label="Alerts" onClick={onAlerts} />
          <Tab id="you"    icon="circle"         label="You"    onClick={onYou} />
        </div>
      );
    }

    /* ============================================================
       SHEETS  (compose intent · spin-up draft)
    ============================================================ */
    function Sheet({ kicker, title, onClose, children }){
      return (
        <div className="pls-scrim" onClick={onClose}>
          <div className="pls-sheet" onClick={e=>e.stopPropagation()}>
            <div className="pls-grab" />
            <div className="flex items-start justify-between mb-6">
              <div>
                {kicker && <div className="pls-kicker mb-1">{kicker}</div>}
                <h2 className="pls-display" style={{ fontWeight:700, fontSize:22, color:'var(--text-primary)', lineHeight:1.15 }}>{title}</h2>
              </div>
              <IconButton name="x" size={20} label="Close" onClick={onClose} className="-mr-2" />
            </div>
            {children}
          </div>
        </div>
      );
    }

    function ComposeSheet({ onClose, onSubmit }){
      return (
        <Sheet kicker="Drop an intent" title="What are you trying to make happen?" onClose={onClose}>
          <IntentComposer onSubmit={onSubmit} />
          <p className="text-[13px] mt-3 leading-relaxed" style={{ color:'var(--text-secondary)' }}>
            Drop it and it waits on your floor until enough people want the same thing — then the drop fires and a loop crystallizes.
          </p>
        </Sheet>
      );
    }

    function SpinUpSheet({ draft, onClose, onSend }){
      const [d, setD] = useState(draft);
      const set = (k,v) => setD({ ...d, [k]:v });
      const rhythm = `${d.day} · ${d.time} · ${d.location}${d.repeat?' · weekly':''}`;
      const inputCls = "pls-input";
      const preview = {
        unit:{ kind:'class', label:`${d.target.toLowerCase()} · section` },
        title:d.title, rhythm, nextLine:`${d.day} · ${d.time} · ${d.location}`,
        status:'active', live:false, memberIds:['sarah','josh','lydia','ryan'], cap:6,

    /* ============================================================
       SHARE — "drop a loop": a simulated SMS / WhatsApp OG unfurl.
       No backend: we render the rich link preview exactly as it
       lands in a friend's texts, then loop them in from the tap.
       (Real og: tags are the documented later upgrade, like Layer B.)
    ============================================================ */
    function loopSlug(id){ return 'loop.so/j/' + (hashInt(id||'loop').toString(36).slice(0,4)); }

    function OgUnfurl({ loop }){
      const count  = (loop.memberIds ? loop.memberIds.length : 3);
      const line   = loop.nextLine || loop.rhythm || 'meets this week';
      const course = (loop.target || 'study').toString();
      return (
        <div style={{ borderRadius:14, overflow:'hidden', border:'1px solid rgba(0,0,0,.10)', background:'#fff', width:242 }}>
          <div style={{ background:'#FF5C3A', padding:'13px 14px 12px', color:'#fff' }}>

              <Icon name="flame" size={16} /> Loop
            </div>
            <div style={{ marginTop:9, fontSize:11.5, fontWeight:600, opacity:.94, letterSpacing:'.02em' }}>{course} · study loop</div>

          </div>
        </div>
      );
    }

    const CHAT_THEME = {
      messages: { header:'#F7F7F8', headerInk:'#111', pane:'#fff',     out:'#0B93F6', outInk:'#fff',    in:'#E9E9EB', inInk:'#111',    sub:'iMessage' },
      whatsapp: { header:'#008069', headerInk:'#fff', pane:'#EFEAE2', out:'#D9FDD3', outInk:'#111B21', in:'#fff',    inInk:'#111B21', sub:'WhatsApp' },
    };

            </div>
            <div style={{ background:th.pane, padding:'12px 12px 16px', minHeight:236 }}>
              <div style={{ textAlign:'center', fontSize:10.5, color:'#9AA0A6', marginBottom:4 }}>now</div>
              <ChatBubble side="out" theme={th}>
                <div style={{ marginBottom:7 }}>come lock in with us 🔒 dropping you the loop</div>
                <OgUnfurl loop={loop} />
              </ChatBubble>
              {step===1 && <TypingBubble theme={th} />}
              {step>=2 && (
                <div className="fade-in">
                  <ChatBubble side="in" theme={th}>omg yes i've been meaning to start {loop.target} hw early 😭 count me in</ChatBubble>
                </div>
              )}
              {done && (
                <div className="fade-in" style={{ textAlign:'center', marginTop:12 }}>
                  <span style={{ display:'inline-flex', alignItems:'center', gap:6, background:'var(--accent-quiet)', color:'var(--accent-strong)',
                    fontSize:11.5, fontWeight:700, padding:'5px 11px', borderRadius:999 }}>
                    <Icon name="flame" size={13} />Kaia tapped the loop
                  </span>
                </div>
              )}
            </div>
          </div>
          <div className="mt-4">
            <Button block disabled={!done} onClick={()=>onSent('Kaia')} icon="users">
              {done ? "Done — she's in" : 'She taps the loop…'}
            </Button>
          </div>
          <button onClick={()=>setChannel(null)} className="w-full mt-2 text-center"
            style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-tertiary)', fontSize:12.5 }}>
            ← try another app

    /* ============================================================
       STORY DEMOS — small, self-contained vignettes that SHOW each
       onboarding concept instead of describing it. One per step,
       reusing Avatar / Icon and the shared reveal animations. The
       card remounts on every step (key={step}), so these staggered
       CSS reveals replay each time you land on a slide — no timers.
    ============================================================ */
    /* One gentle reveal for every demo element — a soft translate-fade
       (no scale jump), long enough not to feel snappy, on an ease-out
       curve with a slow tail so staggered items glide in rather than pop. */
    function reveal(delay){
      return { animation:`demo-in 640ms cubic-bezier(.25,.46,.45,.94) both`, animationDelay:`${delay}ms` };
    }

    function DemoBubble({ side, delay, children }){
      const out = side==='out';

            color: out?'var(--accent-strong)':'var(--text-secondary)',
            border: out?'none':'1px solid var(--border-hairline)' }}>
            {children}

        </div>

    /* ------------------------------------------------------------
       STORY — the narrative onboarding ("The Living Loop"). Five
       screens that reframe why Loop exists, each carried by one
       continuous canvas that morphs to match the message:
       chaos -> anchor -> the group lights up -> a micro-tribe ->
       the loop, alive and on repeat. The anchor picked on the last
       screen seeds the first-intent box.
    ------------------------------------------------------------ */
    function StoryOnboarding({ onDone, onBack, theme }){
      const [step, setStep] = useState(0);
      const [picks, setPicks] = useState([]);   // screen 5 is multiselect
      const cvRef = useRef(null);
      const stepRef = useRef(0);
      const colRef = useRef(null);
      const staticRef = useRef(null);
      const reduced = useRef(typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches);

      const term = (t) => <span style={{ color:'var(--accent-strong)', fontWeight:600 }}>{t}</span>;
      const STEPS = [
        { k:'The reality', h:'Making friends here is exhausting.',
          body:<>Group chats spiral, plans fizzle. The drag is real — it's {term('Logistical Fatigue')}.</>,
          cta:'Wait, what is that?' },
        { k:'The reframe', h:'Stop networking. Start doing.',
          body:<>Friendships grow around a shared task — an {term('Activity Anchor')}, not small talk.</>,
          cta:'That makes sense' },
        { k:'Close to home', h:'Start where you are.',  
          body:<>Loop starts with the people {term('closest to you')} — your floor, your building — then widens out.</>,
          cta:'Show me how' },
        { k:'The science', h:'Small groups. Big impact.',
          body:<>We bond best in {term('Micro-Tribes')}, students who meet in a small group every week land about {term('a letter grade higher')}. So every hangout is capped and intentional. </>,
          cta:'I prefer smaller groups' },
        { k:'Your turn', h:'Now, on repeat.',
          body:<>Start one small moment — the loop keeps it coming back. Pick any that sound good this week.</>,
          opts:true },
      ];
      const ANCHORS = [
        { L:'A', t:'A quiet study sprint', seed:'study sprint' },
        { L:'B', t:'A new cafe or dining spot', seed:'dining spot' },
        { L:'C', t:'A workout or exercise routine', seed:'exercise routine' },
        { L:'D', t:'A walk around campus', seed:'campus walk' },
      ];

      useEffect(()=>{ stepRef.current = step; if(reduced.current && staticRef.current) staticRef.current(); }, [step]);

      useEffect(()=>{
        const dark = theme==='afterdark';
        const cs = getComputedStyle(document.documentElement);
        const g = (n,f)=>{ const v=cs.getPropertyValue(n).trim(); return v && v[0]==='#' ? v : f; };
        colRef.current = { accent: dark?g('--carnelian-400','#cf5347'):g('--carnelian-500','#b31b1b'), moss:g('--moss-500','#3d8a5f'), faint:g('--ink-3','#98897e') };
      }, [theme]);

      useEffect(()=>{
        const cv = cvRef.current; if(!cv) return;
        const ctx = cv.getContext('2d');
        const DPR = Math.min(2, window.devicePixelRatio||1);
        let W=0,H=0,CX=0,CY=0;
        const measure=()=>{ const r=cv.getBoundingClientRect(); W=r.width; H=r.height; CX=W/2; CY=H*0.17;
          cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); };
        measure();
        const rnd=(a,b)=>a+Math.random()*(b-a);
        const N=44, CORE=5, TAU=Math.PI*2, bands=[30,46,60];
        const P=Array.from({length:N},(_,i)=>{ const band=i%3; return {
          x:rnd(26,W-26), y:rnd(40,H*0.24), vx:rnd(-.35,.35), vy:rnd(-.35,.35),
          orbR:bands[band]+rnd(-6,6), orbA:rnd(0,TAU), orbW:0.0055-band*0.0012,
          core:i<CORE, ci:i, a:0.5, halo:0 }; });
        const trails=Array.from({length:CORE},()=>[]);
        let liveRot=0, anchorA=0, tMode=0, lastTs=0, energy=null, sparks=[], sparkT=0, rings2=[], ringT2=0, prev=-1, raf=0, cyCur=CY;

        const enter=(st)=>{ tMode=0; if(st===2 && !reduced.current) energy={r:10,a:.45}; if(st!==4) trails.forEach(t=>t.length=0); };

        const frame=(ts)=>{
          const st=stepRef.current, C=colRef.current||{accent:'#b31b1b',moss:'#3d8a5f',faint:'#98897e'};
          if(st!==prev){ enter(st); prev=st; }
          const dt=Math.min(48, ts-lastTs||16); lastTs=ts; tMode+=dt/1000;
          ctx.clearRect(0,0,W,H);
          anchorA += ((st>=1?1:0)-anchorA)*0.06;
          liveRot += (st===4?0.02:st===3?0.006:0);
          const cyT=H*0.17; cyCur+=(cyT-cyCur)*0.08; const rT=46;

          if(st===1||st===2){ ctx.strokeStyle=C.faint; bands.forEach(r=>{ ctx.globalAlpha=0.06; ctx.beginPath(); ctx.arc(CX,cyCur,r,0,TAU); ctx.stroke(); }); ctx.globalAlpha=1; }

          const cores=[];
          P.forEach((p)=>{
            let tx,ty,ta;
            if(st===0){
              p.vx+=rnd(-.03,.03); p.vy+=rnd(-.03,.03); const sp=Math.hypot(p.vx,p.vy); if(sp>0.5){p.vx*=0.5/sp;p.vy*=0.5/sp;}
              p.x+=p.vx; p.y+=p.vy;
              if(p.x<22){p.x=22;p.vx*=-1;} if(p.x>W-22){p.x=W-22;p.vx*=-1;} if(p.y<40){p.y=40;p.vy*=-1;} if(p.y>H*0.24){p.y=H*0.24;p.vy*=-1;}
              ta=0.5; p.halo+=(0-p.halo)*0.1;
            } else {
              p.orbA+=p.orbW;
              if(st<=2){ tx=CX+Math.cos(p.orbA)*p.orbR; ty=cyCur+Math.sin(p.orbA)*p.orbR; ta=1;
                const want=st===2?Math.min(1,Math.max(0,(tMode-p.ci*0.09))*2.2):0; p.halo+=(want-p.halo)*0.12;
              } else if(p.core){ const a=(p.ci/CORE)*TAU+liveRot-Math.PI/2; tx=CX+Math.cos(a)*rT; ty=cyCur+Math.sin(a)*rT; ta=1; p.halo+=(0-p.halo)*0.08; cores.push(p);
              } else { tx=CX+Math.cos(p.orbA)*(p.orbR*2.6); ty=cyCur+Math.sin(p.orbA)*(p.orbR*2.6); ta=0; }
              p.x+=(tx-p.x)*0.075; p.y+=(ty-p.y)*0.075;
            }
            p.a+=(ta-p.a)*0.08;
          });

          if(st===0 && !reduced.current){
            sparkT+=dt; if(sparkT>420){ sparkT=0; const a=P[(Math.random()*N)|0], b=P[(Math.random()*N)|0]; if(a!==b && Math.hypot(a.x-b.x,a.y-b.y)<130) sparks.push({a,b,t:0}); }
            ctx.strokeStyle=C.accent; ctx.lineWidth=1;
            sparks=sparks.filter(s=>{ s.t+=dt; if(s.t>=560) return false; ctx.globalAlpha=Math.sin(s.t/560*Math.PI)*0.4; ctx.beginPath(); ctx.moveTo(s.a.x,s.a.y); ctx.lineTo(s.b.x,s.b.y); ctx.stroke(); return true; });
            ctx.globalAlpha=1;
          } else sparks.length=0;

          if(st===2 && energy){ energy.r+=1.4; energy.a*=0.975; if(energy.a<0.02) energy=null;
            if(energy){ ctx.globalAlpha=energy.a; ctx.strokeStyle=C.accent; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(CX,cyCur,energy.r,0,TAU); ctx.stroke(); ctx.globalAlpha=1; } }

          if((st===3||st===4)&&cores.length>=3){ const pts=cores.slice().sort((u,v)=>Math.atan2(u.y-cyCur,u.x-CX)-Math.atan2(v.y-cyCur,v.x-CX)); const live=st===4;
            ctx.globalAlpha=live?0.8:0.32; ctx.strokeStyle=live?C.moss:C.accent; ctx.lineWidth=live?2:1.4; ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath(); ctx.stroke(); ctx.globalAlpha=1; }

          if(st===4){
            if(!reduced.current){ ringT2+=dt; if(ringT2>760){ ringT2=0; rings2.push({r:8,a:.5}); } }
            ctx.strokeStyle=C.moss; ctx.lineWidth=1.3;
            rings2=rings2.filter(r=>{ r.r+=1.1; r.a*=0.982; if(r.a<=0.02) return false; ctx.globalAlpha=r.a; ctx.beginPath(); ctx.arc(CX,cyCur,r.r,0,TAU); ctx.stroke(); return true; });
            ctx.globalAlpha=1;
            if(!reduced.current){ const cp=P.filter(p=>p.core); cp.forEach((p,i)=>{ const tr=trails[i]; tr.push([p.x,p.y]); if(tr.length>10) tr.shift();
              ctx.strokeStyle=C.accent; ctx.lineWidth=2; for(let j=1;j<tr.length;j++){ ctx.globalAlpha=(j/tr.length)*0.28; ctx.beginPath(); ctx.moveTo(tr[j-1][0],tr[j-1][1]); ctx.lineTo(tr[j][0],tr[j][1]); ctx.stroke(); } }); ctx.globalAlpha=1; }
          } else rings2.length=0;

          if(anchorA>0.02){ const ar=6+Math.sin(ts*0.004)*1.2; ctx.fillStyle=C.accent;
            ctx.globalAlpha=anchorA*0.16; ctx.beginPath(); ctx.arc(CX,cyCur,ar+9,0,TAU); ctx.fill();
            ctx.globalAlpha=anchorA; ctx.beginPath(); ctx.arc(CX,cyCur,ar,0,TAU); ctx.fill(); ctx.globalAlpha=1; }

          P.forEach(p=>{ if(p.a<0.03) return;
            if(p.halo>0.02){ ctx.fillStyle=C.accent; ctx.globalAlpha=p.halo*0.14; ctx.beginPath(); ctx.arc(p.x,p.y,9,0,TAU); ctx.fill(); }
            const isLive=st===4&&p.core; ctx.fillStyle=isLive?C.moss:C.accent; ctx.globalAlpha=p.a;
            ctx.beginPath(); ctx.arc(p.x,p.y,(p.core&&st>=3)?3.6:2.5,0,TAU); ctx.fill(); });
          ctx.globalAlpha=1;

          if(!reduced.current) raf=requestAnimationFrame(frame);
        };

        if(reduced.current){
          staticRef.current = ()=>{ const base=100; for(let i=0;i<160;i++) frame(base+i*16); };
          staticRef.current();
        } else { raf=requestAnimationFrame(frame); }
        const onResize=()=>{ measure(); if(reduced.current && staticRef.current) staticRef.current(); };
        window.addEventListener('resize', onResize);
        return ()=>{ cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); };
      }, []);

      const s = STEPS[step];
      return (
        <div className="h-full fade-in" style={{ position:'relative', overflow:'hidden' }}>
          <canvas ref={cvRef} style={{ position:'absolute', inset:0, width:'100%', height:'100%', zIndex:1 }} />
          <div style={{ position:'relative', zIndex:3, height:'100%', display:'flex', flexDirection:'column', padding:'20px 20px 26px' }}>
            <div style={{ display:'flex', alignItems:'center', gap:8 }}>
              <button onClick={()=> step===0 ? onBack() : setStep(step-1)} className="pls-iconbtn" style={{ width:38, height:38 }} aria-label="Back">
                <Icon name="chevron-left" size={20} />
              </button>
              <div style={{ display:'flex', gap:6, flex:1 }}>
                {STEPS.map((_,i)=>(
                  <button key={i} onClick={()=>setStep(i)} aria-label={'Screen '+(i+1)}
                    style={{ flex:1, height:4, padding:0, border:'none', borderRadius:999, cursor:'pointer',
                      background: i<=step ? 'var(--accent)' : 'var(--border-hairline)', transition:'background var(--dur-2) var(--ease-out)' }} />
                ))}
              </div>
            </div>
            {/* fixed animation stage up top so every card top-aligns at the same line (level, no scroll) */}
            <div style={{ height:150, flexShrink:0 }} />
            <div style={{ flex:1, display:'flex', alignItems:'flex-start', overflowY:'auto' }} className="no-scrollbar">
              <div key={step} className="fold-in" style={{ width:'100%', background:'var(--bg-surface)', border:'1px solid var(--border-hairline)',
                borderRadius:'var(--radius-2xl)', boxShadow:'var(--shadow-pop)', padding:'26px 24px 24px', textAlign:'center' }}>
                <div className="pls-mono" style={{ fontSize:10.5, letterSpacing:'.16em', color:'var(--text-tertiary)', marginBottom:14 }}>
                  {String(step+1).padStart(2,'0')} · 05
                </div>
                <div className="pls-kicker" style={{ color:'var(--accent-strong)', marginBottom:10 }}>{s.k}</div>
                <h1 className="pls-display" style={{ fontWeight:800, fontSize:29, lineHeight:1.06, letterSpacing:'-.03em', margin:'0 0 12px', color:'var(--text-primary)' }}>{s.h}</h1>
                <p style={{ fontSize:14, lineHeight:1.62, color:'var(--text-secondary)', margin:'0 auto', maxWidth:'32ch' }}>{s.body}</p>
                <StoryDemo step={step} />
                {s.opts ? (
                  <div>
                    <div style={{ display:'flex', flexDirection:'column', gap:7, marginTop:14, textAlign:'left' }}>
                      {ANCHORS.map(o=>{
                        const on = picks.includes(o.L);
                        return (
                          <button key={o.L} aria-pressed={on} onClick={()=>setPicks(p=> on ? p.filter(x=>x!==o.L) : [...p, o.L])}

                              background: on ? 'var(--accent)' : 'var(--accent-quiet)', color: on ? 'var(--accent-ink)' : 'var(--accent-strong)', fontSize:11, transition:'background var(--dur-1) var(--ease-out)' }}>{o.L}</span>
                            <span style={{ fontSize:12.5, color:'var(--text-primary)', whiteSpace:'nowrap', flex:1 }}>{o.t}</span>
                            <span style={{ width:16, height:16, flex:'none', color:'var(--accent-strong)', opacity: on ? 1 : 0, transition:'opacity var(--dur-1) var(--ease-out)' }}><Icon name="check" size={16} /></span>
                          </button>

                    <div style={{ marginTop:16 }}>
                      <Button block disabled={picks.length===0} iconRight="arrow-right"

    /* ============================================================
       PULSE FEED — "campus pulse" (proximity dial) + live forming
       stream + intent-density spin-up prompts. Adoption-aware: it
       stays honest when the floor is quiet (auto-widens, leads with
       what people want), and comes alive at scale. Never fakes a crowd.
    ============================================================ */
    const PULSE_CATS = {
      class:  { label:'Classes', hue:'var(--unit-class)' },
      fitness:{ label:'Fitness', hue:'var(--moss-500)' },
      food:   { label:'Food',    hue:'var(--amber-600)' },
      social: { label:'Social',  hue:'var(--unit-dorm)' },
      music:  { label:'Music',   hue:'#6b5b95' },
    };
    /* ============================================================
       AUDIENCE-DRIVEN VISIBILITY — a loop/intent declares who it's for
       (campus / north / major / class / dorm / floor); a pure filter
       decides what each viewer sees from their attributes. Membership
       always overrides scope. See specs/audience-visibility.
    ============================================================ */
    // North Campus first-year houses (building names, floor suffix stripped).
    const NORTH = new Set(['Donlon','Court-Kay-Bauer','CKB','Balch','Dickson','Toni Morrison','Ganędago','Jameson','Mews','High Rise 5']);
    const building = (dorm) => (dorm||'').replace(/\s+\d.*$/, '').trim(); // 'Donlon 2F' -> 'Donlon'
    // Derive an audience for any un-annotated seed loop so the filter never crashes.
    function inferAudience(l){
      if (l.audience) return l.audience;
      const u = ((l.unit&&l.unit.label)||'').toLowerCase();
      if ((l.unit&&l.unit.kind)==='class' && l.target) return { scope:'class', course:l.target };
      if (/2f|floor/.test(u)) return { scope:'floor', floor:'Donlon 2F' };
      if (/donlon/.test(u)) return { scope:'dorm', dorm:'Donlon' };
      if (/north/.test(u)) return { scope:'north' };
      return { scope:'campus' };
    }
    // Pure: is this loop visible to this viewer? Membership short-circuits to true.
    function isVisibleTo(loop, viewer){
      if (!viewer) return true;
      if ((loop.memberIds||[]).includes(viewer.id)) return true;
      const a = inferAudience(loop);
      switch(a.scope){
        case 'campus': return true;
        case 'north':  return NORTH.has(building(viewer.dorm));
        case 'major':  return !a.major || viewer.major===a.major;
        // demo fallback: a classmate who shares the major sees the class loop
        case 'class':  return (viewer.courses||[]).includes(a.course) || viewer.major==='CS';
        case 'dorm':   return building(viewer.dorm)===building(a.dorm);
        case 'floor':  return (viewer.dorm||'')===(a.floor||'');
        default:       return true;
      }
    }
    const visibleLoops = (world, viewer) => world.loops.filter(l => isVisibleTo(l, viewer));

    // Feed proximity dial: how "local" a loop is, relative to the viewer's scopes.
    const SCOPE_RANK = { floor:0, building:1, north:2, campus:3 };
    function loopLocality(l){
      const a = inferAudience(l);
      if (a.scope==='floor' || a.scope==='class') return 'floor';   // your floor + your classes are closest
      if (a.scope==='dorm' || a.scope==='major')  return 'building';
      if (a.scope==='north') return 'north';

    }

    /* ============================================================
       THE FLOOR (S6) — intent momentum field + @-tag shaping
    ============================================================ */
    const FLR_DAYS=['Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays','Sundays','weekdays','weekends'];

    const FLR_CADENCE=['daily','3× a week','2× a week','weekly','every other week','monthly'];
    const FLR_CADPOP={ daily:5,'3× a week':7,weekly:12,'2× a week':6,'every other week':7,monthly:4 };
    const FLR_CADF={ daily:1.1,'3× a week':.95,weekly:1,'2× a week':.9,'every other week':.8,monthly:.65 };
    const FLR_MEALS=['breakfast','brunch','lunch','coffee','dinner','late-night bites'];

    const FLR_SUBJECTS=['CS 2110','CHEM 2070','MATH 1920','ECON 1110','PSYCH 1101','any subject'];
    const FLR_ACTPOP={ dinner:12,lunch:9,brunch:8,coffee:6,breakfast:4,'late-night bites':5,'a run':9,'a lift':8,'a climb':6,bouldering:6,kickboxing:8,yoga:5,'pickup ball':6,'CS 2110':11,'CHEM 2070':8,'MATH 1920':7,'ECON 1110':6,'PSYCH 1101':6,'any subject':9 };
    const FLR_RING={ floor:{lbl:'your floor',boost:1.0}, building:{lbl:'Donlon',boost:.85}, major:{lbl:'CS majors',boost:.72}, year:{lbl:'Class of ’30',boost:.6} };
    const FLR_FACETS={
      dine:[ {key:'time',type:'time',label:'time',opts:['6pm','7pm','8pm','9pm','late']},
        {key:'cuisine',type:'',label:'cuisine',multi:true,opts:['ramen','sushi','tacos','korean bbq','italian','dumplings','thai','burgers']},
        {key:'budget',type:'',label:'budget',opts:['$','$$','$$$']},
        {key:'where',type:'where',label:'where',opts:['Collegetown','North','West','Downtown']},
        {key:'size',type:'',label:'group',opts:['just 2','small 3-4','big 5+']} ],
      move:[ {key:'time',type:'time',label:'time',opts:['early','morning','afternoon','evening']},
        {key:'where',type:'where',label:'where',opts:['Teagle gym','Beebe Lake','Lindseth wall','outdoor loop']},

        {key:'vibe',type:'',label:'vibe',opts:['silent','light chatter','group work']},
        {key:'length',type:'',label:'length',opts:['1 hr','2 hrs','all-nighter']} ],
    };
    const FLR_OPTPOP={ '7pm':10,'8pm':9,'6pm':7,'9pm':6,late:4, ramen:9,sushi:8,tacos:9,'korean bbq':7,italian:7,dumplings:6,thai:6,burgers:6, '$':6,'$$':11,'$$$':5, Collegetown:12,North:9,West:6,Downtown:5, 'just 2':5,'small 3-4':10,'big 5+':6, early:4,morning:7,afternoon:8,evening:11, 'Teagle gym':10,'Beebe Lake':8,'Lindseth wall':6,'outdoor loop':7, chill:8,moderate:9,sweaty:6, 'small crew':10,'open group':7, 'Libe Café':11,Mann:8,Uris:9,Olin:6,'dorm lounge':7, silent:8,'light chatter':9,'group work':8, '1 hr':7,'2 hrs':10,'all-nighter':4 };
    const FLR_RETAIN={ time:.68, budget:.7, where:.62, size:.62, intensity:.72, vibe:.72, length:.76, cuisine:.6, custom:.82 };
    const FLR_CATX={ move:{c:'var(--unit-major)',label:'moving',icon:'🏃',act:'sport'}, study:{c:'var(--unit-class)',label:'studying',icon:'📖',act:'subject'}, dine:{c:'var(--unit-dorm)',label:'eating together',icon:'🍜',act:'meal'} };

    function flrActKey(it){ return FLR_CATX[it.cat].act; }
    function flrActVal(it){ return it[flrActKey(it)]; }
    function flrActLabel(it){ return (flrActVal(it)||'plan').replace(/^a /,''); }
    function flrLabel(it){ if(it.cat==='study') return it.subject==='any subject'?'study sessions':it.subject+' grind'; const a=(it.sport||it.meal).replace(/^a /,''); return it.day.slice(0,3)+' '+a; }
    function flrCoreText(it){ if(it.cat==='study') return 'Studying '+it.subject+' '+it.day; if(it.cat==='move'){ const s=it.sport.replace(/^a /,''); return s.charAt(0).toUpperCase()+s.slice(1)+' '+it.day; } return it.meal.charAt(0).toUpperCase()+it.meal.slice(1)+' '+it.day; }
    function flrIsOpen(it,k){ const v=it.prefs[k]; return v==null||(Array.isArray(v)&&v.length===0); }
    function flrPrefCount(it){ return FLR_FACETS[it.cat].filter(f=>!flrIsOpen(it,f.key)).length + (it.custom?it.custom.length:0); }
    function flrOnCal(it){ return (it.mine||it.joined)&&!it.dropped; }
    function flrDayMatch(it,pl){ if(it.day===pl) return true; if(it.day==='weekdays') return ['Mondays','Tuesdays','Wednesdays','Thursdays','Fridays'].includes(pl); if(it.day==='weekends') return ['Saturdays','Sundays'].includes(pl); return false; }
    function flrCompat(it){ let n=((FLR_ACTPOP[flrActVal(it)]||6)+(FLR_DAYPOP[it.day]||6))/2*(FLR_CADF[it.cadence]||1)*(FLR_RING[it.ring].boost);
      FLR_FACETS[it.cat].forEach(f=>{ if(!flrIsOpen(it,f.key)){ const v=it.prefs[f.key]; if(f.multi) n*=Math.min(1,.5+.16*v.length); else n*=(FLR_RETAIN[f.key]||.7); } });
      if(it.custom) it.custom.forEach(()=> n*=FLR_RETAIN.custom);
      return Math.max(1,Math.min(it.target,Math.round(n))); }
    function flrMomentum(it){ return it.count/it.target*0.72 + FLR_RING[it.ring].boost*0.28; }
    function flrTags(it){ const t=[]; FLR_FACETS[it.cat].forEach(f=>{ if(!flrIsOpen(it,f.key)){ const v=it.prefs[f.key]; (Array.isArray(v)?v:[v]).forEach(x=>t.push({v:x,type:f.type,key:f.key})); } }); (it.custom||[]).forEach(x=>t.push({v:x,type:'where',key:'custom'})); return t; }
    function flrTagsInline(it){ const t=flrTags(it); if(!t.length) return ' · open to all'; return ' · '+t.slice(0,2).map(x=>'@'+x.v).join(' ')+(t.length>2?' +'+(t.length-2):''); }
    function flrFindFacet(it,term){ const t=term.toLowerCase(); for(const f of FLR_FACETS[it.cat]){ const opt=f.opts.find(o=>o.toLowerCase()===t); if(opt) return {key:f.key,opt}; } return null; }
    function flrFromRaw(raw){ if(!raw) return null; const p=parseIntent(raw);
      if(p.type==='study') return { cat:'study', subject:(p.target||'any subject') };
      if(p.type==='activity'){ const s=p.target; return { cat:'move', sport: s==='running'?'a run':s==='boxing'?'kickboxing':s==='bouldering'?'bouldering':'a lift' }; }
      return { cat:'dine', meal:'dinner' }; }

    /* ============================================================
       INTENT QUICK-ADD — plain-English → structured intent.
       Activities are a CURATED ALLOWLIST (no free-text public labels);

       Required: activity + cadence. Optional: time · day · place.
    ============================================================ */
    const INTENT_ICON = { study:'book-open', move:'activity', dine:'users' };
    const ACTIVITY_CATALOG = [
      ...COURSES.map(c => ({ label:c.code, cat:'study', aliases:[c.code.toLowerCase(), c.code.replace(/\s/g,'').toLowerCase()] })),
      { label:'problem sets', cat:'study', aliases:['problem sets','psets','pset','homework','hw'] },
