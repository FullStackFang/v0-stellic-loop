      { label:'any subject',  cat:'study', aliases:['study','studying','study session','any subject'] },
      { label:'run',      cat:'move', aliases:['run','running','jog','jogging','a run'] },
      { label:'lift',     cat:'move', aliases:['lift','lifting','gym','weights','weightlifting','a lift'] },
      { label:'yoga',     cat:'move', aliases:['yoga'] },
      { label:'pilates',  cat:'move', aliases:['pilates'] },
      { label:'spin',     cat:'move', aliases:['spin','cycling','bike'] },
      { label:'swim',     cat:'move', aliases:['swim','swimming'] },
      { label:'bouldering',cat:'move', aliases:['boulder','bouldering','climb','climbing','a climb'] },
      { label:'kickboxing',cat:'move', aliases:['kickboxing','box','boxing'] },
      { label:'pickup basketball', cat:'move', aliases:['basketball','pickup ball','hoops','pickup basketball'] },
      { label:'soccer',   cat:'move', aliases:['soccer','futbol'] },
      { label:'tennis',   cat:'move', aliases:['tennis'] },
      { label:'volleyball',cat:'move', aliases:['volleyball','vball'] },
      { label:'walk / hike', cat:'move', aliases:['walk','walking','hike','hiking'] },
      { label:'dance',    cat:'move', aliases:['dance','dancing'] },
      { label:'breakfast',cat:'dine', aliases:['breakfast'] },
      { label:'brunch',   cat:'dine', aliases:['brunch'] },
      { label:'lunch',    cat:'dine', aliases:['lunch'] },
      { label:'coffee',   cat:'dine', aliases:['coffee','tea','cafe'] },
      { label:'dinner',   cat:'dine', aliases:['dinner','eat','food','grab food'] },
      { label:'late-night bites', cat:'dine', aliases:['late night','late-night','late night bites','midnight snack'] },
      { label:'cook together', cat:'dine', aliases:['cook','cooking','cook together','meal prep'] },
    ];
    const QI_TIME = [
      { v:'mornings',   re:/\b(morning|mornings|am|early)\b/ },
      { v:'afternoons', re:/\b(afternoon|afternoons|midday)\b/ },
      { v:'evenings',   re:/\b(evening|evenings|pm)\b/ },
      { v:'nights',     re:/\b(night|nights|late[- ]?night)\b/ },
    ];
    const QI_PLACES = ['Teagle gym','Beebe Lake','Lindseth wall','Helen Newman','Noyes','Libe Café','Mann','Uris','Olin','Collegetown','North','West'];
    const QI_DAYWORDS = ['mondays','monday','mon','tuesdays','tuesday','tue','wednesdays','wednesday','wed','thursdays','thursday','thu','fridays','friday','fri','saturdays','saturday','sat','sundays','sunday','sun','weekdays','weekday','weekends','weekend'];
    function qiCadence(t){
      if(/\b(every ?day|daily|each day)\b/.test(t)) return 'daily';
      if(/\b(3\s?x|3\s?times|thrice|three times)\b/.test(t)) return '3× a week';
      if(/\b(2\s?x|2\s?times|twice|two times)\b/.test(t)) return '2× a week';
      if(/\b(every other week|biweekly|bi-weekly|fortnightly)\b/.test(t)) return 'every other week';
      if(/\b(month|monthly)\b/.test(t)) return 'monthly';
      if(/\b(week|weekly|once a week|1\s?x)\b/.test(t)) return 'weekly';
      return null;
    }
    function qiDay(t){
      const map=[['mondays','Mondays'],['monday','Mondays'],['mon','Mondays'],['tuesdays','Tuesdays'],['tuesday','Tuesdays'],['tue','Tuesdays'],['wednesdays','Wednesdays'],['wednesday','Wednesdays'],['wed','Wednesdays'],['thursdays','Thursdays'],['thursday','Thursdays'],['thu','Thursdays'],['fridays','Fridays'],['friday','Fridays'],['fri','Fridays'],['saturdays','Saturdays'],['saturday','Saturdays'],['sat','Saturdays'],['sundays','Sundays'],['sunday','Sundays'],['sun','Sundays'],['weekdays','weekdays'],['weekday','weekdays'],['weekends','weekends'],['weekend','weekends']];
      for(const [k,v] of map){ if(new RegExp('\\b'+k+'\\b').test(t)) return v; }
      return null;
    }
    function qiPlace(t){ for(const p of QI_PLACES){ if(t.includes(p.toLowerCase())) return p; } return null; /* @free-text intentionally ignored — no un-vetted place labels */ }
    function qiActivity(t){
      let best=null;
      for(const a of ACTIVITY_CATALOG){ for(const al of a.aliases){ if(new RegExp('\\b'+al.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(t)){ if(!best || al.length>best.alLen) best={ a, alLen:al.length }; } } }
      return best ? best.a : null;
    }
    function parseQuickIntent(raw){
      const t=(raw||'').toLowerCase().trim();
      if(!t) return { empty:true };
      const cadence=qiCadence(t), time=(QI_TIME.find(x=>x.re.test(t))||{}).v||null, day=qiDay(t), place=qiPlace(t);
      const activity=qiActivity(t);
      let rest=t.replace(/\b(every ?day|daily|each day|3\s?x|3\s?times|thrice|three times|2\s?x|2\s?times|twice|two times|every other week|biweekly|bi-weekly|fortnightly|monthly|month|weekly|week|once a week|1\s?x|times? a week|per week|a week|morning[s]?|afternoon[s]?|evening[s]?|night[s]?|early|midday|am|pm|on|at|in the|the|for|i want to|want to|lets|let's|do|go)\b/g,' ');
      QI_PLACES.forEach(p=>{ rest=rest.replace(p.toLowerCase(),' '); });
      QI_DAYWORDS.forEach(d=>{ rest=rest.replace(new RegExp('\\b'+d+'\\b','g'),' '); });
      rest=rest.replace(/@\s?[\w' -]+/g,' ').replace(/[^\w' -]/g,' ').replace(/\s+/g,' ').trim();

    }
    function qiIntentSummary(p, raw){
      const known=!!p.activity;
      const label = known ? p.activity.label : ((p.request||raw||'').trim().replace(/\s+/g,' ').replace(/^./,c=>c.toUpperCase()));
      const cat = known ? p.activity.cat : null;
      const bits=[p.cadence]; if(p.day) bits.push(p.day); if(p.time) bits.push(p.time); if(p.place) bits.push('@'+p.place);

      { lead:'Going for a', what:'run',        day:'Fridays',    often:'weekly', where:'Collegetown', want:9  },
      { lead:'Doing',       what:'kickboxing', day:'Wednesdays', often:'weekly', where:'Teagle gym',  want:8  },
      { lead:'Grabbing',    what:'coffee',     day:'Mondays',    often:'weekly', where:null,          want:6  },
    ];
    const icCat   = (label) => (ACTIVITY_CATALOG.find(a=>a.label===label)||{}).cat || null;
    const icPop   = (type,v) => type==='what' ? (FLR_ACTPOP[v]||FLR_ACTPOP['a '+v]||5) : type==='day' ? (FLR_DAYPOP[v]||5) : type==='often' ? (FLR_CADPOP[v]||5) : (FLR_OPTPOP[v]||FLR_OPTPOP[String(v).replace(/s$/,'')]||5);

    const icColor = (type,v) => type==='what' ? ((FLR_CATX[icCat(v)]||{}).c||'var(--accent)') : ({ day:'var(--accent)', often:'var(--accent)', where:'var(--unit-class)', time:'var(--unit-major)', pref:'var(--accent-strong)', custom:'var(--accent-strong)' })[type];
    const icEsc   = (s) => String(s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' })[c]);

    function icGroups(term, only){
      const t=(term||'').toLowerCase().trim();

      const G=[
        { type:'what',  items: rank(ACTIVITY_CATALOG.filter(a => !t || a.label.toLowerCase().includes(t) || a.aliases.some(al=>al.includes(t))).map(a=>({ v:a.label, n:icPop('what',a.label) }))) },
        { type:'day',   items: rank(FLR_DAYS.filter(v=>!t||v.toLowerCase().includes(t)).map(v=>({ v, n:icPop('day',v) }))) },
        { type:'often', items: rank(FLR_CADENCE.filter(v=>!t||v.toLowerCase().includes(t)).map(v=>({ v, n:icPop('often',v) }))) },
        { type:'where', items: rank(IC_PLACES.filter(v=>!t||v.toLowerCase().includes(t)).map(v=>({ v, n:icPop('where',v) }))) },
        { type:'time',  items: rank(IC_TIMES.filter(v=>!t||v.includes(t)).map(v=>({ v, n:icPop('time',v) }))) },
        { type:'pref',  items: rank(IC_PREFS.filter(v=>!t||v.toLowerCase().includes(t)).map(v=>({ v, n:icPop('pref',v) }))) },

    // the words that were actually yours — everything the read didn't claim

      if(r.what && r.soft.what){ const a=ACTIVITY_CATALOG.find(x=>x.label===r.what); if(a){
        const hit=[a.label.toLowerCase(), ...a.aliases].filter(al=>new RegExp('(^|[^a-z0-9])'+icRx(al)+'(?=[^a-z0-9]|$)','i').test(n)).sort((x,y)=>y.length-x.length)[0]; if(hit) kill.push(hit); } }

          <div className="flr-chips">
            {tags.map((t,i)=>(
              <span key={i} className={"flr-chip"+(t.type==='where'?' flr-chip--where':t.type==='time'?' flr-chip--time':'')}>@{t.v}
                <span className="flr-chip__rm" onMouseDown={e=>{ e.preventDefault(); onRemove(t.key,t.v); }}>×</span>
              </span>
            ))}
          </div>
          <input className="flr-taginput" value={q} placeholder="open to all — type @ to pin (e.g. @ramen, @Collegetown)" autoComplete="off"
            onFocus={()=>setFocus(true)} onBlur={()=>setTimeout(()=>setFocus(false),150)} onChange={e=>setQ(e.target.value)}
            onKeyDown={e=>{ if(e.key==='Enter' && term){ const kf=flrFindFacet(it,term); add(kf?kf.key:'custom', kf?kf.opt:term); } }} />
          {showSug && (
            <div className="flr-menu flr-menu--block">
              {groups.map((g,gi)=>{ const mx=Math.max.apply(null,g.opts.map(o=>FLR_OPTPOP[o]||5)); return (
                <div key={gi}>
                  <div className="flr-sugcat">{g.f.label}</div>
                  {g.opts.slice(0,5).map(o=>{ const iv=FLR_OPTPOP[o]||5; return (
                    <div key={o} className="flr-sugrow" onMouseDown={e=>{ e.preventDefault(); add(g.f.key,o); }}>
                      <span className="flr-sugrow__bar" style={{ width:Math.round(iv/mx*100)+'%' }} />
                      <span className="flr-sugrow__nm">@{o}</span><span className="flr-sugrow__vl">{iv} want</span>
                    </div>
                  ); })}
                </div>
              ); })}
              {term && !known && (
                <div>
                  <div className="flr-sugcat">custom</div>
                  <div className="flr-sugrow" onMouseDown={e=>{ e.preventDefault(); add('custom',term); }}>
                    <span className="flr-sugrow__nm">＋ pin “@{term}”</span><span className="flr-sugrow__vl">be specific</span>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function FlrSheet({ it, onClose, onCore, onAddTag, onRemoveTag, onJoin, onLeave, onDrop, onMute, onTog }){
      const sheetRef = useRef();
      const [menu, setMenu] = useState(null);
      if(!it) return null;
      const C=FLR_CATX[it.cat], n=it.count, pc=flrPrefCount(it);
      const openMenu = (e, which) => {
        const sr=sheetRef.current.getBoundingClientRect(), tr=e.currentTarget.getBoundingClientRect();
        let list, cur;
        if(which==='day'){ cur=it.day; list=FLR_DAYS.map(v=>({v,n:FLR_DAYPOP[v]||5})); }
        else if(which==='cad'){ cur=it.cadence; list=FLR_CADENCE.map(v=>({v,n:FLR_CADPOP[v]||5})); }
        else { const opts=it.cat==='dine'?FLR_MEALS:it.cat==='move'?FLR_SPORTS:FLR_SUBJECTS; cur=flrActVal(it); list=opts.map(v=>({v,n:FLR_ACTPOP[v]||5})); }
        list.sort((a,b)=>b.n-a.n);
        let left=tr.left-sr.left; left=Math.max(10, Math.min(left, sheetRef.current.clientWidth-240));
        setMenu({ which, left, top:tr.bottom-sr.top+8, list, cur });
      };
      const cls = C.act==='subject' ? 'flr-tok--sub' : C.act==='sport' ? 'flr-tok--mov' : '';
      const lead = it.cat==='study' ? 'Studying' : it.cat==='move' ? 'Up for' : 'Grabbing';
      const mx = menu ? Math.max.apply(null, menu.list.map(o=>o.n)) : 1;
      const primary = it.mine
        ? <button className="pls-btn pls-btn--secondary pls-btn--block" onClick={onClose}><Icon name="calendar" size={17} />On your calendar · done</button>
        : it.joined
        ? <button className="pls-btn pls-btn--secondary pls-btn--block" onClick={()=>onLeave(it.id)}><Icon name="calendar" size={17} />On your week · tap to leave</button>
        : <button className="pls-btn pls-btn--primary pls-btn--block" onClick={()=>onJoin(it.id)}><Icon name="plus" size={17} />Join loop · add to your week</button>;
      const third = it.mine
        ? <button className="pls-btn pls-btn--ghost pls-btn--sm" style={{ width:'100%' }} onClick={()=>onDrop(it.id)}><Icon name="log-out" size={15} />Drop</button>
        : it.joined
        ? <button className="pls-btn pls-btn--ghost pls-btn--sm" style={{ width:'100%' }} onClick={()=>onLeave(it.id)}><Icon name="log-out" size={15} />Leave</button>
        : <button className="pls-btn pls-btn--ghost pls-btn--sm" style={{ width:'100%' }} onClick={()=>onMute(it.id)}><Icon name="shield" size={15} />Mute</button>;
      return ReactDOM.createPortal((
        <>
          <div className="flr-scrim" onClick={onClose} />
          <div className="flr-sheet" ref={sheetRef} onClick={()=>menu&&setMenu(null)}>
            <div className="pls-grab" />
            <div className="pls-kicker" style={{ color:C.c }}>{C.icon} {C.label} · {FLR_RING[it.ring].lbl}{it.mine?' · yours':''}</div>
            <div className="flr-core">
              <span>{lead} </span>
              <span className={"flr-tok "+cls} onClick={e=>{ flrStop(e); openMenu(e,'act'); }}>{flrActVal(it)}</span>{' '}
              <span className="flr-tok" onClick={e=>{ flrStop(e); openMenu(e,'day'); }}>{it.day}</span>,{' '}
              <span className="flr-tok" onClick={e=>{ flrStop(e); openMenu(e,'cad'); }}>{it.cadence}</span>
            </div>
            <div style={{ fontSize:12, color:'var(--text-tertiary)', marginTop:1 }}>tap a word to change the rhythm</div>
            {flrOnCal(it) && <div className="flr-cal"><Icon name="calendar" size={14} />On your calendar — {it.day} · {it.cadence}.</div>}
            <div className="flr-prefsh"><span>your preferences</span><span>blank = open to all</span></div>
            <FlrTagInput it={it} onAdd={(k,v)=>onAddTag(it.id,k,v)} onRemove={(k,v)=>onRemoveTag(it.id,k,v)} />
            {pc===0 && <div className="flr-openhint">✦ open to everything — you fit the most plans</div>}
            <div className="flr-compat">
              <div className="flr-compat__big">{n}</div>
              <div className="flr-compat__txt">
                {pc===0
                  ? <><b>Fully open.</b> Any {flrActLabel(it)} {it.day} near you could loop you in — that’s why {n} fit.</>
                  : <><b>{n} near you</b> fit this. You’ve pinned {pc} preference{pc>1?'s':''} — clear a tag to fit more.</>}
              </div>
            </div>
            <div style={{ marginTop:12 }}>{primary}</div>
            <div className="flr-actgrid">
              <button className={"pls-btn pls-btn--ghost pls-btn--sm"+(it.watching?'':'')} style={{ width:'100%', color: it.watching?'var(--accent-strong)':undefined }} onClick={()=>onTog(it.id,'watching')}>{it.watching?'Watching':'Watch'}</button>
              <button className="pls-btn pls-btn--ghost pls-btn--sm" style={{ width:'100%', color: it.reminded?'var(--accent-strong)':undefined }} onClick={()=>onTog(it.id,'reminded')}><Icon name="bell" size={15} />{it.reminded?'On':'Remind'}</button>
              {third}
            </div>
            {menu && (
              <div className="flr-menu" style={{ left:menu.left, top:menu.top, width:230 }} onClick={e=>flrStop(e)}>
                {menu.list.map(o=>(
                  <div key={o.v} className="flr-sugrow" onClick={()=>{ onCore(it.id, menu.which, o.v); setMenu(null); }}>
                    <span className="flr-sugrow__bar" style={{ width:Math.round(o.n/mx*100)+'%' }} />
                    <span className="flr-sugrow__nm">{o.v===menu.cur?'✓ ':''}{o.v}</span>
                    <span className="flr-sugrow__vl">{o.n} want</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </>
      ), document.querySelector('.phone') || document.body);
    }

    const FLR_KIND = { study:'class', move:'major', dine:'dorm' };
    // Turn a Floor intent into a real app-level loop, so joining it shows up in
    // the Belonging signal + "Your loops" — same shape LoopCard/LoopDetail expect.
    function flrToLoop(it, viewerId){
      return {
        id:'flr-loop-'+it.id,
        title: flrCoreText(it),
        unit:{ kind: FLR_KIND[it.cat]||'class', label:(FLR_CATX[it.cat]?.label||'loop')+' · '+FLR_RING[it.ring].lbl },
        status:'active',
        rhythm: it.day+' · '+it.cadence,
        nextLine: it.day,
        live:false,
        memberIds:[viewerId],
        cap: it.target,
        streakWeeks:1, startedWeek:3,
      };
    }
    // A saved intent — what you've said you want, kept even when it hasn't
    // gathered a crew yet. The anchor people accrete around.
    function flrIntentSummary(it){
      return { id:it.id, label:flrCoreText(it), rhythm:it.day+' · '+it.cadence, cat:it.cat, ring:it.ring };
    }
    function TheFloor({ seedRaw, viewerId, user, onSeat, onUnseat, onSaveIntent, onRemoveIntent }){
      const [intents, setIntents] = useState(()=>flrSeed(seedRaw));
      const [sheetId, setSheetId] = useState(null);
      const [dayFilter, setDayFilter] = useState(null);
      const [toast, setToast] = useState(null);
      const tRef = useRef();
      const showToast = (t) => { setToast(t); clearTimeout(tRef.current); tRef.current=setTimeout(()=>setToast(null), 4200); };
      useEffect(()=>()=>clearTimeout(tRef.current), []);
      useEffect(()=>{
        const iv=setInterval(()=>{ if(sheetId) return; setIntents(xs=>{ const pool=xs.filter(i=>!i.dropped&&!i.muted&&i.status!=='fired'&&!i.mine&&!i.joined&&i.count<i.target-1); if(!pool.length) return xs; const p=pool[Math.floor(Math.random()*pool.length)]; return xs.map(i=>i.id===p.id?{ ...i, count:i.count+1 }:i); }); }, 6500);
        return ()=>clearInterval(iv);
      }, [sheetId]);
      // Persist any intent you've made yours (declared / shaped) up to the app,
      // so it survives leaving The Floor. Skip ones you've joined — those are loops.
      const saveMine = (it) => { if(onSaveIntent && it && !it.joined) onSaveIntent(flrIntentSummary(it)); };
      useEffect(()=>{ intents.forEach(i=>{ if(i.mine && !i.dropped && !i.muted) saveMine(i); }); }, []);
      const patch = (id, fn) => setIntents(xs=>xs.map(i=>{ if(i.id!==id) return i; const c={ ...i, prefs:{ ...i.prefs }, custom:[...(i.custom||[])] }; fn(c); return c; }));
      const onCore = (id, which, v) => { let next=null; patch(id, x=>{ if(which==='day') x.day=v; else if(which==='cad') x.cadence=v; else x[flrActKey(x)]=v; x.mine=x.mine||!x.joined; x.status=null; x.count=flrCompat(x); next=x; }); saveMine(next); };
      const onAddTag = (id, key, val) => { let next=null; patch(id, x=>{ if(key==='custom'){ if(!x.custom.includes(val)) x.custom.push(val); } else { const f=FLR_FACETS[x.cat].find(ff=>ff.key===key); if(f.multi){ x.prefs[key]=[...(x.prefs[key]||[])]; if(!x.prefs[key].includes(val)) x.prefs[key].push(val); } else x.prefs[key]=val; } x.mine=x.mine||!x.joined; x.status=null; x.count=flrCompat(x); next=x; }); saveMine(next); };
      const onRemoveTag = (id, key, val) => patch(id, x=>{ if(key==='custom'){ x.custom=x.custom.filter(t=>t!==val); } else { const f=FLR_FACETS[x.cat].find(ff=>ff.key===key); if(f&&f.multi){ x.prefs[key]=(x.prefs[key]||[]).filter(t=>t!==val); if(!x.prefs[key].length) delete x.prefs[key]; } else delete x.prefs[key]; } x.count=flrCompat(x); });
      const onTog = (id, f) => patch(id, x=>{ x[f]=!x[f]; });
      const onJoin = (id) => {
        const src = intents.find(i=>i.id===id); if(!src) return;
        const joined = { ...src, joined:true, count:src.count+1 };
        const fired = joined.count>=joined.target && src.status!=='fired';
        const lab = flrLabel(joined);
        setIntents(xs=>xs.map(i=> i.id===id ? { ...i, joined:true, count:i.count+1, status:fired?'fired':i.status } : i));
        if(onSeat) onSeat(flrToLoop(joined, viewerId));
        setSheetId(null); showToast(fired?{ icon:'zap', title:'“'+lab+'” fired', body:'A loop is crystallizing. Same faces, on repeat.' }:{ icon:'calendar', title:'Added to your week', body:'You’re in the '+lab+' loop.' }); };
      const onLeave = (id) => { patch(id, x=>{ x.joined=false; x.count=Math.max(0,x.count-1); }); if(onUnseat) onUnseat('flr-loop-'+id); setSheetId(null); showToast({ icon:'log-out', title:'Left the loop', body:'Off your calendar. Nobody sees a thing.' }); };
      const onDrop = (id) => { setIntents(xs=>xs.map(i=>i.id===id?{ ...i, dropped:true }:i)); if(onUnseat) onUnseat('flr-loop-'+id); if(onRemoveIntent) onRemoveIntent(id); setSheetId(null); showToast({ icon:'log-out', title:'Dropped', body:'Off your floor.' }); };
      const onMute = (id) => { setIntents(xs=>xs.map(i=>i.id===id?{ ...i, muted:true }:i)); if(onRemoveIntent) onRemoveIntent(id); setSheetId(null); showToast({ icon:'shield', title:'Muted', body:'It won’t clutter your floor.' }); };
      const addIntent = () => { const id='flr'+Math.floor(Math.random()*1e6); const c={ id, cat:'dine', meal:'dinner', day:'Thursdays', cadence:'weekly', target:8, mine:true, ring:'floor', prefs:{}, custom:[] }; c.count=flrCompat(c); setIntents(xs=>[c, ...xs]); saveMine(c); setSheetId(id); };

      const list = intents.filter(i=>!i.dropped&&!i.muted).slice().sort((a,b)=>flrMomentum(b)-flrMomentum(a));
      const visible = list.filter(it=>!(dayFilter&&!flrDayMatch(it,dayFilter)));
      const hero = visible[0];
      const rest = visible.slice(1);
      const active = sheetId ? intents.find(i=>i.id===sheetId) : null;

      return (
        <div className="mt-6">
          <div className="flex items-center gap-1.5 mb-1">
            <Icon name="radio" size={16} style={{ color:'var(--accent)' }} />
            <h2 className="pls-display" style={{ fontWeight:700, fontSize:15, color:'var(--text-primary)' }}>What your intent lands in</h2>
          </div>
          <p className="text-[12.5px] mb-3" style={{ color:'var(--text-secondary)' }}>Closest to you, closest to happening.</p>

          <div className="flr-week">
            {FLR_WEEK.map(([ltr,pl],i)=>{ const cnt=intents.filter(x=>flrOnCal(x)&&flrDayMatch(x,pl)).length; return (
              <div key={i} className={"flr-wc"+(cnt?" flr-wc--has":"")+(dayFilter===pl?" flr-wc--on":"")} onClick={()=>setDayFilter(dayFilter===pl?null:pl)}>
                <span className="flr-wc__d">{ltr}</span><span className="flr-wc__dot" />
              </div>
            ); })}
          </div>

          {hero && (()=>{ const near=hero.count>=hero.target-1, c=FLR_CATX[hero.cat].c, pct=hero.count/hero.target; return (
            <div className="flr-hero" onClick={()=>setSheetId(hero.id)}>
              <span className="flr-badge">{hero.mine?'★ your intent':near?'🔥 1 more fires it':'closest to happening'}</span>
              <div className="flr-hero__t">{flrCoreText(hero)}</div>
              <div className="flr-hero__meta"><span className="flr-cdot" style={{ background:hero.mine?'var(--accent)':c }} />{FLR_RING[hero.ring].lbl}{flrTagsInline(hero)}</div>
              <div className="flr-hero__stat"><span className="flr-hero__nn">{hero.count}</span><span className="flr-hero__ll">of {hero.target} want it{near?' — you’d be the one that fires it':''}</span></div>
              <div className="flr-mini"><i style={{ width:Math.round(pct*100)+'%' }} /></div>
              <div className="flr-acts">
                <button className="pls-btn pls-btn--secondary pls-btn--sm" style={{ flex:'0 0 auto' }} onClick={e=>{ flrStop(e); setSheetId(hero.id); }}><Icon name="pencil" size={15} />Shape it</button>
                <button className="pls-btn pls-btn--primary pls-btn--sm" style={{ flex:1 }} onClick={e=>{ flrStop(e); flrOnCal(hero)?setSheetId(hero.id):onJoin(hero.id); }}><Icon name="plus" size={16} />{flrOnCal(hero)?'On your week':'Join loop'}</button>
              </div>
            </div>
          ); })()}

          <div className="flr-sec"><Icon name="trending-up" size={14} style={{ color:'var(--text-tertiary)' }} />{dayFilter?('more on '+dayFilter):'more forming near you'}</div>
          {rest.map((it,idx)=>{ const near=it.count>=it.target-1, c=FLR_CATX[it.cat].c, pct=it.count/it.target; return (
            <div key={it.id} className="flr-row" onClick={()=>setSheetId(it.id)}>
              <span className="flr-row__rank">{idx+2}</span>
              <div style={{ flex:1, minWidth:0 }}>
                <div className="flr-row__t"><span className="flr-cdot" style={{ background:it.mine?'var(--accent)':c }} />{flrLabel(it)}{near&&<span className="flr-fire">1 to fire</span>}{it.mine?<span className="flr-you">yours</span>:(flrOnCal(it)?<span className="flr-you">joined</span>:null)}</div>
                <div className="flr-row__sub"><span className="flr-prox">{it.cadence} · {FLR_RING[it.ring].lbl}</span><span className="flr-tagmini">{flrTagsInline(it)}</span></div>
              </div>
              <FlrRingGauge pct={pct} color={near?'var(--status-forming)':it.mine?'var(--accent)':c} label={it.count+'/'+it.target} />
            </div>
          ); })}

          {dayFilter && <div className="flr-sec" style={{ cursor:'pointer', color:'var(--accent-strong)', marginTop:12 }} onClick={()=>setDayFilter(null)}>× clear {dayFilter} filter</div>}

          <div className="mt-4"><Button variant="secondary" block icon="plus" onClick={addIntent}>Drop your own rhythm</Button></div>

          {active && <FlrSheet it={active} onClose={()=>setSheetId(null)} onCore={onCore} onAddTag={onAddTag} onRemoveTag={onRemoveTag} onJoin={onJoin} onLeave={onLeave} onDrop={onDrop} onMute={onMute} onTog={onTog} />}
          {toast && ReactDOM.createPortal((
            <div className="flr-toast">
              <div className="pls-toast toast-in">
                <span style={{ color:'var(--accent)' }}><Icon name={toast.icon} size={18} /></span>
                <div style={{ minWidth:0 }}>
                  <p style={{ fontWeight:600, fontSize:13.5 }}>{toast.title}</p>
                  <p className="text-[12px]" style={{ color:'var(--text-inverse)', opacity:.78 }}>{toast.body}</p>
                </div>
              </div>
            </div>
          ), document.querySelector('.phone') || document.body)}
        </div>
      );
    }

    function Home({ state, actions }){
      const { user, viewerId='sarah', loops, suggestions, nudge, unread, theme, campus } = state;
      const myLoops = loops.filter(l => l.memberIds.includes(viewerId));
      const latecomerLoop = loops.find(l => l.loopedInFor===viewerId && l.memberIds.includes(viewerId));
      const seededLoop = loops.find(l => l.seededBy===viewerId && l.status==='active');   // forming seeds (RA/TA) show as cards, not here
      return (
        <div className="h-full flex flex-col" style={{ position:'relative' }}>
          <AppHeader
            left={<Wordmark size={22} />}
            right={<>
              <IconButton name="bell" size={20} label="Alerts" badge={unread} onClick={actions.openNotifications} />
              <AccountTrigger user={user} viewerId={viewerId} theme={theme} actions={actions} />
            </>}
          />
          <div className="flex-1 overflow-y-auto no-scrollbar px-5 pb-28 fade-in">
            {latecomerLoop && (
              <button onClick={()=>actions.openLoop(latecomerLoop.id, viewerId)} className="w-full text-left pls-banner p-4 mt-4 rise" style={{ cursor:'pointer' }}>
                <div className="flex items-center gap-1.5 pls-kicker" style={{ color:'var(--accent-strong)' }}>
                  <Icon name="users" size={13} />You were looped in
                </div>
                <p className="mt-1.5" style={{ fontWeight:500, fontSize:15, color:'var(--text-primary)', lineHeight:1.4 }}>
                  You didn't search — you got seated into the <span style={{ fontWeight:700 }}>{latecomerLoop.title}</span>, a crew that already meets. No cold start.
                </p>
                <div className="mt-2 flex items-center gap-1 text-[13.5px]" style={{ color:'var(--accent-strong)', fontWeight:600 }}>
                  Meet the crew<Icon name="arrow-right" size={15} />
                </div>
              </button>
            )}

            {seededLoop && !latecomerLoop && (
              <button onClick={()=>actions.openLoop(seededLoop.id)} className="w-full text-left pls-card p-4 mt-4 rise" style={{ cursor:'pointer', borderColor:'var(--accent-quiet)' }}>
                <div className="flex items-center gap-1.5 pls-kicker" style={{ color:'var(--accent-strong)' }}>
                  <Icon name="sprout" size={13} />You seeded this loop
                </div>
                <p className="mt-1.5" style={{ fontWeight:500, fontSize:15, color:'var(--text-primary)', lineHeight:1.4 }}>
                  The <span style={{ fontWeight:700 }}>{seededLoop.title}</span> has run itself {seededLoop.streakWeeks} weeks — {seededLoop.memberIds.length} regulars, no host. Nothing for you to send.
                </p>
                <div className="mt-2 flex items-center gap-1 text-[13.5px]" style={{ color:'var(--accent-strong)', fontWeight:600 }}>
                  See how it's going<Icon name="arrow-right" size={15} />
                </div>
              </button>
            )}

            {nudge && (
              <div className="mt-4">
                <button onClick={actions.tapNudge} className="w-full text-left pls-banner p-4 rise" style={{ cursor:'pointer' }}>
                  <div className="flex items-center gap-1.5 pls-kicker" style={{ color:'var(--accent-strong)' }}>
                    <Icon name="zap" size={13} />{nudge.kicker}
                  </div>
                  <p className="mt-1.5" style={{ fontWeight:500, fontSize:15, color:'var(--text-primary)', lineHeight:1.4 }}>{nudge.body}</p>
                  <div className="mt-2 flex items-center gap-1 text-[13.5px]" style={{ color:'var(--accent-strong)', fontWeight:600 }}>
                    {nudge.cta}<Icon name="arrow-right" size={15} />
                  </div>
                </button>
              </div>
            )}

            {myLoops.length > 0 && (
              <div className="mt-5">
                <div className="flex items-center justify-between mb-2.5">
                  <h2 className="pls-display" style={{ fontWeight:700, fontSize:15, color:'var(--text-primary)' }}>Your loops</h2>
                  <span className="pls-mono text-[12px]" style={{ color:'var(--text-tertiary)' }}>{myLoops.length} running</span>
                </div>
                <div className="space-y-3">
                  {myLoops.map(l => <LoopCard key={l.id} loop={l} onOpen={()=>actions.openLoop(l.id)} />)}
                </div>
              </div>
            )}

            {suggestions ? (
              <TheFloor key={suggestions.raw} seedRaw={suggestions.raw} viewerId={viewerId} user={user}
                onSeat={actions.floorSeat} onUnseat={actions.floorUnseat}
                onSaveIntent={actions.saveIntent} onRemoveIntent={actions.removeIntent} />
            ) : (
              <PulseFeed viewerId={viewerId} user={user} loops={loops} actions={actions} />
            )}
          </div>

          <button className="pls-fab" aria-label="Drop an intent" onClick={actions.openCompose}><Icon name="plus" size={24} /></button>

          <TabBar active="pulse" unread={unread}

    /* ============================================================

    /* Plain-English quick-add for intents. Activity must resolve to the
       curated allowlist; off-list text becomes a moderated pending request. */
    // Phrase to re-open an intent in the quick-add. Quick-add intents keep their raw text;
    // Floor / composer intents are rebuilt from label + rhythm (deduped, so 'Thursdays' isn't repeated).
    function intentToPhrase(it){
      if (it.raw) return it.raw;
      const bits = [it.label, ...((it.rhythm||'').split(' · '))].filter(Boolean).join(' ').toLowerCase().split(/\s+/);
      const seen = new Set();
      return bits.filter(w => { const k=w.replace(/[^\w@]/g,''); if(!k || seen.has(k)) return false; seen.add(k); return true; }).join(' ');
    }
    function IntentQuickAdd({ onAdd, editing=null, onCancelEdit }){
      const [text, setText] = useState('');
      const inputRef = useRef(null);
      useEffect(()=>{ if(editing){ setText(intentToPhrase(editing)); inputRef.current && inputRef.current.focus(); } else setText(''); }, [editing && editing.id]);
      const p = parseQuickIntent(text);
      const known = !!p.activity;
      const canAdd = (known || !!p.request) && !!p.cadence;
      const submit = (activityOverride) => {
        const pp = activityOverride ? { ...p, activity:activityOverride, request:null } : p;
        if(!((activityOverride||known||p.request) && pp.cadence)) return;
        onAdd(qiIntentSummary(pp, activityOverride?activityOverride.label:text), editing ? editing.id : null); setText('');
      };
      const Ghost = ({ children }) => (
        <span className="pls-badge" style={{ color:'var(--text-tertiary)', background:'transparent', border:'1px dashed var(--border-hairline)' }}>{children}</span>
      );
      const suggestions = p.request ? ACTIVITY_CATALOG.filter(a => a.label.includes(p.request) || a.aliases.some(al=>al.includes(p.request))).slice(0,4) : [];
      return (
        <div className="pls-card p-3.5">
          {editing && (
            <div className="flex items-center justify-between mb-2">
              <span className="pls-kicker" style={{ color:'var(--accent-strong)' }}>Editing · {editing.label}</span>
              <button onClick={onCancelEdit} className="text-[12px]" style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-tertiary)', fontWeight:600 }}>Cancel</button>
            </div>
          )}
          <div className="flex items-center gap-2">
            <Icon name={editing?'pencil':'plus'} size={16} style={{ color:'var(--accent-strong)', flexShrink:0 }} />
            <input ref={inputRef} value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') submit(); if(e.key==='Escape' && editing) onCancelEdit(); }}
              placeholder="e.g. lift 3× a week in the mornings"
              style={{ flex:1, minWidth:0, background:'none', border:'none', outline:'none', color:'var(--text-primary)', fontSize:14 }} />
          </div>
          {text.trim() && (
            <div className="mt-2.5">
              <div className="flex items-center flex-wrap gap-1.5">
                {known
                  ? <Chip variant="accent" icon={INTENT_ICON[p.activity.cat]}>{p.activity.label}</Chip>
                  : p.request
                  ? <span className="pls-badge" style={{ color:'var(--status-forming)', background:'color-mix(in srgb, var(--status-forming) 15%, var(--bg-surface))' }}>“{p.request}” · needs review</span>
                  : <Ghost>+ what activity?</Ghost>}
                {p.cadence ? <Chip>{p.cadence}</Chip> : <Ghost>+ how often?</Ghost>}
                {p.day && <Chip>{p.day}</Chip>}
                {p.time && <Chip>{p.time}</Chip>}
                {p.place && <Chip>@{p.place}</Chip>}
              </div>
              {suggestions.length>0 && (
                <div className="flex items-center flex-wrap gap-1.5 mt-2">
                  <span className="text-[11px]" style={{ color:'var(--text-tertiary)' }}>did you mean</span>
                  {suggestions.map(s => (
                    <button key={s.label} onClick={()=>submit(s)}
                      className="pls-badge" style={{ cursor:'pointer', color:'var(--accent-strong)', background:'var(--accent-quiet)', border:'none' }}>{s.label}</button>
                  ))}
                </div>
              )}
              <div className="mt-3">
                <Button size="sm" block disabled={!canAdd} variant={known?'primary':'secondary'} icon={!p.cadence?undefined:known?'plus':'clock'}
                  onClick={()=>submit()}>
                  {!p.cadence ? 'Add how often to save' : editing ? 'Save changes' : known ? 'Add intent' : 'Request & save as pending'}
                </Button>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ============================================================
       YOU  — belonging signal + assigned counselor + safety (Stellic

    function YouScreen({ state, actions }){

              <MiniStat n={unrated} label="to rate" hi={unrated>0} />
            </div>

            {/* segmented hub — one list at a time. Everything in it is editable:

    /* ============================================================
       CLASS OF 2030 — the incoming-cohort "class dashboard" (dynamic,
       alive). Ranks loops + houses, never people (§2 guardrail).
    ============================================================ */
    // Animate a number from 0 → target on mount, so the dashboard reads as live.
    function useCountUp(target, dur=1100){
      const [v, setV] = useState(0);
      useEffect(()=>{
        let raf, start;
        const step = (t)=>{
          if(start==null) start=t;
          const p = Math.min(1, (t-start)/dur);
          const eased = 1 - Math.pow(1-p, 3);   // easeOutCubic
          setV(target*eased);
          if(p<1) raf=requestAnimationFrame(step);
          else setV(target);
        };
        raf=requestAnimationFrame(step);
        return ()=>cancelAnimationFrame(raf);
      }, [target, dur]);
      return v;
    }
    function CountStat({ value, label, suffix='', icon, accent, dur=1100 }){
      const v = useCountUp(value, dur);
      const shown = Math.round(v).toLocaleString() + suffix;
      return (
        <div className="flex flex-col gap-0.5">
          <div className="flex items-center gap-1" style={{ color: accent?'var(--accent-strong)':'var(--text-tertiary)' }}>
            {icon && <Icon name={icon} size={13} />}
            <span className="pls-kicker" style={{ color:'inherit' }}>{label}</span>
          </div>
          <span className="pls-mono" style={{ fontSize:26, fontWeight:500, lineHeight:1.05,
            color: accent?'var(--accent-strong)':'var(--text-primary)' }}>{shown}</span>
        </div>
      );
    }
    // A crew's avatar row (display-only — no tap-through to a profile; guardrail preserved).
    function CrewFaces({ members, size=22, max=3 }){
      const shown = members.slice(0, max);
      const extra = members.length - shown.length;
      return (
        <div className="flex items-center" style={{ paddingLeft:8 }}>
          {shown.map((m,i)=>(
            <div key={m.id} style={{ marginLeft:-8, zIndex:10-i }}><Avatar id={m.id} name={m.name} size={size} ring /></div>
          ))}
          {extra>0 && (
            <div style={{ width:size, height:size, marginLeft:-8, background:'var(--bg-sunken)',
                          color:'var(--text-tertiary)', boxShadow:'0 0 0 2px var(--bg-surface)' }}
                 className="pls-avatar text-[10px] font-semibold">+{extra}</div>
          )}
        </div>
      );
    }
    function RankBadge({ rank }){
      const top3 = rank<=3;
      const hue = rank===1 ? 'var(--amber-500)' : rank===2 ? 'var(--slate-500)' : rank===3 ? 'var(--carnelian-400)' : 'var(--text-tertiary)';
      return (
        <div className="pls-mono flex items-center justify-center" style={{ width:24, height:24, borderRadius:8, flexShrink:0,
          fontSize:13, fontWeight:500, color: top3?hue:'var(--text-tertiary)',
          background: top3 ? `color-mix(in srgb, ${hue} 15%, var(--bg-surface))` : 'var(--bg-sunken)' }}>{rank}</div>
      );
    }
    function ClassDashboard({ state, actions }){
      const { campus, theme, unread, user, viewerId } = state;
      // Live feel: loops-running ticks up gently while you watch.
      const [liveLoops, setLiveLoops] = useState(campus.loopsRunning);
      const [tick, setTick] = useState(0);
      useEffect(()=>{
        const a = setInterval(()=> setLiveLoops(n => n + (1 + Math.floor((n*7)%3))), 4200);
        const b = setInterval(()=> setTick(t => (t+1) % COHORT_TICKER.length), 3600);
        return ()=>{ clearInterval(a); clearInterval(b); };
      }, []);
      const topStreak = COHORT_LEADERBOARD[0].streak;
      const trendLabel = (t)=> t>0 ? `+${t}` : t===0 ? '—' : `${t}`;
      return (
        <div className="h-full flex flex-col" style={{ position:'relative' }}>
          <AppHeader
            left={
              <div className="flex items-center gap-2">
                <div style={{ width:30, height:30, borderRadius:9, background:'var(--accent-quiet)', color:'var(--accent-strong)',
                  display:'flex', alignItems:'center', justifyContent:'center' }}><Icon name="graduation-cap" size={17} /></div>
                <div className="leading-none">
                  <div className="pls-display" style={{ fontWeight:800, fontSize:16, color:'var(--text-primary)' }}>Class of {COHORT.classOf}</div>
                  <div className="pls-kicker" style={{ fontSize:10 }}>{COHORT.arriving} · North Campus</div>
                </div>
              </div>
            }
            right={<AccountTrigger user={user} viewerId={viewerId} theme={theme} actions={actions} />} />

          <div className="flex-1 overflow-y-auto no-scrollbar px-5 pt-4 pb-28 fade-in">

            {/* ---- cohort hero ---- */}
            <div className="flex items-end justify-between">
              <div>
                <div className="flex items-center gap-1.5 pls-kicker" style={{ color:'var(--accent-strong)' }}>
                  <LiveDot />the class, right now
                </div>
                <h1 className="pls-display mt-1" style={{ fontWeight:800, fontSize:30, lineHeight:1, color:'var(--text-primary)' }}>
                  Your people are<br/>already forming.
                </h1>
              </div>
            </div>

            <Card className="p-4 mt-4">
              <div className="grid grid-cols-2 gap-y-4 gap-x-3">

                <div className="flex flex-col gap-0.5">
                  <div className="flex items-center gap-1" style={{ color:'var(--text-tertiary)' }}>
                    <Icon name="radio" size={13} /><span className="pls-kicker" style={{ color:'inherit' }}>loops running</span>
                  </div>
                  <span className="pls-mono" style={{ fontSize:26, fontWeight:500, lineHeight:1.05, color:'var(--text-primary)',
                    transition:'color var(--dur-2)' }}>{liveLoops.toLocaleString()}</span>
                </div>
                <CountStat value={topStreak} suffix=" wk" label="longest streak" icon="flame" accent />
              </div>
              <p className="pls-mono mt-3.5 pt-3 text-[11px]" style={{ color:'var(--text-tertiary)', borderTop:'1px solid var(--border-hairline)' }}>
                {COHORT.admitted.toLocaleString()} admitted on Ivy Day · ~{COHORT.enrolling.toLocaleString()} enrolling
              </p>
            </Card>

            {/* ---- live ticker ---- */}
            <div className="mt-3 pls-blush p-3.5 overflow-hidden">
              <div className="flex items-center gap-2">
                <Icon name="zap" size={15} style={{ color:'var(--accent-strong)', flexShrink:0 }} />
                <div key={tick} className="fade-in text-[13px]" style={{ color:'var(--text-primary)', fontWeight:500, minWidth:0,
                  whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{COHORT_TICKER[tick]}</div>
              </div>
            </div>

            {/* ---- streak leaderboard (loops, never people) ---- */}
            <div className="mt-6 flex items-center justify-between">
              <div className="flex items-center gap-1.5">
                <Icon name="flame" size={17} style={{ color:'var(--accent)' }} />
                <h2 className="pls-display" style={{ fontWeight:700, fontSize:16, color:'var(--text-primary)' }}>Longest-running crews</h2>
              </div>
              <span className="pls-kicker">streak · wks</span>
            </div>
            <p className="text-[12px] mt-0.5 mb-3" style={{ color:'var(--text-secondary)' }}>Same faces, week after week. Loops rank here — never people.</p>

            <div className="space-y-2">
              {COHORT_LEADERBOARD.map((c,i)=>(
                <Card key={c.id} variant={c.seed?'default':'sunken'} className="p-3 rise"
                  style={{ animationDelay:(i*45)+'ms', ...(c.seed?{ borderColor:'var(--accent-quiet)' }:{}) }}>
                  <div className="flex items-center gap-2.5">
                    <RankBadge rank={i+1} />
                    <div className="min-w-0 flex-1">
                      <div className="flex items-center gap-1.5">
                        <span className="truncate" style={{ fontWeight:600, fontSize:14, color:'var(--text-primary)' }}>{c.title}</span>
                        {c.seed && <span className="pls-badge" style={{ flexShrink:0, color:'var(--accent-strong)', background:'var(--accent-quiet)' }}>yours</span>}
                      </div>
                      <div className="flex items-center gap-2 mt-1">
                        <span className="pls-mono text-[11.5px]" style={{ color:'var(--text-tertiary)', flexShrink:0 }}>{c.target}</span>
                        <CrewFaces members={c.members} size={20} max={4} />
                      </div>
                    </div>
                    <div className="flex flex-col items-end" style={{ minWidth:46, flexShrink:0 }}>
                      <div className="flex items-center gap-1">
                        <Icon name="flame" size={15} style={{ color: i<3?'var(--accent)':'var(--text-tertiary)' }} />
                        <span className="pls-mono" style={{ fontSize:17, fontWeight:500, color:'var(--text-primary)' }}>{c.streak}</span>
                      </div>
                      <span className="pls-mono text-[10.5px] mt-0.5" style={{ color: c.trend>0?'var(--moss-500)':'var(--text-tertiary)' }}>
                        {trendLabel(c.trend)} vs last
                      </span>
                    </div>
                  </div>
                </Card>
              ))}
            </div>

            {/* ---- house standings ---- */}
            <div className="mt-6 flex items-center justify-between">
              <div className="flex items-center gap-1.5">
                <Icon name="house" size={17} style={{ color:'var(--accent)' }} />
                <h2 className="pls-display" style={{ fontWeight:700, fontSize:16, color:'var(--text-primary)' }}>House standings</h2>

              <div className="space-y-3">
                {COHORT_HOUSES.map((h,i)=>(
                  <div key={h.dorm} className="flex items-center gap-3">
                    <span className="pls-mono text-[12px]" style={{ width:16, color:'var(--text-tertiary)', flexShrink:0 }}>{i+1}</span>
                    <div className="min-w-0 flex-1">

    /* ============================================================
       STAFF DASHBOARDS — three lenses on the same loops, each scoped
       to what that person can act on: an RA's floor, a TA's class, a
       counselor's whole school. Same guardrail on all three: counts and
       loops, never intents by name (§2). RA/TA are still students — this
       is a 5th tab in their app; Dana lands straight here.
    ============================================================ */
    // Belonging ring — the one number every staff lens leads with.
    function BelongingRing({ pct, size=92 }){
      const v = useCountUp(pct, 1100);
      const ring = Math.round(v);
      return (
        <div style={{ position:'relative', width:size, height:size, flexShrink:0 }}>
          <div style={{ position:'absolute', inset:0, borderRadius:'50%',
            background:`conic-gradient(var(--accent) ${ring*3.6}deg, var(--bg-sunken) 0deg)` }} />
          <div style={{ position:'absolute', inset:9, borderRadius:'50%', background:'var(--bg-surface)',
            display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}>
            <span className="pls-mono" style={{ fontSize:22, fontWeight:500, color:'var(--text-primary)', lineHeight:1 }}>{ring}%</span>
            <span className="pls-kicker" style={{ fontSize:8.5 }}>in a loop</span>
          </div>
        </div>
      );
    }
    function StaffStat({ n, label, tone }){
      const color = tone==='live' ? 'var(--status-live)' : tone==='acc' ? 'var(--accent-strong)' : tone==='form' ? 'var(--status-forming)' : 'var(--text-primary)';
      return (
        <div className="flex flex-col">

    // Aggregate bars: label | in-a-loop (green) + waiting (amber) | count. Never a person.
    function AggBars({ rows, max, tone='in' }){
      const top = max || Math.max(...rows.map(r=>r.total));
      return (
        <div>
          {rows.map((r,i)=>{
            const wait = r.total - (r.inLoop ?? r.total);
            return (
              <div key={r.label} className="flex items-center gap-2.5" style={{ padding:'7px 0', borderTop: i ? '1px solid var(--border-hairline)' : 'none' }}>
                <div style={{ width:104, flexShrink:0 }}>
                  <div className="truncate" style={{ fontSize:12.5, fontWeight:600, color:'var(--text-primary)' }}>{r.label}</div>
                  {r.gap && <div className="pls-mono" style={{ fontSize:10, color:'var(--status-forming)' }}>no loop yet</div>}
                </div>
                <div className="flex-1 flex" style={{ height:8, borderRadius:999, background:'var(--bg-sunken)', overflow:'hidden' }}>
                  <div style={{ width:`${(r.inLoop ?? r.total)/top*100}%`, background: tone==='acc' ? 'var(--accent)' : 'var(--status-live)' }} />
                  <div style={{ width:`${wait/top*100}%`, background:'var(--status-forming)', opacity:.85 }} />
                </div>
                <div className="pls-mono" style={{ fontSize:11.5, color:'var(--text-secondary)', whiteSpace:'nowrap', minWidth:52, textAlign:'right' }}>
                  <span style={{ color:'var(--text-primary)' }}>{r.pct!=null ? r.pct+'%' : r.total}</span>{wait>0 && ` · ${wait} wait`}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

        </Card>

    }
