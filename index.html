                    {inLoopCampus.toLocaleString()} of {S.undergrads.toLocaleString()} undergrads. <span style={{ color:'var(--text-primary)', fontWeight:600 }}>+{S.delta} pts</span> week over week; week 6 is where it usually dips.
                  </p>
                  <div className="flex items-center gap-4 mt-3">
                    <StaffStat n={S.activeLoops.toLocaleString()} label="active loops" />
                    <StaffStat n={S.formedThisWeek} label="formed this wk" tone="live" />
                    <StaffStat n={S.wrappedThisWeek} label="wrapped" tone="acc" />
                  </div>
                </div>
              </div>
              <div className="flex items-end gap-1 mt-3" style={{ height:38 }}>
                {trend.map((v,i)=>(
                  <div key={i} style={{ flex:1, height:Math.max(3, Math.round(v/100*38)), borderRadius:'3px 3px 0 0', background: i===trend.length-1 ? 'var(--accent)' : 'var(--border-hairline)' }} />
                ))}
              </div>
              <div className="flex justify-between pls-mono mt-1" style={{ fontSize:10, color:'var(--text-tertiary)' }}><span>wk 1</span><span>in a loop · % of campus</span><span>wk {trend.length}</span></div>
            </Card>

            <StaffSection icon="trending-up" title="Belonging by" count="% in a loop" />
            <div className="pls-seg pls-seg--3" role="tablist" style={{ marginBottom:10, '--seg-i': ['houses','courses','years'].indexOf(seg) }}>
              <span className="pls-seg__thumb" />
              {[['houses','House'],['courses','Course'],['years','Class year']].map(([k,l])=>(
                <button key={k} className="pls-seg__opt" role="tab" aria-selected={seg===k} aria-pressed={seg===k} onClick={()=>setSeg(k)}>{l}</button>
              ))}
            </div>
            <Card className="p-3.5">
              <AggBars rows={rows} max={100} />
            </Card>

            <StaffSection icon="flag" title="Cold spots" count={`${S.cold.length} to look at`} countAccent
              lede="Where the number is low or falling — routed to who can act (RAs, TAs, departments), not students." />
            <div className="space-y-2.5">
              {S.cold.map((c,i)=>{
                const done = isDone(c.id);
                return (
                  <Card key={c.id} className="p-3.5 rise" style={{ animationDelay:(i*45)+'ms', ...(c.hi && !done ? { borderColor:'var(--accent)' } : {}) }}>
                    <div className="flex items-center gap-3">
                      <div className="pls-mono" style={{ width:34, height:34, borderRadius:10, background:'var(--accent-quiet)', color:'var(--accent-strong)', display:'grid', placeItems:'center', fontWeight:700, fontSize:12 }}>{c.n}</div>
                      <div className="min-w-0 flex-1">
                        <div style={{ fontWeight:600, fontSize:14, color:'var(--text-primary)' }}>{c.title}</div>
                        <div className="pls-mono text-[11px] mt-0.5" style={{ color:'var(--text-tertiary)' }}>{c.line}</div>
                      </div>
                    </div>
                    {c.why && <p className="text-[12.5px] mt-2 leading-relaxed" style={{ color:'var(--text-secondary)' }}>{c.why}</p>}
                    <div className="mt-3">
                      <Button size="sm" variant={done?'secondary':'primary'} icon={done?'check':'send'} disabled={done}
                        onClick={()=>actions.schoolAct(c)}>{done ? 'Sent' : c.cta}</Button>
                    </div>
                  </Card>
                );
              })}
            </div>

            <StaffSection icon="life-buoy" title="Your advisees" count={`${inLoop} of ${ADVISOR_CASELOAD} in a loop`}
              lede="The one signal that predicts who stays. Reach out — a nudge from you, not an algorithm." />
            <Card className="p-3.5">
              {ADVISOR_REACH.map(s => (
                <StaffPerson key={s.id} id={s.id} name={s.name} signal={`${s.dorm} · ${s.signal}`} done={isDone('reach-'+s.id)}
                  onReach={()=>actions.staffReach(s.name, 'reach-'+s.id)} />
              ))}
            </Card>

            <StaffGuard>No intents, no messages, no who-likes-whom. Only whether a student has landed in a loop, rolled up by house, course and year. Everything else stays on their phone.</StaffGuard>
          </div>
        </div>
      );
    }

    /* ============================================================
       SHARED WORLD + PERSISTENCE — one serializable world object is the
       single source of truth for every student persona; a localStorage
       layer hydrates it, auto-saves it, and version-gates stale blobs
       (reseed, no migrations). See specs/shared-world-state + world-persistence.
    ============================================================ */
    const WORLD_VERSION = 1;
    const WORLD_KEY = 'loop.world';
    const seedIntents = () => [];   // authored intents accumulate here (each carries a userId)
    const seedWorld = () => ({
      version: WORLD_VERSION,
      loops: seedLoops(),
      intents: seedIntents(),
      wrapped: WRAPPED_LOOPS,
      notifs: {},     // keyed by recipient userId
      feedback: {},   // keyed by userId → { [ratingId]: 'like'|'neutral'|'dislike' }
      profiles: {},   // keyed by userId → onboarding overrides
      staff: {},      // keyed by actor userId → { [actionId]: true } — one-shot staff actions (event drafted, hint sent…)
    });
    const worldStore = {
      load(){
        try {
          const raw = localStorage.getItem(WORLD_KEY);
          if (!raw) return seedWorld();
          const w = JSON.parse(raw);
          if (!w || w.version !== WORLD_VERSION) return seedWorld();
          return w;
        } catch (e) { return seedWorld(); }
      },
      save(world){
        try { localStorage.setItem(WORLD_KEY, JSON.stringify(world)); } catch (e) {}
      },
      reset(){
        try { localStorage.removeItem(WORLD_KEY); } catch (e) {}
        return seedWorld();
      },
    };

    /* ============================================================
       APP  — state machine + all mutations
    ============================================================ */
    function App(){
      const [screen, setScreen] = useState('splash');   // splash|story|email|basics|intent|home|class|loop|notifs|you|advisor
      const [sheet, setSheet]   = useState(null);        // null|compose|spinup|safety|share
      const [theme, setTheme]   = useState('daylight');  // daylight|afterdark
      const [intentSeed, setIntentSeed] = useState(''); // pre-fill for FirstIntent, chosen in the story onboarding
      const [viewerId, setViewerId] = useState('sarah'); // whose perspective the phone is showing
      const [world, setWorld]   = useState(worldStore.load);   // the one shared, persisted world
      const [suggestions, setSuggestions] = useState(null);
      const [activeLoopId, setActiveLoopId] = useState(null);
      const [highlightId, setHighlightId]   = useState(null);
      const [detailBanner, setDetailBanner] = useState(null);
      const [draft, setDraft]   = useState(null);
      const [nudge, setNudge]   = useState(null);
      const [toast, setToast]   = useState(null);
      const [rateId, setRateId]     = useState(null);          // wrapped loop currently open in the Rate sheet
      const [safetySubject, setSafetySubject] = useState(null);
      const [shareLoopId, setShareLoopId]     = useState(null);
      const campus = useMemo(()=> buildCampus(COHORT.enrolling), []);

      // Auto-save: every mutation produces a new world object; this persists the latest after any change.
      useEffect(()=>{ worldStore.save(world); }, [world]);
      // Shim so existing mutation bodies keep calling setLoops(fn) unchanged.
      const setLoops = up => setWorld(w => ({ ...w, loops: typeof up==='function' ? up(w.loops) : up }));
      // Viewer-relative read slices — derived from the world, never stored per-persona.
      const { loops, wrapped } = world;
      const myNotifs = world.notifs[viewerId] || [];
      const feedback = world.feedback[viewerId] || {};
      const myIntents = world.intents.filter(i => i.userId===viewerId);
      const user = { ...PERSONA_BY_ID[viewerId], ...(USERS[viewerId]||{}), ...(world.profiles[viewerId]||{}) };
      // Writers: profiles (onboarding), per-recipient notifs, per-user feedback.
      const setProfileFor = (id, patch) => setWorld(w => ({ ...w, profiles: { ...w.profiles, [id]: { ...(w.profiles[id]||{}), ...patch } } }));
      const setNotifsFor  = (recipientId, updater) => setWorld(w => ({ ...w, notifs: { ...w.notifs, [recipientId]: updater(w.notifs[recipientId] || []) } }));
      const setFeedbackFor = (id, v) => setWorld(w => { const cur = w.feedback[viewerId] || {}; const n = { ...cur }; if (v==null) delete n[id]; else n[id]=v; return { ...w, feedback: { ...w.feedback, [viewerId]: n } }; });
      // Staff lens (RA / TA): an attribute of the persona, not a role in the student app. Done-latches persist per actor.
      const staffPersona = PERSONA_BY_ID[viewerId]?.staff || null;
      const staffDone = (world.staff||{})[viewerId] || {};
      const staffMark = (id) => setWorld(w => ({ ...w, staff: { ...(w.staff||{}), [viewerId]: { ...((w.staff||{})[viewerId]||{}), [id]: true } } }));
      // Address one notification to many recipients (per-recipient notifs; replaces any prior with the same id).
      const notify = (ids, n) => setWorld(w => {
        const notifs = { ...w.notifs };
        ids.filter((x,i,a)=>x && x!==viewerId && a.indexOf(x)===i).forEach(rid => { notifs[rid] = [{ ...n, unread:true }, ...(notifs[rid]||[]).filter(x => x.id!==n.id)]; });
        return { ...w, notifs };
      });

      useEffect(()=>{
        const root = document.documentElement;
        if (theme==='afterdark') root.setAttribute('data-theme','afterdark');
        else root.removeAttribute('data-theme');
      }, [theme]);

      const toastTimer = useRef(null);
      const showToast = (t) => {
        setToast(t); clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(()=>setToast(null), 7000);
      };
      /* Theme change. When a control element is passed and the browser supports View Transitions,
         the new theme wipes out in a circle from that control; otherwise it's an instant swap. */
      const applyTheme = (next, origin) => {
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const swap = () => {
          const root = document.documentElement;
          if (next==='afterdark') root.setAttribute('data-theme','afterdark'); else root.removeAttribute('data-theme');
          ReactDOM.flushSync(()=>setTheme(next));
        };
        if (!document.startViewTransition || reduced || !origin) { swap(); return; }
        const r = origin.getBoundingClientRect();
        document.documentElement.style.setProperty('--wipe-x', (r.left + r.width/2) + 'px');
        document.documentElement.style.setProperty('--wipe-y', (r.top + r.height/2) + 'px');
        document.startViewTransition(swap);
      };
      const toggleTheme = () => applyTheme(theme==='afterdark' ? 'daylight' : 'afterdark', null);
      const unread = myNotifs.filter(n=>n.unread).length;

      /* ----- onboarding (writes land in world.profiles[viewerId], not a standalone user) ----- */
      const start     = () => setScreen('story');
      const storyDone = (seed) => { setIntentSeed(seed || ''); setScreen('email'); };
      const verify  = (email) => { setProfileFor(viewerId, { email }); setScreen('basics'); };
      const basics  = (b) => { setProfileFor(viewerId, b); setScreen('intent'); };
      const firstIntent = (text) => { runIntent(text); setScreen('home'); armWrap('w-prelim1'); };

      /* ----- intent -> suggestions (S6) ----- */
      // Cards for a single intent phrase.
      const cardsForIntent = (one) => {
        const parse = parseIntent(one);
        const cards = [];
        const activeJoin = loops.find(l => l.target===parse.target && l.status==='active');
        if (activeJoin) cards.push({ kind:'join', loop:activeJoin });
        if (parse.type==='study' && parse.target) cards.push({ kind:'spinup', target:parse.target, subtitle:'11 others on your floor dropped this' });
        const forming = loops.find(l => l.target===parse.target && l.status==='forming');
        if (forming) cards.push({ kind:'forming', loop:forming });
        if (cards.length===0) cards.push({ kind:'spinup', target: parse.target || one.trim(), subtitle:'Be the one who starts it — Loop fills the seats.' });
        return cards;
      };
      const runIntent = (raw) => {
        // Multiple activity anchors arrive joined by " · " (the app's multi-intent convention);
        // each is its own category, so split them into separate suggestion cards.
        const parts = (raw||'').split(/\s*[·;\n]\s*/).map(s=>s.trim()).filter(Boolean);
        if (parts.length > 1) {
          const seen = new Set();
          const cards = parts.flatMap(cardsForIntent).filter(c => {
            const key = c.kind + ':' + (c.loop?.id || c.target);
            if (seen.has(key)) return false; seen.add(key); return true;
          });
          setSuggestions({ raw: parts.join(' · '), parse:null, cards });
          return;
        }
        const one = parts[0] || (raw||'').trim();
        if (isSpinup(one)) { startSpinupFromText(one, parseIntent(one)); return; }
        setSuggestions({ raw: one.toLowerCase(), parse: parseIntent(one), cards: cardsForIntent(one) });
      };
      const openCompose = () => setSheet('compose');
      const submitCompose = (raw, intent) => { setSheet(null); runIntent(raw); if(intent) saveIntent(intent); if(screen!=='home') setScreen('home'); };
      const noop = () => {};

      /* ----- fold in (join a running loop) ----- */
      const foldIn = (loopId) => {
        setLoops(ls => ls.map(l => l.id===loopId && !l.memberIds.includes(viewerId)
          ? { ...l, memberIds:[...l.memberIds, viewerId] } : l));
        const l = loops.find(x=>x.id===loopId);
        setSuggestions(null);
        showToast({ title:`Joined — ${l?.title}`, body:`Same faces, every week. The crew already knows the rhythm.` });
        openLoop(loopId);
      };
      const leaveLoop = (loopId) => {
        setLoops(ls => ls.map(l => l.id===loopId ? { ...l, memberIds:l.memberIds.filter(id=>id!==viewerId) } : l));
        showToast({ title:'Left the loop.', body:'The rhythm holds without you. Nobody sees a thing.' });
        setScreen('home');
      };
      const wantThis = (loopId) => {
        let fired = false;
        setLoops(ls => ls.map(l => {
          if (l.id!==loopId || l.status!=='forming') return l;
          const count = Math.min(l.drop.target, l.drop.count + 1);
          if (count >= l.drop.target) fired = true;
          return { ...l, drop:{ ...l.drop, count } };
        }));
        const l = loops.find(x=>x.id===loopId);
        const next = Math.min(l.drop.target, l.drop.count + 1);
        if (next >= l.drop.target) showToast({ icon:'zap', title:'The drop fired.', body:`${l.title} just crystallized into a loop.` });
        else showToast({ icon:'circle-dot', title:'Dropped.', body:`${next}/${l.drop.target} in — ${l.drop.target-next} more and this drop fires.` });
      };

      /* ----- open a loop ----- */
      const openLoop = (loopId, highlight=null) => {
        setActiveLoopId(loopId); setHighlightId(highlight);
        const hi = highlight && USERS[highlight];
        setDetailBanner(hi ? { title:`Joined. ${hi.name.split(' ')[0]} knows the rhythm now.`, body:`${hi.dorm} · ${hi.major} — seated straight into a loop that already meets.` } : null);
        setScreen('loop');
        setNotifsFor(viewerId, ns => ns.map(n => ({ ...n, unread:false })));
      };
      const openNotifications = () => setScreen('notifs');
      const openYou = () => setScreen('you');
      const openClass = () => setScreen('class');
      const goHome = () => setScreen('home');

      /* ----- a loop concludes → you get asked. Rate sheet reopens from Past loops.
         (private feedback writer setFeedbackFor is defined up top, keyed per viewer) ----- */
      const openRate = (wrapId) => { setRateId(wrapId); setSheet('rate'); setNotifsFor(viewerId, ns => ns.map(n => n.wrapId===wrapId ? { ...n, unread:false } : n)); };
      const closeRate = () => { setSheet(null); setRateId(null); };
      const wrapTimer = useRef(null);
      const armWrap = (wrapId) => {
        clearTimeout(wrapTimer.current);
        const recipient = viewerId;   // the persona on Home when the loop wraps
        wrapTimer.current = setTimeout(() => {
          const src = WRAPPED_LOOPS.find(x=>x.id===wrapId); if(!src) return;
          setWorld(prev => {
            const wrapped = prev.wrapped.map(x => x.id===wrapId ? { ...x, when:'just now' } : x);
            const cur = prev.notifs[recipient] || [];
            const notifs = cur.some(n=>n.wrapId===wrapId) ? cur : [{ id:'wrap-'+wrapId, type:'wrapped', wrapId, unread:true }, ...cur];
            return { ...prev, wrapped, notifs: { ...prev.notifs, [recipient]: notifs } };
          });
          showToast({ icon:'repeat', title:`${src.title} ${src.reason}.`, body:'How was it? Private, takes a second.', open:{ rate:wrapId } });
        }, 4200);
      };

      /* ----- safety report → assigned counselor (confidential) ----- */
      const openSafety = (subject) => { setSafetySubject(subject); setSheet('safety'); };
      const openShare  = (loopId)  => { setShareLoopId(loopId); setSheet('share'); };
      /* ----- The Floor → seat the viewer into a real loop so it lands in
         Belonging / Your loops. Upsert by id; persists across navigation. ----- */
      const floorSeat = (loop) => setLoops(ls => ls.some(l=>l.id===loop.id)
        ? ls.map(l => l.id===loop.id ? { ...l, ...loop, memberIds: l.memberIds.includes(viewerId)?l.memberIds:[...l.memberIds, viewerId] } : l)
        : [loop, ...ls]);
      const floorUnseat = (loopId) => setLoops(ls => ls.map(l => l.id===loopId ? { ...l, memberIds:l.memberIds.filter(id=>id!==viewerId) } : l));
      /* ----- intents you declare (shape / drop your own rhythm) persist in the
         shared world, authored with your userId. The intent is the anchor.
         Honors the two-arg edit-replace: drop replaceId when the rebuilt intent
         got a new id, so editing replaces rather than duplicates. ----- */
      const saveIntent = (it, replaceId=null) => setWorld(w => {
        const authored = { ...it, userId:viewerId };
        let list = replaceId && replaceId!==it.id ? w.intents.filter(i=>i.id!==replaceId) : w.intents;
        list = list.some(i=>i.id===it.id) ? list.map(i=>i.id===it.id?{ ...i, ...authored }:i) : [authored, ...list];
        return { ...w, intents:list };
      });
      const removeIntent = (id) => setWorld(w => ({ ...w, intents: w.intents.filter(i=>i.id!==id) }));
      const addToCalendar = (loop) => showToast({ icon:'calendar', title:`${loop.title} added to your calendar`,
        body:`${loop.rhythm || loop.nextLine || 'Weekly'} — repeats weekly, same faces. Loop keeps the crew in sync.` });
      const sendSafety = () => {
        const s = safetySubject; setSheet(null); setSafetySubject(null);
        showToast({ icon:'shield', title:`Sent privately to ${COUNSELOR.name}.`,
          body: s ? `Your concern about ${s} is confidential — never shown to the loop. She'll reach out.` : `It's confidential — never shown to the loop. She'll reach out.` });
      };
      const messageCounselor = () => showToast({ icon:'message-square', title:`Message sent to ${COUNSELOR.name}.`, body:`${COUNSELOR.hours}. She'll reply here.` });

      /* ----- spin-up (S8) ----- */
      const startSpinup = (target) => { setDraft({ ...buildDraft({ target }, ''), raw:`set up a study loop for ${target}`.toLowerCase(), target }); setSheet('spinup'); };
      const startSpinupFromText = (raw, parse) => { setDraft({ ...buildDraft(parse, raw), raw:raw.toLowerCase() }); setSheet('spinup'); };
      const sendDraft = (d) => {
        const id = 'spun-' + d.title.replace(/\s+/g,'-').toLowerCase();
        const crew = [viewerId, 'josh', 'lydia', 'ryan'].filter((x,i,a)=>a.indexOf(x)===i);
        const newLoop = {
          id, title:d.title, target:d.target, unit:{ kind:'class', label:`${d.target.toLowerCase()} · section` },
          status:'active', rhythm:`${d.day} · ${d.time} · ${d.location}${d.repeat?' · weekly':''}`,
          nextLine:`${d.day} · ${d.time} · ${d.location}`, live:true,
          memberIds:crew, cap:6, spun:true,
          startedWeek:3, streakWeeks:1, createdBy:viewerId, hereIds:[],
          seniority:Object.fromEntries(crew.map(x=>[x,3])),
        };
        setLoops(ls => [newLoop, ...ls]);
        setSheet(null); setSuggestions(null);
        showToast({ title:'Sent. 3 classmates already joined.', body:'Loop holds the time, the place, and the next one.' });
        openLoop(id);
        armRecurrence(newLoop);
      };

      /* ----- recurrence nudge (the payoff, §5.5) ----- */
      const armRecurrence = (baseLoop) => {
        setNudge({
          kicker:'Two weeks later',
          body:`hw3 is due thursday. Loop drafted the next ${baseLoop.target} session — same faces?`,
          cta:'Bring the crew back', base:baseLoop,
        });
      };
      const tapNudge = () => {
        if (!nudge) return;
        const base = nudge.base;
        const recurId = base.id + '-hw3';
        let existing = loops.find(l=>l.id===recurId);
        if (!existing) {
          existing = { ...base, id:recurId, title:`${base.target} · HW3 grind`, live:false,
            streakWeeks:(base.streakWeeks||1)+2,
            timeMarker:'Started Week 3 on a pretext · same faces since', sameCrew:true };
          setLoops(ls => [existing, ...ls.filter(l=>l.id!==base.id)]);
        }
        setNudge(null);
        openLoop(recurId);
      };

      /* ----- director fold-in (out-of-frame): fold a chosen member into a chosen
         loop as one real world mutation — the live fold-in beat, no hardcoded
         identities. Addresses the "someone joined" notif to the loop's members. ----- */
      const directorFoldIn = (memberId, loopId) => {
        let target = null;
        setWorld(w => {
          const loops = w.loops.map(l => l.id===loopId && !l.memberIds.includes(memberId)
            ? { ...l, memberIds:[...l.memberIds, memberId], loopedInFor:memberId } : l);
          const loop = loops.find(l => l.id===loopId);
          if (!loop) return w;
          target = loop;
          const nid = 'foldin-'+memberId+'-'+loopId;
          const notifs = { ...w.notifs };
          loop.memberIds.filter(id => id!==memberId).forEach(rid => {
            const cur = (notifs[rid] || []).filter(n => n.id!==nid);
            notifs[rid] = [{ id:nid, type:'foldin', userId:memberId, target:loop.target, loopId, loopTitle:loop.title, unread:true }, ...cur];
          });
          return { ...w, loops, notifs };
        });
        const m = USERS[memberId];
        setTimeout(() => {
          if (!target || !m) return;
          showToast({ userId:memberId, title:`${m.name.split(' ')[0]} joined the ${target.title}`,
            body:`${roleTag(memberId) || m.dorm} · ${m.major} — they know the rhythm now`,
            open:{ loopId, highlight:memberId } });
        }, 600);
      };
      // Sensible demo default: fold the "other" student into a loop the current
      // viewer is in, so the join notification lands on the viewer. All derived — no magic ids.
      const runDirectorFoldIn = () => {
        const active = world.loops.filter(l => l.status==='active');
        const loop = active.find(l => l.memberIds.includes(viewerId)) || active[0];
        if (!loop) return;
        const students = PERSONAS.filter(p => p.land==='home').map(p => p.id);
        const memberId = students.find(id => id!==viewerId && !loop.memberIds.includes(id))
          || Object.keys(USERS).find(id => !loop.memberIds.includes(id));
        if (!memberId) return;
        directorFoldIn(memberId, loop.id);
      };

      /* ----- ownerless governance: presence = authority ----- */
      const checkIn = (loopId) => {
        setLoops(ls => ls.map(l => l.id!==loopId ? l : { ...l, hereIds:[...(l.hereIds||[]).filter(x=>x!==viewerId), viewerId] }));
        const l = loops.find(x => x.id===loopId);
        const first = !(l?.hereIds||[]).length;
        showToast({ icon:'circle-check-big', title:'Logged. You\'re here.',
          body: first ? 'First in — you hold the pin tonight. If the room changes, you can move it.' : 'Anyone checked in can move tonight if the room changes.' });
      };
      const moveTonight = (loopId, place) => {
        setLoops(ls => ls.map(l => {
          if (l.id!==loopId) return l;
          const parts = (l.nextLine||'').split(' · ');
          const from = parts.pop();
          return { ...l, nextLine:[...parts, place].join(' · '), movedFrom:from };
        }));
        showToast({ icon:'map-pin', title:`Moved to ${place}`, body:`Pushed to everyone confirmed for tonight — no thread, no host. Undo from the loop if it's wrong.` });
      };
      const undoMove = (loopId) => {
        setLoops(ls => ls.map(l => {
          if (l.id!==loopId || !l.movedFrom) return l;
          const parts = (l.nextLine||'').split(' · '); parts.pop();
          return { ...l, nextLine:[...parts, l.movedFrom].join(' · '), movedFrom:null };
        }));
        showToast({ icon:'rotate-ccw', title:'Move undone', body:'Everyone confirmed gets the correction.' });
      };
      const messageCrew = (loop) => showToast({ icon:'message-square', title:`Sent to the ${loop.title}`, body:`${loop.memberIds.length} regulars get it — no new thread, no cold DM.` });

      /* ----- advisor controls ----- */
      const advisorReach = (name) => showToast({ icon:'heart-handshake', title:`Reached out to ${name.split(' ')[0]}`, body:`A warm note from you — Loop never tells them how you knew.` });

      /* ----- staff lens actions (RA floor · TA class · counselor school) -----
         Every one is a world mutation: seeds become real forming loops with an audience
         (so isVisibleTo shows them to the right students), notes go out as per-recipient
         notifs, and done-latches persist in world.staff. Authorship stays provenance-only. */
      const openStaff = () => setScreen('staff');
      const floorResidents = (floor) => Object.values(USERS).filter(u => u.dorm===floor).map(u => u.id);
      const staffSeed = (s) => {
        const st = staffPersona;
        const isRA = st?.kind==='ra';
        const audience = isRA ? { scope:'floor', floor:st.scope } : { scope:'class', course:(st?.scope || s.target) };
        const unit = isRA ? { kind:'dorm', label:`${st.scope.toLowerCase()} · forming` } : { kind:'class', label:`${(st?.scope || s.target).toLowerCase()} · section` };
        setLoops(ls => ls.some(l => l.id===s.id) ? ls : [{
          id:s.id, title:s.title, target:s.target, unit, audience, status:'forming',
          drop:{ count:s.count||1, target:Math.max(3, (s.count||1)+2) }, memberIds:[],
          rhythm:s.line, nextLine:s.line, seededBy:viewerId, createdBy:viewerId, hereIds:[],
        }, ...ls]);
        showToast({ icon:'sprout', title:`Seeded · ${s.title}`,
          body:`Goes out as "${isRA ? 'your floor is' : (st?.scope||s.target)+' is'} starting a loop" — bylined ${bylineFor(viewerId)}, no roster. Quorum of 3 makes it real.` });
      };
      const staffEvent = (e) => {
        const st = staffPersona; const floor = st?.scope || 'Donlon 2F';
        setLoops(ls => ls.some(l => l.id===e.id) ? ls : [{
          id:e.id, title:e.title, target:'floor event', unit:{ kind:'dorm', label:`${floor.toLowerCase()} · one-off` },
          audience:{ scope:'floor', floor }, status:'forming', drop:{ count:1, target:6 }, memberIds:[],
          rhythm:e.line, nextLine:e.line, oneOff:true, seededBy:viewerId, createdBy:viewerId, hereIds:[],
        }, ...ls]);
        notify(floorResidents(floor), { id:'ev-'+e.id, type:'staff', body:`${bylineFor(viewerId)} is hosting ${e.title} — ${e.line}. It's on your Home if you want in.` });
        staffMark(e.id);
        showToast({ icon:'calendar', title:'Drafted · residents get it', body:`Everyone on ${floor} sees "${bylineFor(viewerId)} is hosting…" — a one-off that can turn into a loop.` });
      };
      const staffBoost = (l) => {
        notify(l.ids || l.memberIds || [], { id:'boost-'+l.id, type:'staff', body:`${bylineFor(viewerId)} will drop by the ${l.title} — it's ${l.drop ? `${l.drop.count} of ${l.drop.target}` : 'close'} to forming.` });
        staffMark('boost-'+l.id);
        showToast({ icon:'zap', title:`Boosted · ${l.title}`, body:`The ${TA_CLASS.waiting} waiting see "${bylineFor(viewerId)} will drop by". No roster, no names to you.` });
      };
      const staffDropIn = (l) => {
        notify(l.ids || l.memberIds || [], { id:'drop-'+l.id, type:'staff', body:`${bylineFor(viewerId)} is dropping by the ${l.title} this week.` });
        staffMark('drop-'+l.id);
        showToast({ icon:'users', title:`You're in this week · ${l.title}`, body:`The regulars get a heads-up as "${bylineFor(viewerId)}". You're a guest, not a member — the loop stays theirs.` });
      };
      const staffHint = (l) => {
        notify(l.ids || l.memberIds || [], { id:'hint-'+l.id, type:'staff', body:`A hint from ${bylineFor(viewerId)} for the ${l.title}: start HW3 from the recursion tree, not the code.` });
        staffMark('hint-'+l.id);
        showToast({ icon:'message-square', title:`Hint sent to the ${l.title}`, body:`Lands in their Alerts, bylined ${bylineFor(viewerId)} — no thread, no DM.` });
      };
      const staffAnchorOH = () => {
        staffMark('oh');
        showToast({ icon:'clock', title:'Office hours anchored', body:`Your Tue 5p is now a loop anchor for ${TA_CLASS.scope} — the 14 waiting who are free then get invited.` });
      };
      const staffReach = (name, id) => {
        if (id) staffMark(id);
        showToast({ icon:'heart-handshake', title:`Reached out to ${name.split(' ')[0]}`, body:`A warm note from you — Loop never tells them how you knew.` });
      };
      const schoolAct = (c) => {
        staffMark(c.id);
        const body = c.id==='cold-jameson' ? 'Jameson RAs see the gaps in their Floor view — a nudge from you, not an algorithm.'
                   : c.id==='cold-econ'    ? 'ECON 1110 course staff get the count (412 waiting, 3 loops) — never who.'
                   : 'A campus-wide transfer mixer loop is drafted; transfers see it as "Advising & Wellbeing is starting…".';
        showToast({ icon:'send', title:c.cta, body });
      };

      /* ----- persona switcher (out-of-frame) — viewpoint-only. Sets whose
         perspective renders and clears ephemeral view state; it NEVER reseeds
         or mutates the shared world. All three students are attribute-only. ----- */
      const switchPersona = (pid) => {
        const p = PERSONA_BY_ID[pid];
        if (!p) return;
        clearTimeout(toastTimer.current); clearTimeout(wrapTimer.current);
        setViewerId(pid);
        setRateId(null);
        setSheet(null); setSuggestions(null); setActiveLoopId(null); setHighlightId(null);
        setDetailBanner(null); setDraft(null); setNudge(null); setToast(null);
        setSafetySubject(null); setShareLoopId(null);
        setScreen(p.land);
      };

      const actions = {
        openCompose, noop, foldIn, leaveLoop, wantThis, openLoop, openNotifications,
        startSpinup, tapNudge, toggleTheme, setTheme:applyTheme, openYou, openClass, goHome,
        setFeedbackFor, openRate, openSafety, messageCounselor, openShare, addToCalendar, floorSeat, floorUnseat, saveIntent, removeIntent,
        checkIn, moveTonight, undoMove, messageCrew, advisorReach,
        openStaff, staffMark, staffSeed, staffEvent, staffBoost, staffDropIn, staffHint, staffAnchorOH, staffReach, schoolAct,
      };

      const activeLoop = loops.find(l => l.id===activeLoopId);
      const shareLoop  = loops.find(l => l.id===shareLoopId);

      const reset = () => {
        clearTimeout(toastTimer.current); clearTimeout(wrapTimer.current);
        setWorld(worldStore.reset());   // clear persisted blob + re-seed the world
        setRateId(null); setScreen('splash'); setSheet(null); setIntentSeed(''); setViewerId('sarah');
        setSuggestions(null); setActiveLoopId(null); setHighlightId(null); setDetailBanner(null);
        setDraft(null); setNudge(null); setToast(null); setSafetySubject(null); setShareLoopId(null);
      };

      return (
        <div className="demo-stage" style={{ display:'flex', flexDirection:'row', alignItems:'center', justifyContent:'center', flexWrap:'wrap', gap:28 }}>
          <StaffCtx.Provider value={staffPersona ? { staff:staffPersona, onStaff:openStaff } : null}>
          <div className="phone">
            <StatusBar />
            <div style={{ flex:1, position:'relative', overflow:'hidden' }}>
              <Toast toast={toast}
                onTap={()=>{ if(toast?.open?.rate){ openRate(toast.open.rate); } else if(toast?.open){ openLoop(toast.open.loopId, toast.open.highlight); } else { openNotifications(); } setToast(null); }}
                onClose={()=>setToast(null)} />

              {screen==='splash' && <Splash onStart={start} theme={theme} onToggleTheme={toggleTheme} />}
              {screen==='story'  && <StoryOnboarding onDone={storyDone} onBack={()=>setScreen('splash')} theme={theme} />}
              {screen==='email'  && <EmailVerify onBack={()=>setScreen('story')} onNext={verify} />}
              {screen==='basics' && <Basics onBack={()=>setScreen('email')} onNext={basics} />}
              {screen==='intent' && <FirstIntent onBack={()=>setScreen('basics')} onNext={firstIntent} seed={intentSeed} />}
              {screen==='home'   && user && (
                <Home state={{ user, viewerId, loops, suggestions, nudge, unread, theme, campus }} actions={actions} />
              )}
              {screen==='loop'   && activeLoop && (
                <LoopDetail loop={activeLoop} viewerId={viewerId} highlightId={highlightId} banner={detailBanner} theme={theme}
                  onBack={()=>setScreen('home')} actions={actions} />
              )}
              {screen==='class'  && (
                <ClassDashboard state={{ campus, theme, unread, user, viewerId }} actions={actions} />
              )}
              {screen==='staff' && staffPersona && (
                staffPersona.kind==='ra'
                  ? <RADashboard state={{ theme, user, viewerId, unread, loops, staffDone }} actions={actions} />
                  : <TADashboard state={{ theme, user, viewerId, unread, loops, staffDone }} actions={actions} />
              )}
              {screen==='advisor' && (
                <AdvisorDashboard state={{ campus, theme, user, viewerId, staffDone }} actions={actions} />
              )}
              {screen==='you'    && user && (
                <YouScreen state={{ user, viewerId, loops, myIntents, campus, theme, unread, wrapped, feedback, feedbackCount: Object.keys(feedback).length }} actions={actions} />
              )}
              {screen==='notifs' && (
                <Notifications items={myNotifs} unread={unread} wrapped={wrapped} feedback={feedback} actions={actions} />
              )}

              {sheet==='compose' && <ComposeSheet onClose={()=>setSheet(null)} onSubmit={submitCompose} />}
              {sheet==='spinup' && draft && <SpinUpSheet draft={draft} onClose={()=>setSheet(null)} onSend={sendDraft} />}
              {sheet==='safety' && <SafetySheet subject={safetySubject} onClose={()=>{ setSheet(null); setSafetySubject(null); }} onSend={sendSafety} />}
              {sheet==='rate' && rateId && wrapped.find(w=>w.id===rateId) &&
                <RateSheet wrapped={wrapped.find(w=>w.id===rateId)} viewerId={viewerId} feedback={feedback} actions={actions} onClose={closeRate} />}
              {sheet==='share' && shareLoop && <ShareSheet loop={shareLoop}
                onClose={()=>{ setSheet(null); setShareLoopId(null); }}
                onSent={(name)=>{ setSheet(null); setShareLoopId(null);
                  showToast({ icon:'users', title:`${name} joined from your drop`, body:`Straight into ${shareLoop.title} — no cold DM, no feed.` }); }} />}
            </div>
          </div>
          </StaffCtx.Provider>

          {/* out-of-frame demo switcher — cycle the phone through each point of view.
              Not part of the app UI; it's the director's console for the demo. */}
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:8 }}>
            <div className="pls-kicker" style={{ fontSize:10, color:'var(--text-tertiary)' }}>view the demo as</div>
            <div style={{ display:'flex', flexDirection:'column', gap:6, width:172 }}>
              {PERSONAS.map(p => {
                const on = viewerId===p.id;
                return (
                  <button key={p.id} onClick={()=>switchPersona(p.id)}
                    style={{ display:'flex', alignItems:'center', gap:7, cursor:'pointer',
                      padding:'5px 11px 5px 5px', borderRadius:999,
                      background: on ? 'var(--accent-quiet)' : 'var(--bg-surface)',
                      border:'1px solid '+(on ? 'transparent' : 'var(--border-hairline)'),
                      boxShadow: on ? 'var(--glow-accent)' : 'none',
                      transition:'background var(--dur-1), box-shadow var(--dur-2)' }}>
                    <Avatar id={p.id} name={p.name} size={24} ring={false} />
                    <span style={{ textAlign:'left', lineHeight:1.1 }}>
                      <span style={{ display:'block', fontSize:12.5, fontWeight:600,
                        color: on ? 'var(--accent-strong)' : 'var(--text-primary)' }}>{p.name.split(' ')[0]}</span>
                      <span style={{ display:'block', fontSize:10, color:'var(--text-tertiary)' }}>{p.staff?.byline || p.dorm || p.role}</span>
                    </span>
                  </button>
                );
              })}
            </div>
            {/* director control — trigger a real fold-in on demand (live animation + addressed notif) */}
            <button onClick={runDirectorFoldIn} className="flex items-center gap-1.5"
              style={{ background:'none', border:'1px solid var(--border-hairline)', borderRadius:999, padding:'5px 11px', cursor:'pointer', fontSize:12, color:'var(--text-secondary)' }}>
              <Icon name="user-plus" size={13} />fold someone in
            </button>
            <button onClick={reset} className="flex items-center gap-1.5"
              style={{ background:'none', border:'none', cursor:'pointer', fontSize:12, color:'var(--text-tertiary)' }}>
              <Icon name="rotate-ccw" size={13} />restart demo
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
