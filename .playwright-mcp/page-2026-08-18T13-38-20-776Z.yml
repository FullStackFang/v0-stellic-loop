    - list [ref=f1e195]:
      - listitem [ref=f1e196]: "Kill the \"Verify\" button. The demo accepts any @cornell.edu instantly, so a button that pretends to do a round-trip is a fake step. Verify inline: the moment the address matches, a moss \"Cornellian\" check appears. In a real build the check would flip after the magic-link comes back; the screen doesn't need to change either way."
      - listitem [ref=f1e197]: Fix the copy contradiction. "The basics" says "That's the whole questionnaire, promise", then the next screen is titled "One last thing." One page removes the lie by construction.
      - listitem [ref=f1e198]: Drop the three AppHeader titles. "Verify you're a Cornellian / The basics / One last thing" are process labels. The story screens use a progress bar + step number; this screen should be its 6th dash, not a different app.
      - listitem [ref=f1e199]: Story card 5's CTA currently reads "See what's forming · 2" but lands on the email screen. Rename it ("Set me up", "Almost there") and let the consolidated screen own "See what's forming", since that's the button that actually shows what's forming.
